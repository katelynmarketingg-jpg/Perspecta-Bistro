<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perspecta Bistro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Questrial&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f3ee;
      --panel: #fffdf9;
      --panel-2: #f1ebe2;
      --ink: #171412;
      --muted: #756a60;
      --line: #ded4c7;
      --brand: #f07a22;
      --brand-2: #176b5d;
      --gold: #c58b22;
      --blue: #356ea8;
      --danger: #a92f2f;
      --ok: #24734c;
      --shadow: 0 18px 45px rgba(42, 28, 16, .10);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: #111111;
      color: #f8efe4;
      padding: 22px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(255,255,255,.13);
      margin-bottom: 18px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .brand-wordmark {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand-wordmark strong {
      display: block;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .3px;
      color: #fff;
    }
    .brand-wordmark span {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f6921e;
      font-weight: 500;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      color: #f8efe4;
      background: transparent;
      border-radius: 7px;
      transition: .18s ease;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(255,255,255,.10);
    }

    .nav svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .sidebar-footer {
      margin-top: 26px;
      padding: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 8px;
      color: #e9dccd;
      font-size: 13px;
      line-height: 1.45;
    }

    .sidebar-logout {
      width: 100%;
      margin-top: 14px;
      background: var(--brand);
      color: #111111;
    }

    main {
      padding: 26px;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      margin: 8px 0 0;
      max-width: 760px;
    }

    .eyebrow {
      color: var(--brand);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0;
      font-size: 12px;
      margin: 0 0 6px;
    }

    h1, h2, h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.02;
      max-width: 850px;
    }

    h2 { font-size: 24px; margin-bottom: 14px; }
    h3 { font-size: 17px; margin-bottom: 12px; }

    .date-pill {
      white-space: nowrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--muted);
      box-shadow: var(--shadow);
      font-weight: 700;
      font-size: 13px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .metrics {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 18px;
    }

    .metric, .panel, .module-card, .product-row, .report-row, .command-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 17px;
      min-height: 126px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 11px;
    }

    .metric .value {
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 10px;
    }

    .metric .delta {
      color: var(--ok);
      font-weight: 800;
      font-size: 13px;
    }

    .metric .delta.bad { color: var(--danger); }

    .two-col {
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
    }

    .three-col {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel {
      padding: 18px;
      min-width: 0;
    }

    .modules {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .module-card {
      padding: 16px;
      min-height: 178px;
    }

    .plain-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .module-card p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 14px;
      font-size: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      background: var(--panel-2);
      color: #40362e;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .product-list, .report-list {
      display: grid;
      gap: 10px;
    }

    .product-row, .report-row {
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: none;
    }

    .product-row strong, .report-row strong {
      display: block;
      margin-bottom: 4px;
    }

    .product-row span, .report-row span {
      color: var(--muted);
      font-size: 13px;
    }

    .bar-chart {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .bar-line {
      display: grid;
      grid-template-columns: 145px 1fr 56px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }

    .bar {
      height: 12px;
      background: #eadfd1;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--brand-2);
      border-radius: inherit;
    }

    .flow {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin-top: 18px;
    }

    .flow-step {
      background: #171412;
      color: #fff7eb;
      padding: 16px;
      border-radius: 8px;
      min-height: 112px;
      position: relative;
    }

    .flow-step strong { display: block; margin: 10px 0 4px; }
    .flow-step span { color: #d8cab8; font-size: 13px; }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    form {
      display: grid;
      gap: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .floor-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .floor-plan {
      position: relative;
      height: 420px;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px),
        linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px),
        #fffaf3;
      background-size: 48px 48px;
      overflow: hidden;
      touch-action: none;
    }

    .table-tile {
      position: relative;
      box-sizing: border-box;
      min-height: 86px;
      border-radius: 8px;
      border: 2px solid var(--line);
      background: #fffaf3;
      padding: clamp(10px, calc(var(--table-size, 132px) * .09), 16px);
      display: grid;
      align-content: center;
      gap: 5px;
      overflow: hidden;
    }

    .floor-plan .table-tile {
      position: absolute;
      width: var(--table-size, 132px);
      min-height: calc(var(--table-size, 132px) * .72);
      cursor: grab;
      user-select: none;
      box-shadow: 0 10px 22px rgba(35, 24, 14, .12);
    }

    .floor-plan .table-tile.dragging {
      cursor: grabbing;
      z-index: 5;
      transform: scale(1.02);
    }

    .table-tile.busy {
      border-color: var(--brand);
      background: #fffaf3;
    }

    .table-tile.kitchen {
      border-color: #d99a00;
      background: #ffe36b;
    }

    .table-tile.delivered {
      border-color: #2f80ed;
      background: #e8f1ff;
    }

    .table-tile.paid {
      border-color: #cdd8cf;
      background: #fff;
    }

    .table-tile.free {
      border-color: #cdd8cf;
      background: #fff;
    }

    .table-tile strong {
      display: block;
      max-width: 100%;
      font-size: clamp(12px, calc(var(--table-size, 132px) * .11), 18px);
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .table-tile span {
      color: var(--muted);
      font-size: clamp(10px, calc(var(--table-size, 132px) * .075), 13px);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .table-paid-badge {
      position: absolute;
      left: 8px;
      bottom: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #17623a;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 5px 12px rgba(23, 98, 58, .22);
    }

    .table-resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 24px;
      height: 24px;
      border: 0;
      background: transparent;
      cursor: nwse-resize;
      touch-action: none;
      border-radius: 0 0 8px 0;
      transition: background .15s;
    }

    .table-tile.resizing .table-resize-handle {
      background: rgba(240, 122, 34, 0.55);
    }

    .table-tile.resizing {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .table-client {
      color: var(--ink) !important;
      font-weight: 850;
    }

    .table-name {
      display: block;
      color: var(--muted) !important;
      font-weight: 800;
    }

    .table-status {
      display: block;
      margin-top: 3px;
      font-weight: 850;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .map-toolbar label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .map-toolbar input {
      width: 130px;
      padding: 0;
    }

    .map-toolbar input[type="checkbox"] {
      width: 16px;
      height: 16px;
      min-height: 16px;
      padding: 0;
      accent-color: var(--brand);
    }

    .map-toggle {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8ef;
      color: var(--ink) !important;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .map-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: #f1faf5;
    }

    .legend-dot.busy { background: #fffaf3; border-color: var(--brand); }
    .legend-dot.kitchen { background: #ffe36b; border-color: #d99a00; }
    .legend-dot.delivered { background: #e8f1ff; border-color: #2f80ed; }
    .legend-dot.paid { background: #fff8f0; border-color: var(--brand); }

    .cost-block {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .ingredient-row {
      display: grid;
      grid-template-columns: 1.2fr repeat(6, minmax(92px, 1fr)) auto;
      gap: 8px;
      align-items: end;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8ef;
    }

    .simple-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .simple-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 5px solid var(--brand);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      min-height: 132px;
    }

    .simple-card strong {
      display: block;
      font-size: 20px;
      margin: 8px 0;
    }

    .goal-card {
      padding: 12px;
      min-height: 108px;
    }

    .goal-card strong {
      font-size: 17px;
      margin: 5px 0;
    }

    .goal-card .progress {
      height: 9px;
      margin-top: 7px;
    }

    .settings-stack {
      display: grid;
      gap: 16px;
    }

    .progress {
      height: 12px;
      background: #eadfd1;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress i {
      display: block;
      height: 100%;
      background: var(--brand);
      border-radius: inherit;
    }

    .role-pill {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      background: #181614;
      color: #fff6ed;
      font-size: 12px;
      font-weight: 850;
    }

    .change-note {
      display: block;
      margin-top: 5px;
      color: var(--brand);
      font-weight: 900;
      font-size: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      color: var(--ink);
      padding: 10px 11px;
      outline: none;
      min-height: 42px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(180, 63, 47, .14);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 10px 13px;
      border-radius: 7px;
      color: white;
      background: var(--brand);
      font-weight: 850;
      text-decoration: none;
    }

    .btn.secondary {
      background: #332923;
    }

    .btn.ghost {
      background: var(--panel-2);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn.ok { background: var(--brand-2); }
    .btn.danger { background: var(--danger); }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      background: #f4eee6;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    tr:last-child td { border-bottom: 0; }

    .table-wrap {
      overflow: auto;
      margin-top: 16px;
      border-radius: 8px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 850;
      background: #eaf4ef;
      color: var(--ok);
    }

    .status.paused {
      background: #f6e9e7;
      color: var(--danger);
    }

    .mini {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 6px 0 0;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .summary-strip > div {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .summary-strip span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .summary-strip strong {
      font-size: 22px;
    }

    .command-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .command-card {
      padding: 12px;
      box-shadow: none;
    }

    .command-location-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .command-location {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 10px;
      text-align: left;
      cursor: pointer;
    }

    .command-location strong,
    .command-location span {
      display: block;
    }

    .command-location span {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .command-location.open {
      border-color: #f28c28;
      background: #fff1df;
    }

    .command-location.paid {
      border-color: var(--brand);
      background: #fff6ec;
      box-shadow: inset 0 0 0 1px rgba(240, 122, 34, .18);
    }

    .command-card.paid {
      border-color: var(--brand);
      background: #fff8f0;
    }

    .command-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .command-head-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1 1 0;
      min-width: 0;
    }

    .command-head h3 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.3px;
      margin: 0;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .command-client-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--brand);
      margin-top: 2px;
    }

    .command-head strong {
      font-size: 19px;
      font-weight: 900;
      white-space: nowrap;
      padding-top: 2px;
    }

    .command-card .mini {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.25;
      margin-top: 2px;
    }

    .command-card .form-grid {
      gap: 6px;
    }

    .command-card label {
      gap: 4px;
      font-size: 11px;
    }

    .command-card input,
    .command-card select {
      min-height: 38px;
      padding: 8px 9px;
      font-size: 13px;
    }

    .command-card .btn {
      min-height: 38px;
      padding: 8px 10px;
      font-size: 12px;
      gap: 5px;
    }

    .command-save-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 82px auto;
      gap: 8px;
      align-items: end;
    }

    .line-items {
      display: grid;
      gap: 6px;
      margin: 8px 0;
    }

    .line-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
      padding: 6px;
      background: #f5efe7;
      border-radius: 7px;
      font-size: 13px;
    }

    .line-main {
      display: grid;
      gap: 4px;
    }

    .item-notes {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .addon-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .addon-list label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8ef;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .addon-list input {
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .addon-toggle {
      margin: 6px 0;
    }

    .addon-toggle summary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
      list-style: none;
    }

    .addon-toggle summary::-webkit-details-marker {
      display: none;
    }

    .addon-toggle[open] summary {
      background: #fff1df;
      border-color: #f28c28;
    }

    .permission-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .permission-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8ef;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .permission-chip input {
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .quick-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 12px;
    }

    .command-flow {
      display: grid;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .payment-form {
      display: grid;
      grid-template-columns: 1fr 90px auto;
      gap: 6px;
      align-items: end;
    }

    .command-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: end;
    }

    .command-actions .payment-form {
      flex: 1 1 320px;
    }

    .payment-toggle summary {
      list-style: none;
      cursor: pointer;
    }

    .payment-toggle summary::-webkit-details-marker {
      display: none;
    }

    .payment-toggle .payment-form {
      margin-top: 6px;
    }

    .btn.paid {
      background: #a85500;
      border-color: #a85500;
      color: #fff;
      cursor: default;
    }

    .command-card .btn.ok {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .command-card .btn.ok:hover {
      background: #d96a18;
      border-color: #d96a18;
    }

    .btn-sm {
      min-height: 28px !important;
      padding: 4px 10px !important;
      font-size: 11px !important;
      font-weight: 800 !important;
    }

    .close-command-button {
      width: 100%;
      justify-content: center;
      min-height: 38px;
      font-size: 13px;
    }

    /* ── View mode toggle ── */
    .cmd-view-toggle {
      display: flex;
      gap: 5px;
      margin: 4px 0 14px;
    }
    .cmd-view-toggle .btn {
      font-size: 12px;
      padding: 7px 14px;
      min-height: 0;
      flex: 1;
      justify-content: center;
    }

    /* ── Kanban board ── */
    .kanban-board {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 16px;
      align-items: flex-start;
    }
    .kanban-col {
      flex: 0 0 220px;
      min-width: 200px;
      background: #f5ede3;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - 260px);
      overflow-y: auto;
    }
    .kanban-col-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      background: #f5ede3;
      z-index: 1;
    }
    .kanban-col-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .kanban-count { background: var(--brand); color: #fff; font-size: 10px; font-weight: 900; border-radius: 20px; padding: 2px 7px; }
    .kanban-count.zero { background: var(--muted); }
    .kanban-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .kanban-card:hover { border-color: var(--brand); }
    .kanban-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
    .kanban-card-mesa { font-weight: 900; font-size: 15px; line-height: 1.15; }
    .kanban-card-total { font-size: 13px; font-weight: 900; white-space: nowrap; }
    .kanban-card-cliente { font-size: 12px; font-weight: 700; color: var(--brand); }
    .kanban-card-meta { font-size: 11px; color: var(--muted); }
    .kanban-card-action { margin-top: 3px; }
    .kb-pay-row { display: flex; gap: 5px; align-items: center; }
    .kb-pay-row select { flex: 1; font-size: 11px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }

    /* ── List view ── */
    .cmd-list-wrap { overflow-x: auto; margin-top: 4px; }
    .cmd-list { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cmd-list th { text-align: left; font-size: 10px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 6px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
    .cmd-list td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .cmd-list tr:last-child td { border-bottom: none; }
    .cmd-list tbody tr:hover td { background: #fdf6ef; }
    .cmd-status-chip { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .cmd-status-chip.montando  { background: #f3f3f3; color: #555; }
    .cmd-status-chip.feito     { background: #fff7d6; color: #a07000; }
    .cmd-status-chip.cozinha   { background: #fff0e0; color: var(--brand); }
    .cmd-status-chip.entregue  { background: #e8f1ff; color: #2f80ed; }
    .cmd-status-chip.pago      { background: #fff8f0; color: #a85500; }
    .list-pay-inline { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }
    .list-pay-inline select { font-size: 11px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; }

    /* ── Adicionais mini toggle ── */
    .obs-addon-row { display: flex; gap: 6px; align-items: flex-end; }
    .obs-addon-row > label { flex: 1; }
    .addon-mini { position: relative; }
    .addon-mini summary { list-style: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink); user-select: none; transition: background .12s; }
    .addon-mini summary::-webkit-details-marker { display: none; }
    .addon-mini[open] summary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .addon-mini .addon-list { position: absolute; right: 0; bottom: calc(100% + 4px); width: 230px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.14); z-index: 200; margin: 0; }

    .print-ticket {
      width: 280px;
      padding: 12px;
      color: #111;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.35;
    }

    .print-ticket h1 {
      font-size: 18px;
      text-align: center;
      margin: 0 0 4px;
    }

    .print-ticket .logo-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f28c28;
      margin: 0 auto 6px;
    }

    .print-ticket hr {
      border: 0;
      border-top: 1px dashed #333;
      margin: 8px 0;
    }

    .public-menu { min-height: 100vh; background: #000; }

    /* ===== PERSPECTA BISTRO — Public Menu ===== */
    .pm-wrap { min-height: 100vh; background: #000; font-family: 'Questrial', system-ui, sans-serif; }

    /* Hero */
    .pm-hero {
      background: #000;
      color: #fff;
      padding: 48px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .pm-hero::after {
      content: '';
      display: block;
      height: 4px;
      background: linear-gradient(90deg, #f6921e, #ffe597, #f6921e);
      margin-top: 32px;
    }
    .pm-hero-logo-img {
      display: block;
      margin: 0 auto 4px;
      width: auto;
      max-width: min(300px, 88%);
      max-height: 150px;
      object-fit: contain;
    }
    .pm-hero-wordmark {
      font-family: 'Anton', sans-serif;
      font-size: clamp(48px, 12vw, 80px);
      letter-spacing: 2px;
      color: #f6921e;
      line-height: 1;
      margin: 0;
      text-transform: uppercase;
    }
    .pm-hero-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffe597;
      margin: 6px 0 0;
    }
    .pm-hero-note {
      font-size: 13px;
      color: rgba(255,255,255,.55);
      margin: 14px 0 0;
      letter-spacing: .3px;
    }

    /* Category tabs */
    .pm-cats-wrap {
      background: #161616;
      border-bottom: 2px solid #f6921e;
      position: sticky; top: 0; z-index: 10;
      overflow-x: auto; scrollbar-width: none;
    }
    .pm-cats-wrap::-webkit-scrollbar { display: none; }
    .pm-cats { display: flex; gap: 6px; padding: 10px 16px; width: max-content; min-width: 100%; }
    .pm-cat {
      background: transparent; border: 1.5px solid #333; color: #aaa;
      border-radius: 6px; padding: 7px 20px; font-weight: 700; font-size: 13px;
      white-space: nowrap; cursor: pointer; transition: all .15s;
      font-family: 'Questrial', sans-serif; text-transform: uppercase; letter-spacing: .5px;
    }
    .pm-cat.active, .pm-cat:hover { background: #f6921e; color: #000; border-color: #f6921e; }

    /* Content */
    .pm-content { max-width: 960px; margin: 0 auto; padding: 24px 16px 120px; background: #000; }
    .pm-section-title {
      font-family: 'Anton', sans-serif;
      font-size: 20px; letter-spacing: 1.5px;
      margin: 32px 0 14px; color: #fff;
      text-transform: uppercase;
      display: flex; align-items: center; gap: 10px;
    }
    .pm-section-title::after { content: ''; flex: 1; height: 1px; background: #222; }

    .pm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

    /* Product card */
    .pm-card {
      background: #161616; border: 1px solid #2a2a2a; border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column;
      transition: border-color .2s, transform .15s;
    }
    .pm-card:hover { border-color: #f6921e; transform: translateY(-2px); }

    .pm-card-img {
      width: 100%; aspect-ratio: 4/3; background: #1e1e1e;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .pm-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .pm-card-emoji { font-size: 52px; line-height: 1; }

    .pm-card-body { padding: 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .pm-card-name { font-weight: 900; font-size: 15px; margin: 0; color: #fff; }
    .pm-card-desc { font-size: 13px; color: #888; margin: 0; flex: 1; line-height: 1.4; }
    .pm-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .pm-price { font-family: 'Anton', sans-serif; font-size: 22px; color: #f6921e; letter-spacing: .5px; }

    .pm-add-btn {
      background: #f6921e; color: #000; border: 0; border-radius: 8px;
      width: 38px; height: 38px; font-size: 22px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center; line-height: 1;
      transition: background .15s, transform .1s; flex-shrink: 0;
    }
    .pm-add-btn:hover { background: #ffe597; transform: scale(1.08); }

    /* FAB */
    .pm-fab {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #f6921e; color: #000; border: 0; border-radius: 10px;
      padding: 15px 32px; font-weight: 900; font-size: 15px; cursor: pointer;
      box-shadow: 0 8px 32px rgba(246,146,30,.55);
      display: flex; align-items: center; gap: 10px; z-index: 50;
      white-space: nowrap; transition: transform .15s, background .15s;
      font-family: 'Questrial', sans-serif; letter-spacing: .3px;
    }
    .pm-fab:hover { transform: translateX(-50%) scale(1.04); background: #ffe597; }

    /* Overlay / panels */
    .pm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.85);
      z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    }
    .pm-overlay.hidden { display: none; }

    .pm-cart-panel, .pm-addon-panel, .pm-checkout-panel {
      background: #161616; border-radius: 20px 20px 0 0;
      width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
      padding: 22px 20px 36px; border-top: 3px solid #f6921e;
      font-family: 'Questrial', sans-serif;
    }
    .pm-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .pm-panel-head h2 { margin: 0; font-size: 20px; font-weight: 900; color: #fff; }

    .pm-close-btn {
      background: #2a2a2a; border: 0; border-radius: 50%; width: 36px; height: 36px;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .pm-close-btn:hover { background: #f6921e; color: #000; }

    .pm-cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2a2a2a; }
    .pm-cart-item-info { flex: 1; min-width: 0; }
    .pm-cart-item-name { font-weight: 800; font-size: 14px; color: #fff; }
    .pm-cart-item-detail { font-size: 12px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pm-qty { display: flex; align-items: center; gap: 8px; }
    .pm-qty-btn {
      background: #2a2a2a; border: 0; border-radius: 50%; width: 30px; height: 30px;
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff;
    }
    .pm-qty-btn:hover { background: #f6921e; color: #000; }
    .pm-qty-num { font-weight: 900; min-width: 22px; text-align: center; color: #fff; }
    .pm-cart-item-price { font-weight: 900; min-width: 72px; text-align: right; font-size: 14px; color: #f6921e; }
    .pm-cart-total { display: flex; justify-content: space-between; font-weight: 900; font-size: 18px; padding: 16px 0 18px; color: #fff; }

    .pm-btn-full {
      width: 100%; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 900;
      border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      font-family: 'Questrial', sans-serif; transition: background .15s;
    }
    .pm-btn-green { background: #f6921e; color: #000; }
    .pm-btn-green:hover { background: #ffe597; }
    .pm-btn-ghost { background: #2a2a2a; color: #fff; margin-top: 10px; }
    .pm-btn-ghost:hover { background: #3a3a3a; }

    /* Form fields inside panels */
    .pm-cart-panel label, .pm-checkout-panel label, .pm-addon-panel label { color: #ccc; }
    .pm-cart-panel input, .pm-checkout-panel input, .pm-checkout-panel select,
    .pm-addon-panel input[type=text] {
      background: #111; border: 1.5px solid #333; color: #fff; border-radius: 8px;
      padding: 10px 12px; font-size: 15px; font-family: 'Questrial', sans-serif;
    }
    .pm-cart-panel input:focus, .pm-checkout-panel input:focus, .pm-checkout-panel select:focus {
      border-color: #f6921e; outline: none;
    }

    /* Addon modal */
    .pm-addon-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
    .pm-addon-item label { cursor: pointer; flex: 1; font-size: 14px; font-weight: 700; color: #fff; }
    .pm-addon-price { font-size: 13px; color: #f6921e; font-weight: 700; }
    .pm-addon-item input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; accent-color: #f6921e; }
    .pm-qty-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 10px; font-weight: 700; color: #fff; }
    .pm-qty-controls { display: flex; align-items: center; gap: 16px; background: #2a2a2a; border-radius: 30px; padding: 6px 18px; }

    /* Checkout modal */
    .pm-checkout-panel label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; margin-bottom: 14px; }
    .pm-checkout-panel input, .pm-checkout-panel select, .pm-checkout-panel textarea {
      width: 100%; border: 1.5px solid #e8ddd3; border-radius: 8px;
      padding: 10px 12px; font: inherit; font-size: 15px;
    }
    .pm-checkout-panel input:focus, .pm-checkout-panel select:focus { outline: none; border-color: var(--brand); }
    .pm-order-recap { background: #f9f6f2; border-radius: 10px; padding: 14px; margin: 16px 0; }
    .pm-recap-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
    .pm-recap-total { border-top: 1px solid #e8ddd3; margin-top: 8px; padding-top: 10px; font-weight: 900; font-size: 16px; }
    .pm-wa-btn {
      width: 100%; padding: 16px; border-radius: 12px; background: #25D366; color: white;
      font-size: 17px; font-weight: 850; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .pm-wa-btn:hover { background: #1db952; }

    /* WhatsApp badge in comandas */
    .badge-wa {
      display: inline-flex; align-items: center; gap: 4px;
      background: #e6f9ee; color: #0f6b3c; border-radius: 6px;
      padding: 3px 8px; font-size: 11px; font-weight: 850; margin-left: 8px; vertical-align: middle;
    }

    /* Photo thumbnail in menu admin table */
    .menu-thumb {
      width: 40px; height: 40px; border-radius: 6px; object-fit: cover;
      background: #f4ede4; border: 1px solid #e8ddd3; display: inline-block; vertical-align: middle;
    }
    .menu-thumb-empty {
      width: 40px; height: 40px; border-radius: 6px; display: inline-flex;
      align-items: center; justify-content: center; background: #f4ede4;
      border: 1px dashed #c8b8a8; font-size: 20px; vertical-align: middle;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      padding: 18px;
      border: 1px dashed var(--line);
      background: rgba(255,255,255,.55);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    .icon {
      width: 18px;
      height: 18px;
    }

    @media (max-width: 1050px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
      }
      .nav {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .metrics, .modules, .three-col, .flow, .command-grid, .command-location-grid, .floor-grid, .simple-card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .two-col {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      main { padding: 16px; }
      .topbar { display: grid; }
      .nav, .metrics, .modules, .three-col, .flow, .form-grid, .summary-strip, .command-grid, .command-location-grid, .floor-grid, .simple-card-grid, .ingredient-row {
        grid-template-columns: 1fr;
      }
      .payment-form {
        grid-template-columns: 1fr;
      }
      .command-save-grid {
        grid-template-columns: 1fr 1fr 60px auto;
      }
      .floor-plan { height: 520px; }
      .sidebar { padding: 16px; }
      .nav button { min-height: 44px; }
      .bar-line { grid-template-columns: 1fr; }
      th, td { min-width: 140px; }
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #printArea,
      #printArea * {
        visibility: visible;
      }
      #printArea {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        background: white;
      }
    }

    /* ===== LOGIN SCREEN ===== */
    #loginScreen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a;
    }
    #loginScreen.hidden { display: none; }
    .login-card {
      background: #1a1a1a; border-radius: 20px; padding: 40px 32px;
      max-width: 380px; width: 92%;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,.6);
    }
    .login-logo { width: 56px; height: 56px; }
    .login-wordmark { text-align: center; line-height: 1.1; }
    .login-wordmark strong { display: block; font-size: 20px; font-weight: 800; color: #fff; }
    .login-wordmark span { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #f6921e; font-weight: 500; }
    .login-card form { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .login-card form label { font-size: 12px; color: #aaa; font-weight: 600; display: flex; flex-direction: column; gap: 4px; }
    .login-card form input { background: #111; border: 1.5px solid #333; border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none; transition: border .15s; }
    .login-card form input:focus { border-color: #f6921e; }
    .login-card form button { margin-top: 6px; padding: 14px; font-size: 15px; font-weight: 700; background: #f6921e; color: #000; border: none; border-radius: 12px; cursor: pointer; }
    .login-card form button:hover { background: #e07d10; }
    .login-error { color: #e55; font-size: 13px; text-align: center; width: 100%; }
    .login-error.hidden { display: none; }
    .login-hint { font-size: 11px; color: #555; text-align: center; margin-top: 4px; }
  </style>
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-card">
      <svg class="login-logo" viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
        <rect width="42" height="42" rx="9" fill="#f6921e"/>
        <polygon points="21,9 32,15.5 21,22 10,15.5" fill="#fff"/>
        <polygon points="10,15.5 21,22 21,33 10,26.5" fill="rgba(0,0,0,0.28)"/>
        <polygon points="21,22 32,15.5 32,26.5 21,33" fill="rgba(0,0,0,0.14)"/>
      </svg>
      <div class="login-wordmark"><strong>Perspecta</strong><span>Bistro</span></div>

        <label>Senha<input type="password" id="loginPass" placeholder="Digite sua senha" autocomplete="current-password"></label>
        <div id="loginError" class="login-error hidden">Login ou senha incorretos</div>

  <div id="internalApp" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand" id="sidebarBrand"></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div id="sessionBadge" style="font-size:11px;color:#f6921e;font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px"></div>
        <button class="btn sidebar-logout" type="button" data-logout>⏏ Sair</button>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div>
          <p class="eyebrow" id="pageEyebrow" style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0"><rect width="42" height="42" rx="9" fill="#f6921e"/><polygon points="21,9 32,15.5 21,22 10,15.5" fill="#fff"/><polygon points="10,15.5 21,22 21,33 10,26.5" fill="rgba(0,0,0,0.28)"/><polygon points="21,22 32,15.5 32,26.5 21,33" fill="rgba(0,0,0,0.14)"/></svg>Perspecta Bistro</p>
          <h1 id="pageTitle">Visão do dia</h1>
          <p class="page-subtitle" id="pageSubtitle">Operação simples para caixa, mesas, pedidos, clientes e cardápio.</p>
        </div>
        <div class="date-pill" id="todayLabel"></div>
      </div>

      <section id="dashboard" class="section active"></section>
      <section id="empresas" class="section"></section>
      <section id="caixa" class="section"></section>
      <section id="mesas" class="section"></section>
      <section id="estoque" class="section"></section>
      <section id="custos" class="section"></section>
      <section id="metas" class="section"></section>
      <section id="previsao" class="section"></section>
      <section id="clientes" class="section"></section>
      <section id="cardapio" class="section"></section>
      <section id="comandas" class="section"></section>
      <section id="relatorios" class="section"></section>
      <section id="dados" class="section"></section>
    </main>
  </div>

  <div id="publicMenu" class="public-menu hidden"></div>
  <div id="printArea" class="print-area hidden"></div>

  <template id="iconTemplate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
  </template>

  <script>
    const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const DATE = new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
    const MASTER_KEY = "gestaoMaster.v1";
    let storeKey = MASTER_KEY;
    let currentSession = null; // { type:'gestor'} | { type:'company', company:{...} }

    const icons = {
      dashboard: '<path d="M3 13h8V3H3z"></path><path d="M13 21h8V11h-8z"></path><path d="M13 3h8v6h-8z"></path><path d="M3 21h8v-6H3z"></path>',
      empresas: '<path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path><path d="M9 9h1"></path><path d="M9 13h1"></path><path d="M9 17h1"></path>',
      mesas: '<rect width="16" height="10" x="4" y="7" rx="2"></rect><path d="M8 7V4"></path><path d="M16 7V4"></path><path d="M8 17v3"></path><path d="M16 17v3"></path>',
      caixa: '<rect width="20" height="14" x="2" y="5" rx="2"></rect><path d="M2 10h20"></path><path d="M6 15h.01"></path><path d="M10 15h.01"></path><path d="M14 15h.01"></path><path d="M18 15h.01"></path>',
      estoque: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><path d="M3.3 7 12 12l8.7-5"></path><path d="M12 22V12"></path>',
      custos: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M8 13h8"></path><path d="M8 17h5"></path>',
      metas: '<path d="M12 20V10"></path><path d="M18 20V4"></path><path d="M6 20v-6"></path>',
      previsao: '<path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path>',
      clientes: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
      cardapio: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"></path>',
      comandas: '<path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path>',
      relatorios: '<path d="M3 3v18h18"></path><path d="M7 16V8"></path><path d="M12 16v-5"></path><path d="M17 16v-9"></path>',
      dados: '<path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z"></path><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8.6 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15.4 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.35.35.66.6 1 .3.25.7.4 1.1.4H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51.6z"></path>'
    };

    const navItems = [
      ["dashboard", "Visão do dia"], ["empresas", "Empresas"], ["caixa", "Caixa"], ["estoque", "Estoque e insumos"], ["custos", "Fichas de custo"], ["metas", "Metas"], ["previsao", "Planejamento"], ["clientes", "Clientes"],
      ["cardapio", "Cardápio"], ["comandas", "Comandas"], ["relatorios", "Relatórios"], ["dados", "Configurações"]
    ];

    const pageCopy = {
      dashboard: ["Visão do dia", "Resumo rápido para olhar no caixa: vendas, clientes, mesas e pedidos."],
      empresas: ["Empresas", "Acesso da gestão para abrir cada restaurante e acompanhar as configurações."],
      caixa: ["Caixa", "Entradas, saídas, sangrias e fechamento do dia."],
      mesas: ["Mesas e áreas", "Organize o salão arrastando as mesas e cadastrando cada área."],
      estoque: ["Estoque e insumos", "Entrada de estoque, mínimo necessário e alerta do que está faltando."],
      custos: ["Fichas de custo", "Receitas com vários ingredientes e cálculo automático de custo."],
      metas: ["Metas", "Acompanhe venda, quantidade de pedidos, produtos específicos e tempo de preparo."],
      previsao: ["Planejamento", "Receitas e despesas previstas para saber o que entra, o que sai e o saldo esperado."],
      clientes: ["Clientes", "Cadastro simples com contato, aniversário, pontos e WhatsApp."],
      cardapio: ["Cardápio", "Itens que aparecem no cardápio público e nas comandas."],
      comandas: ["Comandas", "Pedidos abertos por mesa, balcão ou delivery."],
      relatorios: ["Relatórios", "Leitura simples do que vendeu, do que entrou e do que precisa atenção."],
      dados: ["Configurações", "Operação simples para o caixa: pedido, cliente e cardápio."]
    };

    const defaultState = {
      settings: {
        whatsapp: "",
        restaurant: "Perspecta Bistro",
        defaultMargin: 60,
        publicSlug: "perspecta-bistro",
        ownerName: "",
        ownerEmail: "",
        ownerPassword: "",
        clientLogin: "",
        clientPassword: "",
        theme: "preto-laranja",
        menuNote: "Pedido finalizado pelo WhatsApp da empresa.",
        logoUrl: null,
        perspectaLogo: null
      },
      gestorCredentials: { login: "gestor", senha: "perspecta2026" },
      companies: [],
      staff: [],
      costs: [],
      tables: [
        { id: "tbl-balcao", nome: "Balcão", area: "Caixa", ordem: 1, x: 8, y: 12 },
        { id: "tbl-mesa1",  nome: "Mesa 1", area: "Salão", ordem: 2, x: 34, y: 12 },
        { id: "tbl-mesa2",  nome: "Mesa 2", area: "Salão", ordem: 3, x: 62, y: 12 },
        { id: "tbl-delivery", nome: "Delivery", area: "Online", ordem: 4, x: 84, y: 12 }
      ],
      goals: [],
      inventory: [],
      inventoryMovements: [],
      expenses: [],
      cash: [],
      cashSessions: [],
      clients: [],
      menu: [],
      addons: [],
      commands: [],
      sales: []
    };
    let state = loadState();

    function uid() {
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(storeKey);
        if (!saved) return normalizeState(structuredClone(defaultState));
        return normalizeState({ ...structuredClone(defaultState), ...JSON.parse(saved) });
      } catch {
        return normalizeState(structuredClone(defaultState));
      }
    }

    function loadMasterState() {
      try {
        const saved = localStorage.getItem(MASTER_KEY);
        const base = { gestorCredentials: { login: "gestor", senha: "perspecta2026" }, companies: [], settings: {} };
        if (!saved) return base;
        return { ...base, ...JSON.parse(saved) };
      } catch { return { gestorCredentials: { login: "gestor", senha: "perspecta2026" }, companies: [], settings: {} }; }
    }

    function saveMasterState(master) {
      localStorage.setItem(MASTER_KEY, JSON.stringify(master));
    }

    function showLogin() {
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("internalApp").classList.add("hidden");
      document.getElementById("publicMenu").classList.add("hidden");
      document.getElementById("loginError").classList.add("hidden");
      document.getElementById("loginUser").value = "";
      document.getElementById("loginPass").value = "";
      setTimeout(() => document.getElementById("loginUser").focus(), 100);
    }

    function hideLogin() {
      document.getElementById("loginScreen").classList.add("hidden");
    }

    function doLogin(login, senha) {
      const master = loadMasterState();
      const gc = master.gestorCredentials || { login: "gestor", senha: "perspecta2026" };
      if (login === gc.login && senha === gc.senha) {
        currentSession = { type: "gestor" };
        sessionStorage.setItem("perspectaSession", JSON.stringify(currentSession));
        storeKey = MASTER_KEY;
        state = normalizeState({ ...structuredClone(defaultState), ...master });
        hideLogin();
        startApp();
        return;
      }
      const companies = master.companies || [];
      const company = companies.find(c => c.login === login && c.senha === senha && c.status !== "inativo");
      if (company) {
        currentSession = { type: "company", company };
        sessionStorage.setItem("perspectaSession", JSON.stringify(currentSession));
        storeKey = "gestaoCompany." + company.id + ".v1";
        state = loadState();
        hideLogin();
        startApp();
        return;
      }
      document.getElementById("loginError").classList.remove("hidden");
    }

    function startApp() {
      if (location.hash.startsWith("#cardapio-publico")) {
        document.getElementById("internalApp").classList.add("hidden");
        document.getElementById("publicMenu").classList.remove("hidden");
        renderPublicMenu();
        loadFromServer().then(ss => {
          if (ss && (ss.savedAt || 0) > (state.savedAt || 0)) {
            state = normalizeState({ ...structuredClone(defaultState), ...ss });
            localStorage.setItem(storeKey, JSON.stringify(state));
            renderPublicMenu();
          }
        }).catch(() => {});
        setInterval(() => {
          loadFromServer().then(ss => {
            if (ss && (ss.savedAt || 0) > (state.savedAt || 0)) {
              state = normalizeState({ ...structuredClone(defaultState), ...ss });
              localStorage.setItem(storeKey, JSON.stringify(state));
              renderPublicMenu();
            }
          }).catch(() => {});
        }, 15000);
        return;
      }
      document.getElementById("internalApp").classList.remove("hidden");
      renderAll();
      const start = location.hash.replace("#", "");
      if (start && document.getElementById(start)?.classList.contains("section")) setSection(start);
    }

    function getSessionLabel() {
      if (!currentSession) return "";
      if (currentSession.type === "gestor") return "Gestor";
      return currentSession.company?.nome || "Empresa";
    }

    function getNavItems() {
      if (!currentSession || currentSession.type === "gestor") return navItems;
      return navItems.filter(([id]) => id !== "empresas");
    }

    function normalizeState(data) {
      data.settings = { ...structuredClone(defaultState.settings), ...(data.settings || {}) };
      data.settings.menuOrder = normalizeMenuOrder(data.settings.menuOrder);
      data.cash = data.cash || [];
      data.cashSessions = data.cashSessions || structuredClone(defaultState.cashSessions);
      data.tables = ensureDefaultServicePoints(data.tables || structuredClone(defaultState.tables));
      data.goals = data.goals || structuredClone(defaultState.goals);
      data.inventory = data.inventory || structuredClone(defaultState.inventory);
      data.inventory = data.inventory.map(item => ({ previousCost: item.previousCost ?? item.custo, ...item }));
      data.inventoryMovements = data.inventoryMovements || [];
      const savedMenu = Array.isArray(data.menu) && data.menu.length ? data.menu : structuredClone(defaultState.menu);
      const savedAddons = Array.isArray(data.addons) && data.addons.length ? data.addons : structuredClone(defaultState.addons);
      data.menu = savedMenu.map(item => ({ foto: null, ...item, preco: num(item.preco) }));
      data.addons = savedAddons.map(addon => ({ ativo: true, ...addon, preco: num(addon.preco) }));
      data.companies = data.companies || structuredClone(defaultState.companies);
      data.staff = data.staff || structuredClone(defaultState.staff);
      data.staff = data.staff.map(person => ({ ...person, permissions: Array.isArray(person.permissions) ? person.permissions : defaultPermissionsForRole(person.perfil) }));
      data.tables = data.tables.map((table, index) => ({
        ...table,
        x: table.x ?? (8 + (index % 4) * 24),
        y: table.y ?? (12 + Math.floor(index / 4) * 34)
      }));
      data.goals = data.goals.map(goal => ({
        tipo: "valor",
        periodo: "hoje",
        produto: "",
        ...goal
      }));
      data.commandViewMode = data.commandViewMode || "geral";
      data.costs = (data.costs || []).map(row => {
        if (Array.isArray(row.ingredientes)) {
          return {
            ...row,
            ingredientes: row.ingredientes.map(item => ({
              ...item,
              inventoryId: item.inventoryId || inventoryMatchByName(item.nome, data.inventory)?.id || "",
              baseUnitCost: item.baseUnitCost || purchaseUnitCost(item)
            }))
          };
        }
        return {
          id: row.id || uid(),
          produto: row.produto || "Produto",
          rendimento: row.rendimento || 1,
          margem: row.margem || data.settings.defaultMargin,
          outrosCustos: row.outrosCustos || 0,
          ingredientes: [{
            nome: row.ingrediente || "Ingrediente",
            precoCompra: row.precoCompra || 0,
            quantidadeCompra: row.quantidadeCompra || 1,
            unidadeCompra: row.unidadeCompra || "kg",
            quantidadeUsada: row.quantidadeUsada || 0,
            unidadeUsada: row.unidadeUsada || "g",
            inventoryId: inventoryMatchByName(row.ingrediente, data.inventory)?.id || "",
            baseUnitCost: purchaseUnitCost(row)
          }]
        };
      });
      return data;
    }

    function ensureDefaultServicePoints(tables) {
      const required = [
        ...Array.from({ length: 11 }, (_, index) => ({ nome: `Mesa ${index + 1}`, area: index < 4 ? "Salão" : index < 8 ? "Meio" : "Fundo" })),
        { nome: "Balcão", area: "Caixa" },
        { nome: "Bebidas", area: "Balcão" },
        { nome: "Delivery", area: "Online" }
      ];
      const existing = new Set((tables || []).map(table => String(table.nome || "").toLowerCase()));
      required.forEach((item, index) => {
        if (!existing.has(item.nome.toLowerCase())) {
          tables.push({
            id: uid(),
            nome: item.nome,
            area: item.area,
            ordem: (tables.length || 0) + 1,
            x: 8 + (index % 4) * 26,
            y: 12 + Math.floor(index / 4) * 25
          });
        }
      });
      return tables;
    }

    function normalizeMenuOrder(order) {
      const saved = Array.isArray(order) ? order : [];
      const byId = new Map(saved.map((item, index) => [item.id, { ...item, order: num(item.order || index + 1) }]));
      return getNavItems().map(([id, label], index) => {
        const current = byId.get(id) || {};
        return {
          id,
          label: current.label || label,
          order: current.order || index + 1,
          visible: id === "dashboard" || id === "dados" ? true : current.visible !== false
        };
      });
    }

    function orderedMenuItems() {
      const order = normalizeMenuOrder(state.settings.menuOrder);
      state.settings.menuOrder = order;
      return order
        .filter(item => item.visible || item.id === "dashboard" || item.id === "dados")
        .sort((a, b) => num(a.order) - num(b.order));
    }

    function defaultPermissionsForRole(role) {
      if (role === "Gestão") return navItems.map(item => item[0]).filter(id => id !== "empresas");
      if (role === "Caixa") return ["dashboard", "caixa", "mesas", "estoque", "clientes", "cardapio", "comandas", "relatorios"];
      if (role === "Cozinha") return ["dashboard", "comandas", "estoque"];
      return ["dashboard", "mesas", "clientes", "cardapio", "comandas"];
    }

    function permissionOptions(selected = []) {
      const locked = new Set(["dashboard"]);
      return navItems
        .filter(([id]) => id !== "empresas")
        .map(([id, label]) => `<label class="permission-chip"><input type="checkbox" name="permissions" value="${id}" ${selected.includes(id) || locked.has(id) ? "checked" : ""} ${locked.has(id) ? "disabled" : ""}> ${escapeHTML(label)}</label>`)
        .join("");
    }

    const SERVER_SYNC = 'http://localhost:7342';

    function syncToServer(s) {
      try {
        fetch(SERVER_SYNC + '/state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(s)
        }).catch(() => {});
      } catch(e) {}
    }

    async function loadFromServer() {
      try {
        const r = await fetch(SERVER_SYNC + '/state');
        if (!r.ok) return null;
        return await r.json();
      } catch(e) { return null; }
    }

    function save() {
      try {
        state.savedAt = Date.now();
        localStorage.setItem(storeKey, JSON.stringify(state));
        syncToServer(state);
        renderAll();
      } catch (error) {
        alert("Não foi possível salvar. A imagem pode estar pesada demais; tente uma foto menor.");
      }
    }

    function saveMenuRow(row, item) {
      if (!row || !item) return;
      item.nome = row.querySelector("[data-edit-menu-name]").value;
      item.descricao = row.querySelector("[data-edit-menu-desc]").value;
      item.emoji = row.querySelector("[data-edit-menu-emoji]").value || "🍽️";
      item.categoria = row.querySelector("[data-edit-menu-category]").value;
      item.preco = num(row.querySelector("[data-edit-menu-price]").value);
      item.ativo = row.querySelector("[data-edit-menu-active]").value === "true";
      const pendingPhoto = row.querySelector("[data-menu-photo-preview]")?.dataset.pendingPhoto;
      if (pendingPhoto) item.foto = pendingPhoto;
    }

    function validPhotoSrc(src) {
      return typeof src === "string" && (/^data:image\//.test(src) || /^https?:\/\//.test(src) || /^file:\/\//.test(src));
    }

    function menuPhotoPreview(item) {
      if (!validPhotoSrc(item.foto)) return `<span class="menu-thumb-empty">${escapeHTML(item.emoji || "🍽️")}</span>`;
      return `<img class="menu-thumb" src="${item.foto}" alt="${escapeHTML(item.nome)}" data-emoji="${escapeHTML(item.emoji || "🍽️")}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'menu-thumb-empty',textContent:this.dataset.emoji||'🍽️'}))">`;
    }

    function money(value) {
      return BRL.format(Number(value || 0));
    }

    function num(value) {
      return Number(String(value ?? "").replace(",", ".")) || 0;
    }

    function convertToBase(value, unit) {
      const amount = num(value);
      if (unit === "kg" || unit === "l") return amount * 1000;
      if (unit === "g" || unit === "ml" || unit === "un") return amount;
      return amount;
    }

    function inventoryMatchByName(name, inventory = state.inventory || []) {
      const normalized = String(name || "").trim().toLowerCase();
      return inventory.find(item => String(item.item || "").trim().toLowerCase() === normalized);
    }

    function inventoryById(id) {
      return (state.inventory || []).find(item => item.id === id);
    }

    function purchaseUnitCost(row) {
      const base = convertToBase(row.quantidadeCompra || 1, row.unidadeCompra || "un");
      return base ? num(row.precoCompra) / base : 0;
    }

    function inventoryUnitCost(item) {
      if (!item) return 0;
      const base = convertToBase(1, item.unidade || "un");
      return base ? num(item.custo) / base : 0;
    }

    function currentIngredientUnitCost(row) {
      const inventory = inventoryById(row.inventoryId) || inventoryMatchByName(row.nome);
      return inventory ? inventoryUnitCost(inventory) : purchaseUnitCost(row);
    }

    function ingredientCost(row) {
      const usedBase = convertToBase(row.quantidadeUsada, row.unidadeUsada);
      const unitCost = currentIngredientUnitCost(row);
      return unitCost * usedBase;
    }

    function ingredientOriginalCost(row) {
      const usedBase = convertToBase(row.quantidadeUsada, row.unidadeUsada);
      return num(row.baseUnitCost || purchaseUnitCost(row)) * usedBase;
    }

    function ingredientChange(row) {
      const current = ingredientCost(row);
      const original = ingredientOriginalCost(row);
      const delta = current - original;
      return { current, original, delta, changed: Math.abs(delta) >= 0.01 };
    }

    function costCalc(row) {
      const ingredientTotal = (row.ingredientes || []).reduce((sum, item) => sum + ingredientCost(item), 0);
      const totalRecipe = ingredientTotal + num(row.outrosCustos);
      const costPerUnit = totalRecipe / Math.max(1, num(row.rendimento));
      const profitValue = costPerUnit * (num(row.margem) / 100);
      const suggested = costPerUnit + profitValue;
      return { ingredientCost: ingredientTotal, totalRecipe, costPerUnit, profitValue, suggested: isFinite(suggested) ? suggested : 0 };
    }

    function commandTotal(command) {
      return command.itens.reduce((sum, item) => sum + commandItemTotal(item), 0);
    }

    function commandItemAddons(item) {
      return (item.adicionais || []).map(addon => typeof addon === "string" ? { id: "", nome: addon, preco: 0 } : { preco: 0, ...addon });

    function commandItemTotal(item) {
      const addonsTotal = commandItemAddons(item).reduce((sum, addon) => sum + num(addon.preco), 0);
      return (num(item.preco) + addonsTotal) * Math.max(1, num(item.quantidade));
    }

    function tableMap(draggable = false, allowOpen = true) {
      const open = state.commands.filter(c => c.status === "aberta");

      const content = (state.tables || []).sort((a, b) => num(a.ordem) - num(b.ordem)).map(table => {
        const command = open.find(c => c.local.toLowerCase() === table.nome.toLowerCase());
        if (onlyActive && !command) return "";
        const tileSize = Math.max(108, Math.min(180, num(table.tamanho || state.settings.tableTileSize || 118)));
        const minutes = command ? Math.max(1, Math.round((Date.now() - new Date(command.createdAt).getTime()) / 60000)) : 0;
        const status = tableStatus(command);
        const style = draggable ? `style="--table-size:${tileSize}px;left:${Math.max(0, Math.min(88, num(table.x)))}%;top:${Math.max(0, Math.min(80, num(table.y)))}%"` : `style="--table-size:${tileSize}px"`;
        const openAttr = allowOpen ? `data-open-table="${escapeHTML(table.nome)}"` : "";
        const showMinutes = command && !command.deliveredAt && !command.paidAt;
        const statusText = command ? `${status.label}${showMinutes ? ` · ${minutes} min` : ""}` : "Livre";
        const paidBadge = command?.paidAt ? `<span class="table-paid-badge" title="Pago">✓</span>` : "";
        const mainText = command ? escapeHTML(command.cliente || "Avulso") : escapeHTML(table.nome);
        const subText = command ? `<span class="table-name">${escapeHTML(table.nome)}</span>` : "";
        return `<button class="table-tile ${status.className}" ${style} data-table-id="${table.id}" ${openAttr}>

    function salesForGoalPeriod(periodo) {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      if (periodo === "hoje" || periodo === "agora") return todaySales();
      return (state.sales || []).filter(s => {
        const d = new Date(s.createdAt || "");
        if (isNaN(d)) return false;
        if (periodo === "semana") {
          const ws = new Date(now); ws.setHours(0, 0, 0, 0);
          const day = ws.getDay(); ws.setDate(ws.getDate() - (day === 0 ? 6 : day - 1));
          return d >= ws;
        }
        if (periodo === "mes") return d.getFullYear() === year && d.getMonth() === month;
        if (periodo === "trimestre") return d.getFullYear() === year && Math.floor(d.getMonth() / 3) === Math.floor(month / 3);
        if (periodo === "ano") return d.getFullYear() === year;
        if (periodo === "proximo_mes") {
          const nm = month === 11 ? 0 : month + 1;
          const ny = month === 11 ? year + 1 : year;
          return d.getFullYear() === ny && d.getMonth() === nm;
        }
        if (periodo === "proximo_ano") return d.getFullYear() === year + 1;
        return false;
      });
    }

    function goalPeriodLabel(periodo) {
      const y = new Date().getFullYear();
      return { hoje: "Hoje", semana: "Esta semana", mes: "Este mês", trimestre: "Este trimestre", ano: `Ano ${y}`, proximo_mes: "Próximo mês", proximo_ano: `Ano ${y + 1}`, agora: "Ao vivo" }[periodo] || periodo;
    }

    function goalProgress(goal) {
      if (goal.tipo === "tempo") {
        const open = state.commands.filter(c => c.status === "aberta");
        return open.length ? Math.round(open.reduce((s, c) => s + ((Date.now() - new Date(c.createdAt).getTime()) / 60000), 0) / open.length) : 0;
      }
      const sales = salesForGoalPeriod(goal.periodo || "hoje");
      if (goal.tipo === "pedidos") return sales.length;
      if (goal.tipo === "produto") {
        const key = (goal.produto || "").toLowerCase();
        return sales.reduce((s, sale) => s + (sale.itens || []).filter(i => !key || String(i.nome).toLowerCase().includes(key)).reduce((si, i) => si + num(i.quantidade), 0), 0);
      }
      return sales.reduce((sum, s) => sum + num(s.total), 0);
    }

    function goalCard(goal) {
      const done = goalProgress(goal);
      const target = Math.max(1, num(goal.alvo));
      const pct = goal.tipo === "tempo" ? Math.max(0, Math.min(100, 100 - ((done - target) / target) * 100)) : Math.min(100, (done / target) * 100);
      const label = goalPeriodLabel(goal.periodo || "hoje");
      const isFuture = goal.periodo === "proximo_mes" || goal.periodo === "proximo_ano";
      return `<article class="simple-card goal-card">
        <span class="mini">${escapeHTML(label)}${isFuture ? " · planejamento" : ""}</span>
        <strong>${escapeHTML(goal.nome)}</strong>
        <p class="mini">${done} de ${escapeHTML(String(goal.alvo))} ${escapeHTML(goal.unidade || "")}</p>
        <div class="progress"><i style="width:${Math.max(0, pct)}%"></i></div>
        <div class="actions" style="margin-top:8px"><button class="btn ghost" data-delete-goal="${goal.id}">Excluir</button></div>
      </article>`;
    }

      const s = commandStatus(command);
      const display = (s === "aberta" && command.itens.length) ? "feito" : s === "aberta" ? "montando" : s === "cozinha" ? "cozinha" : s === "entregue" ? "entregue" : "pago";

      return `<span class="cmd-status-chip ${display}">${labels[display] || display}</span>`;
    }

    function commandKanbanCard(command) {
      const total = commandTotal(command);
      const status = commandStatus(command);
      const mesa = escapeHTML(command.local);
      const cliente = escapeHTML(command.cliente || "Avulso");
      const pessoas = Math.max(1, num(command.pessoas || 1));

        action = `<span class="mini" style="color:var(--muted)">Sem itens</span>`;
      } else if (status === "aberta") {
        action = `<button class="btn secondary btn-sm" style="width:100%" data-send-kitchen="${command.id}">🍳 Mandar para cozinha</button>`;
      } else if (status === "cozinha") {
        action = `<button class="btn ghost btn-sm" style="width:100%" data-deliver-command="${command.id}">✓ Marcar entregue</button>`;

        action = `<div class="kb-pay-row">

    function productRanking() {
      const map = new Map();
      todaySales().forEach(sale => {
        (sale.itens || []).forEach(item => {
          const current = map.get(item.nome) || { nome: item.nome, quantidade: 0, total: 0 };
          current.quantidade += num(item.quantidade);
          current.total += commandItemTotal(item);
          map.set(item.nome, current);
        });
      });
      return Array.from(map.values()).sort((a, b) => b.total - a.total);
    }

    function dateOnly(value) {
      return (value || "").slice(0, 10);
    }

    function inDateRange(value, start, end) {
      const date = dateOnly(value);
      return (!start || date >= start) && (!end || date <= end);
    }

    function weekdayMatches(value, weekday) {
      if (weekday === "" || weekday === undefined || weekday === null) return true;
      const date = new Date(`${dateOnly(value)}T12:00:00`);
      return String(date.getDay()) === String(weekday);
    }

    function ordersForRange(start, end, weekday = "") {
      const sales = (state.sales || []).filter(sale => inDateRange(sale.createdAt, start, end) && weekdayMatches(sale.createdAt, weekday));
      const commands = (state.commands || [])
        .filter(command => command.status === "aberta" && inDateRange(command.createdAt, start, end) && weekdayMatches(command.createdAt, weekday))
        .map(command => ({ ...command, total: commandTotal(command), live: true }));
      return [...sales, ...commands].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    }

    function productStats(orders) {
      const map = new Map();
      orders.forEach(order => {
        (order.itens || []).forEach(item => {
          const current = map.get(item.nome) || { nome: item.nome, quantidade: 0, total: 0, lucro: 0 };
          const qty = Math.max(1, num(item.quantidade));
          const total = commandItemTotal(item);
          const cost = state.costs.find(row => row.produto.toLowerCase() === String(item.nome).toLowerCase());
          const unitCost = cost ? costCalc(cost).costPerUnit : 0;
          current.quantidade += qty;
          current.total += total;
          current.lucro += total - unitCost * qty;
          map.set(item.nome, current);
        });
      });
      return Array.from(map.values()).sort((a, b) => b.total - a.total);
    }

    function avgKitchenMinutes(orders) {
      const times = orders
        .map(order => order.kitchenSentAt && order.deliveredAt ? Math.round((new Date(order.deliveredAt) - new Date(order.kitchenSentAt)) / 60000) : null)
        .filter(value => value !== null && isFinite(value) && value >= 0);
      return times.length ? Math.round(times.reduce((sum, value) => sum + value, 0) / times.length) : 0;
    }

    function reportSummary(orders) {
      return {
        pedidos: orders.length,
        vendas: orders.reduce((sum, order) => sum + num(order.total || commandTotal(order)), 0),
        itens: orders.reduce((sum, order) => sum + (order.itens || []).reduce((itemSum, item) => itemSum + num(item.quantidade), 0), 0),
        tempo: avgKitchenMinutes(orders)
      };
    }

    function percentChange(current, previous) {
      if (!previous) return current ? "+100%" : "0%";
      const pct = ((current - previous) / previous) * 100;
      return `${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%`;
    }

    function weekDayOptions(selected) {
      const names = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
      return `<option value="">Todos</option>${names.map((name, index) => `<option value="${index}" ${String(selected) === String(index) ? "selected" : ""}>${name}</option>`).join("")}`;
    }

    function periodRange(kind) {
      const now = new Date();
      const date = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (kind === "week") {
        const day = date.getDay();
        const diff = day === 0 ? 6 : day - 1;
        const start = new Date(date);
        start.setDate(date.getDate() - diff);
        return { start: dateToISO(start), end: dateToISO(date), weekday: "" };
      }
      if (kind === "month") {
        return { start: dateToISO(new Date(date.getFullYear(), date.getMonth(), 1)), end: dateToISO(date), weekday: "" };
      }
      return { start: dateToISO(date), end: dateToISO(date), weekday: "" };
    }

    function dateToISO(date) {

      const compareA = ordersForRange(filters.compareAStart, filters.compareAEnd);
      const compareB = ordersForRange(filters.compareBStart, filters.compareBEnd);
      const sumA = reportSummary(compareA);
      const sumB = reportSummary(compareB);
      const profitProducts = products.slice().sort((a, b) => b.lucro - a.lucro);

      // Gastos de insumos no período

      const compras = (state.inventoryMovements || []).filter(m => {
        if (m.tipo !== "entrada") return false;
        const d = (m.createdAt || "").slice(0, 10);
        return d >= rStart && d <= rEnd;
      });
      const gastosMap = new Map();
      compras.forEach(m => {
        const inv = inventoryById(m.inventoryId);
        const custoUnit = num(m.custo) || num(inv?.custo) || 0;
        const key = m.item || m.inventoryId;
        const cur = gastosMap.get(key) || { nome: key, unidade: m.unidade || inv?.unidade || "", qtd: 0, total: 0 };
        cur.qtd   += num(m.quantidade);
        cur.total += num(m.quantidade) * custoUnit;
        gastosMap.set(key, cur);
      });
      const gastosLista = [...gastosMap.values()].sort((a, b) => b.total - a.total);
      const gastoTotal = gastosLista.reduce((s, g) => s + g.total, 0);

            ${simpleCard("Quantidade total", qtdTotal.toFixed(2).replace(".", ",") + " unid.", "Soma de todas as quantidades compradas.")}

          ${gastosLista.length ? `

        <div class="grid two-col" style="margin-top:16px">

            <div><span>Tempo médio</span><strong>${percentChange(sumA.tempo, sumB.tempo)}</strong></div>

    function pmCartTotal() {
      return publicCart.reduce((s, item) => {
        const addT = (item.adicionais || []).reduce((sa, a) => sa + num(a.preco), 0);
        return s + (num(item.preco) + addT) * num(item.quantidade);
      }, 0);
    }

    function updatePmFab() {
      const fab = document.getElementById("pmFab");
      const label = document.getElementById("pmFabLabel");
      if (!fab || !label) return;
      const count = publicCart.reduce((s, i) => s + i.quantidade, 0);
      if (count > 0) {
        fab.classList.remove("hidden");
        label.textContent = `${count} ${count === 1 ? "item" : "itens"} · ${money(pmCartTotal())}`;
      } else {
        fab.classList.add("hidden");
      }
    }

      el.innerHTML = publicCart.map((item, index) => {
        const addT = (item.adicionais || []).reduce((s, a) => s + num(a.preco), 0);
        const unit = num(item.preco) + addT;
        const detail = [(item.adicionais || []).map(a => a.nome).join(", "), item.observacao].filter(Boolean).join(" · ");
        return `<div class="pm-cart-item">
          <div class="pm-cart-item-info">

            ${detail ? `<div class="pm-cart-item-detail">${escapeHTML(detail)}</div>` : ""}
