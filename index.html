<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perspecta Bistro</title>
  <link rel="icon" id="faviconLink" href="icone-192.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6921e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Questrial&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f3ee;
      --panel: #fffdf9;
      --panel-2: #f1ebe2;
      --ink: #171412;
      --muted: #756a60;
      --line: #ded4c7;
      --brand: #f07a22;
      --brand-2: #176b5d;
      --gold: #c58b22;
      --blue: #356ea8;
      --danger: #a92f2f;
      --ok: #24734c;
      --shadow: 0 18px 45px rgba(42, 28, 16, .10);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: #111111;
      color: #f8efe4;
      padding: 22px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(255,255,255,.13);
      margin-bottom: 18px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .brand-wordmark {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand-wordmark strong {
      display: block;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .3px;
      color: #fff;
    }
    .brand-wordmark span {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f6921e;
      font-weight: 500;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      color: #f8efe4;
      background: transparent;
      border-radius: 7px;
      transition: .18s ease;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(255,255,255,.10);
    }

    .nav svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .sidebar-footer {
      margin-top: 26px;
      padding: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 8px;
      color: #e9dccd;
      font-size: 13px;
      line-height: 1.45;
    }

    .sidebar-logout {
      width: 100%;
      margin-top: 14px;
      background: var(--brand);
      color: #111111;
    }

    main {
      padding: 26px;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      margin: 8px 0 0;
      max-width: 760px;
    }

    .eyebrow {
      color: var(--brand);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0;
      font-size: 12px;
      margin: 0 0 6px;
    }

    h1, h2, h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.02;
      max-width: 850px;
    }

    h2 { font-size: 24px; margin-bottom: 14px; }
    h3 { font-size: 17px; margin-bottom: 12px; }

    .date-pill {
      white-space: nowrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--muted);
      box-shadow: var(--shadow);
      font-weight: 700;
      font-size: 13px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 18px;
    }

    .metric, .panel, .module-card, .product-row, .report-row, .command-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 17px;
      min-height: 126px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 11px;
    }

    .metric .value {
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 10px;
    }

    .metric .delta {
      color: var(--ok);
      font-weight: 800;
      font-size: 13px;
    }

    .metric .delta.bad { color: var(--danger); }

    .two-col {
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
    }

    .three-col {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel {
      padding: 18px;
      min-width: 0;
    }

    .modules {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .module-card {
      padding: 16px;
      min-height: 178px;
    }

    .plain-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .module-card p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 14px;
      font-size: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      background: var(--panel-2);
      color: #40362e;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .product-list, .report-list {
      display: grid;
      gap: 10px;
    }

    .product-row, .report-row {
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: none;
    }

    .product-row strong, .report-row strong {
      display: block;
      margin-bottom: 4px;
    }

    .product-row span, .report-row span {
      color: var(--muted);
      font-size: 13px;
    }

    .bar-chart {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .bar-line {
      display: grid;
      grid-template-columns: 145px 1fr 56px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }

    .bar {
      height: 12px;
      background: #eadfd1;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--brand-2);
      border-radius: inherit;
    }

    .flow {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin-top: 18px;
    }

    .flow-step {
      background: #171412;
      color: #fff7eb;
      padding: 16px;
      border-radius: 8px;
      min-height: 112px;
      position: relative;
    }

    .flow-step strong { display: block; margin: 10px 0 4px; }
    .flow-step span { color: #d8cab8; font-size: 13px; }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    form {
      display: grid;
      gap: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .floor-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .floor-plan {
      position: relative;
      height: 420px;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px),
        linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px),
        #fffaf3;
      background-size: 48px 48px;
      overflow: hidden;
      touch-action: none;
    }

    .table-tile {
      position: relative;
      box-sizing: border-box;
      min-height: 86px;
      border-radius: 8px;
      border: 2px solid var(--line);
      background: #fffaf3;
      padding: clamp(10px, calc(var(--table-size, 132px) * .09), 16px);
      display: grid;
      align-content: center;
      gap: 5px;
      overflow: hidden;
    }

    .floor-plan .table-tile {
      position: absolute;
      width: var(--table-size, 132px);
      min-height: calc(var(--table-size, 132px) * .72);
      cursor: grab;
      user-select: none;
      box-shadow: 0 10px 22px rgba(35, 24, 14, .12);
    }

    .floor-plan .table-tile.dragging {
      cursor: grabbing;
      z-index: 5;
      transform: scale(1.02);
    }

    .table-tile.busy {
      border-color: var(--brand);
      background: #fffaf3;
    }

    .table-tile.kitchen {
      border-color: #d99a00;
      background: #ffe36b;
    }

    .table-tile.delivered {
      border-color: #2f80ed;
      background: #e8f1ff;
    }

    .table-tile.paid {
      border-color: #cdd8cf;
      background: #fff;
    }

    .table-tile.free {
      border-color: #cdd8cf;
      background: #fff;
    }

    .table-tile strong {
      display: block;
      max-width: 100%;
      font-size: clamp(12px, calc(var(--table-size, 132px) * .11), 18px);
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .table-tile span {
      color: var(--muted);
      font-size: clamp(10px, calc(var(--table-size, 132px) * .075), 13px);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .table-paid-badge {
      position: absolute;
      left: 8px;
      bottom: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #17623a;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 5px 12px rgba(23, 98, 58, .22);
    }

    .table-resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 24px;
      height: 24px;
      border: 0;
      background: transparent;
      cursor: nwse-resize;
      touch-action: none;
      border-radius: 0 0 8px 0;
      transition: background .15s;
    }

    .table-tile.resizing .table-resize-handle {
      background: rgba(240, 122, 34, 0.55);
    }

    .table-tile.resizing {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .table-client {
      color: var(--ink) !important;
      font-weight: 850;
    }

    .table-name {
      display: block;
      color: var(--muted) !important;
      font-weight: 800;
    }

    .table-status {
      display: block;
      margin-top: 3px;
      font-weight: 850;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .map-toolbar label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .map-toolbar input {
      width: 130px;
      padding: 0;
    }

    .map-toolbar input[type="checkbox"] {
      width: 16px;
      height: 16px;
      min-height: 16px;
      padding: 0;
      accent-color: var(--brand);
    }

    .map-toggle {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8ef;
      color: var(--ink) !important;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .map-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: #f1faf5;
    }

    .legend-dot.busy { background: #fffaf3; border-color: var(--brand); }
    .legend-dot.kitchen { background: #ffe36b; border-color: #d99a00; }
    .legend-dot.delivered { background: #e8f1ff; border-color: #2f80ed; }
    .legend-dot.paid { background: #fff8f0; border-color: var(--brand); }

    .cost-block {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .ingredient-row {
      display: grid;
      grid-template-columns: 1.2fr repeat(6, minmax(92px, 1fr)) auto;
      gap: 8px;
      align-items: end;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8ef;
    }

    .simple-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .simple-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 5px solid var(--brand);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      min-height: 132px;
    }

    .simple-card strong {
      display: block;
      font-size: 20px;
      margin: 8px 0;
    }

    .goal-card {
      padding: 12px;
      min-height: 108px;
    }

    .goal-card strong {
      font-size: 17px;
      margin: 5px 0;
    }

    .goal-card .progress {
      height: 9px;
      margin-top: 7px;
    }

    .settings-stack {
      display: grid;
      gap: 16px;
    }

    .progress {
      height: 12px;
      background: #eadfd1;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress i {
      display: block;
      height: 100%;
      background: var(--brand);
      border-radius: inherit;
    }

    .role-pill {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      background: #181614;
      color: #fff6ed;
      font-size: 12px;
      font-weight: 850;
    }

    .change-note {
      display: block;
      margin-top: 5px;
      color: var(--brand);
      font-weight: 900;
      font-size: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      color: var(--ink);
      padding: 10px 11px;
      outline: none;
      min-height: 42px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(180, 63, 47, .14);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 10px 13px;
      border-radius: 7px;
      color: white;
      background: var(--brand);
      font-weight: 850;
      text-decoration: none;
    }

    .btn.secondary {
      background: #332923;
    }

    .btn.ghost {
      background: var(--panel-2);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn.ok { background: var(--brand-2); }
    .btn.danger { background: var(--danger); }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      background: #f4eee6;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    tr:last-child td { border-bottom: 0; }

    .table-wrap {
      overflow: auto;
      margin-top: 16px;
      border-radius: 8px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 850;
      background: #eaf4ef;
      color: var(--ok);
    }

    .status.paused {
      background: #f6e9e7;
      color: var(--danger);
    }

    .mini {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 6px 0 0;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .summary-strip > div {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .summary-strip span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .summary-strip strong {
      font-size: 22px;
    }

    .command-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .command-card {
      padding: 12px;
      box-shadow: none;
      background: var(--panel-2);
      border-color: var(--line);
    }

    .command-location-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .command-location {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 10px;
      text-align: left;
      cursor: pointer;
    }

    .command-location strong,
    .command-location span {
      display: block;
    }

    .command-location span {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .command-location.open {
      border-color: #f28c28;
      background: #fff1df;
    }

    .command-location.paid {
      border-color: var(--brand);
      background: #fff6ec;
      box-shadow: inset 0 0 0 1px rgba(240, 122, 34, .18);
    }

    .command-card.paid {
      border-color: var(--brand);
      background: #fff8f0;
    }

    .command-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .command-head-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1 1 0;
      min-width: 0;
    }

    .command-head h3 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.3px;
      margin: 0;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .command-client-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 1px;
    }

    .command-head strong {
      font-size: 19px;
      font-weight: 900;
      white-space: nowrap;
      padding-top: 2px;
    }

    .command-card .mini {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.25;
      margin-top: 2px;
    }

    .command-card .form-grid {
      gap: 6px;
    }

    .command-card label {
      gap: 4px;
      font-size: 11px;
    }

    .command-card input,
    .command-card select {
      min-height: 38px;
      padding: 8px 9px;
      font-size: 13px;
    }

    .command-card .btn {
      min-height: 38px;
      padding: 8px 10px;
      font-size: 12px;
      gap: 5px;
    }

    .command-save-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 82px auto;
      gap: 8px;
      align-items: end;
    }

    .line-items {
      display: grid;
      gap: 6px;
      margin: 8px 0;
    }

    .line-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
      padding: 6px;
      background: #f5efe7;
      border-radius: 7px;
      font-size: 13px;
    }

    .line-main {
      display: grid;
      gap: 4px;
    }

    .item-notes {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .addon-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .addon-list label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8ef;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .addon-list input {
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .addon-toggle {
      margin: 6px 0;
    }

    .addon-toggle summary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
      list-style: none;
    }

    .addon-toggle summary::-webkit-details-marker {
      display: none;
    }

    .addon-toggle[open] summary {
      background: #fff1df;
      border-color: #f28c28;
    }

    .permission-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .permission-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8ef;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .permission-chip input {
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .quick-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 12px;
    }

    .command-flow {
      display: grid;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .payment-form {
      display: grid;
      grid-template-columns: 1fr 90px auto;
      gap: 6px;
      align-items: end;
    }

    .command-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: end;
    }

    .command-actions .payment-form {
      flex: 1 1 320px;
    }

    .payment-toggle summary {
      list-style: none;
      cursor: pointer;
    }

    .payment-toggle summary::-webkit-details-marker {
      display: none;
    }

    .payment-toggle .payment-form {
      margin-top: 6px;
    }

    .btn.paid {
      background: #a85500;
      border-color: #a85500;
      color: #fff;
      cursor: default;
    }

    .command-card .btn.ok {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .command-card .btn.ok:hover {
      background: #d96a18;
      border-color: #d96a18;
    }

    .btn-sm {
      min-height: 28px !important;
      padding: 4px 10px !important;
      font-size: 11px !important;
      font-weight: 800 !important;
    }

    .close-command-button {
      width: 100%;
      justify-content: center;
      min-height: 38px;
      font-size: 13px;
    }

    /* ── View mode toggle ── */
    .cmd-view-toggle {
      display: flex;
      gap: 5px;
      margin: 4px 0 14px;
    }
    .cmd-view-toggle .btn {
      font-size: 12px;
      padding: 7px 14px;
      min-height: 0;
      flex: 1;
      justify-content: center;
    }

    /* ── Kanban board ── */
    .kanban-board {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 16px;
      align-items: flex-start;
    }
    .kanban-col {
      flex: 0 0 220px;
      min-width: 200px;
      background: #f5ede3;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - 260px);
      overflow-y: auto;
    }
    .kanban-card { cursor: grab; touch-action: none; }
    .kanban-card:active { cursor: grabbing; }
    .kanban-card.dragging { opacity: 0.3; pointer-events: none; }
    .kanban-col.drag-over { outline: 2px dashed var(--brand); outline-offset: -4px; background: #fdefd8; }

    .kanban-col-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      background: #f5ede3;
      z-index: 1;
    }
    .kanban-col-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .kanban-count { background: var(--brand); color: #fff; font-size: 10px; font-weight: 900; border-radius: 20px; padding: 2px 7px; }
    .kanban-count.zero { background: var(--muted); }
    .kanban-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }
    .kanban-card:hover { border-color: var(--brand); }

    /* ── Kanban command modal ── */
    .kb-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      z-index: 500; display: flex; align-items: center; justify-content: center;
      padding: 16px; box-sizing: border-box;
    }
    .kb-modal-overlay.hidden { display: none; }
    .kb-modal-inner {
      background: var(--panel); border-radius: 14px;
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
      position: relative; padding: 0;
    }
    .kb-modal-close {
      position: sticky; top: 0; float: right; z-index: 10;
      background: var(--panel-2); border: none; border-radius: 0 14px 0 10px;
      padding: 8px 14px; font-size: 18px; cursor: pointer; color: var(--text);
      line-height: 1;
    }
    .kb-modal-close:hover { background: var(--line); }
    .kb-modal-body { padding: 0; overflow: hidden; border-radius: 14px; }
    .kanban-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
    .kanban-card-mesa { font-weight: 900; font-size: 15px; line-height: 1.15; }
    .kanban-card-total { font-size: 13px; font-weight: 900; white-space: nowrap; }
    .kanban-card-cliente { font-size: 12px; font-weight: 700; color: var(--brand); }
    .kanban-card-meta { font-size: 11px; color: var(--muted); }
    .kanban-card-action { margin-top: 3px; }
    .kb-pay-row { display: flex; gap: 5px; align-items: center; }
    .kb-pay-row select { flex: 1; font-size: 11px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }

    /* ── List view ── */
    .cmd-list-wrap { overflow-x: auto; margin-top: 4px; }
    .cmd-list { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cmd-list th { text-align: left; font-size: 10px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 6px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
    .cmd-list td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .cmd-list tr:last-child td { border-bottom: none; }
    .cmd-list tbody tr:hover td { background: #fdf6ef; }
    .cmd-status-chip { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .cmd-status-chip.montando  { background: #f3f3f3; color: #555; }
    .cmd-status-chip.feito     { background: #fff7d6; color: #a07000; }
    .cmd-status-chip.cozinha   { background: #fff0e0; color: var(--brand); }
    .cmd-status-chip.entregue  { background: #e8f1ff; color: #2f80ed; }
    .cmd-status-chip.pago      { background: #fff8f0; color: #a85500; }
    .list-pay-inline { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }
    .list-pay-inline select { font-size: 11px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; }

    /* ── Adicionais mini toggle ── */
    .obs-addon-row { display: flex; gap: 6px; align-items: flex-end; }
    .obs-addon-row > label { flex: 1; }
    .addon-mini { position: relative; }
    .addon-mini summary { list-style: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink); user-select: none; transition: background .12s; }
    .addon-mini summary::-webkit-details-marker { display: none; }
    .addon-mini[open] summary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .addon-mini .addon-list { position: absolute; right: 0; bottom: calc(100% + 4px); width: 230px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.14); z-index: 200; margin: 0; }

    .print-ticket {
      width: 280px;
      padding: 12px;
      color: #111;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.35;
    }

    .print-ticket h1 {
      font-size: 18px;
      text-align: center;
      margin: 0 0 4px;
    }

    .print-ticket .logo-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f28c28;
      margin: 0 auto 6px;
    }

    .print-ticket hr {
      border: 0;
      border-top: 1px dashed #333;
      margin: 8px 0;
    }

    .public-menu { min-height: 100vh; background: #000; }

    /* ===== PERSPECTA BISTRO — Public Menu ===== */
    .pm-wrap { min-height: 100vh; background: #000; font-family: 'Questrial', system-ui, sans-serif; }

    /* Hero */
    .pm-hero {
      background: #000;
      color: #fff;
      padding: 48px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .pm-hero::after {
      content: '';
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      margin-top: 32px;
    }
    .pm-hero-logo-img {
      display: block;
      margin: 0 auto 4px;
      width: auto;
      max-width: min(300px, 88%);
      max-height: 150px;
      object-fit: contain;
    }
    .pm-hero-wordmark {
      font-family: 'Anton', sans-serif;
      font-size: clamp(48px, 12vw, 80px);
      letter-spacing: 2px;
      color: #fff;
      line-height: 1;
      margin: 0;
      text-transform: uppercase;
    }
    .pm-hero-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,.5);
      margin: 6px 0 0;
    }
    .pm-hero-note {
      font-size: 13px;
      color: rgba(255,255,255,.55);
      margin: 14px 0 0;
      letter-spacing: .3px;
    }

    /* Custom select */
    .csel { position:relative; display:inline-block; }
    .csel-trigger { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); cursor:pointer; font-size:13px; user-select:none; white-space:nowrap; min-height:36px; box-sizing:border-box; }
    .csel-trigger::after { content:'▾'; font-size:10px; color:var(--muted); flex-shrink:0; }
    .csel-drop { position:absolute; top:calc(100% + 4px); left:0; min-width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.15); z-index:9000; overflow:hidden; display:none; max-height:240px; overflow-y:auto; }
    .csel-drop.open { display:block; }
    .csel-opt { padding:9px 14px; font-size:13px; cursor:pointer; white-space:nowrap; }
    .csel-opt:hover { background:var(--panel-2); }
    .csel-opt.sel { color:var(--accent); font-weight:700; }
    label > .csel { width:100%; }
    label > .csel .csel-trigger { width:100%; box-sizing:border-box; }

    /* Category tabs */
    .pm-cats-wrap {
      background: #161616;
      border-bottom: 1px solid #262626;
      position: sticky; top: 0; z-index: 10;
      overflow-x: auto; scrollbar-width: none;
    }
    .pm-cats-wrap::-webkit-scrollbar { display: none; }
    .pm-cats { display: flex; gap: 6px; padding: 10px 16px; width: max-content; min-width: 100%; }
    .pm-cat {
      background: transparent; border: 1.5px solid #333; color: #aaa;
      border-radius: 6px; padding: 7px 20px; font-weight: 700; font-size: 13px;
      white-space: nowrap; cursor: pointer; transition: all .15s;
      font-family: 'Questrial', sans-serif; text-transform: uppercase; letter-spacing: .5px;
    }
    .pm-cat.active, .pm-cat:hover { background: #fff; color: #000; border-color: #fff; }

    /* Content */
    .pm-content { max-width: 960px; margin: 0 auto; padding: 24px 16px 120px; background: #000; }
    .pm-section-title {
      font-family: 'Anton', sans-serif;
      font-size: 20px; letter-spacing: 1.5px;
      margin: 32px 0 14px; color: #fff;
      text-transform: uppercase;
      display: flex; align-items: center; gap: 10px;
    }
    .pm-section-title::after { content: ''; flex: 1; height: 1px; background: #222; }

    .pm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

    /* Product card */
    .pm-card {
      background: #161616; border: 1px solid #2a2a2a; border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column;
      transition: border-color .2s, transform .15s;
    }
    .pm-card:hover { border-color: #555; transform: translateY(-2px); }

    .pm-card-img {
      width: 100%; aspect-ratio: 4/3; background: #1e1e1e;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .pm-card-img img { width: 100%; height: 100%; object-fit: cover; image-rendering: auto; display: block; }
    .pm-card-emoji { font-size: 52px; line-height: 1; }

    .pm-card-body { padding: 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .pm-card-name { font-weight: 900; font-size: 15px; margin: 0; color: #fff; }
    .pm-card-desc { font-size: 13px; color: #888; margin: 0; flex: 1; line-height: 1.4; }
    .pm-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .pm-price { font-family: 'Anton', sans-serif; font-size: 22px; color: #f6921e; letter-spacing: .5px; }

    .pm-add-btn {
      background: #f6921e; color: #000; border: 0; border-radius: 8px;
      width: 38px; height: 38px; font-size: 22px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center; line-height: 1;
      transition: background .15s, transform .1s; flex-shrink: 0;
    }
    .pm-add-btn:hover { background: #ffe597; transform: scale(1.08); }

    /* FAB */
    .pm-fab {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #f6921e; color: #000; border: 0; border-radius: 10px;
      padding: 15px 32px; font-weight: 900; font-size: 15px; cursor: pointer;
      box-shadow: 0 8px 32px rgba(246,146,30,.55);
      display: flex; align-items: center; gap: 10px; z-index: 50;
      white-space: nowrap; transition: transform .15s, background .15s;
      font-family: 'Questrial', sans-serif; letter-spacing: .3px;
    }
    .pm-fab:hover { transform: translateX(-50%) scale(1.04); background: #ffe597; }

    /* Overlay / panels */
    .pm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.85);
      z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    }
    .pm-overlay.hidden { display: none; }

    .pm-cart-panel, .pm-addon-panel, .pm-checkout-panel {
      background: #161616; border-radius: 20px 20px 0 0;
      width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
      padding: 22px 20px 36px; border-top: 3px solid #f6921e;
      font-family: 'Questrial', sans-serif;
    }
    .pm-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .pm-panel-head h2 { margin: 0; font-size: 20px; font-weight: 900; color: #fff; }

    .pm-close-btn {
      background: #2a2a2a; border: 0; border-radius: 50%; width: 36px; height: 36px;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .pm-close-btn:hover { background: #f6921e; color: #000; }

    .pm-cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2a2a2a; }
    .pm-cart-item-info { flex: 1; min-width: 0; }
    .pm-cart-item-name { font-weight: 800; font-size: 14px; color: #fff; }
    .pm-cart-item-detail { font-size: 12px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pm-qty { display: flex; align-items: center; gap: 8px; }
    .pm-qty-btn {
      background: #2a2a2a; border: 0; border-radius: 50%; width: 30px; height: 30px;
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff;
    }
    .pm-qty-btn:hover { background: #f6921e; color: #000; }
    .pm-qty-num { font-weight: 900; min-width: 22px; text-align: center; color: #fff; }
    .pm-cart-item-price { font-weight: 900; min-width: 72px; text-align: right; font-size: 14px; color: #f6921e; }
    .pm-cart-total { display: flex; justify-content: space-between; font-weight: 900; font-size: 18px; padding: 16px 0 18px; color: #fff; }

    .pm-btn-full {
      width: 100%; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 900;
      border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      font-family: 'Questrial', sans-serif; transition: background .15s;
    }
    .pm-btn-green { background: #f6921e; color: #000; }
    .pm-btn-green:hover { background: #ffe597; }
    .pm-btn-ghost { background: #2a2a2a; color: #fff; margin-top: 10px; }
    .pm-btn-ghost:hover { background: #3a3a3a; }

    /* Form fields inside panels */
    .pm-cart-panel label, .pm-checkout-panel label, .pm-addon-panel label { color: #ccc; }
    .pm-cart-panel input, .pm-checkout-panel input, .pm-checkout-panel select,
    .pm-addon-panel input[type=text] {
      background: #111; border: 1.5px solid #333; color: #fff; border-radius: 8px;
      padding: 10px 12px; font-size: 15px; font-family: 'Questrial', sans-serif;
    }
    .pm-cart-panel input:focus, .pm-checkout-panel input:focus, .pm-checkout-panel select:focus {
      border-color: #f6921e; outline: none;
    }

    /* Addon modal */
    .pm-addon-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
    .pm-addon-item label { cursor: pointer; flex: 1; font-size: 14px; font-weight: 700; color: #fff; }
    .pm-addon-price { font-size: 13px; color: #f6921e; font-weight: 700; }
    .pm-addon-item input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; accent-color: #f6921e; }
    .pm-qty-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 10px; font-weight: 700; color: #fff; }
    .pm-qty-controls { display: flex; align-items: center; gap: 16px; background: #2a2a2a; border-radius: 30px; padding: 6px 18px; }

    /* Checkout modal */

    .pm-checkout-panel input, .pm-checkout-panel select, .pm-checkout-panel textarea {
      width: 100%; border: 1.5px solid #e8ddd3; border-radius: 8px;
      padding: 10px 12px; font: inherit; font-size: 15px;
    }
    .pm-checkout-panel input:focus, .pm-checkout-panel select:focus { outline: none; border-color: var(--brand); }
    .pm-order-recap { background: #f9f6f2; border-radius: 10px; padding: 14px; margin: 16px 0; }
    .pm-recap-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
    .pm-recap-total { border-top: 1px solid #e8ddd3; margin-top: 8px; padding-top: 10px; font-weight: 900; font-size: 16px; }
    .pm-wa-btn {
      width: 100%; padding: 16px; border-radius: 12px; background: #25D366; color: white;
      font-size: 17px; font-weight: 850; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .pm-wa-btn:hover { background: #1db952; }

    /* WhatsApp badge in comandas */
    .badge-wa {
      display: inline-flex; align-items: center; gap: 4px;
      background: #e6f9ee; color: #0f6b3c; border-radius: 6px;
      padding: 3px 8px; font-size: 11px; font-weight: 850; margin-left: 8px; vertical-align: middle;
    }

    /* Photo thumbnail in menu admin table */
    .menu-thumb {
      width: 40px; height: 40px; border-radius: 6px; object-fit: cover;
      background: #f4ede4; border: 1px solid #e8ddd3; display: inline-block; vertical-align: middle;

    .menu-thumb-empty {
      width: 40px; height: 40px; border-radius: 6px; display: inline-flex;
      align-items: center; justify-content: center; background: #f4ede4;
      border: 1px dashed #c8b8a8; font-size: 20px; vertical-align: middle;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      padding: 18px;
      border: 1px dashed var(--line);
      background: rgba(255,255,255,.55);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    .icon {
      width: 18px;
      height: 18px;
    }

    /* Hamburger button — only on mobile */
    .hamburger-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: #111;
      flex-shrink: 0;
      border-radius: 8px;
    }
    .hamburger-btn:hover { background: rgba(0,0,0,.06); }
    .hamburger-btn svg { display: block; }

    /* Logo direita — só mobile */
    .topbar-logo-right {
      display: none;
      flex-shrink: 0;
      align-items: center;
    }
    .topbar-logo-right svg { display: block; }

    /* Sidebar overlay backdrop */
    .sidebar-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
