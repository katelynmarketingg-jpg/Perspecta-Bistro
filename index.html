    function salesForGoalPeriod(periodo) {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      if (periodo === "hoje" || periodo === "agora") return todaySales();
      return (state.sales || []).filter(s => {
        const d = new Date(s.createdAt || "");
        if (isNaN(d)) return false;
        if (periodo === "semana") {
          const ws = new Date(now); ws.setHours(0, 0, 0, 0);
          const day = ws.getDay(); ws.setDate(ws.getDate() - (day === 0 ? 6 : day - 1));
          return d >= ws;
        }
        if (periodo === "mes") return d.getFullYear() === year && d.getMonth() === month;
        if (periodo === "trimestre") return d.getFullYear() === year && Math.floor(d.getMonth() / 3) === Math.floor(month / 3);
        if (periodo === "ano") return d.getFullYear() === year;
        if (periodo === "proximo_mes") {
          const nm = month === 11 ? 0 : month + 1;
          const ny = month === 11 ? year + 1 : year;
          return d.getFullYear() === ny && d.getMonth() === nm;
        }
        if (periodo === "proximo_ano") return d.getFullYear() === year + 1;
        return false;
      });
    }

    function goalPeriodLabel(periodo) {
      const y = new Date().getFullYear();
      return { hoje: "Diário", semana: "Semanal", mes: "Mensal", trimestre: "Trimestral", ano: "Anual", proximo_mes: "Próximo mês", proximo_ano: `Ano ${y + 1}`, agora: "Ao vivo" }[periodo] || periodo;
    }

    function goalProgress(goal) {
      if (goal.tipo === "tempo") {
        const open = state.commands.filter(c => c.status === "aberta");
        return open.length ? Math.round(open.reduce((s, c) => s + ((Date.now() - new Date(c.createdAt).getTime()) / 60000), 0) / open.length) : 0;
      }
      const sales = salesForGoalPeriod(goal.periodo || "hoje");
      if (goal.tipo === "pedidos") return sales.length;
      if (goal.tipo === "produto") {
        const key = (goal.produto || "").toLowerCase();
        return sales.reduce((s, sale) => s + (sale.itens || []).filter(i => !key || String(i.nome).toLowerCase().includes(key)).reduce((si, i) => si + num(i.quantidade), 0), 0);
      }
      return sales.reduce((sum, s) => sum + num(s.total), 0);
    }

    function goalCard(goal) {
      const done = goalProgress(goal);
      const target = Math.max(1, num(goal.alvo));
      const pct = goal.tipo === "tempo" ? Math.max(0, Math.min(100, 100 - ((done - target) / target) * 100)) : Math.min(100, (done / target) * 100);
      const label = goalPeriodLabel(goal.periodo || "hoje");
      const isFuture = goal.periodo === "proximo_mes" || goal.periodo === "proximo_ano";
      return `<article class="simple-card goal-card">
        <span class="mini">${escapeHTML(label)}${isFuture ? " · planejamento" : ""}</span>
        <strong>${escapeHTML(goal.nome)}</strong>
        <p class="mini">${done} de ${escapeHTML(String(goal.alvo))} ${escapeHTML(goal.unidade || "")}</p>
        <div class="progress"><i style="width:${Math.max(0, pct)}%"></i></div>
        <div class="actions" style="margin-top:8px"><button class="btn ghost" data-delete-goal="${goal.id}">Excluir</button></div>
      </article>`;
    }

    let _openCosts = new Set(); // fichas de custo abertas (mantém aberto entre re-renders)
    let _scrollCostId = null;   // rola até a ficha recém-criada (uma vez)
    let _editIngred = null;     // ingrediente em edição na ficha: "costId:index"

    function renderCosts(tipo = "produto") {
      const isIns = tipo === "insumo";
      const el = document.getElementById(isIns ? "insumos" : "custos");
      if (!el) return;
      el.innerHTML = `
        <div class="panel">
          <h2 style="margin:0 0 4px">${isIns ? "Novo insumo (preparo)" : "Novo produto"}</h2>
          <p class="mini" style="color:var(--muted);margin:0 0 12px">${isIns ? "O que você prepara na cozinha (ex.: strogonoff, carne de panela). Depois pode ser usado como ingrediente dos produtos." : "O produto final que você vende. Pode usar insumos preparados como ingrediente."}</p>
          <form id="costForm-${tipo}">
            <input type="hidden" name="tipo" value="${tipo}">
            <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
              <label style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--muted)">
                Nome
                <input name="produto" required placeholder="${isIns ? "Strogonoff, Carne de panela, Molho…" : "Pastel de frango, Prato feito…"}" style="font-size:14px">
              </label>
              <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--muted)">
                Rende
                <div style="display:flex;align-items:center;gap:4px">
                  <input name="rendimento" type="number" step="1" min="1" value="1" style="width:54px;font-size:13px;padding:6px;text-align:center;border:1px solid var(--line);border-radius:7px">
                  <span style="font-size:11px">${isIns ? "porções" : "un."}</span>
                </div>
              </label>
              <button class="btn" type="submit" style="height:38px">${icon("custos")}Cadastrar</button>
            </div>
          </form>
        </div>
        <div class="panel" style="padding:0">${costsTable(tipo)}</div>
      `;
      if (_scrollCostId) {
        const sc = document.getElementById("cost-detail-" + _scrollCostId);
        if (sc) sc.scrollIntoView({ behavior: "smooth", block: "start" });
        _scrollCostId = null;
      }
    }

    function inventoryOptions(selectedId = "") {
      return `<option value="">Manual / não vinculado</option>${(state.inventory || []).map(item => `<option value="${item.id}" ${item.id === selectedId ? "selected" : ""}>${escapeHTML(item.item)} - ${money(item.custo)} / ${escapeHTML(item.unidade)}</option>`).join("")}`;
    }

    function allIngredientOptions() {
      const stocks = (state.inventory || []).map(item =>
        `<option value="inv:${item.id}">${escapeHTML(item.item)} — ${money(item.custo)}/${escapeHTML(item.unidade)}</option>`
      ).join("");
      const subs = (state.costs || []).filter(c => c.tipo === "insumo").map(c => {
        const calc = costCalc(c);
        return `<option value="cost:${c.id}">${escapeHTML(c.produto)} — ${money(calc.costPerUnit)}/un</option>`;
      }).join("");
      return `<option value="">Selecione…</option>` +
        (stocks ? `<optgroup label="Estoque">${stocks}</optgroup>` : "") +
        (subs ? `<optgroup label="Sub-receitas">${subs}</optgroup>` : "");
    }

    function inventorySelectOptions(selectedId = "") {
      return `<option value="">Selecione</option>${(state.inventory || []).map(item => `<option value="${item.id}" ${item.id === selectedId ? "selected" : ""}>${escapeHTML(item.item)} - saldo ${escapeHTML(item.quantidade)} ${escapeHTML(item.unidade)}</option>`).join("")}`;
    }

    function ingredientFromFormData(data) {
      const ref = data.inventoryId || "";
      // Estoque vinculado
      if (ref.startsWith("inv:")) {
        const inventory = inventoryById(ref.slice(4));
        if (inventory) return {
          nome: inventory.item,
          inventoryId: inventory.id,
          refType: "inv",
          precoCompra: inventory.custo,
          quantidadeCompra: 1,
          unidadeCompra: inventory.unidade,
          quantidadeUsada: data.quantidadeUsada,
          unidadeUsada: data.unidadeUsada || inventory.unidade,
          baseUnitCost: inventoryUnitCost(inventory)
        };
      }
      // Sub-receita (ficha de insumo)
      if (ref.startsWith("cost:")) {
        const sub = state.costs.find(c => c.id === ref.slice(5));
        if (sub) {
          const calc = costCalc(sub);
          return {
            nome: sub.produto,
            inventoryId: "",
            costId: sub.id,
            refType: "cost",
            precoCompra: calc.costPerUnit,
            quantidadeCompra: 1,
            unidadeCompra: "un",
            quantidadeUsada: data.quantidadeUsada,
            unidadeUsada: "un",
            baseUnitCost: calc.costPerUnit
          };
        }
      }
      // Legado: id direto (sem prefixo)
      if (ref && !ref.includes(":")) {
        const inventory = inventoryById(ref);
        if (inventory) return {
          nome: inventory.item,
          inventoryId: inventory.id,
          refType: "inv",
          precoCompra: inventory.custo,
          quantidadeCompra: 1,
          unidadeCompra: inventory.unidade,
          quantidadeUsada: data.quantidadeUsada,
          unidadeUsada: data.unidadeUsada || inventory.unidade,
          baseUnitCost: inventoryUnitCost(inventory)
        };
      }
      // Manual
      const manual = {
        nome: data.ingrediente || "Ingrediente",
        inventoryId: "",
        refType: "manual",
        precoCompra: data.precoCompra || 0,
        quantidadeCompra: data.quantidadeCompra || 1,
        unidadeCompra: data.unidadeCompra || "un",
        quantidadeUsada: data.quantidadeUsada,
        unidadeUsada: data.unidadeUsada || "un"
      };
      manual.baseUnitCost = purchaseUnitCost(manual);
      return manual;
    }

    function costsTable(tipo = "produto") {
      const list = (state.costs || []).filter(c => (c.tipo || "produto") === tipo);
      if (!list.length) return `<div style="padding:16px">${empty(tipo === "insumo" ? "Nenhum insumo (preparo) cadastrado ainda. Cadastre acima o que você prepara (strogonoff, carne de panela…)." : "Nenhuma ficha de produto cadastrada ainda.")}</div>`;
      const tipoBadge = tipo => tipo === "insumo"
        ? `<span style="font-size:10px;font-weight:700;background:#e8f4fd;color:#1a6fa8;border-radius:20px;padding:2px 8px">sub-receita</span>`
        : `<span style="font-size:10px;font-weight:700;background:#fff3e0;color:#b85c00;border-radius:20px;padding:2px 8px">produto</span>`;
      const rows = list.map(row => {
        const calc = costCalc(row);
        const isInsumo = row.tipo === "insumo";
        const fifoItems = (row.ingredientes||[]).map(ing => ({ ing, change: ingredientChange(ing) })).filter(x => x.change.changed && x.change.isFifo);
        const fifoTotalCost = (row.ingredientes||[]).reduce((s, ing) => s + ingredientChange(ing).current, 0) + num(row.outrosCustos);
        const fifoRendimento = Math.max(1, num(row.rendimento)||1);
        const fifoNewCostPerUnit = fifoTotalCost / fifoRendimento;
        const fifoNewSuggested = fifoNewCostPerUnit * (1 + num(row.margem)/100);
        const fifoBanner = fifoItems.length ? `
          <div style="background:#fff8e1;border:1px solid #f0ad4e;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12px;line-height:1.6">
            <div style="font-weight:700;color:#7a4f00;margin-bottom:4px">⚠️ Lote FIFO com preço novo (${fifoItems.length} ingrediente${fifoItems.length>1?"s":""})</div>
            ${fifoItems.map(({ing, change}) => {
              const pct = change.original ? ((change.delta/change.original)*100).toFixed(1) : "—";
              return `<div>• <strong>${escapeHTML(ing.nome)}</strong>: ${money(change.original)} → <strong>${money(change.current)}</strong> <span style="color:${change.delta>0?"#c0392b":"#27ae60"}">(${change.delta>0?"+":""}${pct}%)</span></div>`;
            }).join("")}
            <div style="margin-top:6px;padding-top:6px;border-top:1px solid #f0ad4e;color:#7a4f00">
              Custo/un pelo FIFO: <strong>${money(fifoNewCostPerUnit)}</strong>${!isInsumo ? ` · Sugerido: <strong>${money(fifoNewSuggested)}</strong>` : ""}
            </div>
          </div>` : "";
        const fifoBadge = fifoItems.length ? ` <span style="font-size:10px;font-weight:700;background:#fff3cd;color:#856404;border-radius:20px;padding:2px 7px;vertical-align:middle;border:1px solid #f0ad4e">FIFO ↑</span>` : "";
        const detail = `
          <tr id="cost-detail-${row.id}" style="${_openCosts.has(row.id) ? "" : "display:none"}">
            <td colspan="${isInsumo ? 2 : 3}" style="padding:0;border-top:1px solid var(--line)">
              <div style="padding:14px 16px;background:var(--panel-2)">
                ${fifoBanner}
                <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px">
                  <div style="flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px">
                    <div style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.4px">CUSTO POR UNIDADE</div>
                    <div style="font-size:23px;font-weight:900;line-height:1.1">${money(calc.costPerUnit)}</div>
                    <div style="font-size:10px;color:var(--muted)">receita ${money(calc.totalRecipe)} ÷ ${num(row.rendimento)||1} un</div>
                  </div>
                  ${!isInsumo ? `<div style="flex:1;min-width:130px;background:#176b5d;color:#fff;border-radius:10px;padding:10px 12px">
                    <div style="font-size:10px;opacity:.85;font-weight:700;letter-spacing:.4px">${calc.precoManual ? "PREÇO DE VENDA" : "PREÇO SUGERIDO"}</div>
                    <div style="font-size:23px;font-weight:900;line-height:1.1">${money(calc.suggested)}</div>
                    <div style="font-size:10px;opacity:.85">${Math.round(calc.margemEfetiva)}% de lucro (${money(calc.profitValue)})</div>
                  </div>` : ""}
                </div>
                <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Rende ${escapeHTML(String(row.rendimento))} un. · Ingredientes: ${(row.ingredientes||[]).length}</div>
                <div class="table-wrap" style="margin-bottom:12px"><table>
                  <thead><tr><th>Ingrediente</th><th>Qtd usada</th><th>Custo</th><th></th></tr></thead>
                  <tbody>
                    ${(row.ingredientes || []).length ? (row.ingredientes || []).map((item, index) => {
                      const change = ingredientChange(item);
                      const key = `${row.id}:${index}`;
                      if (_editIngred === key) {
                        const units = ["g","kg","ml","l","un"];
                        const inS = "box-sizing:border-box;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)";
                        return `<tr data-ingred-row="${key}">
                          <td><strong>${escapeHTML(item.nome)}</strong></td>
                          <td><div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
                            <input data-ingred-edit="quantidadeUsada" type="number" step="0.001" value="${num(item.quantidadeUsada)}" style="${inS};width:62px;text-align:right">
                            <select data-ingred-edit="unidadeUsada" style="${inS}">${units.map(u => `<option ${(item.unidadeUsada || "") === u ? "selected" : ""}>${u}</option>`).join("")}</select>
                            <span style="font-size:10px;color:var(--muted)">perda</span><input data-ingred-edit="perda" type="number" step="1" min="0" max="99" value="${num(item.perda) || 0}" style="${inS};width:42px;text-align:right"><span style="font-size:10px;color:var(--muted)">%</span>
                            <span style="font-size:10px;color:var(--muted)">aum.</span><input data-ingred-edit="aumento" type="number" step="1" min="0" value="${num(item.aumento) || 0}" style="${inS};width:42px;text-align:right"><span style="font-size:10px;color:var(--muted)">%</span>
                          </div></td>
                          <td><span class="mini">—</span></td>
                          <td style="white-space:nowrap"><button class="btn secondary" style="padding:2px 8px;font-size:11px" data-save-ingredient="${key}">✓ Salvar</button> <button class="btn ghost" style="padding:2px 7px;font-size:11px" data-cancel-ingredient="1">✕</button></td>
                        </tr>`;
                      }
                      const tag = item.refType === "cost" ? `<span style="font-size:10px;color:#1a6fa8">sub-receita</span>`
                                : item.inventoryId ? `<span style="font-size:10px;color:var(--muted)">estoque</span>`
                                : `<span style="font-size:10px;color:var(--muted)">manual</span>`;
                      const _rp = []; if (num(item.perda) > 0) _rp.push(`perda ${num(item.perda)}%`); if (num(item.aumento) > 0) _rp.push(`aumento ${num(item.aumento)}%`);
                      const perdaTxt = _rp.length ? ` <span style="font-size:10px;color:#b85c00;font-weight:700">· ${_rp.join(" · ")} → rende ${usableQtyLabel(item)}</span>` : "";
                      return `<tr>
                        <td><strong>${escapeHTML(item.nome)}</strong> ${tag}</td>
                        <td>${escapeHTML(String(item.quantidadeUsada))} ${escapeHTML(item.unidadeUsada||"")}${perdaTxt}</td>
                        <td><strong>${money(change.current)}</strong>${change.changed ? ` <span class="change-note" style="font-size:10px">${change.delta>0?"↑":"↓"} ${money(Math.abs(change.delta))}</span>` : ""}</td>
                        <td style="white-space:nowrap"><button class="btn ghost" style="padding:2px 7px;font-size:11px" data-edit-ingredient="${key}">editar</button> <button class="btn ghost" style="padding:2px 7px;font-size:11px" data-delete-ingredient="${row.id}:${index}">×</button></td>
                      </tr>`;
                    }).join("") : `<tr><td colspan="4" style="color:var(--muted);font-size:12px">Nenhum ingrediente ainda.</td></tr>`}
                  </tbody>
                </table></div>
                <div style="display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end;margin-bottom:8px">
                  <form class="addIngredientForm" data-cost="${row.id}" style="display:contents">
                    <div style="display:grid;grid-template-columns:2fr 58px 54px 58px 58px;gap:6px;align-items:end">
                      <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted)">Ingrediente<select name="inventoryId" style="font-size:12px">${allIngredientOptions()}</select></label>
                      <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted)">Qtd<input name="quantidadeUsada" type="number" step="0.001" required value="1" style="font-size:12px"></label>
                      <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted)">Un.<select name="unidadeUsada" style="font-size:12px"><option selected>un</option><option>g</option><option>kg</option><option>ml</option><option>l</option></select></label>
                      <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted)" title="Perda no preparo, ex.: carne -18% ao cozinhar">Perda %<input name="perda" type="number" step="1" min="0" max="99" placeholder="0" style="font-size:12px"></label>
                      <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted)" title="Aumento no preparo, ex.: arroz +150% ao cozinhar">Aumento %<input name="aumento" type="number" step="1" min="0" placeholder="0" style="font-size:12px"></label>
                    </div>
                    <button class="btn ghost" type="submit" style="align-self:end;font-size:12px;padding:8px 12px">+ Add</button>
                  </form>
                </div>
                <form class="costMarginForm" data-cost="${row.id}">
                  <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">Nome do produto<input name="produto" value="${escapeHTML(row.produto)}" style="font-size:13px"></label>
                  <div style="display:grid;grid-template-columns:repeat(${isInsumo ? 2 : 4},1fr);gap:6px">
                    ${!isInsumo ? `<label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted)">Lucro %<input name="margem" type="number" step="1" value="${num(row.margem)}" style="font-size:13px"></label>` : ``}
                    ${!isInsumo ? `<label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted)" title="Preencha para FIXAR o preço (o lucro se ajusta sozinho). Vazio = automático pela margem.">Preço venda<input name="precoVenda" type="number" step="0.01" value="${num(row.precoVenda) || ''}" placeholder="auto" style="font-size:13px"></label>` : ``}
                    <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted)">Outros custos<input name="outrosCustos" type="number" step="0.01" value="${num(row.outrosCustos)}" style="font-size:13px"></label>
                    <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted)">Rendimento<input name="rendimento" type="number" step="1" min="1" value="${num(row.rendimento)||1}" style="font-size:13px"></label>
                  </div>
                  <div style="display:flex;gap:8px;margin-top:10px">
                    <button class="btn ghost" type="submit" style="font-size:12px">Salvar alterações</button>
                    <button class="btn ghost" type="button" data-delete-cost="${row.id}" style="color:#c0392b;font-size:12px">Excluir ficha</button>
                  </div>
                </form>
              </div>
            </td>
          </tr>`;
        return `
          <tr style="cursor:pointer" data-tipo="${row.tipo}" onclick="toggleCostDetail('${row.id}')">
            <td style="line-height:1.3"><strong style="font-size:13px">${escapeHTML(row.produto)}</strong> ${tipoBadge(row.tipo)}${fifoBadge}</td>
            <td style="text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap">${money(calc.costPerUnit)}</td>
            ${!isInsumo ? `<td style="text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap">${money(calc.suggested)}</td>` : ""}
          </tr>
          ${detail}`;
      }).join("");
      return `
        <div class="table-wrap"><table id="costsMainTable">
          <thead><tr>
            <th>Nome</th>
            <th style="text-align:right">Custo/un</th>
            ${tipo === "insumo" ? "" : `<th style="text-align:right">Sugerido</th>`}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
    }

    function toggleCostDetail(id) {
      const el = document.getElementById("cost-detail-" + id);
      if (!el) return;
      const isOpen = el.style.display !== "none";
      if (isOpen) { el.style.display = "none"; _openCosts.delete(id); }
      else { el.style.display = ""; _openCosts.add(id); }
    }

    function toggleCatPicker() {
      const el = document.getElementById("catPicker");
      if (!el) return;
      el.style.display = el.style.display === "none" ? "flex" : "none";
    }

    function pickCat(cat) {
      const el = document.getElementById("expCategoria");
      if (el) el.value = cat;
      const picker = document.getElementById("catPicker");
      if (picker) picker.style.display = "none";
    }

    function filterCosts(tipo, btn) {
      const table = document.getElementById("costsMainTable");
      if (!table) return;
      table.querySelectorAll("tr[data-tipo]").forEach(tr => {
        const show = tipo === "todos" || tr.dataset.tipo === tipo;
        tr.style.display = show ? "" : "none";
        const detail = document.getElementById("cost-detail-" + tr.getAttribute("onclick")?.match(/'([^']+)'/)?.[1]);
        if (detail && !show) detail.style.display = "none";
      });
      btn.closest("div").querySelectorAll("button").forEach(b => {
        b.style.background = ""; b.style.color = ""; b.style.borderColor = "";
      });
      btn.style.background = "var(--accent)"; btn.style.color = "#fff"; btn.style.borderColor = "var(--accent)";
    }

    function renderForecast() {
      const entries = monthEntries();
      const receitas = entries.filter(e => e.tipo === "receita").reduce((s, e) => s + num(e.valor), 0);
      const despesas = entries.filter(e => e.tipo === "despesa").reduce((s, e) => s + num(e.valor), 0);
      const saldo = receitas - despesas;
      document.getElementById("previsao").innerHTML = `
        <div class="panel">
          <h2>Receitas e despesas previstas</h2>
          <form id="expenseForm">
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
              <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--muted)">Tipo<select name="tipo" style="font-size:13px"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></label>

    function expensesTable(entries) {
      if (!entries.length) return empty("Lance receitas e despesas para visualizar a previsão.");
      return `<table><thead><tr><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Recorrência</th><th></th></tr></thead><tbody>
        ${entries.map(e => `<tr>
          <td><span class="status ${e.tipo === "despesa" ? "paused" : ""}">${e.tipo}</span></td>
          <td><strong>${escapeHTML(e.descricao)}</strong><br><span class="mini">${escapeHTML(e.categoria || "Sem categoria")}</span></td>
          <td>${money(e.valor)}</td>
          <td>${escapeHTML(e.vencimento || "")}</td>
          <td>${escapeHTML(e.recorrencia)}</td>
          <td><button class="btn ghost" data-delete-expense="${e.id}">Excluir</button></td>
        </tr>`).join("")}
      </tbody></table>`;
    }

    // ── Pedidos de um cliente (por nome) ──
    function clientOrders(c) {
      const key = String(c.nome || "").trim().toLowerCase();
      if (!key) return [];
      const all = [...(state.sales || []), ...(state.commands || [])];
      return all
        .filter(o => String(o.cliente || "").trim().toLowerCase() === key)
        .sort((a, b) => new Date(b.paidAt || b.createdAt || 0) - new Date(a.paidAt || a.createdAt || 0));
    }
    function clientLastPurchase(c) {
      const os = clientOrders(c);
      if (!os.length) return null;
      const o = os[0];
      return { when: o.paidAt || o.createdAt || "", total: num(o.total != null ? o.total : commandTotal(o)) };
    }
    // busca por nome/telefone/e-mail/observações e também por produto/data dos pedidos
    function clientMatchesSearch(c, q) {
      if (!q) return true;
      q = q.toLowerCase();
      const base = [c.nome, c.telefone, c.email, c.notas].map(x => String(x || "").toLowerCase());
      if (base.some(x => x.includes(q))) return true;
      return clientOrders(c).some(o => {
        const iso = String(o.paidAt || o.createdAt || "").toLowerCase();
        if (iso.includes(q)) return true;
        const when = o.paidAt || o.createdAt;
        const br = when ? new Date(when).toLocaleDateString("pt-BR").toLowerCase() : "";
        if (br.includes(q)) return true;
        return (o.itens || []).some(it => String(it.nome || "").toLowerCase().includes(q));
      });
    }

    function commandKanbanCard(command) {
      const total = commandTotal(command);
      const status = commandStatus(command);
      const mesa = escapeHTML(command.local);
      const cliente = escapeHTML(command.cliente || "Avulso");
      const pessoas = Math.max(1, num(command.pessoas || 1));
      const itens = command.itens.length;
      let action = "";
      if (status === "aberta" && !itens) {
        action = `<span class="mini" style="color:var(--muted)">Sem itens</span>`;
      } else if (status === "aberta") {
        action = `<button class="btn secondary btn-sm" style="width:100%" data-send-kitchen="${command.id}">🍳 Mandar para cozinha</button>`;
      } else if (status === "cozinha") {
        action = `<button class="btn ghost btn-sm" style="width:100%" data-deliver-command="${command.id}">✓ Marcar entregue</button>`;
      } else if (status === "entregue") {
        action = `<div class="kb-pay-row">${cselBuild("_kbpay_"+command.id,[{v:"dinheiro",l:"Dinheiro"},{v:"pix",l:"Pix"},{v:"debito",l:"Débito"},{v:"credito",l:"Crédito"}],"dinheiro","width:100%")}<button class="btn ok btn-sm" data-pay-kanban="${command.id}">💰 Pagar</button></div>`;
      } else if (status === "paga") {
        action = `<button class="btn ok btn-sm" style="width:100%" data-close-command="${command.id}">✓ Liberar mesa</button>`;
      }
      const _kbOrd=["montando","feito","cozinha","entregue","pago"];
      const _kbCs=commandStatus(command);
      const _kbCur=_kbCs==="paga"?"pago":_kbCs==="entregue"?"entregue":_kbCs==="cozinha"?"cozinha":(command.itens&&command.itens.length?"feito":"montando");
      const _kbCi=_kbOrd.indexOf(_kbCur);
      const _kbStps=[{k:"montando",l:"Novo",bg:"#e8e8e8",fg:"#444"},{k:"feito",l:"Pedido",bg:"#fff7d6",fg:"#a07000"},{k:"cozinha",l:"Cozinha",bg:"#fff0e0",fg:"#d96800"},{k:"entregue",l:"Entregue",bg:"#ddeeff",fg:"#1a68cc"},{k:"pago",l:"Pago",bg:"#d4f5e2",fg:"#1a7a45"}];
      const _kbBar=`<div style="display:flex;border-radius:5px;overflow:hidden;gap:2px;background:#d8d8d8;height:22px;margin-bottom:6px">${_kbStps.map((s,i)=>{const isAct=s.k===_kbCur;return`<div data-step-advance="${command.id}:${s.k}" style="flex:1;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:${isAct?900:600};background:${isAct?s.bg:"#f0f0f0"};color:${isAct?s.fg:"#c0c0c0"};white-space:nowrap;cursor:${isAct?"default":"pointer"}">${s.l}</div>`}).join("")}</div>`;
      return `<div class="kanban-card" data-drag-id="${command.id}" data-open-kb="${command.id}">
        <div class="kanban-card-top">
          <span class="kanban-card-mesa">👤 ${cliente}</span>

        ${_kbBar}
        <div class="kanban-card-action">${action}</div>
      </div>`;
    }

    async function emitirNFCe(commandId) {
      const command = state.commands.find(c => c.id === commandId);
      if (!command) return;
      const token = state.settings.nfceToken;
      const cnpj  = (state.settings.nfceCnpj || "").replace(/\D/g, "");
      if (!token || !cnpj) {
        showToast("⚠️ Configure CNPJ e token NFC-e em Configurações.", 3500);
        return;
      }
      if (command.nfce?.status === "autorizado") {
        showToast("NFC-e já emitida para esta comanda.", 2500);
        return;
      }
      showToast("⏳ Emitindo NFC-e...", 5000);
      const total = num(command.paymentAmount || commandTotal(command));
      const _formaMap = { dinheiro:1, pix:17, debito:4, credito:3, cartao:3, fiado:1 };
      const _formaKey = (command.paymentMethod || "dinheiro").toLowerCase().replace(/[\s-]/g,"");
      const payload = [{
        idIntegracao: command.id,
        cpfCnpjEmitente: cnpj,
        ambiente: num(state.settings.nfceAmbiente || "2"),
        serie: num(state.settings.nfceSerie || "1"),
        infAdic: { infCpl: `Obrigado! ${escapeHTML(state.settings.restaurant||"")}` },
        itens: (command.itens||[]).map((item, i) => ({
          codigo: String(i+1).padStart(3,"0"),
          descricao: item.nome,
          ncm: state.settings.nfceNcm || "21069090",
          cfop: "5102",
          unidade: "UN",
          quantidade: Math.max(1, num(item.quantidade)),
          valorUnitario: num(item.preco),
          valorTotal: num(item.preco) * Math.max(1, num(item.quantidade)),
          origem: 0,
          csosn: state.settings.nfceCsosn || "400"
        })),
        pagamentos: [{ forma: _formaMap[_formaKey] || 1, valor: total }]
      }];
      try {
        const res = await fetch("https://api.plugnotas.com.br/nfce", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-api-key": token },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        const r = Array.isArray(json) ? json[0] : json;
        if (res.ok && r) {
          command.nfce = {
            status: r.status || "processando",
            numero: r.numero || r.numeroNota || "—",
            chave: r.chaveAcesso || "",
            linkPdf: r.linkPdf || r.linkDanfe || "",
            emitidaEm: new Date().toISOString()
          };
          save();
          showToast(`✅ NFC-e emitida! Nº ${command.nfce.numero}`, 5000);
        } else {
          const msg = r?.message || r?.error || JSON.stringify(r).slice(0,80);
          showToast("❌ " + msg, 5000);
        }
      } catch (e) {
        showToast("❌ Falha ao conectar com Plugnotas. Verifique o token.", 4000);
      }
    }

    function productRanking() {
      const map = new Map();
      todaySales().forEach(sale => {
        (sale.itens || []).forEach(item => {
          const current = map.get(item.nome) || { nome: item.nome, quantidade: 0, total: 0 };
          current.quantidade += num(item.quantidade);
          current.total += commandItemTotal(item);
          map.set(item.nome, current);
        });
      });
      return Array.from(map.values()).sort((a, b) => b.total - a.total);
    }

    function dateOnly(value) {
      return (value || "").slice(0, 10);
    }

    function inDateRange(value, start, end) {
      const date = dateOnly(value);
      return (!start || date >= start) && (!end || date <= end);
    }

    function weekdayMatches(value, weekday) {
      if (weekday === "" || weekday === undefined || weekday === null) return true;
      const date = new Date(`${dateOnly(value)}T12:00:00`);
      return String(date.getDay()) === String(weekday);
    }

    function ordersForRange(start, end, weekday = "") {
      const sales = (state.sales || []).filter(sale => inDateRange(sale.createdAt, start, end) && weekdayMatches(sale.createdAt, weekday));
      const commands = (state.commands || [])
        .filter(command => command.status === "aberta" && inDateRange(command.createdAt, start, end) && weekdayMatches(command.createdAt, weekday))
        .map(command => ({ ...command, total: commandTotal(command), live: true }));
      return [...sales, ...commands].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    }

    function productStats(orders) {
      const map = new Map();
      orders.forEach(order => {
        (order.itens || []).forEach(item => {
          const current = map.get(item.nome) || { nome: item.nome, quantidade: 0, total: 0, lucro: 0 };
          const qty = Math.max(1, num(item.quantidade));
          const total = commandItemTotal(item);
          const cost = state.costs.find(row => row.produto.toLowerCase() === String(item.nome).toLowerCase());
          const unitCost = cost ? costCalc(cost).costPerUnit : 0;
          current.quantidade += qty;
          current.total += total;
          current.lucro += total - unitCost * qty;
          map.set(item.nome, current);
        });
      });
      return Array.from(map.values()).sort((a, b) => b.total - a.total);
    }

    function avgKitchenMinutes(orders) {
      const times = orders
        .map(order => order.kitchenSentAt && order.deliveredAt ? Math.round((new Date(order.deliveredAt) - new Date(order.kitchenSentAt)) / 60000) : null)
        .filter(value => value !== null && isFinite(value) && value >= 0);
      return times.length ? Math.round(times.reduce((sum, value) => sum + value, 0) / times.length) : 0;
    }

    function reportSummary(orders) {
      return {
        pedidos: orders.length,
        vendas: orders.reduce((sum, order) => sum + num(order.total || commandTotal(order)), 0),
        itens: orders.reduce((sum, order) => sum + (order.itens || []).reduce((itemSum, item) => itemSum + num(item.quantidade), 0), 0),
        tempo: avgKitchenMinutes(orders)
      };
    }

    function percentChange(current, previous) {
      if (!previous) return current ? "+100%" : "0%";
      const pct = ((current - previous) / previous) * 100;
      return `${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%`;
    }

    function weekDayOptions(selected) {
      const names = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
      return `<option value="">Todos</option>${names.map((name, index) => `<option value="${index}" ${String(selected) === String(index) ? "selected" : ""}>${name}</option>`).join("")}`;
    }

    function periodRange(kind) {
      const now = new Date();
      const date = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (kind === "week") {
        const day = date.getDay();
        const diff = day === 0 ? 6 : day - 1;
        const start = new Date(date);
        start.setDate(date.getDate() - diff);
        return { start: dateToISO(start), end: dateToISO(date), weekday: "" };
      }
      if (kind === "month") {
        return { start: dateToISO(new Date(date.getFullYear(), date.getMonth(), 1)), end: dateToISO(date), weekday: "" };
      }
      return { start: dateToISO(date), end: dateToISO(date), weekday: "" };
    }

    function dateToISO(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function renderReports() {
      const filters = state.settings;
      const orders = ordersForRange(filters.reportStart, filters.reportEnd, filters.reportWeekday);
      const summary = reportSummary(orders);
      const products = productStats(orders);
      const compareA = ordersForRange(filters.compareAStart, filters.compareAEnd);
      const compareB = ordersForRange(filters.compareBStart, filters.compareBEnd);
      const sumA = reportSummary(compareA);
      const sumB = reportSummary(compareB);
      const profitProducts = products.slice().sort((a, b) => b.lucro - a.lucro);

      // Gastos de insumos no período
      const rStart = filters.reportStart || todayISO();
      const rEnd   = filters.reportEnd   || todayISO();
      const compras = (state.inventoryMovements || []).filter(m => {
        if (m.tipo !== "entrada") return false;

        return d >= rStart && d <= rEnd;
      });
      const gastosMap = new Map();
      compras.forEach(m => {
        const inv = inventoryById(m.inventoryId);
        const custoUnit = num(m.custo) || num(inv?.custo) || 0;
        const key = m.item || m.inventoryId;
        const cur = gastosMap.get(key) || { nome: key, unidade: m.unidade || inv?.unidade || "", qtd: 0, total: 0 };
        cur.qtd   += num(m.quantidade);
        cur.total += num(m.quantidade) * custoUnit;
        gastosMap.set(key, cur);
      });
      const gastosLista = [...gastosMap.values()].sort((a, b) => b.total - a.total);
      const gastoTotal = gastosLista.reduce((s, g) => s + g.total, 0);
      const qtdTotal   = gastosLista.reduce((s, g) => s + g.qtd, 0);

      // ── Consumo de insumos: baixas diretas + estimativa via vendas ──
      const consumoMap = new Map();
      const addConsumo = (nome, unidade, qtd, origem) => {
        const key = nome.toLowerCase();
        const cur = consumoMap.get(key) || { nome, unidade: unidade || "", direto: 0, vendas: 0 };
        if (origem === "direto") cur.direto += qtd;
        else cur.vendas += qtd;
        consumoMap.set(key, cur);
      };
      // 1. Baixas diretas de estoque no período
      (state.inventoryMovements || []).filter(m => {
        if (m.tipo !== "saida") return false;
        const d = (m.createdAt || "").slice(0, 10);
        return d >= rStart && d <= rEnd;
      }).forEach(m => {
        const inv = inventoryById(m.inventoryId);
        addConsumo(m.item || inv?.item || m.inventoryId, m.unidade || inv?.unidade || "", num(m.quantidade), "direto");
      });
      // 2. Consumo estimado via fichas de custo × vendas no período
      orders.forEach(order => {
        (order.itens || []).forEach(item => {
          const qty = Math.max(1, num(item.quantidade));
          const cost = state.costs.find(r => r.produto.toLowerCase() === String(item.nome).toLowerCase());
          if (!cost) return;
          (cost.ingredientes || []).forEach(ing => {
            const inv = inventoryById(ing.inventoryId);
            const nome = inv?.item || ing.inventoryId || "Insumo";
            const unidade = inv?.unidade || "";
            addConsumo(nome, unidade, num(ing.quantidadeUsada) * qty, "vendas");
          });
        });
      });
      const consumoLista = [...consumoMap.values()]
        .map(c => ({ ...c, total: c.direto + c.vendas }))
        .sort((a, b) => b.total - a.total);

      // ── Faturamento por hora do dia ──
      const hourMap = Array.from({length: 24}, () => ({ total: 0, count: 0 }));
      orders.forEach(order => {
        const dt = order.paidAt || order.createdAt;
        if (!dt) return;
        const h = new Date(dt).getHours();
        hourMap[h].total += num(order.total || commandTotal(order));
        hourMap[h].count++;
      });
      const maxHourTotal = Math.max(...hourMap.map(h => h.total), 1);

      // ── Vendas por dia da semana ──
      const dowLabels = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
      const dowMap = Array.from({length: 7}, () => ({ total: 0, count: 0 }));
      orders.forEach(order => {
        const dt = order.paidAt || order.createdAt;
        if (!dt) return;
        const d = new Date(dt).getDay();
        dowMap[d].total += num(order.total || commandTotal(order));
        dowMap[d].count++;
      });
      const maxDowTotal = Math.max(...dowMap.map(d => d.total), 1);

      // ── Formas de pagamento ──
      const _payAliases = { dinheiro:"💵 Dinheiro", cartão:"💳 Cartão", cartao:"💳 Cartão", pix:"📱 Pix", fiado:"📋 Fiado", credito:"💳 Crédito", debito:"💳 Débito" };
      const _payColors = ["#f6921e","#4caf50","#2196f3","#9c27b0","#e91e63","#607d8b"];

        .map(([label, v], i) => ({ label, ...v, color: _payColors[i % _payColors.length], pct: 0 }))

      // ── Margem bruta estimada (via fichas de custo) ──
      let _custoVendas = 0, _semFicha = 0, _comFicha = 0;
      orders.forEach(order => {
        (order.itens || []).forEach(item => {
          const qty = Math.max(1, num(item.quantidade));
          const recipe = (state.costs || []).find(r => r.produto && r.produto.toLowerCase() === String(item.nome || "").toLowerCase());
          if (!recipe) { _semFicha++; return; }

        <div class="panel">

        <div class="simple-card-grid" style="margin-top:16px">

          ${simpleCard("Itens vendidos", summary.itens, "Soma das quantidades vendidas.")}
          ${simpleCard("Tempo médio", summary.tempo ? `${summary.tempo} min` : "sem registro", "Da cozinha até entregue.")}
        </div>

        <div class="panel" style="margin-top:16px">
          <h2>📈 Margem bruta estimada</h2>
          ${margemBruta === null
            ? `<p class="mini" style="color:var(--muted);padding:4px 0">Cadastre fichas de custo nos produtos para calcular a margem${_semFicha > 0 ? " ("+_semFicha+" item(ns) sem ficha no período)" : ""}.</p>`
            : `<div class="simple-card-grid" style="margin:10px 0">
                ${simpleCard("Vendas", money(summary.vendas), "Total vendido no período.")}

                <article class="simple-card"><span class="mini">Margem bruta</span><strong style="font-size:22px;color:${margemColor}">${margemBruta.toFixed(1).replace(".",",")}%</strong><p class="mini">Lucro: ${money(summary.vendas - _custoVendas)}</p></article>
              </div>
              <div style="height:10px;border-radius:5px;background:#e8e0d8;overflow:hidden">
                <div style="height:100%;width:${Math.min(100,Math.max(0,margemBruta)).toFixed(1)}%;background:${margemColor};border-radius:5px"></div>
              </div>`}
        </div>

        <div class="panel" style="margin-top:16px">
          <h2>💳 Formas de pagamento</h2>
          ${payEntries.length === 0
            ? `<p class="mini" style="color:var(--muted);padding:4px 0">Nenhum pagamento registrado no período.</p>`
            : `<div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">
                ${payEntries.map(p => `<div>

                  <div style="height:8px;border-radius:4px;background:#e8e0d8;overflow:hidden">

                  </div>
                </div>`).join("")}
              </div>
              <p class="mini" style="margin-top:12px;color:var(--muted)">Total recebido: <strong>${money(payGrand)}</strong></p>`}
        </div>

        <div class="panel" style="margin-top:16px">

                <tr style="border-top:2px solid #e0d9cf">

            ${simpleCard("Via baixa direta", consumoLista.reduce((s,c)=>s+c.direto,0).toFixed(2).replace(".",",") + " unid.", "Saídas registradas manualmente no estoque.")}
            ${simpleCard("Via vendas", consumoLista.reduce((s,c)=>s+c.vendas,0).toFixed(2).replace(".",",") + " unid.", "Estimativa com base nas fichas de custo.")}

                return `<div style="display:flex;align-items:center;gap:10px">

                  <span style="font-size:11px;color:var(--muted);width:24px;flex-shrink:0">${row.count > 0 ? row.count+"×" : ""}</span>

                ${hourMap.map((h, i) => {
                  const pct = h.total / maxHourTotal;
                  const barH = Math.max(h.total > 0 ? 4 : 2, Math.round(pct * 72));
                  const isPeak = pct >= 0.7;
                  return `<div title="${i}h: ${h.count > 0 ? money(h.total)+" ("+h.count+"×)" : "sem pedidos"}"
                    style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default">
                    <div style="width:100%;border-radius:2px 2px 0 0;background:${isPeak ? "var(--brand)" : h.total > 0 ? "#f6c47e" : "#e8e0d8"};height:${barH}px"></div>
                    <span style="font-size:7px;color:var(--muted)">${i}h</span>
                  </div>`;
                }).join("")}

              <p class="mini" style="margin-top:6px;color:var(--muted)">🟠 Laranja escuro = horário de pico (≥70% do máximo). Passe o mouse na barra para ver o valor.</p>
            </div>`}

          </form>
          <div class="grid two-col" style="margin-top:12px">
            <div class="simple-card"><span class="mini">Período A</span><strong>${money(sumA.vendas)}</strong><p class="mini">${sumA.pedidos} pedido(s), ${sumA.itens} item(ns), ${sumA.tempo || 0} min médio.</p></div>
            <div class="simple-card"><span class="mini">Período B</span><strong>${money(sumB.vendas)}</strong><p class="mini">${sumB.pedidos} pedido(s), ${sumB.itens} item(ns), ${sumB.tempo || 0} min médio.</p></div>

            <div><span>Tempo médio</span><strong>${percentChange(sumA.tempo, sumB.tempo)}</strong></div>
          </div>

          return `<tr>
            <td><strong>${escapeHTML(order.local || "Pedido")}</strong><br><span class="mini">${escapeHTML(new Date(order.createdAt || Date.now()).toLocaleString("pt-BR"))}</span></td>
            <td>${escapeHTML(order.cliente || "Avulso")}</td>
            <td>${money(order.total || commandTotal(order))}</td>
            <td>${(order.itens || []).map(item => `${escapeHTML(item.nome)} x${escapeHTML(item.quantidade)}`).join("<br>")}</td>
            <td>${kitchenTime}</td>
          </tr>`;
        }).join("")}
      </tbody></table>`;

    function simpleCard(title, value, text) {
      return `<article class="simple-card"><span class="mini">${escapeHTML(title)}</span><strong>${escapeHTML(value)}</strong><p class="mini">${escapeHTML(text)}</p></article>`;
    }

    function renderDataTools() {
      const currentLogo = state.settings.perspectaLogo;
      const co = currentSession?.company;
      const mainLogin = co?.login || state.settings.mainLogin || "";
      // Check cloud status asynchronously after render
      setTimeout(() => {
        loadFromServer().then(ss => {
          const dot = document.getElementById("cloudStatusDot");
          const txt = document.getElementById("cloudStatusText");
          if (!dot || !txt) return;
          if (ss !== null) {
            dot.style.background = "#1a7a45";
            const d = ss?.savedAt ? new Date(ss.savedAt).toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit"}) : "—";
            txt.textContent = `Conectado — último sync às ${d}`;
          } else {
            dot.style.background = "#e67e22";
            txt.textContent = "Nenhum dado na nuvem ainda — clique em Sincronizar";
          }

    function compressImage(file, maxW, maxH, quality) {
      return new Promise(resolve => {
        const reader = new FileReader();
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxW / img.width, maxH / img.height);
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          } catch {
            resolve(null);
          }
        };
        img.onerror = () => resolve(null); // imagem ilegível (ex.: HEIC) → não guarda quebrada
        reader.onload = () => {
          if (typeof reader.result === "string" && reader.result.startsWith("data:image/")) img.src = reader.result;
          else resolve(null);
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    // Fotos de iPhone vêm em HEIC, que o navegador não exibe. Convertemos
    // para JPEG sob demanda (a lib só é baixada quando aparece um HEIC).
    function isHeicFile(file) {
      return !!file && (/hei[cf]/i.test(file.type || "") || /\.(heic|heif)$/i.test(file.name || ""));
    }
    let _heicLibPromise = null;
    function loadHeicLib() {
      if (window.heic2any) return Promise.resolve(window.heic2any);
      if (_heicLibPromise) return _heicLibPromise;
      _heicLibPromise = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
        s.onload = () => resolve(window.heic2any);
        s.onerror = () => { _heicLibPromise = null; reject(new Error("cdn")); };
        document.head.appendChild(s);
      });
      return _heicLibPromise;
    }
    // Lê qualquer foto (inclusive HEIC) e devolve um JPEG comprimido (ou null).
    async function fileToCompressed(file, maxW, maxH, quality) {
      let input = file;
      if (isHeicFile(file)) {
        try {
          showToast("Convertendo foto do iPhone…", 2500);
          const heic2any = await loadHeicLib();
          const out = await Promise.race([
            heic2any({ blob: file, toType: "image/jpeg", quality: 0.92 }),
            new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 25000))
          ]);
          input = Array.isArray(out) ? out[0] : out;
        } catch (e) {
          return null; // não deu para converter (sem internet ou arquivo inválido)
        }
      }
      return compressImage(input, maxW, maxH, quality);
    }

    // Arrastar comanda entre colunas — baseado em PONTEIRO (funciona no mouse E no toque).
    // Pega o card em qualquer lugar (menos nos controles), mostra um "fantasma" seguindo
    // o cursor/dedo e solta na coluna sob ele.
    function _colUnder(x, y) {
      const el = document.elementFromPoint(x, y);
      return el && el.closest("[data-drop-col]");
    }
    document.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      const card = e.target.closest(".kanban-card[data-drag-id]");
      if (!card) return;
      // não inicia arraste se a pessoa tocou num controle (botão, seletor, barra de status…)
      if (e.target.closest("button, select, input, a, .csel, .csel-trigger, .csel-opt, .csel-drop, [data-step-advance]")) return;
      _pdrag = { id: card.dataset.dragId, card, x0: e.clientX, y0: e.clientY, started: false, ghost: null, offX: 0, offY: 0, pid: e.pointerId };
    });
    document.addEventListener("pointermove", e => {
      if (!_pdrag) return;
      const dx = e.clientX - _pdrag.x0, dy = e.clientY - _pdrag.y0;
      if (!_pdrag.started) {
        if (Math.hypot(dx, dy) < 6) return; // movimento mínimo para diferenciar de um clique
        _pdrag.started = true;
        const r = _pdrag.card.getBoundingClientRect();
        _pdrag.offX = _pdrag.x0 - r.left;
        _pdrag.offY = _pdrag.y0 - r.top;
        const g = _pdrag.card.cloneNode(true);
        g.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;margin:0;pointer-events:none;opacity:.92;z-index:99999;transform:rotate(2deg);box-shadow:0 14px 34px rgba(0,0,0,.28)`;
        document.body.appendChild(g);
        _pdrag.ghost = g;
        _pdrag.card.style.opacity = "0.3";
        document.body.style.userSelect = "none";
        try { _pdrag.card.setPointerCapture(e.pointerId); } catch (_) {}
      }
      _pdrag.ghost.style.left = (e.clientX - _pdrag.offX) + "px";
      _pdrag.ghost.style.top = (e.clientY - _pdrag.offY) + "px";
      _pdrag.ghost.style.display = "none";
      const col = _colUnder(e.clientX, e.clientY);
      _pdrag.ghost.style.display = "";
      document.querySelectorAll(".kanban-col.drag-over").forEach(c => c.classList.remove("drag-over"));
      if (col) col.classList.add("drag-over");
      e.preventDefault();
    }, { passive: false });
    function _endPdrag(e, doDrop) {
      const d = _pdrag; _pdrag = null;
      document.body.style.userSelect = "";
      document.querySelectorAll(".kanban-col.drag-over").forEach(c => c.classList.remove("drag-over"));
      if (!d) return;
      if (d.card) d.card.style.opacity = "";
      if (!d.started) { if (d.ghost) d.ghost.remove(); return; }
      let col = null;
      if (doDrop && e) { if (d.ghost) d.ghost.style.display = "none"; col = _colUnder(e.clientX, e.clientY); }
      if (d.ghost) d.ghost.remove();
      _justDragged = true; setTimeout(() => { _justDragged = false; }, 300); // evita abrir o modal após arrastar
      if (col) applyKanbanDrop(d.id, col.dataset.dropCol);
    }
    document.addEventListener("pointerup", e => _endPdrag(e, true));
    document.addEventListener("pointercancel", e => _endPdrag(e, false));

      // ── Adicionar ao estoque com custo médio ponderado ──
      const addStockOpen = event.target.closest("[data-add-stock]")?.dataset.addStock;
      if (addStockOpen) { _addStockId = addStockOpen; _editInvId = null; renderInventory(); }
      if (event.target.closest("[data-cancel-addstock]")) { _addStockId = null; renderInventory(); }
      const saveAddStock = event.target.closest("[data-save-addstock]")?.dataset.saveAddstock;
      if (saveAddStock) {
        const it = (state.inventory || []).find(x => x.id === saveAddStock);
        const row = event.target.closest("[data-addstock-row]");
        if (it && row) {
          const q1 = num(row.querySelector('[data-addstock="qtd"]')?.value);
          const v1 = num(row.querySelector('[data-addstock="valor"]')?.value);
          if (q1 <= 0) {
            showToast("Informe a quantidade comprada.", 3000);
          } else {
            const q0 = num(it.quantidade), c0 = num(it.custo);
            const newQty = q0 + q1;
            it.previousCost = c0;
            it.quantidade = newQty;
            it.custo = newQty > 0 ? (q0 * c0 + v1) / newQty : it.custo; // custo médio ponderado
            const unitNew = q1 > 0 ? v1 / q1 : 0;
            const at = new Date().toISOString();
            state.inventoryMovements = state.inventoryMovements || [];
            state.inventoryMovements.push({ id: uid(), inventoryId: it.id, item: it.item, tipo: "entrada", quantidade: q1, unidade: it.unidade, custo: unitNew, motivo: "Compra (custo médio)", createdAt: at });
            state.inventoryBatches = state.inventoryBatches || [];
            state.inventoryBatches.push({ id: uid(), inventoryId: it.id, item: it.item, quantidadeInicial: q1, quantidadeRestante: q1, custo: unitNew, unidade: it.unidade, createdAt: at });
            _addStockId = null;
            save();
            showToast(`Estoque atualizado: ${newQty.toLocaleString("pt-BR",{maximumFractionDigits:3})} ${it.unidade} · custo médio ${money(it.custo)}`, 3800);
          }
        }
      }

      const delTable = event.target.closest("[data-delete-table]")?.dataset.deleteTable;
      if (delTable) { state.tables = (state.tables || []).filter(x => x.id !== delTable); save(); }

      const saveMenuOrder = event.target.closest("[data-save-menu-order]")?.dataset.saveMenuOrder;
      if (saveMenuOrder) {
        const rows = normalizeMenuOrder(state.settings.menuOrder);
        state.settings.menuOrder = rows.map(item => {
          const orderInput = document.querySelector(`[data-menu-order="${item.id}"]`);
          const visibleInput = document.querySelector(`[data-menu-visible="${item.id}"]`);
          const locked = item.id === "dashboard" || item.id === "dados";
          return {
            ...item,
            order: orderInput ? Math.max(1, num(orderInput.value)) : item.order,
            visible: locked ? true : visibleInput ? visibleInput.checked : item.visible
          };
        });
        save();
      }

      const reportPeriod = event.target.closest("[data-report-period]")?.dataset.reportPeriod;
      if (reportPeriod) {
        const range = periodRange(reportPeriod);
        state.settings.reportStart = range.start;
        state.settings.reportEnd = range.end;
        state.settings.reportWeekday = range.weekday;
        save();
      }

      const saveMenuItem = event.target.closest("[data-save-menu]")?.dataset.saveMenu;
      if (saveMenuItem) {
        const row = event.target.closest("[data-menu-row]");
        const item = state.menu.find(x => x.id === saveMenuItem);
        if (row && item) {
          saveMenuRow(row, item);
          save();
        }
      }

      if (event.target.id === "saveMenuBatch") {
        document.querySelectorAll("[data-menu-row]").forEach(row => {
          const item = state.menu.find(x => x.id === row.dataset.menuRow);

        });

      }

      const saveAddon = event.target.closest("[data-save-addon]")?.dataset.saveAddon;
      if (saveAddon) {
        const row = event.target.closest("[data-addon-row]");
        const addon = (state.addons || []).find(x => x.id === saveAddon);
        if (row && addon) {
          addon.nome = row.querySelector("[data-edit-addon-name]").value;
          addon.preco = num(row.querySelector("[data-edit-addon-price]").value);
          addon.ativo = row.querySelector("[data-edit-addon-active]").value === "true";
          save();
        }
      }


      const delCompany = event.target.closest("[data-delete-company]")?.dataset.deleteCompany;
      if (delCompany) { const master = loadMasterState(); master.companies = (master.companies || []).filter(x => x.id !== delCompany); saveMasterState(master); state.companies = master.companies; localStorage.removeItem("gestaoCompany." + delCompany + ".v1"); save(); }

      const delStaff = event.target.closest("[data-delete-staff]")?.dataset.deleteStaff;
      if (delStaff) { state.staff = (state.staff || []).filter(x => x.id !== delStaff); save(); }

      const saveStaffPermissions = event.target.closest("[data-save-staff-permissions]")?.dataset.saveStaffPermissions;
      if (saveStaffPermissions) {
        const row = event.target.closest("tr");
        const person = (state.staff || []).find(x => x.id === saveStaffPermissions);
        if (row && person) {
          person.permissions = ["dashboard", ...Array.from(row.querySelectorAll('input[name="permissions"]:checked')).map(input => input.value)]
            .filter((value, index, arr) => arr.indexOf(value) === index);
          save();
        }
      }

      // ── Staff card edit toggle ──
      const toggleStaffEdit = event.target.closest("[data-toggle-staff-edit]")?.dataset.toggleStaffEdit;
      if (toggleStaffEdit) {
        const card = document.querySelector(`[data-staff-card="${toggleStaffEdit}"]`);
        if (card) {
          card.querySelector(".staffInfoForm").classList.toggle("hidden");
          card.querySelector(`[data-staff-view]`).classList.toggle("hidden");
        }
      }
      // ── Imprimir cupom do cliente ──
      const printReceipt = event.target.closest("[data-print-receipt]")?.dataset.printReceipt;
      if (printReceipt) {
        const cmd = state.commands.find(c => c.id === printReceipt) || state.sales.find(s => s.id === printReceipt);
        if (cmd) printCustomerReceipt(cmd);
      }

      // ── Emitir NFC-e ──
      const emitirNfce = event.target.closest("[data-emitir-nfce]")?.dataset.emitirNfce;
      if (emitirNfce) emitirNFCe(emitirNfce);

      const cancelStaffEdit = event.target.closest("[data-cancel-staff-edit]")?.dataset.cancelStaffEdit;
      if (cancelStaffEdit) {
        const card = document.querySelector(`[data-staff-card="${cancelStaffEdit}"]`);
        if (card) {
          card.querySelector(".staffInfoForm").classList.add("hidden");
          card.querySelector(`[data-staff-view]`).classList.remove("hidden");
        }
      }

      const delGoal = event.target.closest("[data-delete-goal]")?.dataset.deleteGoal;
      if (delGoal) { state.goals = (state.goals || []).filter(x => x.id !== delGoal); save(); }

      const openCompany = event.target.closest("[data-open-company]")?.dataset.openCompany;
      if (openCompany) {
        const company = (state.companies || []).find(x => x.id === openCompany);
        if (company) {
          // Switch gestor into a read/write proxy session for this company
          currentSession = { type: "gestor-proxy", company };
          sessionStorage.setItem("perspectaSession", JSON.stringify(currentSession));
          storeKey = "gestaoCompany." + company.id + ".v1";

          setSection("dashboard");
          showToast("📂 Acessando: " + company.nome, 2200);

      const toggleMenu = event.target.closest("[data-toggle-menu]")?.dataset.toggleMenu;
      if (toggleMenu) { const item = state.menu.find(x => x.id === toggleMenu); if (item) item.ativo = !item.ativo; save(); }

      const toggleAddon = event.target.closest("[data-toggle-addon]")?.dataset.toggleAddon;
      if (toggleAddon) { const addon = (state.addons || []).find(x => x.id === toggleAddon); if (addon) addon.ativo = !addon.ativo; save(); }

      // ── Kanban card → open full command modal ──
      if (event.target.id === "kbModalClose" || event.target.id === "kbModal") {
        closeKbModal();
      } else {
        const openKb = event.target.closest("[data-open-kb]")?.dataset.openKb;
        if (!_justDragged && openKb && !event.target.closest("button, .csel-trigger, .csel-opt, .csel-drop, .csel, [data-step-advance]")) {

      const removeItem = event.target.closest("[data-remove-item]")?.dataset.removeItem;
      if (removeItem) {
        const [commandId, index] = removeItem.split(":");
        const command = state.commands.find(c => c.id === commandId);
        if (command) command.itens.splice(Number(index), 1);

      // ── Status bar step click ──
      const stepAdvance = event.target.closest("[data-step-advance]")?.dataset.stepAdvance;
      if (stepAdvance) {
        const [cmdId, step] = stepAdvance.split(":");
        const command = state.commands.find(c => c.id === cmdId);
        if (command) {
          const ord = ["montando","feito","cozinha","entregue","pago"];
          const cs = commandStatus(command);
          const cur = cs==="paga"?"pago":cs==="entregue"?"entregue":cs==="cozinha"?"cozinha":(command.itens&&command.itens.length?"feito":"montando");
          const curI = ord.indexOf(cur), stepI = ord.indexOf(step);
          if (stepI !== curI) {
            const _now = new Date().toISOString();
            if (stepI > curI) {
              if (step === "cozinha") {
                if (!(command.itens||[]).length) { showToast("Adicione itens antes de mandar para a cozinha.", 2500); }
                else {
                  command.kitchenSentAt = _now; save(); printKitchenCommand(command);
                  if (command.telefone) { window.open(whatsappLink(command.telefone, `Olá *${command.cliente}*! 👨‍🍳\nSeu pedido foi enviado para a cozinha.\nEm breve estará pronto! 🍽️`), "_blank"); }
                }
              } else if (step === "entregue") {
                if (!command.kitchenSentAt) command.kitchenSentAt = _now;
                command.deliveredAt = _now; save(); renderCommands();
                if (command.telefone) { window.open(whatsappLink(command.telefone, `Olá *${command.cliente}*! ✅\nSeu pedido está pronto! 🎉\n_${command.tipoEntrega === "tele" ? "O entregador está a caminho!" : command.tipoEntrega === "mesa" ? "Seu pedido está na mesa!" : "Pode retirar no balcão!"}_`), "_blank"); }
              } else if (step === "pago") {
                if (!command.kitchenSentAt) command.kitchenSentAt = _now;
                if (!command.deliveredAt) command.deliveredAt = _now;
                command.paidAt = _now;
                command.paymentMethod = "dinheiro";
                command.paymentAmount = commandTotal(command);
                save(); renderCommands();
              }
            } else {
              if (step === "montando" || step === "feito") { command.kitchenSentAt = null; command.deliveredAt = null; command.paidAt = null; }
              else if (step === "cozinha") { command.deliveredAt = null; command.paidAt = null; }
              else if (step === "entregue") { command.paidAt = null; }
              save(); renderCommands();
            }
          }
        }
      }

      const sendKitchen = event.target.closest("[data-send-kitchen]")?.dataset.sendKitchen;
      if (sendKitchen) {
        const command = state.commands.find(c => c.id === sendKitchen);
        if (command) {
          if (!(command.itens || []).length) {
            alert("Adicione pelo menos um item antes de mandar para a cozinha.");
          } else {
            command.kitchenSentAt = new Date().toISOString();
            save();
            printKitchenCommand(command);
            // Notifica cliente pelo WhatsApp se tiver telefone
            if (command.telefone) {
              const msgCoz = `Olá *${command.cliente}*! 👨‍🍳\nSeu pedido foi enviado para a cozinha.\nEm breve estará pronto! 🍽️`;
              window.open(whatsappLink(command.telefone, msgCoz), "_blank");
            }
          }
        }
      }

      const deliverCommand = event.target.closest("[data-deliver-command]")?.dataset.deliverCommand;
      if (deliverCommand) {
        const command = state.commands.find(c => c.id === deliverCommand);
        if (command) {
          command.deliveredAt = new Date().toISOString();
          save();
          renderCommands();
          // Notifica cliente pelo WhatsApp se tiver telefone
          if (command.telefone) {
            const msgPronto = `Olá *${command.cliente}*! ✅\nSeu pedido está pronto! 🎉\n_${command.tipoEntrega === "tele" ? "O entregador está a caminho!" : command.tipoEntrega === "mesa" ? "Seu pedido está na mesa!" : "Pode retirar no balcão!"}_`;
            window.open(whatsappLink(command.telefone, msgPronto), "_blank");
          }
        }
      }

      const closeCommand = event.target.closest("[data-close-command]")?.dataset.closeCommand;
      if (closeCommand) {
        const command = state.commands.find(c => c.id === closeCommand);
        if (command) {
          if (!command.paidAt) {
            alert("Registre o pagamento antes de fechar a comanda.");
          } else {
            command.status = "fechada";
            command.closedAt = new Date().toISOString();
            command.total = commandTotal(command);
            state.sales.push({ id: uid(), createdAt: command.closedAt, local: command.local, cliente: command.cliente || "Avulso", pessoas: Math.max(1, num(command.pessoas || 1)), total: command.total, itens: command.itens, kitchenSentAt: command.kitchenSentAt || "", deliveredAt: command.deliveredAt || "", paidAt: command.paidAt || "", paymentMethod: command.paymentMethod });
            // remove comanda fechada de state.commands — dados já estão em state.sales
            state.commands = state.commands.filter(c => c.id !== closeCommand);
          }
        }
        save();
      }

      // ── Public menu: open addon modal (exige login rápido antes de escolher) ──
      const pmAdd = event.target.closest("[data-pm-add]")?.dataset.pmAdd;
      if (pmAdd) {
        const item = state.menu.find(m => m.id === pmAdd);
        if (!item) return;
        if (!pmClient || !pmClient.nome) {
          _pmPendingAdd = pmAdd;
          document.getElementById("pmLoginOverlay")?.classList.remove("hidden");
          setTimeout(() => document.querySelector('#pmLoginForm input[name="nome"]')?.focus(), 60);
          return;
        }
        pmOpenAddon(item);
        return;
      }

      // ── Public menu: trocar cliente (logout do carrinho) ──
      if (event.target.id === "pmClientLogout") {
        clearPmClient();
        publicCart = [];
        updatePmClientBadge();
        updatePmFab();
        showToast("Você saiu. Informe seus dados no próximo item.", 2500);
        return;
      }

      // ── Public menu: fechar login ──
      if (event.target.id === "pmLoginClose" || event.target.id === "pmLoginOverlay") {
        document.getElementById("pmLoginOverlay")?.classList.add("hidden");
        return;
      }

      // ── Public menu: category filter ──
      const pmCat = event.target.closest("[data-pm-cat]")?.dataset.pmCat;
      if (pmCat !== undefined) {
        pmActiveCat = pmCat;
        document.querySelectorAll(".pm-cat").forEach(b => b.classList.toggle("active", b.dataset.pmCat === pmCat));
        const active = state.menu.filter(m => m.ativo);
        const cats = [...new Set(active.map(m => m.categoria))];
        const content = document.getElementById("pmContent");
        if (content) content.innerHTML = renderPmItems(active, cats, pmCat);
        return;
      }

      // ── Public menu: open cart ──
      if (event.target.id === "pmFab" || event.target.closest("#pmFab")) {
        renderPmCartItems();
        document.getElementById("pmCartOverlay")?.classList.remove("hidden");
        return;
      }

      // ── Public menu: close cart ──
      if (event.target.id === "pmCartClose" || event.target.id === "pmCartClose2") {
        document.getElementById("pmCartOverlay")?.classList.add("hidden");
        return;
      }

      // ── Public menu: close cart by clicking backdrop ──
      if (event.target.id === "pmCartOverlay") {
        document.getElementById("pmCartOverlay")?.classList.add("hidden");
        return;
      }

      // ── Public menu: go to checkout ──
      if (event.target.id === "pmCheckoutOpen") {
        if (!publicCart.length) { showToast("Adicione itens ao pedido primeiro."); return; }
        document.getElementById("pmCartOverlay")?.classList.add("hidden");
        renderPmOrderRecap();
        // pré-preenche com o login rápido
        if (pmClient) {
          const nEl = document.querySelector('#pmCheckoutForm input[name="nome"]');
          const tEl = document.querySelector('#pmCheckoutForm input[name="telefone"]');
          if (nEl && !nEl.value) nEl.value = pmClient.nome || "";
          if (tEl && !tEl.value) tEl.value = pmClient.telefone || "";
        }
        document.getElementById("pmCheckoutOverlay")?.classList.remove("hidden");
        return;
      }

      // ── Public menu: close checkout ──
      if (event.target.id === "pmCheckoutClose" || event.target.id === "pmCheckoutOverlay") {
        document.getElementById("pmCheckoutOverlay")?.classList.add("hidden");
        return;
      }

      // ── Public menu: addon modal close ──
      if (event.target.id === "pmAddonClose" || event.target.id === "pmAddonOverlay") {
        document.getElementById("pmAddonOverlay")?.classList.add("hidden");
        return;
      }

      // ── Public menu: addon qty ──
      if (event.target.id === "pmQtyMinus") {

        if (el) el.textContent = pmAddonQty;
        return;
      }
      if (event.target.id === "pmQtyPlus") {

        const el = document.getElementById("pmAddonQtyNum");
        if (el) el.textContent = pmAddonQty;
        return;
      }

      // ── Public menu: confirm add to cart ──
      if (event.target.id === "pmAddonConfirm") {
        if (!pmAddonTarget) return;
        const selected = Array.from(document.querySelectorAll("#pmAddonList input[type=checkbox]:checked")).map(cb => ({
          id: cb.value,
          nome: cb.dataset.addonName,
          preco: num(cb.dataset.addonPrice)
        }));
        const obs = document.getElementById("pmAddonObs")?.value || "";
        publicCart.push({
          id: pmAddonTarget.id,
          nome: pmAddonTarget.nome,
          preco: pmAddonTarget.preco,
          quantidade: pmAddonQty,
          adicionais: selected,
          observacao: obs
        });

        updatePmFab();
        showToast(`${pmAddonQty}× ${pmAddonTarget.nome} adicionado!`, 2000);
        pmAddonTarget = null;
        return;
      }

      // ── Public menu: cart qty change ──
      const cartQtyEl = event.target.closest("[data-cart-qty]");
      if (cartQtyEl) {
        const index = Number(cartQtyEl.dataset.cartQty);
        const delta = Number(cartQtyEl.dataset.delta);
        if (publicCart[index]) {
          publicCart[index].quantidade = Math.max(0, publicCart[index].quantidade + delta);
          if (publicCart[index].quantidade === 0) publicCart.splice(index, 1);
        }
        renderPmCartItems();
        updatePmFab();
        return;
      }

      // ── Remover logo ──
      if (event.target.id === "removeLogoBtn") {
        state.settings.logoUrl = null;
        state.settings.logoDims = null;
        save();
        renderMenuAdmin();
        return;
      }

      if (event.target.id === "removePerspectaLogo") {
        state.settings.perspectaLogo = null;
        save();
        renderBrand();
        renderDataTools();
        showToast("Logo removido.", 2000);
        return;
      }

      // ── Copiar link do cardápio público ──
      if (event.target.id === "copyPublicLink") {

        const url = `${baseUrl.replace(/sistema-gestao\.html$/, "cardapio-publico.html")}`;
        navigator.clipboard?.writeText(url).then(() => showToast("Link copiado!", 2000));

        // click on label triggers the hidden file input — handled via change event
        return;
      }

      if (event.target.id === "forceSyncBtn") {
        showSyncStatus('ing');
        syncToServer(); // empurra E junta (merge) com a nuvem num passo só

            if (dot) dot.style.background = "#1a7a45";

            showToast("☁️ Sincronizado!", 2000);

            showToast("☁️ Tudo em dia!", 2000);
          }
        }).catch(() => {
          const dot = document.getElementById("cloudStatusDot");
          const txt = document.getElementById("cloudStatusText");
          if (dot) dot.style.background = "#c0392b";
          if (txt) txt.textContent = "Sem conexão com a nuvem";
          showSyncStatus('err');

      if (event.target.id === "exportData") {

        URL.revokeObjectURL(url);

        save();

      if (event.target.id === "importDataBtn") {
        try {
          state = normalizeState(JSON.parse(document.getElementById("importData").value));
          save();
          alert("Dados importados com sucesso.");
        } catch {
          alert("JSON inválido.");
        }
      }

      if (event.target.id === "logoutBtn" || event.target.closest("[data-logout]")) {
        sessionStorage.removeItem("perspectaSession");
        currentSession = null;
        storeKey = MASTER_KEY;
        showLogin();
