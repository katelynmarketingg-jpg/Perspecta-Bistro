    function renderDashboard() {
      const sales = todaySales();
      const total = sales.reduce((sum, s) => sum + num(s.total), 0);
      const clients = sales.length + state.commands.filter(c => c.status === "aberta").length;
      const ticket = clients ? total / clients : 0;
      const ranking = productRanking().slice(0, 5);

      // ── Datas ──
      const _iso2 = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      const _sum2 = orders => orders.reduce((s,o) => s + num(o.total || commandTotal(o)), 0);
      const todayD = new Date(); todayD.setHours(0,0,0,0);
      const todayStr = _iso2(todayD);
      const yesterdayD = new Date(todayD); yesterdayD.setDate(todayD.getDate()-1);
      const sdlmD = new Date(todayD); sdlmD.setMonth(todayD.getMonth()-1);
      const sdlyD = new Date(todayD); sdlyD.setFullYear(todayD.getFullYear()-1);

      // ── Pedidos por período ──
      const ordersHoje  = ordersForRange(todayStr, todayStr);
      const totalHoje   = _sum2(ordersHoje);
      const countHoje   = ordersHoje.length;
      const mondayD = new Date(todayD); mondayD.setDate(todayD.getDate() - (todayD.getDay()===0?6:todayD.getDay()-1));
      const countSemana = ordersForRange(_iso2(mondayD), todayStr).length;
      const firstMesD   = new Date(todayD.getFullYear(), todayD.getMonth(), 1);
      const ordersMonth = ordersForRange(_iso2(firstMesD), todayStr);
      const countMes    = ordersMonth.length;
      const totalMes    = _sum2(ordersMonth);

      // ── Comparativos ──
      const totalOntem = _sum2(ordersForRange(_iso2(yesterdayD), _iso2(yesterdayD)));
      const totalSdlm  = _sum2(ordersForRange(_iso2(sdlmD),     _iso2(sdlmD)));
      const totalSdly  = _sum2(ordersForRange(_iso2(sdlyD),     _iso2(sdlyD)));
      const firstLYD   = new Date(todayD.getFullYear()-1, todayD.getMonth(), 1);
      const lastLYD    = new Date(todayD.getFullYear()-1, todayD.getMonth()+1, 0);
      const totalMesLY = _sum2(ordersForRange(_iso2(firstLYD), _iso2(lastLYD)));

      const _delta2 = (cur, prev) => {
        if (!prev) return { txt: cur > 0 ? "+100%" : "—", ok: cur > 0 ? true : null };
        const p = (cur - prev) / prev * 100;
        return { txt: (p>=0?"+":"") + p.toFixed(1)+"%", ok: p >= 0 };
      };
      const _dc2 = ok => ok === null ? "#999" : ok ? "#1a7a45" : "#c0392b";
      const dOntem = _delta2(totalHoje, totalOntem);
      const dSdlm  = _delta2(totalHoje, totalSdlm);
      const dSdly  = _delta2(totalHoje, totalSdly);
      const dMesLY = _delta2(totalMes,  totalMesLY);

      // ── Lucro estimado hoje ──
      let _custoHoje = 0, _semFH = 0, _comFH = 0;
      ordersHoje.forEach(order => {
        (order.itens || []).forEach(item => {
          const qty = Math.max(1, num(item.quantidade));
          const recipe = (state.costs || []).find(r => r.produto && r.produto.toLowerCase() === String(item.nome||"").toLowerCase());
          if (!recipe) { _semFH++; return; }
          _comFH++;
          const ci = costCalc(recipe);
          _custoHoje += ci.costPerUnit * qty;
        });
      });
      const lucroHoje  = totalHoje - _custoHoje;
      const margemH    = (_comFH > 0 && totalHoje > 0) ? (lucroHoje / totalHoje * 100) : null;
      const margemCorH = margemH === null ? "#999" : margemH >= 60 ? "#1a7a45" : margemH >= 35 ? "#a07000" : "#c0392b";

      // ── Meta do dia ──
      const metaDia    = num(state.settings.metaDia) || 0;
      const metaPct    = metaDia > 0 ? Math.min(100, totalHoje / metaDia * 100) : 0;
      const metaFaltam = metaDia > 0 ? Math.max(0, metaDia - totalHoje) : 0;
      const metaCor    = metaPct >= 100 ? "#1a7a45" : metaPct >= 70 ? "#a07000" : "var(--brand)";

      document.getElementById("dashboard").innerHTML = `
        <div class="grid metrics">
          ${metric("Faturamento hoje", money(totalHoje), dOntem.ok !== null ? dOntem.txt+" vs ontem" : "hoje", false, "caixa")}
          ${metric("Ticket médio", money(ticket), clients ? ""+clients+" cliente(s)" : "—", false, "relatorios")}
          ${metric("Clientes atendidos", clients, "mesas + balcão", false, "clientes")}
          <div class="metric metric-vendidos">
            <div class="metric-top"><span class="label">Mais vendidos</span><span class="metric-ic">${icon("cardapio")}</span></div>
            <div class="metric-vendidos-list">
              ${ranking.length
                ? ranking.slice(0,3).map(p => `<div class="metric-vendidos-row"><span>${escapeHTML(p.nome)}</span><span>${p.quantidade}x</span></div>`).join("")
                : `<span class="metric-vendidos-empty">—</span>`}
            </div>
          </div>
        </div>

        <div class="panel" style="margin-top:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
            <h2 style="margin:0">🎯 Meta do dia</h2>
            <form id="metaDiaForm" style="display:flex;gap:6px;align-items:center">
              <span style="font-size:11px;color:var(--muted)">Meta:</span>
              <input name="metaDia" type="number" min="0" step="50" value="${metaDia || ""}" placeholder="R$ 0"
                style="width:80px;padding:4px 8px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--text)">
              <button class="btn secondary" type="submit" style="padding:4px 10px;font-size:11px">Salvar</button>
            </form>
          </div>
          ${metaDia > 0 ? `
            <div style="height:14px;border-radius:7px;background:#26262c;overflow:hidden;margin-bottom:8px">
              <div style="height:100%;width:${metaPct.toFixed(1)}%;background:${metaCor};border-radius:7px"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:12px">
              <strong style="color:${metaCor}">${metaPct.toFixed(0)}% atingido</strong>
              <span style="color:var(--muted)">${money(totalHoje)} de ${money(metaDia)}${metaFaltam > 0 ? " · faltam "+money(metaFaltam) : " ✓"}</span>
            </div>
          ` : `<p class="mini" style="color:var(--muted)">Defina uma meta acima para acompanhar o progresso.</p>`}
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">
          <article style="background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)">
            <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Hoje</div>
            <div style="font-size:9px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.5px">pedidos</div>
            <div style="font-size:22px;font-weight:800;margin:1px 0 1px">${countHoje}</div>
            <div style="font-size:11px;color:var(--muted)">${totalHoje > 0 ? money(totalHoje) : "Nenhum"}</div>
          </article>
          <article style="background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)">
            <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Esta semana</div>
            <div style="font-size:9px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.5px">pedidos</div>
            <div style="font-size:22px;font-weight:800;margin:1px 0 1px">${countSemana}</div>
            <div style="font-size:11px;color:var(--muted)">desde segunda</div>
          </article>
          <article style="background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)">
            <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Este mês</div>
            <div style="font-size:9px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.5px">pedidos</div>
            <div style="font-size:22px;font-weight:800;margin:1px 0 1px">${countMes}</div>
            <div style="font-size:11px;color:var(--muted)">${money(totalMes)}</div>
          </article>
        </div>

        <div class="panel" style="margin-top:14px">
          <h2>📊 Comparativos de faturamento</h2>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
            <div style="padding:10px 12px;border-radius:10px;background:var(--panel-2)">
              <div style="font-size:11px;color:var(--muted);margin-bottom:2px">vs Ontem (${_iso2(yesterdayD).slice(5).replace("-","/")})</div>
              <div style="font-size:20px;font-weight:800;color:${_dc2(dOntem.ok)}">${dOntem.txt}</div>
              <div style="font-size:11px;color:var(--muted)">${totalOntem > 0 ? "Ontem: "+money(totalOntem) : "Sem dados ontem"}</div>
            </div>
            <div style="padding:10px 12px;border-radius:10px;background:var(--panel-2)">
              <div style="font-size:11px;color:var(--muted);margin-bottom:2px">vs Mesmo dia mês passado</div>
              <div style="font-size:20px;font-weight:800;color:${_dc2(dSdlm.ok)}">${dSdlm.txt}</div>
              <div style="font-size:11px;color:var(--muted)">${totalSdlm > 0 ? _iso2(sdlmD).slice(5).replace("-","/")+": "+money(totalSdlm) : "Sem dados"}</div>
            </div>
            <div style="padding:10px 12px;border-radius:10px;background:var(--panel-2)">
              <div style="font-size:11px;color:var(--muted);margin-bottom:2px">vs Mesmo dia ano passado</div>
              <div style="font-size:20px;font-weight:800;color:${_dc2(dSdly.ok)}">${dSdly.txt}</div>
              <div style="font-size:11px;color:var(--muted)">${totalSdly > 0 ? _iso2(sdlyD).slice(5).replace("-","/")+": "+money(totalSdly) : "Sem dados"}</div>
            </div>
            <div style="padding:10px 12px;border-radius:10px;background:var(--panel-2)">
              <div style="font-size:11px;color:var(--muted);margin-bottom:2px">Este mês vs ${todayD.getFullYear()-1}</div>
              <div style="font-size:20px;font-weight:800;color:${_dc2(dMesLY.ok)}">${dMesLY.txt}</div>
              <div style="font-size:11px;color:var(--muted)">${totalMesLY > 0 ? "Mesmo mês ano passado: "+money(totalMesLY) : "Sem dados"}</div>
            </div>
          </div>
        </div>

        ${margemH !== null || totalHoje > 0 ? `
        <div class="panel" style="margin-top:14px">
          <h2>💰 Lucro estimado hoje</h2>
          ${margemH !== null ? `
            <div class="simple-card-grid" style="margin-top:8px">
              ${simpleCard("Vendas hoje", money(totalHoje), "Total faturado no dia.")}
              ${simpleCard("Custo estimado", money(_custoHoje), _comFH+" produto(s) com ficha."+(_semFH > 0 ? " "+_semFH+" sem ficha." : ""))}
              <article class="simple-card"><span class="mini">Margem hoje</span><strong style="font-size:22px;color:${margemCorH}">${margemH.toFixed(1).replace(".",",")}%</strong><p class="mini">Lucro: ${money(lucroHoje)}</p></article>
            </div>
          ` : `<p class="mini" style="color:var(--muted);padding:4px 0">Cadastre fichas de custo nos produtos para ver o lucro estimado.</p>`}
        </div>` : ""}

        <div class="panel" style="margin-top:14px">
          <h2>Alertas de estoque</h2>
          <div class="product-list">${stockAlerts()}</div>
        </div>
      `;
    }

    let salaoSel = null;

    function tableMap(draggable = false, allowOpen = true) {
      const open = state.commands.filter(c => c.status === "aberta");
      const onlyActive = Boolean(state.settings.tableOnlyActive);
      const selName = String(salaoSel || "").toLowerCase();
      const content = (state.tables || []).sort((a, b) => num(a.ordem) - num(b.ordem)).map(table => {
        const command = open.find(c => c.local.toLowerCase() === table.nome.toLowerCase());
        if (onlyActive && !command) return "";
        const tileSize = Math.max(108, Math.min(180, num(table.tamanho || state.settings.tableTileSize || 118)));
        const minutes = command ? Math.max(1, Math.round((Date.now() - new Date(command.createdAt).getTime()) / 60000)) : 0;
        const status = tableStatus(command);
        const style = draggable ? `style="--table-size:${tileSize}px;left:${Math.max(0, Math.min(88, num(table.x)))}%;top:${Math.max(0, Math.min(80, num(table.y)))}%"` : `style="--table-size:${tileSize}px"`;
        const openAttr = allowOpen ? `data-open-table="${escapeHTML(table.nome)}"` : "";
        const showMinutes = command && !command.deliveredAt && !command.paidAt;
        const statusText = command ? `${status.label}${showMinutes ? ` · ${minutes} min` : ""}` : "Livre";
        const paidBadge = command?.paidAt ? `<span class="table-paid-badge" title="Pago">✓</span>` : "";
        const qrDot = command?.qrNewAt ? `<span class="table-qr-dot" title="Novo pedido pelo QR da mesa"></span>` : "";
        const mainText = command ? escapeHTML(command.cliente || "Avulso") : escapeHTML(table.nome);
        const subText = command ? `<span class="table-name">${escapeHTML(table.nome)}</span>` : "";
        const selClass = selName && table.nome.toLowerCase() === selName ? " sel" : "";
        return `<button class="table-tile ${status.className}${selClass}" ${style} data-table-id="${table.id}" ${openAttr}>
          ${paidBadge}${qrDot}
          <div><strong class="table-client">${mainText}</strong>${subText}<span class="table-status">${statusText}</span>${command ? `<span class="table-total">${money(commandTotal(command))}</span>` : ""}</div>
          <span class="table-resize-handle" data-resize-tables title="Ajustar tamanho das mesas"></span>
        </button>`;
      }).join("");
      const emptyMessage = onlyActive && !content.trim() ? `<div class="empty">Nenhuma mesa ativa agora.</div>` : "";
      return draggable ? `<div class="floor-plan" id="floorPlan">${content}${emptyMessage}</div>` : `<div class="floor-grid">${content}${emptyMessage}</div>`;
    }

    function tableStatus(command) {
      if (!command) return { className: "free", label: "Livre" };
      if (command.paidAt) return { className: "paid", label: "Pago" };
      if (command.deliveredAt) return { className: "delivered", label: "Comendo" };
      if (command.kitchenSentAt) return { className: "kitchen", label: "Cozinha" };
      return { className: "busy", label: "Ocupada" };
    }

    function tableMapControls() {
      const size = Math.max(108, Math.min(180, num(state.settings.tableTileSize || 132)));
      const checked = state.settings.tableOnlyActive ? "checked" : "";
      return `<div class="map-toolbar">
        <label>Tamanho das mesas <input data-table-size type="range" min="108" max="180" value="${size}"></label>
        <label class="map-toggle"><input data-active-tables-only type="checkbox" ${checked}> Só mesas ativas</label>
      </div>`;
    }

    function tableLegend() {
      return `<div class="map-legend">
        <span><i class="legend-dot"></i>Livre</span>
        <span><i class="legend-dot busy"></i>Ocupada</span>
        <span><i class="legend-dot kitchen"></i>Cozinha</span>
        <span><i class="legend-dot delivered"></i>Comendo</span>
        <span><i class="legend-dot paid"></i>Pago</span>
      </div>`;
    }

    function tableVisitorsToday(tableName) {
      const normalized = String(tableName || "").toLowerCase();
      const closedVisitors = todaySales()
        .filter(sale => String(sale.local || "").toLowerCase() === normalized)
        .reduce((sum, sale) => sum + Math.max(1, num(sale.pessoas || 1)), 0);
      const openVisitors = state.commands
        .filter(command => command.status === "aberta" && String(command.local || "").toLowerCase() === normalized)
        .reduce((sum, command) => sum + Math.max(1, num(command.pessoas || 1)), 0);
      return closedVisitors + openVisitors;
    }

    function stockAlerts() {
      const now = Date.now();
      const week = 7 * 24 * 60 * 60 * 1000;
      const low = (state.inventory || []).filter(item => num(item.quantidade) <= num(item.minimo));
      const expiring = (state.inventory || []).filter(item => {
        if (!item.validade) return false;
        const diff = new Date(item.validade).getTime() - now;
        return diff >= 0 && diff <= week;
      });
      const expired = (state.inventory || []).filter(item => {
        if (!item.validade) return false;
        return new Date(item.validade).getTime() < now;
      });
      if (!low.length && !expiring.length && !expired.length) return empty("Nada faltando agora.");
      return [
        ...expired.map(item => `<div class="product-row"><div><strong>${escapeHTML(item.item)}</strong><span>Vencido em ${new Date(item.validade).toLocaleDateString("pt-BR")}</span></div><span class="status paused">vencido</span></div>`),
        ...expiring.map(item => {
          const dias = Math.ceil((new Date(item.validade).getTime() - now) / (24*60*60*1000));
          return `<div class="product-row"><div><strong>${escapeHTML(item.item)}</strong><span>Vence em ${dias} dia${dias !== 1 ? "s" : ""} (${new Date(item.validade).toLocaleDateString("pt-BR")})</span></div><span class="status" style="background:#fff3cd;color:#856404">validade</span></div>`;
        }),
        ...low.map(item => `<div class="product-row"><div><strong>${escapeHTML(item.item)}</strong><span>Tem ${item.quantidade}${item.unidade}; mínimo ${item.minimo}${item.unidade}</span></div><span class="status paused">repor</span></div>`)
      ].join("");
    }

    function metric(label, value, delta, bad, iconName) {
      const ic = iconName ? `<span class="metric-ic">${icon(iconName)}</span>` : "";
      return `<div class="metric"><div class="metric-top"><span class="label">${label}</span>${ic}</div><div class="value">${value}</div><div class="delta ${bad ? "bad" : ""}">${delta}</div></div>`;
    }

    function moduleCard(title, text, tags) {
      return `<article class="module-card"><h3>${title}</h3><p>${text}</p><div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join("")}</div></article>`;
    }

    function bar(label, pct) {
      return `<div class="bar-line"><span>${label}</span><div class="bar"><i style="width:${pct}%"></i></div><strong>${pct}%</strong></div>`;
    }

    function flow(title, sub, iconName) {
      return `<button class="flow-step" data-section="${iconName}">${icon(iconName)}<strong>${title}</strong><span>${sub}</span></button>`;
    }

    function cashToday() {
      const today = todayISO();
      return (state.cash || []).filter(row => (row.createdAt || "").slice(0, 10) === today);
    }

    function cashBalance(rows = cashToday()) {
      return rows.reduce((sum, row) => sum + (row.tipo === "saida" ? -num(row.valor) : num(row.valor)), 0);
    }

    function cashByMethod(rows = cashToday(), method) {
      return rows
        .filter(row => row.forma === method && row.tipo === "entrada" && row.descricao !== "Abertura de caixa")
        .reduce((sum, row) => sum + num(row.valor), 0);
    }

    // Normaliza a forma de pagamento (vinda de botões diferentes: "Pix", "Cartão",
    // "Dinheiro", "debito"…) para uma chave única usada no Caixa.
    function normalizePayForma(method) {
      const m = String(method || "").toLowerCase();
      if (m.indexOf("dinheiro") >= 0) return "dinheiro";
      if (m.indexOf("pix") >= 0) return "pix";
      if (m.indexOf("déb") >= 0 || m.indexOf("deb") >= 0) return "debito";
      if (m.indexOf("créd") >= 0 || m.indexOf("cred") >= 0) return "credito";
      if (m.indexOf("cart") >= 0) return "cartao";
      return m || "dinheiro";
    }

    // Soma as vendas do dia de um conjunto de formas (ex.: cartão = débito+crédito+genérico).
    function cashByMethods(rows = cashToday(), methods) {
      return methods.reduce((sum, m) => sum + cashByMethod(rows, m), 0);
    }

    // Registra no Caixa a venda paga de uma comanda — UMA única vez (flag cashRegistered).
    // Chamado por TODOS os caminhos de pagamento (Pix/Cartão/Dinheiro, card ou kanban),
    // pra que todo pedido pago entre no caixa e apareça nos totais do dia por forma.
    function registerCashSale(command) {
      if (!command || !command.paidAt || command.cashRegistered) return;
      state.cash = state.cash || [];
      const forma = normalizePayForma(command.paymentMethod);
      const valor = num(command.paymentAmount != null ? command.paymentAmount : commandTotal(command));
      state.cash.push({
        id: uid(), tipo: "entrada", descricao: `Pagamento ${command.local || "comanda"}`,
        valor, forma, createdAt: command.paidAt, comandaId: command.id,
      });
      command.cashRegistered = true;
    }

    function currentCashSession() {
      const today = todayISO();
      return (state.cashSessions || []).find(session => session.date === today && session.status === "aberto") || null;
    }

    function lastCashSession() {
      const today = todayISO();
      return (state.cashSessions || []).filter(session => session.date === today).slice(-1)[0] || null;
    }

    function renderCash() {
      const rows = cashToday();
      const entradas = rows.filter(r => r.tipo === "entrada").reduce((s, r) => s + num(r.valor), 0);
      const saidas = rows.filter(r => r.tipo === "saida").reduce((s, r) => s + num(r.valor), 0);
      const entradasDinheiro = rows.filter(r => r.forma === "dinheiro" && r.tipo === "entrada").reduce((s, r) => s + num(r.valor), 0);
      const saidasDinheiro = rows.filter(r => r.forma === "dinheiro" && r.tipo === "saida").reduce((s, r) => s + num(r.valor), 0);
      const dinheiro = entradasDinheiro - saidasDinheiro;
      // Vendas do dia por forma (como na aba "Vendas" do Commerce): Dinheiro, Pix,
      // Cartão (débito+crédito+genérico) e o Total do dia.
      const vendaDinheiro = cashByMethod(rows, "dinheiro");
      const vendaPix = cashByMethod(rows, "pix");
      const vendaCartao = cashByMethods(rows, ["cartao", "debito", "credito"]);
      const vendaTotal = vendaDinheiro + vendaPix + vendaCartao;
      const methodTotals = [
        ["Dinheiro", vendaDinheiro],
        ["Pix", vendaPix],
        ["Cartão", vendaCartao],
        ["Total do dia", vendaTotal]
      ];
      const session = currentCashSession();
      const lastSession = lastCashSession();
      const status = session ? "Aberto" : "Fechado";

      // Saldo = dinheiro físico na gaveta (troco inicial + entradas − saídas em
      // dinheiro). Pix/Cartão entram nas "Vendas do dia", não na gaveta.
      const valorAtual = dinheiro;
      const lastCloseInfo = lastSession && lastSession.status === "fechado"
        ? `<p class="mini" style="text-align:center;margin-top:12px">Último fechamento: ${money(lastSession.countedCash)}${num(lastSession.difference) ? ` · diferença ${money(lastSession.difference)}` : " · conferido"}.</p>` : "";

      // ── CAIXA FECHADO — tela limpa ──
      if (!session) {
        document.getElementById("caixa").innerHTML = `
          <div class="panel">
            <div class="cash-closed">
              <div class="cash-closed-ico">${icon("caixa")}</div>
              <h2>Caixa fechado</h2>
              <p>Para registrar vendas e movimentações no balcão, abra o caixa informando o dinheiro (troco) que está na gaveta.</p>
              ${openCashForm(lastSession)}
            </div>
            ${lastCloseInfo}
          </div>`;
        return;
      }

      // ── CAIXA ABERTO ──
      const methodCard = (label, val, strong) => `<div class="metric" style="min-height:auto;padding:13px 15px${strong ? ";border-color:var(--brand)" : ""}"><div class="metric-top" style="margin-bottom:7px"><span class="label">${label}</span></div><div class="value" style="font-size:20px${strong ? ";color:var(--brand)" : ""}">${money(val)}</div></div>`;
      document.getElementById("caixa").innerHTML = `
        <div class="cash-head">
          <span class="cash-status open">● Caixa aberto</span>
          <span class="mini">troco inicial ${money(session.openingAmount)} · ${escapeHTML(session.openedBy || "")}</span>
        </div>

        <div class="grid metrics" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px">
          <div class="metric"><div class="metric-top"><span class="label">Saldo atual</span><span class="metric-ic">${icon("caixa")}</span></div><div class="value" style="color:var(--brand)">${money(valorAtual)}</div></div>
          <div class="metric"><div class="metric-top"><span class="label">Entradas hoje</span></div><div class="value" style="color:var(--ok)">${money(entradas)}</div></div>
          <div class="metric"><div class="metric-top"><span class="label">Saídas hoje</span></div><div class="value" style="color:var(--danger)">${money(saidas)}</div></div>
        </div>

        <div class="panel">
          <h2>Lançar movimento</h2>
          <form id="cashForm">
            <div class="form-grid form-grid-2col">
              <label>Movimento
                <select name="tipo" id="cashTipo" onchange="
                  var s=document.getElementById('cashSangriaRow');
                  s.style.display=this.value==='sangria'?'contents':'none';
                ">

    // Custo médio ponderado ao adicionar uma compra ao estoque (preview ao vivo).
    function calcStockAvg(id) {
      const item = (state.inventory || []).find(x => x.id === id);
      const row = document.querySelector(`[data-addstock-row="${id}"]`);
      if (!item || !row) return;
      const q1 = num(row.querySelector('[data-addstock="qtd"]')?.value);
      const v1 = num(row.querySelector('[data-addstock="valor"]')?.value);
      const q0 = num(item.quantidade), c0 = num(item.custo);
      const newQty = q0 + q1;
      const newAvg = newQty > 0 ? (q0 * c0 + v1) / newQty : 0;
      const prev = row.querySelector(`[data-addstock-preview="${id}"]`);
      if (!prev) return;
      const un = escapeHTML(item.unidade || "");
      if (q1 > 0 || v1 > 0) {
        prev.style.color = "var(--ink)";
        prev.innerHTML = `Novo saldo: <strong>${newQty.toLocaleString("pt-BR",{maximumFractionDigits:3})} ${un}</strong> · Novo custo médio: <strong style="color:var(--brand)">${money(newAvg)}/${un}</strong>${q1 > 0 ? ` <span style="color:var(--muted)">(esta compra: ${money(v1 / q1)}/${un})</span>` : ""}`;
      } else {
        prev.style.color = "var(--muted)";
        prev.innerHTML = "Preencha a quantidade e o valor pago para ver o novo custo médio.";
      }
    }

    function salaoSummary() {
      const open = state.commands.filter(c => c.status === "aberta");
      const byLocal = {};
      open.forEach(c => { byLocal[String(c.local).toLowerCase()] = c; });
      let livres = 0, ocupadas = 0, cozinha = 0, prontas = 0;
      (state.tables || []).forEach(t => {
        const c = byLocal[t.nome.toLowerCase()];
        if (!c) { livres++; return; }
        ocupadas++;
        if (c.kitchenSentAt && !c.deliveredAt) cozinha++;
        if (c.deliveredAt && !c.paidAt) prontas++;
      });
      return `<div class="salao-sum">
        <span class="fs"><i style="background:var(--ok)"></i><b>${livres}</b> livres</span>
        <span class="fs"><i style="background:var(--brand)"></i><b>${ocupadas}</b> ocupadas</span>
        <span class="fs"><i style="background:#ff8a3a"></i><b>${cozinha}</b> na cozinha</span>
        <span class="fs"><i style="background:var(--gold)"></i><b>${prontas}</b> p/ pagar</span>
      </div>`;
    }

    function renderGoals() {
      document.getElementById("metas").innerHTML = `
        <div class="panel">

              <label>Alvo<input name="alvo" type="number" step="0.01" required></label>

    function salesForGoalPeriod(periodo) {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      if (periodo === "hoje" || periodo === "agora") return todaySales();
      return (state.sales || []).filter(s => {
        const d = new Date(s.createdAt || "");
        if (isNaN(d)) return false;
        if (periodo === "semana") {
          const ws = new Date(now); ws.setHours(0, 0, 0, 0);
          const day = ws.getDay(); ws.setDate(ws.getDate() - (day === 0 ? 6 : day - 1));
          return d >= ws;
        }
        if (periodo === "mes") return d.getFullYear() === year && d.getMonth() === month;
        if (periodo === "trimestre") return d.getFullYear() === year && Math.floor(d.getMonth() / 3) === Math.floor(month / 3);
        if (periodo === "ano") return d.getFullYear() === year;
        if (periodo === "proximo_mes") {
          const nm = month === 11 ? 0 : month + 1;
          const ny = month === 11 ? year + 1 : year;
          return d.getFullYear() === ny && d.getMonth() === nm;
        }
        if (periodo === "proximo_ano") return d.getFullYear() === year + 1;
        return false;
      });
    }

    function goalPeriodLabel(periodo) {
      const y = new Date().getFullYear();
      return { hoje: "Diário", semana: "Semanal", mes: "Mensal", trimestre: "Trimestral", ano: "Anual", proximo_mes: "Próximo mês", proximo_ano: `Ano ${y + 1}`, agora: "Ao vivo" }[periodo] || periodo;
    }

    function goalProgress(goal) {
      if (goal.tipo === "tempo") {
        const open = state.commands.filter(c => c.status === "aberta");
        return open.length ? Math.round(open.reduce((s, c) => s + ((Date.now() - new Date(c.createdAt).getTime()) / 60000), 0) / open.length) : 0;
      }
      const sales = salesForGoalPeriod(goal.periodo || "hoje");
      if (goal.tipo === "pedidos") return sales.length;
      if (goal.tipo === "produto") {
        const key = (goal.produto || "").toLowerCase();
        return sales.reduce((s, sale) => s + (sale.itens || []).filter(i => !key || String(i.nome).toLowerCase().includes(key)).reduce((si, i) => si + num(i.quantidade), 0), 0);
      }
      return sales.reduce((sum, s) => sum + num(s.total), 0);
    }

    function goalCard(goal) {
      const done = goalProgress(goal);
      const target = Math.max(1, num(goal.alvo));
      const pct = goal.tipo === "tempo" ? Math.max(0, Math.min(100, 100 - ((done - target) / target) * 100)) : Math.min(100, (done / target) * 100);
      const label = goalPeriodLabel(goal.periodo || "hoje");
      const isFuture = goal.periodo === "proximo_mes" || goal.periodo === "proximo_ano";
      return `<article class="simple-card goal-card">
        <span class="mini">${escapeHTML(label)}${isFuture ? " · planejamento" : ""}</span>
        <strong>${escapeHTML(goal.nome)}</strong>
        <p class="mini">${done} de ${escapeHTML(String(goal.alvo))} ${escapeHTML(goal.unidade || "")}</p>
        <div class="progress"><i style="width:${Math.max(0, pct)}%"></i></div>
        <div class="actions" style="margin-top:8px"><button class="btn ghost" data-delete-goal="${goal.id}">Excluir</button></div>
      </article>`;
    }

    let _openCosts = new Set(); // fichas de custo abertas (mantém aberto entre re-renders)

    function ingredientFromFormData(data) {
      const ref = data.inventoryId || "";
      // Estoque vinculado
      if (ref.startsWith("inv:")) {
        const inventory = inventoryById(ref.slice(4));
        if (inventory) return {
          nome: inventory.item,
          inventoryId: inventory.id,
          refType: "inv",
          precoCompra: inventory.custo,
          quantidadeCompra: 1,
          unidadeCompra: inventory.unidade,
          quantidadeUsada: data.quantidadeUsada,
          unidadeUsada: data.unidadeUsada || inventory.unidade,
          baseUnitCost: inventoryUnitCost(inventory)
        };
      }
      // Sub-receita (ficha de insumo)
      if (ref.startsWith("cost:")) {
        const sub = state.costs.find(c => c.id === ref.slice(5));
        if (sub) {
          const calc = costCalc(sub);
          return {
            nome: sub.produto,
            inventoryId: "",
            costId: sub.id,
            refType: "cost",
            precoCompra: calc.costPerUnit,
            quantidadeCompra: 1,
            unidadeCompra: "un",
            quantidadeUsada: data.quantidadeUsada,
            unidadeUsada: "un",
            baseUnitCost: calc.costPerUnit
          };
        }
      }
      // Legado: id direto (sem prefixo)
      if (ref && !ref.includes(":")) {
        const inventory = inventoryById(ref);
        if (inventory) return {
          nome: inventory.item,
          inventoryId: inventory.id,
          refType: "inv",
          precoCompra: inventory.custo,
          quantidadeCompra: 1,
          unidadeCompra: inventory.unidade,
          quantidadeUsada: data.quantidadeUsada,
          unidadeUsada: data.unidadeUsada || inventory.unidade,
          baseUnitCost: inventoryUnitCost(inventory)
        };
      }
      // Manual
      const manual = {
        nome: data.ingrediente || "Ingrediente",
        inventoryId: "",
        refType: "manual",
        precoCompra: data.precoCompra || 0,
        quantidadeCompra: data.quantidadeCompra || 1,
        unidadeCompra: data.unidadeCompra || "un",
        quantidadeUsada: data.quantidadeUsada,
        unidadeUsada: data.unidadeUsada || "un"
      };
      manual.baseUnitCost = purchaseUnitCost(manual);
      return manual;
    }

                    <div style="font-size:23px;font-weight:900;line-height:1.1">${money(calc.suggested)}</div>

                <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Rende ${escapeHTML(String(row.rendimento))} un. · Ingredientes: ${(row.ingredientes||[]).length}</div>

                    ${(row.ingredientes || []).length ? (row.ingredientes || []).map((item, index) => {

            </td>

        return `
          <tr style="cursor:pointer" data-tipo="${row.tipo}" onclick="toggleCostDetail('${row.id}')">
            <td style="line-height:1.3"><strong style="font-size:13px">${escapeHTML(row.produto)}</strong> ${tipoBadge(row.tipo)}${fifoBadge}</td>
            <td style="text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap">${money(calc.costPerUnit)}</td>
            ${!isInsumo ? `<td style="text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap">${money(calc.suggested)}</td>` : ""}
          </tr>
          ${detail}`;
      }).join("");
      return `
        <div class="table-wrap"><table id="costsMainTable">
          <thead><tr>
            <th>Nome</th>
            <th style="text-align:right">Custo/un</th>
            ${tipo === "insumo" ? "" : `<th style="text-align:right">Sugerido</th>`}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
    }

    function toggleCostDetail(id) {
      const el = document.getElementById("cost-detail-" + id);
      if (!el) return;
      const isOpen = el.style.display !== "none";
      if (isOpen) { el.style.display = "none"; _openCosts.delete(id); }
      else { el.style.display = ""; _openCosts.add(id); }
    }

    function toggleCatPicker() {
      const el = document.getElementById("catPicker");
      if (!el) return;
      el.style.display = el.style.display === "none" ? "flex" : "none";
    }

    function pickCat(cat) {
      const el = document.getElementById("expCategoria");
      if (el) el.value = cat;
      const picker = document.getElementById("catPicker");
      if (picker) picker.style.display = "none";
    }

    function filterCosts(tipo, btn) {
      const table = document.getElementById("costsMainTable");
      if (!table) return;
      table.querySelectorAll("tr[data-tipo]").forEach(tr => {
        const show = tipo === "todos" || tr.dataset.tipo === tipo;
        tr.style.display = show ? "" : "none";
        const detail = document.getElementById("cost-detail-" + tr.getAttribute("onclick")?.match(/'([^']+)'/)?.[1]);
        if (detail && !show) detail.style.display = "none";
      });
      btn.closest("div").querySelectorAll("button").forEach(b => {
        b.style.background = ""; b.style.color = ""; b.style.borderColor = "";
      });
      btn.style.background = "var(--accent)"; btn.style.color = "#fff"; btn.style.borderColor = "var(--accent)";
    }

          <button class="btn ghost btn-sm" type="button" data-delete-zone="${z.id}">Excluir</button>
        </div>`).join("")}

        ${(state.addons || []).map(addon => `<div class="prod-row" data-addon-row="${addon.id}">
          <div class="prod-info"><strong>${escapeHTML(addon.nome)}</strong></div>
          <span class="prod-price">${money(addon.preco)}</span>
          <button class="prod-status ${addon.ativo ? "on" : "off"}" type="button" data-toggle-addon="${addon.id}">${addon.ativo ? "● Ativo" : "Pausado"}</button>
          <details class="prod-edit">
            <summary class="btn ghost btn-sm">Editar</summary>
            <div class="prod-edit-body">
              <label>Nome<input data-edit-addon-name value="${escapeHTML(addon.nome)}"></label>
              <label>Valor<input data-edit-addon-price type="number" step="0.01" value="${num(addon.preco)}"></label>
              <select data-edit-addon-active style="display:none"><option value="true" ${addon.ativo ? "selected" : ""}>Ativo</option><option value="false" ${!addon.ativo ? "selected" : ""}>Pausado</option></select>
              <div class="actions full">
                <button class="btn" data-save-addon="${addon.id}">Salvar</button>
                <button class="btn ghost" data-delete-addon="${addon.id}">Excluir</button>
              </div>
            </div>
          </details>
        </div>`).join("")}
      </div>`;

    function commandStatusChip(command) {
      const st = commandStage(command);
      // reaproveita as cores existentes (pronto/saiu herdam o visual de cozinha/entregue)
      const cls = st === "pronto" ? "cozinha" : st === "saiu" ? "entregue" : st;
      return `<span class="cmd-status-chip ${cls}">${STAGE_LABEL[st] || st}</span>`;
    }

    function commandKanbanCard(command) {
      const total = commandTotal(command);
      const status = commandStatus(command);
      const mesa = escapeHTML(command.local);
      const cliente = escapeHTML(command.cliente || "Avulso");
      const pessoas = Math.max(1, num(command.pessoas || 1));
      const itens = command.itens.length;
      let action = "";
      const stage = commandStage(command);
      const entregar = `<button class="btn ghost btn-sm" style="width:100%" data-deliver-command="${command.id}">✓ Marcar entregue</button>`;
      if (stage === "montando") {
        action = `<span class="mini" style="color:var(--muted)">Sem itens</span>`;
      } else if (stage === "feito") {
        action = `<button class="btn secondary btn-sm" style="width:100%" data-send-kitchen="${command.id}">🍳 Mandar para cozinha</button>`;
      } else if (stage === "cozinha") {
        action = `<button class="btn secondary btn-sm" style="width:100%" data-mark-ready="${command.id}">🔔 Marcar pronto</button>`;
      } else if (stage === "pronto") {
        action = isDeliveryCmd(command)
          ? `<button class="btn secondary btn-sm" style="width:100%" data-dispatch="${command.id}">🛵 Saiu para entrega</button>`
          : entregar;
      } else if (stage === "saiu") {
        action = entregar;
      } else if (stage === "entregue") {
        action = `<div class="kb-pay-row">${cselBuild("_kbpay_"+command.id,[{v:"dinheiro",l:"Dinheiro"},{v:"pix",l:"Pix"},{v:"debito",l:"Débito"},{v:"credito",l:"Crédito"}],"dinheiro","width:100%")}<button class="btn ok btn-sm" data-pay-kanban="${command.id}">💰 Pagar</button></div>`;
      } else if (stage === "pago") {
        action = `<button class="btn ok btn-sm" style="width:100%" data-close-command="${command.id}">✓ Liberar mesa</button>`;
      }
      const _kbItems = command.itens.length
        ? `<div class="kanban-card-items">${command.itens.slice(0, 4).map(it => { const dr = isDrinkItem(it); const done = dr && it.bebidaEntregue; return `<div class="kbi${done ? " drink-done" : ""}"><b class="num">${Math.max(1, num(it.quantidade))}×</b> ${dr ? "🥤 " : ""}${escapeHTML(it.nome)}${done ? " ✓" : ""}</div>`; }).join("")}${command.itens.length > 4 ? `<div class="kbi more">+${command.itens.length - 4} item(ns)…</div>` : ""}</div>`
        : `<div class="kanban-card-items empty">Sem itens ainda</div>`;
      const _drinks = commandUndeliveredDrinks(command);
      const _drinkBtn = (_drinks.length && commandStage(command) !== "pago")
        ? `<button class="btn-drink" type="button" data-deliver-drinks="${command.id}" title="Marcar bebida(s) como entregue">🥤 Entregar bebida</button>` : "";
      return `<div class="kanban-card" data-drag-id="${command.id}" data-open-kb="${command.id}">
        <div class="kanban-card-top">
          <span class="kanban-card-mesa">👤 ${cliente}</span>
          <span class="kanban-card-total">${money(total)}</span>
        </div>
        <div class="kanban-card-cliente">${mesa}${command.source === "whatsapp" ? `<span class="badge-wa" style="font-size:10px;padding:1px 5px;margin-left:4px">📲</span>` : ""}</div>
        ${_kbItems}
        ${_drinkBtn ? `<div class="kb-drink-row">${_drinkBtn}</div>` : ""}
        <div class="kanban-card-action">${action}</div>
      </div>`;
    }

    function showKbModal(id) {
      const command = state.commands.find(c => c.id === id);
      if (!command) { closeKbModal(); return; }
      if (command.qrNewAt) { command.qrNewAt = null; save({ silent: true }); } // abriu → apaga o círculo azul
      _kbModalId = id;
      const modal = document.getElementById("kbModal");
      if (!modal) return;
      modal.innerHTML = `<div class="kb-modal-inner">
        <button class="kb-modal-close" id="kbModalClose">✕</button>
        <div class="kb-modal-body">${commandCard(command)}</div>
      </div>`;
      modal.classList.remove("hidden");
    }

    function closeKbModal() {
      _kbModalId = null;
      const modal = document.getElementById("kbModal");
      if (modal) { modal.classList.add("hidden"); modal.innerHTML = ""; }
    }

    function commandListRow(command) {
      const status = commandStatus(command);
      const total = commandTotal(command);
      const paySelect = `<span class="list-pay-inline" style="display:inline-flex;align-items:center;gap:6px">${cselBuild("_kbpay_"+command.id,[{v:"dinheiro",l:"Dinheiro"},{v:"pix",l:"Pix"},{v:"debito",l:"Débito"},{v:"credito",l:"Crédito"}],"dinheiro","min-width:110px")}<button class="btn ok btn-sm" data-pay-kanban="${command.id}">Pagar</button></span>`;
      const _st = commandStage(command);
      const actions = [
        _st === "feito" ? `<button class="btn secondary btn-sm" data-send-kitchen="${command.id}">Cozinha</button>` : "",
        _st === "cozinha" ? `<button class="btn secondary btn-sm" data-mark-ready="${command.id}">Pronto</button>` : "",
        _st === "pronto" && isDeliveryCmd(command) ? `<button class="btn secondary btn-sm" data-dispatch="${command.id}">Saiu</button>` : "",
        (_st === "pronto" && !isDeliveryCmd(command)) || _st === "saiu" ? `<button class="btn ghost btn-sm" data-deliver-command="${command.id}">Entregue</button>` : "",
        _st === "entregue" ? paySelect : "",
        _st === "pago" ? `<button class="btn ok btn-sm" data-close-command="${command.id}">Liberar</button>` : "",
      ].filter(Boolean).join(" ");
      return `<tr>
        <td><strong>${escapeHTML(command.local)}</strong>${command.source === "whatsapp" ? ` <span class="badge-wa" style="font-size:10px;padding:1px 5px">📲</span>` : ""}</td>
        <td style="color:var(--brand);font-weight:700">${escapeHTML(command.cliente || "Avulso")}</td>
        <td>${command.itens.length}</td>
        <td><strong>${money(total)}</strong></td>
        <td>${commandStatusChip(command)}</td>
        <td style="white-space:nowrap">${actions || `<span class="mini">—</span>`}</td>
      </tr>`;
    }

    function renderCommands() {
      const mode = state.commandViewMode || "geral";
      const open = state.commands.filter(c => c.status === "aberta");
      const locations = commandLocations();

      const viewToggle = `<div class="cmd-view-toggle">
        <button class="btn${mode === "geral" ? "" : " ghost"}" data-cmd-view="geral">▤ Geral</button>
        <button class="btn${mode === "colunas" ? "" : " ghost"}" data-cmd-view="colunas">⊞ Colunas</button>
        <button class="btn${mode === "lista" ? "" : " ghost"}" data-cmd-view="lista">☰ Lista</button>
      </div>`;

      let content = "";
      if (mode === "geral") {
        content = `${viewToggle}<div class="command-grid">${open.length ? open.map(commandCard).join("") : empty("Nenhuma comanda aberta.")}</div>`;
      } else if (mode === "colunas") {
        const cols = [
          { id: "montando", label: "Sem pedido",     filter: c => commandStage(c) === "montando" },
          { id: "feito",    label: "Pedido feito",   filter: c => commandStage(c) === "feito" },
          { id: "cozinha",  label: "Na cozinha",     filter: c => commandStage(c) === "cozinha" },
          { id: "pronto",   label: "Pronto",         filter: c => commandStage(c) === "pronto" },
          { id: "saiu",     label: "Saiu p/ entrega", filter: c => commandStage(c) === "saiu" },
          { id: "entregue", label: "Entregue",       filter: c => commandStage(c) === "entregue" },
          { id: "pago",     label: "Pago",           filter: c => commandStage(c) === "pago" },
        ].map(col => {
          const cards = open.filter(col.filter);
          return `<div class="kanban-col" data-drop-col="${col.id}">
            <div class="kanban-col-header">
              <span class="kanban-col-title">${col.label}</span>
              <span class="kanban-count${cards.length ? "" : " zero"}">${cards.length}</span>
            </div>
            ${cards.length ? cards.map(commandKanbanCard).join("") : `<p class="mini" style="text-align:center;margin:8px 0">—</p>`}
          </div>`;
        }).join("");
        content = `${viewToggle}<div class="kanban-board">${cols}</div>`;
      } else {
        const rows = open.length ? open.map(commandListRow).join("") : `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">Nenhuma comanda aberta.</td></tr>`;
        content = `${viewToggle}<div class="cmd-list-wrap"><table class="cmd-list">
          <thead><tr><th>Mesa</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Status</th><th>Ação</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
      }

      document.getElementById("comandas").innerHTML = `
        ${salaoSummary()}

        <div class="salao-grid" style="margin-bottom:16px">
          <div class="salao-map">
            <div class="panel">
              ${tableMapControls()}
              ${tableLegend()}
              ${tableMap(true)}
            </div>
          </div>
          <aside class="panel salao-comanda">
            ${salaoComandaPanel()}
          </aside>
        </div>

        <div class="panel">
          <form id="commandForm">
            <div class="form-grid" style="grid-template-columns:1fr 1fr 72px;gap:8px">
              <label style="font-size:11px">Local${cselBuild("local", locations.map(t=>({v:t.nome,l:t.nome})), locations[0]?.nome||"")}</label>
              <label style="font-size:11px">Cliente<input name="cliente" placeholder="Avulso" style="font-size:13px"></label>
              <label style="font-size:11px">Qtd.<input name="pessoas" type="number" min="1" value="1" style="font-size:13px"></label>
            </div>
            <div class="actions"><button class="btn" type="submit">${icon("comandas")}Abrir comanda</button></div>
          </form>
          <div style="margin-top:16px">${content}</div>
        </div>
      `;
      if (_kbModalId) {
        const cmd = state.commands.find(c => c.id === _kbModalId && c.status === "aberta");
        if (cmd) showKbModal(_kbModalId);
        else closeKbModal();
      }
    }

    function commandLocations() {
      const map = new Map();
      (state.tables || []).forEach(table => map.set(table.nome.toLowerCase(), table));
      ["Balcão", "Bebidas", "Delivery"].forEach((name, index) => {
        if (!map.has(name.toLowerCase())) map.set(name.toLowerCase(), { id: name, nome: name, area: "Atendimento", ordem: 90 + index });
      });
      return Array.from(map.values()).sort((a, b) => num(a.ordem) - num(b.ordem) || a.nome.localeCompare(b.nome));
    }

    function commandCard(command) {
      const activeItems = state.menu.filter(m => m.ativo);
      const activeAddons = (state.addons || []).filter(addon => addon.ativo);
      const locations = commandLocations();
      const waBadge = command.source === "whatsapp" ? `<span class="badge-wa">📲 Online</span>` : "";
      const clienteName = escapeHTML(command.cliente || "Avulso");
      const pessoas = Math.max(1, num(command.pessoas || 1));
      const localLabel = escapeHTML(command.local) + (command.tipoLabel ? ` <span style="font-size:11px;color:var(--muted)">(${escapeHTML(command.tipoLabel)})</span>` : "");
      return `<article class="command-card ${command.paidAt ? "paid" : ""}">
        <div class="command-head">
          <div class="command-head-info">
            <h3 class="cmd-head-name">👤 <input class="cmd-name-inp" data-head-name="${command.id}" value="${escapeHTML(command.cliente || "Avulso")}" placeholder="Cliente" autocomplete="off">${waBadge}</h3>
            <div class="command-client-name cmd-head-local" data-head-local="${command.id}" title="Clique para trocar a mesa / tipo">${cselBuild("hl_" + command.id, locations.map(t=>({v:t.nome,l:t.nome})), command.local)}${command.tipoLabel ? ` <span style="font-size:11px;color:var(--muted)">(${escapeHTML(command.tipoLabel)})</span>` : ""}</div>
            <p class="mini"><input class="cmd-qtd-inp" type="number" min="1" value="${Math.max(1, num(command.pessoas || 1))}" data-head-pessoas="${command.id}" title="Qtd. de clientes"> cliente(s) · ${commandStatusText(command)}</p>
          </div>
          <strong>${money(commandTotal(command))}</strong>
        </div>
        ${(command.referencia || command.telefone || command.entrega || command.troco || command.observacao) ? `
        <div class="cc-order-info">
          ${command.referencia ? `<div>📍 ${escapeHTML(command.referencia)}</div>` : ""}
          ${command.telefone ? `<div>📱 ${escapeHTML(command.telefone)}</div>` : ""}
          ${command.entrega ? `<div>🛵 Entrega: ${money(command.entrega)}</div>` : ""}
          ${command.paymentMethod ? `<div>💳 ${escapeHTML(command.paymentMethod)}</div>` : ""}
          ${command.troco ? `<div>💵 Troco p/ ${money(command.trocoPara)} · levar ${money(command.troco)}</div>` : ""}
          ${command.observacao ? `<div>📝 ${escapeHTML(command.observacao)}</div>` : ""}
        </div>` : ""}
        <div class="line-items" style="margin:10px 0">
          ${command.itens.length ? command.itens.map((item, index) => commandItemRow(command, item, index)).join("") : `<div class="empty">Sem itens</div>`}
        </div>
        <details class="cc-fold add-item-fold" ${command.itens.length ? "" : "open"}>
          <summary class="add">＋ Adicionar item</summary>
          <div class="item-picker">
            <input type="search" class="item-picker-search" data-item-filter placeholder="🔎 Procurar item…" autocomplete="off">
            <div class="item-picker-grid">
              ${activeItems.length ? activeItems.map(i=>`<button type="button" class="item-chip" data-add-menu-item="${command.id}:${i.id}" data-name="${escapeHTML(_cselNorm(i.nome))}"><span class="ic-name">${escapeHTML(i.nome)}</span><span class="ic-price">${money(i.preco)}</span></button>`).join("") : `<span class="mini">Cadastre itens no Cardápio.</span>`}
            </div>
            <p class="mini item-picker-hint">Toque no item para adicionar. Clique no item na lista acima para mudar a quantidade ou a observação.</p>

        </details>
        <div class="command-flow">
          ${command.kitchenSentAt
            ? `<p class="mini flow-sent">🍳 Enviado pra cozinha</p><button class="btn btn-sm" type="button" data-send-kitchen="${command.id}" style="width:100%;margin-bottom:8px">↻ Reimprimir cozinha</button>`
            : `<button class="btn" type="button" data-send-kitchen="${command.id}" style="width:100%;margin-bottom:8px">🍳 Mandar pra cozinha</button>`}
          ${command.paidAt
            ? `<div class="pay-done">✓ Pago ${money(command.paymentAmount || commandTotal(command))} · ${escapeHTML(command.paymentMethod || "")}</div>`
            : `<button class="btn secondary" type="button" data-pay-toggle="${command.id}" style="width:100%;margin-bottom:8px">💳 Pagar</button>
            <div class="pay-box hidden" data-pay-box="${command.id}" style="margin-bottom:8px">
              <div class="pay-eyebrow">Forma de pagamento</div>
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
                <button class="btn ok" type="button" data-quick-pay="${command.id}:pix">Pix</button>
                <button class="btn ok" type="button" data-quick-pay="${command.id}:cartao">Cartão</button>

                <div style="display:flex;gap:10px;align-items:flex-end;margin-top:8px">
                  <label style="font-size:11px;flex:1">Valor recebido<input type="number" step="0.01" inputmode="decimal" data-cash-received="${command.id}" placeholder="${commandTotal(command).toFixed(2)}"></label>
                  <div class="troco-view" data-troco="${command.id}">Troco<br><strong>R$ 0,00</strong></div>
                </div>
                <button class="btn ok" type="button" data-confirm-cash="${command.id}" style="width:100%;margin-top:8px">Confirmar dinheiro</button>
              </div>

          <button class="btn ok close-command-button" type="button" data-close-command="${command.id}" style="width:100%">✓ Feito</button>
          ${command.paidAt ? `
          <div style="display:flex;gap:6px;margin-top:8px">

            ${state.settings.nfceToken
              ? (command.nfce
                  ? `<a href="${escapeHTML(command.nfce.linkPdf||'#')}" target="_blank" rel="noopener" class="btn ghost" style="flex:1;font-size:12px;padding:7px 6px;text-align:center;text-decoration:none">📄 NFC-e #${escapeHTML(String(command.nfce.numero))}</a>`
                  : `<button class="btn ghost" type="button" data-emitir-nfce="${command.id}" style="flex:1;font-size:12px;padding:7px 6px">🗒️ Emitir NFC-e</button>`)
              : ""}

          <p class="mini" style="margin-top:6px">${command.paidAt ? "Comanda paga — clique em Feito pra finalizar e enviar pra Pedido feito." : "Mande pra cozinha, receba o pagamento e clique em Feito."}</p>
          <button class="btn-cancel-cmd" type="button" data-cancel-command="${command.id}">🗑️ Apagar comanda (desistiu)</button>
        </div>
      </article>`;

    function commandProgressBar(command) {
      const steps = [
        { key: "montando", label: "Sem pedido",   bg: "#2a2a31", fg: "#cfcfd6" },
        { key: "feito",    label: "Pedido feito", bg: "#2a2411", fg: "#fb923c" },
        { key: "cozinha",  label: "Na cozinha",   bg: "#2a1c10", fg: "#ff8a3a" },
        { key: "entregue", label: "Entregue",     bg: "#141a26", fg: "#5b8def" },
        { key: "pago",     label: "Pago",         bg: "#12211b", fg: "#4ade80" },
      ];
      const s = commandStatus(command);
      const current =
        s === "paga"     ? "pago"     :
        s === "entregue" ? "entregue" :
        s === "cozinha"  ? "cozinha"  :
        (s === "aberta" && command.itens.length) ? "feito" : "montando";
      const cells = steps.map(step => {
        const active = step.key === current;
        return `<div style="display:flex;align-items:center;justify-content:center;padding:0 3px;${active ? `background:${step.bg};color:${step.fg};font-weight:900;font-size:10px;` : "background:#1c1c20;color:#6f6e78;font-weight:600;font-size:10px;"}">${step.label}</div>`;
      }).join("");
      return `<div style="display:grid;grid-template-columns:repeat(5,1fr);border-radius:7px;overflow:hidden;gap:2px;background:#26262c;height:26px;margin-bottom:10px">${cells}</div>`;
    }

    function commandItemRow(command, item, index) {
      const adicionais = commandItemAddons(item);
      const detail = [
        adicionais.length ? `Adicionais: ${adicionais.map(addon => `${addon.nome} (${money(addon.preco)})`).join(", ")}` : "",
        item.observacao ? `Obs.: ${item.observacao}` : ""
      ].filter(Boolean).join(" · ");
      // Clica no item → abre embaixo pra mudar quantidade / obs / remover.
      return `<details class="line-item-fold">
        <summary class="line-item">
          <div class="line-main">
            <span>${escapeHTML(item.nome)} x${item.quantidade}</span>
            ${detail ? `<span class="item-notes">${escapeHTML(detail)}</span>` : ""}
          </div>
          <strong>${money(commandItemTotal(item))}</strong>
          <span class="line-edit-ico" title="Editar">✎</span>
        </summary>
        <div class="line-item-edit">
          <div style="display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:end">
            <label style="font-size:11px">Qtd.<input type="number" min="1" value="${Math.max(1, num(item.quantidade))}" data-edit-item-qty></label>
            <label style="font-size:11px">Observação<input value="${escapeHTML(item.observacao || "")}" data-edit-item-obs placeholder="Ex: sem cebola, bem passado…"></label>
          </div>
          <div class="actions full" style="margin-top:8px;display:flex;gap:8px">
            <button class="btn" type="button" data-save-item="${command.id}:${index}">Salvar</button>
            <button class="btn ghost" type="button" data-remove-item="${command.id}:${index}">🗑️ Remover item</button>
          </div>
        </div>
      </details>`;
    }

      const printArea = document.getElementById("printArea");
      if (!printArea) return;
      const createdAt = new Date(command.createdAt || Date.now()).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
      printArea.innerHTML = `<div class="print-ticket">
        <div class="logo-dot"></div>
        <h1>${escapeHTML(state.settings.restaurant || "Perspecta Gestão")}</h1>
        <p><strong>Comanda:</strong> ${escapeHTML(command.local)}</p>
        <p><strong>Cliente:</strong> ${escapeHTML(command.cliente || "Avulso")}</p>

    async function emitirNFCe(commandId) {
      const command = state.commands.find(c => c.id === commandId);
      if (!command) return;
      const token = state.settings.nfceToken;
      const cnpj  = (state.settings.nfceCnpj || "").replace(/\D/g, "");
      if (!token || !cnpj) {
        showToast("⚠️ Configure CNPJ e token NFC-e em Configurações.", 3500);
        return;
      }
      if (command.nfce?.status === "autorizado") {
        showToast("NFC-e já emitida para esta comanda.", 2500);
        return;
      }
      showToast("⏳ Emitindo NFC-e...", 5000);
      const total = num(command.paymentAmount || commandTotal(command));
      const _formaMap = { dinheiro:1, pix:17, debito:4, credito:3, cartao:3, fiado:1 };
      const _formaKey = (command.paymentMethod || "dinheiro").toLowerCase().replace(/[\s-]/g,"");
      const payload = [{
        idIntegracao: command.id,
        cpfCnpjEmitente: cnpj,
        ambiente: num(state.settings.nfceAmbiente || "2"),
        serie: num(state.settings.nfceSerie || "1"),
        infAdic: { infCpl: `Obrigado! ${escapeHTML(state.settings.restaurant||"")}` },
        itens: (command.itens||[]).map((item, i) => ({
          codigo: String(i+1).padStart(3,"0"),
          descricao: item.nome,
          ncm: state.settings.nfceNcm || "21069090",
          cfop: "5102",
          unidade: "UN",
          quantidade: Math.max(1, num(item.quantidade)),
          valorUnitario: num(item.preco),
          valorTotal: num(item.preco) * Math.max(1, num(item.quantidade)),
          origem: 0,
          csosn: state.settings.nfceCsosn || "400"
        })),
        pagamentos: [{ forma: _formaMap[_formaKey] || 1, valor: total }]
      }];
      try {
        const companyId = (storeKey || "").replace(/^gestaoCompany\./, "").replace(/\.v1$/, "");
        let res = null;
        // Caminho principal: emite pelo servidor (o token não sai do navegador).
        try {
          const sr = await fetch("/api/nfce", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ companyId, payload })
          });
          if (sr.status !== 404 && sr.status < 500) res = sr;   // servidor respondeu (Plugnotas incluído)
        } catch (e) {}
        // Fallback: endpoint indisponível → Plugnotas direto. Sem nota dupla:
        // o Plugnotas deduplica por idIntegracao (= command.id).
        if (!res) {
          res = await fetch("https://api.plugnotas.com.br/nfce", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-api-key": token },
            body: JSON.stringify(payload)
          });
        }
        const json = await res.json();
        const r = Array.isArray(json) ? json[0] : json;
        if (res.ok && r) {
          command.nfce = {
            status: r.status || "processando",
            numero: r.numero || r.numeroNota || "—",
            chave: r.chaveAcesso || "",
            linkPdf: r.linkPdf || r.linkDanfe || "",
            emitidaEm: new Date().toISOString()
          };
          save();
          showToast(`✅ NFC-e emitida! Nº ${command.nfce.numero}`, 5000);
        } else {
          const msg = r?.message || r?.error || JSON.stringify(r).slice(0,80);
          showToast("❌ " + msg, 5000);
        }
      } catch (e) {
        showToast("❌ Falha ao conectar com Plugnotas. Verifique o token.", 4000);
      }
    }

    function productRanking() {
      const map = new Map();
      todaySales().forEach(sale => {
        (sale.itens || []).forEach(item => {
          const current = map.get(item.nome) || { nome: item.nome, quantidade: 0, total: 0 };
          current.quantidade += num(item.quantidade);
          current.total += commandItemTotal(item);
          map.set(item.nome, current);
        });
      });
      return Array.from(map.values()).sort((a, b) => b.total - a.total);
    }

    function dateOnly(value) {
      return (value || "").slice(0, 10);
    }

    function inDateRange(value, start, end) {
      const date = dateOnly(value);
      return (!start || date >= start) && (!end || date <= end);
    }

    function weekdayMatches(value, weekday) {
      if (weekday === "" || weekday === undefined || weekday === null) return true;
      const date = new Date(`${dateOnly(value)}T12:00:00`);
      return String(date.getDay()) === String(weekday);
    }

    function ordersForRange(start, end, weekday = "") {
      const sales = (state.sales || []).filter(sale => inDateRange(sale.createdAt, start, end) && weekdayMatches(sale.createdAt, weekday));
      const commands = (state.commands || [])
        .filter(command => command.status === "aberta" && inDateRange(command.createdAt, start, end) && weekdayMatches(command.createdAt, weekday))
        .map(command => ({ ...command, total: commandTotal(command), live: true }));
      return [...sales, ...commands].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    }

    function productStats(orders) {
      const map = new Map();
      orders.forEach(order => {
        (order.itens || []).forEach(item => {
          const current = map.get(item.nome) || { nome: item.nome, quantidade: 0, total: 0, lucro: 0 };
          const qty = Math.max(1, num(item.quantidade));
          const total = commandItemTotal(item);
          const cost = state.costs.find(row => row.produto.toLowerCase() === String(item.nome).toLowerCase());
          const unitCost = cost ? costCalc(cost).costPerUnit : 0;
          current.quantidade += qty;
          current.total += total;
          current.lucro += total - unitCost * qty;
          map.set(item.nome, current);
        });
      });
      return Array.from(map.values()).sort((a, b) => b.total - a.total);
    }

    function avgKitchenMinutes(orders) {
      const times = orders
        .map(order => order.kitchenSentAt && order.deliveredAt ? Math.round((new Date(order.deliveredAt) - new Date(order.kitchenSentAt)) / 60000) : null)
        .filter(value => value !== null && isFinite(value) && value >= 0);
      return times.length ? Math.round(times.reduce((sum, value) => sum + value, 0) / times.length) : 0;
    }

    function reportSummary(orders) {
      return {
        pedidos: orders.length,
        vendas: orders.reduce((sum, order) => sum + num(order.total || commandTotal(order)), 0),
        itens: orders.reduce((sum, order) => sum + (order.itens || []).reduce((itemSum, item) => itemSum + num(item.quantidade), 0), 0),
        tempo: avgKitchenMinutes(orders)
      };
    }

    function percentChange(current, previous) {
      if (!previous) return current ? "+100%" : "0%";
      const pct = ((current - previous) / previous) * 100;
      return `${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%`;
    }

    function weekDayOptions(selected) {
      const names = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
      return `<option value="">Todos</option>${names.map((name, index) => `<option value="${index}" ${String(selected) === String(index) ? "selected" : ""}>${name}</option>`).join("")}`;
    }

    function periodRange(kind) {
      const now = new Date();
      const date = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (kind === "week") {
        const day = date.getDay();
        const diff = day === 0 ? 6 : day - 1;
        const start = new Date(date);
        start.setDate(date.getDate() - diff);
        return { start: dateToISO(start), end: dateToISO(date), weekday: "" };
      }
      if (kind === "month") {
        return { start: dateToISO(new Date(date.getFullYear(), date.getMonth(), 1)), end: dateToISO(date), weekday: "" };
      }
      return { start: dateToISO(date), end: dateToISO(date), weekday: "" };
    }

    function dateToISO(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function ordersTable(orders) {
      if (!orders.length) return empty("Nenhum pedido encontrado nesse período.");
      return `<table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Itens</th><th>Tempo cozinha</th></tr></thead><tbody>
        ${orders.map(order => {
          const kitchenTime = order.kitchenSentAt && order.deliveredAt ? `${Math.max(0, Math.round((new Date(order.deliveredAt) - new Date(order.kitchenSentAt)) / 60000))} min` : "sem registro";
          return `<tr>
            <td><strong>${escapeHTML(order.local || "Pedido")}</strong><br><span class="mini">${escapeHTML(new Date(order.createdAt || Date.now()).toLocaleString("pt-BR"))}</span></td>
            <td>${escapeHTML(order.cliente || "Avulso")}</td>
            <td>${money(order.total || commandTotal(order))}</td>
            <td>${(order.itens || []).map(item => `${escapeHTML(item.nome)} x${escapeHTML(item.quantidade)}`).join("<br>")}</td>
            <td>${kitchenTime}</td>
          </tr>`;
        }).join("")}
      </tbody></table>`;
    }

    function simpleCard(title, value, text) {
      return `<article class="simple-card"><span class="mini">${escapeHTML(title)}</span><strong>${escapeHTML(value)}</strong><p class="mini">${escapeHTML(text)}</p></article>`;
    }

    function pmCartTotal() {
      return publicCart.reduce((s, item) => {
        const addT = (item.adicionais || []).reduce((sa, a) => sa + num(a.preco), 0);
        return s + (num(item.preco) + addT) * num(item.quantidade);
      }, 0);
    }

    function updatePmFab() {

        fab.classList.remove("hidden");

    // Atualiza a dica embaixo das formas de pagamento no checkout público.

      const onde = tipo === "tele" ? "na entrega" : tipo === "mesa" ? "no local" : "na retirada";
      if (method === "dinheiro") hint.textContent = `Você paga em dinheiro ${onde}.`;
      else if (payOnline) hint.textContent = `Você paga agora, pelo site, com segurança (InfinitePay).`;
      else hint.textContent = `Você paga ${onde} (${method === "pix" ? "Pix" : "cartão na maquininha"}).`;

    // Calcula o troco ao vivo (troco = valor informado − total do pedido).
    function pmUpdateTrocoHint() {
      const h = document.getElementById("pmTrocoHint");
      if (!h) return;
      const para = num(document.getElementById("pmTrocoInput")?.value);
      const total = pmCartTotal() + pmDeliveryFee().taxa;
      if (!para) { h.textContent = ""; return; }
      if (para < total) { h.textContent = `Valor menor que o total (${money(total)}).`; h.style.color = "#f87171"; }
      else { h.textContent = `Troco: ${money(para - total)}`; h.style.color = "#4ade80"; }
    }

    // Monta e grava o pedido do cardápio no sistema (servidor + fallback direto).
    // Usado tanto pelo "Finalizar pedido" quanto pelo "Pedir pelo WhatsApp".
    async function pmPersistOrder(data) {
      const nome = escapeHTML(data.nome || "").trim();
      const tipo = data.tipo || "retirada";
      const telefone = (data.telefone || "").replace(/\D/g, "");
      const pagamento = data.pagamento || "dinheiro";
      const payOnline = data.payOnline === "1" && (pagamento === "pix" || pagamento === "cartao");
      const payMap = { dinheiro: "Dinheiro", pix: "Pix", cartao: "Cartão" };
      const obs = escapeHTML(data.obs || "").trim();
      // Endereço estruturado (delivery) + taxa do bairro.
      const zone = (state.settings.deliveryZones || []).find(z => z.id === data.bairro);
      const bairroNome = zone ? zone.bairro : "";
      const entrega = tipo === "tele" && zone ? num(zone.taxa) : 0;
      let referencia = "";
      if (tipo === "tele") {
        const rua = escapeHTML(data.rua || "").trim();
        const numero = escapeHTML(data.numero || "").trim();
        const compl = escapeHTML(data.complemento || "").trim();
        referencia = [`${rua}${numero ? `, ${numero}` : ""}`, bairroNome].filter(Boolean).join(" — ") + (compl ? ` (${compl})` : "");
      } else if (tipo === "mesa") {
        referencia = pmMesa || escapeHTML(data.mesaNum || "").trim();
      }
      const itemsForComanda = publicCart.map(item => ({
        id: item.id, nome: item.nome, preco: item.preco,
        quantidade: item.quantidade, adicionais: item.adicionais || [], observacao: item.observacao || ""
      }));
      const orderId = uid();
      const tipoLabel = tipo === "tele" ? `Delivery${referencia ? ` — ${referencia}` : ""}` : tipo === "mesa" ? `${referencia ? referencia : "Comer no local"}` : "Retirada no local";
      const total = pmCartTotal() + entrega;
      // Troco (só dinheiro + delivery): quanto o cliente vai pagar e o troco a levar.
      const trocoPara = (pagamento === "dinheiro" && tipo === "tele") ? num(data.trocoPara) : 0;
      const troco = trocoPara > total ? +(trocoPara - total).toFixed(2) : 0;
      // Pedido do QR da mesa → local = a mesa (roteia pra comanda dela); senão "Cardápio online".
      const localPedido = pmMesa ? pmMesa : "Cardápio online";
      const payload = { id: orderId, nome, tipo, referencia, bairro: bairroNome, entrega, observacao: obs, telefone, itens: itemsForComanda, total, trocoPara, troco, ts: Date.now(), createdAt: new Date().toISOString(), local: localPedido, mesa: pmMesa || "", tipoLabel, paymentMethod: payMap[pagamento] || "Dinheiro", paymentStatus: payOnline ? "aguardando_online" : "na_entrega" };
      const lines = publicCart.map(item => {
        const addT = (item.adicionais || []).reduce((s, a) => s + num(a.preco), 0);
        const addNames = (item.adicionais || []).filter(a => a.nome).map(a => `  + ${a.nome}`).join("\n");
        const iobs = item.observacao ? `  📝 ${item.observacao}` : "";
        return `• ${item.quantidade}× ${item.nome} — ${money((num(item.preco) + addT) * item.quantidade)}${addNames ? "\n" + addNames : ""}${iobs ? "\n" + iobs : ""}`;
      }).join("\n") + (entrega ? `\n🛵 Entrega (${bairroNome}): ${money(entrega)}` : "") + (troco ? `\n💵 Troco para ${money(trocoPara)} (levar ${money(troco)})` : "") + (obs ? `\n📝 Obs: ${obs}` : "");
      const companyId = String(storeKey || "").replace(/^gestaoCompany\./, "").replace(/\.v1$/, "");
      let saved = false, failReason = "";
      try {
        const r = await fetch("https://perspecta-bistro.vercel.app/api/order", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ companyId, order: payload })
        });
        saved = r.ok;
        if (!saved) {
          let detail = ""; try { const j = await r.json(); detail = j.error || j.detail || ""; } catch (e) {}
          failReason = `servidor ${r.status}${detail ? ` — ${detail}` : ""}`;
          console.error("[pedido] /api/order falhou:", r.status, detail, { companyId });
        }
      } catch (e) { failReason = "sem rede/CORS: " + (e && e.message || e); console.error("[pedido] /api/order erro:", e); }
      if (!saved) {
        try {
          const w = await authedFetch(`${FIREBASE_URL}/orders/${fbPath(storeKey)}/${orderId}.json`, {
            method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
          });
          saved = w && w.ok;
        } catch (e) {}
      }
      if (saved) {
        try {
          const mine = JSON.parse(localStorage.getItem("bistroMyOrders") || "[]");
          mine.unshift({ id: orderId, companyId, restaurante: state.settings.restaurant || "", nome, telefone, total: payload.total, ts: Date.now(),
            itensCount: itemsForComanda.reduce((s, i) => s + (Number(i.quantidade) || 1), 0), tipoLabel, tipoEntrega: tipo, paymentMethod: payload.paymentMethod });
          localStorage.setItem("bistroMyOrders", JSON.stringify(mine.slice(0, 20)));
        } catch (e) {}
      }
      return { saved, failReason, orderId, payload, itemsForComanda, lines, tipoLabel, companyId, nome, tipo, telefone, referencia, pagamento, payOnline, payMap };
    }

    // Monta a mensagem do WhatsApp a partir do pedido (template configurável).
    function pmOrderWhatsMsg(res, saved) {
      const tpl = (state.settings.orderMessage && state.settings.orderMessage.trim())
        || "*🍽️ Novo Pedido — {restaurante}*\nCliente: {cliente}\nTipo: {tipo}\n\n📦 *Itens:*\n{itens}\n\n💰 *Total: {total}*";
      const vars = {
        restaurante: state.settings.restaurant || "", cliente: res.nome, tipo: res.tipoLabel,
        telefone: res.telefone || "", itens: res.lines, total: money(res.payload.total),
        pagamento: res.payMap[res.pagamento] || "",
      };
      const preenchida = tpl.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
      const pag = `\n💳 Pagamento: ${res.payMap[res.pagamento]}`;
      const confirmacao = saved ? "✅ Pedido registrado no sistema!" : "⚠️ Confirme o recebimento com o restaurante.";
      return `${preenchida}${pag}\n\n${confirmacao}`;
    }

    function renderPmCartItems() {
      const el = document.getElementById("pmCartItems");
      if (!el) return;
      if (!publicCart.length) { el.innerHTML = `<div class="empty">Adicione itens para começar.</div>`; return; }
      el.innerHTML = publicCart.map((item, index) => {
        const addT = (item.adicionais || []).reduce((s, a) => s + num(a.preco), 0);
        const unit = num(item.preco) + addT;
        const detail = [(item.adicionais || []).map(a => a.nome).join(", "), item.observacao].filter(Boolean).join(" · ");
        return `<div class="pm-cart-item">

    function compressImage(file, maxW, maxH, quality, format) {
      return new Promise(resolve => {
        const reader = new FileReader();
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxW / img.width, maxH / img.height);
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const ctx = canvas.getContext("2d");
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            // PNG (sem perda) preserva texto nítido e transparência — ideal p/ logotipo.
            // JPEG (padrão) é melhor p/ fotos de produto (arquivo menor).
            const fmt = format || "image/jpeg";
            resolve(fmt === "image/png" ? canvas.toDataURL("image/png") : canvas.toDataURL(fmt, quality));
          } catch {
            resolve(null);
          }
        };
        img.onerror = () => resolve(null); // imagem ilegível (ex.: HEIC) → não guarda quebrada
        reader.onload = () => {
          if (typeof reader.result === "string" && reader.result.startsWith("data:image/")) img.src = reader.result;
          else resolve(null);
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    // Fotos de iPhone vêm em HEIC, que o navegador não exibe. Convertemos
    // para JPEG sob demanda (a lib só é baixada quando aparece um HEIC).
    function isHeicFile(file) {
      return !!file && (/hei[cf]/i.test(file.type || "") || /\.(heic|heif)$/i.test(file.name || ""));
    }
    let _heicLibPromise = null;
    function loadHeicLib() {
      if (window.heic2any) return Promise.resolve(window.heic2any);
      if (_heicLibPromise) return _heicLibPromise;
      _heicLibPromise = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
        s.onload = () => resolve(window.heic2any);
        s.onerror = () => { _heicLibPromise = null; reject(new Error("cdn")); };
        document.head.appendChild(s);
      });
      return _heicLibPromise;
    }
    // Lê qualquer foto (inclusive HEIC) e devolve um JPEG comprimido (ou null).
    async function fileToCompressed(file, maxW, maxH, quality, format) {
      let input = file;
      if (isHeicFile(file)) {
        try {
          showToast("Convertendo foto do iPhone…", 2500);
          const heic2any = await loadHeicLib();
          const out = await Promise.race([
            heic2any({ blob: file, toType: "image/jpeg", quality: 0.92 }),
            new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 25000))
          ]);
          input = Array.isArray(out) ? out[0] : out;
        } catch (e) {
          return null; // não deu para converter (sem internet ou arquivo inválido)
        }
      }
      return compressImage(input, maxW, maxH, quality, format);
    }
