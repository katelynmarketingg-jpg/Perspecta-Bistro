<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perspecta Bistro</title>
  <link rel="icon" id="faviconLink" href="icone-192.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Questrial&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Perspecta — preto puro + cores do Perspecta Creator */
      --bg: #000000;
      --panel: #0b0b0d;
      --panel-2: #141416;
      --raise: #1d1d20;
      --ink: #fafaf9;
      --muted: #a8a29e;
      --line: #242428;
      --line-2: #33333a;
      --brand: #f97316;
      --brand-soft: rgba(249,115,22,.15);
      --brand-2: #1f9e86;
      --gold: #fb923c;
      --blue: #5b8def;
      --danger: #f87171;
      --ok: #4ade80;
      --shadow: 0 14px 40px rgba(0, 0, 0, .6);
      --display: "Outfit", "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1, h2, h3, .metric .value, .command-head strong, .command-head h3 {
      font-family: var(--display);
      letter-spacing: -0.02em;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: #111111;
      color: #f8efe4;
      padding: 22px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(255,255,255,.13);
      margin-bottom: 18px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .brand-wordmark {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand-wordmark strong {
      display: block;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .3px;
      color: #fff;
    }
    .brand-wordmark span {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f97316;
      font-weight: 500;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-group { display: flex; flex-direction: column; gap: 2px; }
    .nav-group + .nav-group { margin-top: 15px; }
    .nav-eyebrow {
      font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); opacity: .65; font-weight: 700; padding: 2px 12px 6px;
    }

    .nav button {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      color: var(--ink);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 500;
      transition: .16s ease;
    }

    .nav button:hover { background: var(--panel-2); }
    .nav button.active {
      background: var(--brand-soft);
      border-color: rgba(249,115,22,.22);
    }
    .nav button.active svg { color: var(--brand); }

    .nav svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .sidebar-footer {
      margin-top: 26px;
      padding: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 8px;
      color: #e9dccd;
      font-size: 13px;
      line-height: 1.45;
    }

    .sidebar-logout {
      width: 100%;
      margin-top: 14px;
      background: var(--brand);
      color: #fafaf9;
    }

    main {
      padding: 26px;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
      margin: 5px 0 0;
      max-width: 760px;
    }

    .eyebrow {
      color: var(--brand);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0;
      font-size: 12px;
      margin: 0 0 6px;
    }

    h1, h2, h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: clamp(21px, 2.3vw, 28px);
      line-height: 1.05;
      max-width: 850px;
    }

    h2 { font-size: 18px; margin-bottom: 12px; }
    h3 { font-size: 15px; margin-bottom: 10px; }

    .date-pill {
      white-space: nowrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--muted);
      box-shadow: var(--shadow);
      font-weight: 700;
      font-size: 13px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 18px;
    }

    .metric, .panel, .module-card, .product-row, .report-row, .command-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 18px 20px;
      min-height: 124px;
      border-radius: 16px;
    }

    .metric-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 13px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .metric-ic { color: var(--faint); display: inline-flex; }
    .metric-ic svg { width: 18px; height: 18px; }

    .metric .value {
      font-size: 29px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 7px;
    }

    .metric .delta {
      color: var(--ok);
      font-weight: 800;
      font-size: 13px;
    }

    .metric .delta.bad { color: var(--danger); }

    .two-col {
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
    }

    .three-col {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel {
      padding: 16px;
      min-width: 0;
    }

    .modules {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .module-card {
      padding: 16px;
      min-height: 178px;
    }

    .plain-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .module-card p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 14px;
      font-size: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      background: var(--panel-2);
      color: #40362e;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .product-list, .report-list {
      display: grid;
      gap: 10px;
    }

    .product-row, .report-row {
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: none;
    }

    .product-row strong, .report-row strong {
      display: block;
      margin-bottom: 4px;
    }

    .product-row span, .report-row span {
      color: var(--muted);
      font-size: 13px;
    }

    .bar-chart {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .bar-line {
      display: grid;
      grid-template-columns: 145px 1fr 56px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }

    .bar {
      height: 12px;
      background: #26262c;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--brand-2);
      border-radius: inherit;
    }

    .flow {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin-top: 18px;
    }

    .flow-step {
      background: #171412;
      color: #1c1c207eb;
      padding: 16px;
      border-radius: 8px;
      min-height: 112px;
      position: relative;
    }

    .flow-step strong { display: block; margin: 10px 0 4px; }
    .flow-step span { color: #d8cab8; font-size: 13px; }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    form {
      display: grid;
      gap: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .floor-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .floor-plan {
      position: relative;
      height: 420px;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0),
        var(--panel);
      background-size: 26px 26px, 100% 100%;
      overflow: hidden;
      touch-action: none;
    }

    .table-tile {
      position: relative;
      box-sizing: border-box;
      min-height: 86px;
      border-radius: 8px;
      border: 2px solid var(--line);
      background: #1c1c20;
      padding: clamp(10px, calc(var(--table-size, 132px) * .09), 16px);
      display: grid;
      align-content: center;
      gap: 5px;
      overflow: hidden;
    }

    /* Círculo azul: pedido novo pelo QR da mesa (pisca até o atendente abrir) */
    .table-qr-dot { position: absolute; top: 6px; left: 6px; width: 12px; height: 12px; border-radius: 50%; background: #3b82f6; box-shadow: 0 0 0 0 rgba(59,130,246,.7); animation: qrpulse 1.4s infinite; z-index: 3; }
    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .qr-card { background: #fff; border-radius: 10px; padding: 12px; text-align: center; color: #111; }
    .qr-card img { width: 100%; max-width: 160px; height: auto; display: block; margin: 0 auto; }
    .qr-card .qr-name { font-weight: 900; font-size: 16px; margin-bottom: 6px; color: #111; }
    .qr-card .qr-hint { font-size: 11px; color: #555; margin-top: 6px; }
    .qr-card .qr-brand { font-size: 10px; color: #999; margin-top: 2px; }
    .qr-loading { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
    @keyframes qrpulse { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,.7); } 70% { box-shadow: 0 0 0 8px rgba(59,130,246,0); } 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); } }

    .floor-plan .table-tile {
      position: absolute;
      width: var(--table-size, 132px);
      min-height: calc(var(--table-size, 132px) * .72);
      cursor: grab;
      user-select: none;
      box-shadow: 0 10px 22px rgba(35, 24, 14, .12);
    }

    .floor-plan .table-tile.dragging {
      cursor: grabbing;
      z-index: 5;
      transform: scale(1.02);
    }

    .table-tile.busy {
      border-color: rgba(249,115,22,.55);
      background: linear-gradient(160deg, rgba(249,115,22,.13), var(--panel-2));
    }

    .table-tile.kitchen {
      border-color: #fb923c;
      background: #2a2411;
    }

    .table-tile.delivered {
      border-color: #5b8def;
      background: #141a26;
    }

    .table-tile.paid {
      border-color: rgba(74,222,128,.5);
      background: var(--panel-2);
    }

    .table-tile.free {
      border-color: rgba(74,222,128,.5);
      border-style: dashed;
      background: var(--panel-2);
    }
    .table-tile.free .table-client { color: var(--ok); }
    .table-tile.sel { outline: 2.5px solid var(--brand); outline-offset: 2px; }

    /* Salão: mapa + comanda lado a lado */
    .salao-sum { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .salao-sum .fs { display: inline-flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 7px 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .salao-sum .fs b { font-family: var(--display); font-size: 15px; color: var(--ink); }
    .salao-sum .fs i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
    .salao-grid { display: grid; grid-template-columns: minmax(0,1fr) 384px; gap: 16px; align-items: start; }
    .salao-map { min-width: 0; }
    .salao-comanda { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 0; background: transparent; border: none; }
    .salao-comanda > .command-card, .salao-comanda > .card { margin: 0; }
    .salao-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; text-align: center; padding: 56px 20px; min-height: 320px;
      background: var(--panel); border: 1px dashed var(--line); border-radius: 16px; color: var(--muted);
    }
    .salao-empty-ico { opacity: .5; transform: scale(1.6); margin-bottom: 6px; }
    .salao-empty strong { color: var(--ink); font-size: 16px; }
    .salao-empty p { margin: 0; font-size: 13px; max-width: 220px; }
    .salao-empty .btn { margin-top: 8px; }
    .salao-manage > summary { cursor: pointer; font-weight: 750; font-size: 14px; color: var(--ink); list-style: none; }
    .salao-manage > summary::-webkit-details-marker { display: none; }
    .salao-manage > summary::before { content: "⚙ "; color: var(--muted); }
    @media (max-width: 1000px) { .salao-grid { grid-template-columns: 1fr; } .salao-comanda { position: static; max-height: none; } }
    .table-total {
      display: block; margin-top: 3px; font-weight: 700; color: var(--brand);
      font-variant-numeric: tabular-nums;
      font-size: clamp(11px, calc(var(--table-size, 132px) * .09), 15px);
    }

    .table-tile strong {
      display: block;
      max-width: 100%;
      font-size: clamp(12px, calc(var(--table-size, 132px) * .11), 18px);
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .table-tile span {
      color: var(--muted);
      font-size: clamp(10px, calc(var(--table-size, 132px) * .075), 13px);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .table-paid-badge {
      position: absolute;
      left: 8px;
      bottom: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #17623a;
      color: #1c1c20;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 5px 12px rgba(23, 98, 58, .22);
    }

    .table-resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 24px;
      height: 24px;
      border: 0;
      background: transparent;
      cursor: nwse-resize;
      touch-action: none;
      border-radius: 0 0 8px 0;
      transition: background .15s;
    }

    .table-tile.resizing .table-resize-handle {
      background: rgba(240, 122, 34, 0.55);
    }

    .table-tile.resizing {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .table-client {
      color: var(--ink) !important;
      font-weight: 850;
    }

    .table-name {
      display: block;
      color: var(--muted) !important;
      font-weight: 800;
    }

    .table-status {
      display: block;
      margin-top: 3px;
      font-weight: 850;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .map-toolbar label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .map-toolbar input {
      width: 130px;
      padding: 0;
    }

    .map-toolbar input[type="checkbox"] {
      width: 16px;
      height: 16px;
      min-height: 16px;
      padding: 0;
      accent-color: var(--brand);
    }

    .map-toggle {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1c1c20;
      color: var(--ink) !important;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .map-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: #12211b;
    }

    .legend-dot.busy { background: #1c1c20; border-color: var(--brand); }
    .legend-dot.kitchen { background: #2a2411; border-color: #fb923c; }
    .legend-dot.delivered { background: #141a26; border-color: #5b8def; }
    .legend-dot.paid { background: #1c1c20; border-color: var(--brand); }

    .cost-block {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .ingredient-row {
      display: grid;
      grid-template-columns: 1.2fr repeat(6, minmax(92px, 1fr)) auto;
      gap: 8px;
      align-items: end;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1c1c20;
    }

    .simple-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .simple-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 5px solid var(--brand);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      min-height: 132px;
    }

    .simple-card strong {
      display: block;
      font-size: 20px;
      margin: 8px 0;
    }

    .goal-card {
      padding: 12px;
      min-height: 108px;
    }

    .goal-card strong {
      font-size: 17px;
      margin: 5px 0;
    }

    .goal-card .progress {
      height: 9px;
      margin-top: 7px;
    }

    .settings-stack {
      display: grid;
      gap: 16px;
    }

    /* Caixa — estado fechado (empty-state) */
    .cash-closed { text-align: center; padding: 40px 20px 8px; max-width: 460px; margin: 0 auto; }
    .cash-closed-ico {
      width: 60px; height: 60px; border-radius: 18px; margin: 0 auto 16px;
      display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    }
    .cash-closed-ico svg { width: 28px; height: 28px; }
    .cash-closed h2 { margin-bottom: 8px; }
    .cash-closed p { color: var(--muted); font-size: 13.5px; margin: 0 auto 4px; max-width: 360px; }
    .cash-closed form { max-width: 420px; margin: 20px auto 0; text-align: left; }
    .cash-status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .cash-status.open { background: rgba(74,222,128,.14); color: var(--ok); }
    .cash-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

    /* Comanda — dobras compactas (editar / adicionar item) */
    /* "Mandar para cozinha" em laranja (destaque da ação principal) */
    .btn[data-send-kitchen] { background: var(--brand) !important; border-color: var(--brand) !important; color: #1c1c20 !important; font-weight: 800; }
    .btn[data-send-kitchen]:hover { background: #d96a18 !important; border-color: #d96a18 !important; }
    .cc-order-info { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 12px; line-height: 1.5; color: var(--ink); }
    .cc-order-info div { white-space: normal; word-break: break-word; }
    .cc-fold { margin: 8px 0; }
    .cc-fold > summary {
      list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--muted);
      padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2);
    }
    .cc-fold > summary::-webkit-details-marker { display: none; }
    .cc-fold > summary:hover { color: var(--ink); border-color: var(--line-2); }
    .cc-fold > summary.add { color: var(--brand); border-color: rgba(249,115,22,.35); }
    .cc-fold[open] > summary { margin-bottom: 10px; }
    /* Botão "+ Adicionar item": laranja e centralizado, mais intuitivo */

    .cmd-qtd-inp:focus { border-color: var(--brand); background: var(--bg); color: var(--ink); outline: none; }

    .prod-thumb { width: 44px; height: 44px; border-radius: 9px; overflow: hidden; flex: none; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); }
    .prod-thumb img, .prod-thumb .menu-thumb { width: 100%; height: 100%; object-fit: cover; }
    .prod-thumb .menu-thumb-empty { font-size: 22px; }

    .prod-cat { display: block; font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
    .prod-price { font-family: var(--display); font-weight: 800; color: var(--brand); font-variant-numeric: tabular-nums; flex: none; }

    .prod-edit-body .full { grid-column: 1 / -1; }
    @media (max-width: 640px) { .prod-edit-body { grid-template-columns: 1fr; } .prod-cat { max-width: 22ch; } }

    /* Ordem do menu — lista compacta com toggle */
    .order-list { display: flex; flex-direction: column; gap: 6px; }
    .order-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 11px; padding: 8px 12px;

      font-family: var(--display); padding: 6px; flex: none;

    .order-row .order-name { flex: 1; min-width: 0; line-height: 1.2; }
    .order-row .order-name strong { font-size: 14px; }
    .order-row .order-name span { display: block; font-size: 11px; color: var(--faint); }
    .order-toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; flex: none; }
    .order-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .order-toggle .track {
      width: 38px; height: 22px; border-radius: 999px; background: var(--raise);
      border: 1px solid var(--line-2); position: relative; transition: .18s; flex: none;
    }
    .order-toggle .track::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
      border-radius: 50%; background: var(--muted); transition: .18s;
    }
    .order-toggle input:checked + .track { background: var(--brand); border-color: var(--brand); }
    .order-toggle input:checked + .track::after { left: 18px; background: #fff; }
    .order-toggle .lbl { font-size: 12px; font-weight: 600; color: var(--muted); width: 46px; }
    .order-toggle input:checked ~ .lbl { color: var(--ink); }
    .order-toggle.locked { opacity: .6; cursor: default; }
    .order-row .btn { min-height: 32px; padding: 6px 14px; flex: none; }
    @media (max-width: 620px) { .order-toggle .lbl { display: none; } .order-row { gap: 8px; } }

    .kanban-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
    .kanban-card-mesa { font-weight: 900; font-size: 15px; line-height: 1.15; }
    .kanban-card-total { font-size: 13px; font-weight: 900; white-space: nowrap; }
    .kanban-card-cliente { font-size: 12px; font-weight: 700; color: var(--brand); }
    .kanban-card-meta { font-size: 11px; color: var(--muted); }
    .kanban-card-action { margin-top: 3px; }
    .kb-drink-row { display: flex; justify-content: flex-end; margin: 4px 0 2px; }
    .btn-drink { background: rgba(59,130,246,.16); border: 1px solid rgba(59,130,246,.55); color: #7fb2ff; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 800; cursor: pointer; }
    .btn-drink:hover { background: rgba(59,130,246,.28); color: #cfe0ff; }

    .kb-pay-row { display: flex; gap: 5px; align-items: center; }
    .kb-pay-row select { flex: 1; font-size: 11px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }

    /* ── List view ── */
    .cmd-list-wrap { overflow-x: auto; margin-top: 4px; }
    .cmd-list { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cmd-list th { text-align: left; font-size: 10px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 6px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
    .cmd-list td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .cmd-list tr:last-child td { border-bottom: none; }
    .cmd-list tbody tr:hover td { background: #1c1c20; }
    .cmd-status-chip { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .cmd-status-chip.montando  { background: #26262c; color: #a8a29e; }
    .cmd-status-chip.feito     { background: #2a2411; color: #fb923c; }
    .cmd-status-chip.cozinha   { background: #241a12; color: var(--brand); }
    .cmd-status-chip.entregue  { background: #141a26; color: #5b8def; }
    .cmd-status-chip.pago      { background: #1c1c20; color: #f97316; }
    .list-pay-inline { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }
    .list-pay-inline select { font-size: 11px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; }

    /* ── Adicionais mini toggle ── */
    .obs-addon-row { display: flex; gap: 6px; align-items: flex-end; }
    .obs-addon-row > label { flex: 1; }
    .addon-mini { position: relative; }
    .addon-mini summary { list-style: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink); user-select: none; transition: background .12s; }
    .addon-mini summary::-webkit-details-marker { display: none; }
    .addon-mini[open] summary { background: var(--brand); color: #1c1c20; border-color: var(--brand); }
    .addon-mini .addon-list { position: absolute; right: 0; bottom: calc(100% + 4px); width: 230px; background: #1c1c20; border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.14); z-index: 200; margin: 0; }

    .print-ticket {
      width: 280px;
      padding: 12px;
      color: #111;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.35;
    }

    .print-ticket h1 {
      font-size: 18px;
      text-align: center;
      margin: 0 0 4px;
    }

    .print-ticket .logo-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f97316;
      margin: 0 auto 6px;
    }

    .print-ticket hr {
      border: 0;
      border-top: 1px dashed #333;
      margin: 8px 0;
    }

    .public-menu { min-height: 100vh; background: #000; }

    /* ===== PERSPECTA BISTRO — Public Menu ===== */
    .pm-wrap { min-height: 100vh; background: #000; font-family: 'Questrial', system-ui, sans-serif; }

    /* Hero */
    .pm-hero {
      background: #000;
      color: #fff;
      padding: 56px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .pm-hero::after {
      content: '';
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      margin-top: 32px;
    }
    .pm-hero-logo-img {
      display: block;
      margin: 0 auto 8px;
      width: auto;
      max-width: min(420px, 92%);
      max-height: 240px;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }
    .pm-hero-wordmark {
      font-family: 'Anton', sans-serif;
      font-size: clamp(48px, 12vw, 80px);
      letter-spacing: 2px;
      color: #fff;
      line-height: 1;
      margin: 0;
      text-transform: uppercase;
    }
    .pm-hero-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,.5);
      margin: 6px 0 0;
    }
    .pm-hero-note {
      font-size: 13px;
      color: rgba(255,255,255,.55);
      margin: 14px 0 0;
      letter-spacing: .3px;
    }
    /* "Meus pedidos" — botão no topo do cardápio */
    .pm-myorders-link {
      margin-top: 14px; display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .pm-myorders-link:hover { background: rgba(255,255,255,.16); }
    /* Cartão de cada pedido + linha do tempo do status */
    .pm-myorder { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--panel-2); }
    .pm-myorder.is-done { opacity: .75; }
    .pm-myorder-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .pm-myorder-badge { background: var(--brand); color: #1c1c20; font-size: 11px; font-weight: 900; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
    .pm-myorder.is-done .pm-myorder-badge { background: var(--ok, #16a34a); color: #fff; }
    .pm-track { display: flex; flex-direction: column; gap: 0; position: relative; }
    .pm-track-step { display: flex; align-items: center; gap: 10px; padding: 5px 0; position: relative; }
    .pm-track-step .pm-track-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: transparent; flex-shrink: 0; z-index: 1; }
    .pm-track-step:not(:last-child)::before { content: ""; position: absolute; left: 6px; top: 19px; bottom: -5px; width: 2px; background: var(--line); }
    .pm-track-step.done .pm-track-dot { background: var(--brand); border-color: var(--brand); }
    .pm-track-step.done:not(:last-child)::before { background: var(--brand); }
    .pm-track-lbl { font-size: 13px; color: var(--muted); }
    .pm-track-step.done .pm-track-lbl { color: var(--text); font-weight: 600; }
    .pm-track-step.now .pm-track-lbl { color: var(--brand); font-weight: 800; }

    /* Custom select */
    .csel { position:relative; display:inline-block; }
    .csel-trigger { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); cursor:pointer; font-size:13px; user-select:none; white-space:nowrap; min-height:36px; box-sizing:border-box; overflow:hidden; }
    .csel-val { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    /* itens de grid (labels) precisam poder encolher, senão o Item invade o Qtd */
    .addItemForm label { min-width: 0; }
    .addItemForm label .csel, .addItemForm label input { width: 100%; box-sizing: border-box; }
    .csel-trigger::after { content:'▾'; font-size:10px; color:var(--muted); flex-shrink:0; }
    .csel-drop { position:absolute; top:calc(100% + 4px); left:0; min-width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.15); z-index:9000; overflow:hidden; display:none; max-height:240px; overflow-y:auto; }
    .csel-drop.open { display:block; }
    .csel-opt { padding:9px 14px; font-size:13px; cursor:pointer; white-space:nowrap; }
    .csel-opt:hover { background:var(--panel-2); }
    .csel-opt.sel { color:var(--accent); font-weight:700; }
    .csel-search { position:sticky; top:0; z-index:2; display:block; width:100%; box-sizing:border-box; padding:9px 14px; border:0; border-bottom:1px solid var(--line); background:var(--panel-2); color:var(--ink); font-size:13px; outline:none; }
    .csel-search::placeholder { color:var(--muted); }
    label > .csel { width:100%; }
    label > .csel .csel-trigger { width:100%; box-sizing:border-box; }

    /* Category tabs */
    .pm-cats-wrap {
      background: #161616;
      border-bottom: 1px solid #262626;
      position: sticky; top: 0; z-index: 10;
      overflow-x: auto; scrollbar-width: none;
    }
    .pm-cats-wrap::-webkit-scrollbar { display: none; }
    .pm-cats { display: flex; gap: 6px; padding: 10px 16px; width: max-content; min-width: 100%; }
    .pm-cat {
      background: transparent; border: 1.5px solid #333; color: #aaa;
      border-radius: 6px; padding: 7px 20px; font-weight: 700; font-size: 13px;
      white-space: nowrap; cursor: pointer; transition: all .15s;
      font-family: 'Questrial', sans-serif; text-transform: uppercase; letter-spacing: .5px;
    }
    .pm-cat.active, .pm-cat:hover { background: #fff; color: #000; border-color: #fff; }

    /* Content */
    .pm-content { max-width: 960px; margin: 0 auto; padding: 24px 16px 120px; background: #000; }
    .pm-section-title {
      font-family: 'Anton', sans-serif;
      font-size: 20px; letter-spacing: 1.5px;
      margin: 32px 0 14px; color: #fff;
      text-transform: uppercase;

    .pm-section-title::after { content: ''; flex: 1; height: 1px; background: #222; }

    .pm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

    /* Product card */
    .pm-card {
      background: #161616; border: 1px solid #2a2a2a; border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column;
      transition: border-color .2s, transform .15s;
    }
    .pm-card:hover { border-color: #555; transform: translateY(-2px); }

    .pm-card-img {
      width: 100%; aspect-ratio: 4/3; background: #1e1e1e;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .pm-card-img img { width: 100%; height: 100%; object-fit: cover; image-rendering: auto; display: block; }
    .pm-card-emoji { font-size: 52px; line-height: 1; }

    .pm-card-body { padding: 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .pm-card-name { font-weight: 900; font-size: 15px; margin: 0; color: #fff; }
    .pm-card-desc { font-size: 13px; color: #888; margin: 0; flex: 1; line-height: 1.4; }
    .pm-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .pm-price { font-family: 'Anton', sans-serif; font-size: 22px; color: #f97316; letter-spacing: .5px; }

    .pm-add-btn {
      background: #f97316; color: #000; border: 0; border-radius: 8px;
      width: 38px; height: 38px; font-size: 22px; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center; line-height: 1;
      transition: background .15s, transform .1s; flex-shrink: 0;
    }
    .pm-add-btn:hover { background: #ffe597; transform: scale(1.08); }

    /* FAB */
    .pm-fab {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #f97316; color: #000; border: 0; border-radius: 10px;
      padding: 15px 32px; font-weight: 900; font-size: 15px; cursor: pointer;
      box-shadow: 0 8px 32px rgba(246,146,30,.55);
      display: flex; align-items: center; gap: 10px; z-index: 50;
      white-space: nowrap; transition: transform .15s, background .15s;
      font-family: 'Questrial', sans-serif; letter-spacing: .3px;
    }
    .pm-fab:hover { transform: translateX(-50%) scale(1.04); background: #ffe597; }

    /* Overlay / panels */
    .pm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.85);
      z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    }
    .pm-overlay.hidden { display: none; }

    .pm-checkout-status { border-radius: 12px; padding: 14px 16px; margin: 4px 0 12px; font-weight: 700; line-height: 1.4; }
    .pm-checkout-status.hidden { display: none; }
    .pm-checkout-status.ok { background: rgba(74,222,128,.14); border: 1px solid rgba(74,222,128,.5); color: #4ade80; }
    .pm-checkout-status.err { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.5); color: #f87171; }
    .pm-checkout-status .st-title { font-size: 16px; font-weight: 900; display: block; margin-bottom: 2px; }
    .pm-checkout-status .st-sub { font-size: 12.5px; font-weight: 600; opacity: .9; }

    /* Forma de pagamento no checkout público */
    .pm-pay-block { margin: 14px 0 6px; }
    .pm-pay-title { display: block; font-size: 14px; font-weight: 800; color: #ccc; margin-bottom: 8px; }
    .pm-pay-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pm-pay-opt { position: relative; cursor: pointer; }
    .pm-pay-opt input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
    .pm-pay-opt span { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 12px 6px; border: 1.5px solid #3a3a3a; border-radius: 12px; font-size: 13px; font-weight: 700; color: #ddd; text-align: center; transition: border-color .15s, background .15s; }
    .pm-pay-opt input:checked + span { border-color: #f97316; background: rgba(249,115,22,.12); color: #fff; }
    .pm-pay-hint { font-size: 12px; color: rgba(255,255,255,.5); margin: 8px 0 0; min-height: 15px; }
    .pm-wa-mini { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 10px; padding: 9px; background: transparent; border: none; color: rgba(255,255,255,.55); font-size: 13px; font-weight: 600; cursor: pointer; }
    .pm-wa-mini:hover { color: #25D366; }
    .pm-mesa-banner { background: rgba(249,115,22,.14); border: 1px solid rgba(249,115,22,.5); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #fff; }
    .pm-mesa-banner strong { color: #f97316; }

    .pm-cart-panel, .pm-addon-panel, .pm-checkout-panel {
      background: #161616; border-radius: 20px 20px 0 0;
      width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
      padding: 22px 20px 36px; border-top: 3px solid #f97316;
      font-family: 'Questrial', sans-serif;

    .pm-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .pm-panel-head h2 { margin: 0; font-size: 20px; font-weight: 900; color: #fff; }

    .pm-close-btn {
      background: #2a2a2a; border: 0; border-radius: 50%; width: 36px; height: 36px;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .pm-close-btn:hover { background: #f97316; color: #000; }

    .pm-cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2a2a2a; }
    .pm-cart-item-info { flex: 1; min-width: 0; }
    .pm-cart-item-name { font-weight: 800; font-size: 14px; color: #fff; }
    .pm-cart-item-detail { font-size: 12px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pm-qty { display: flex; align-items: center; gap: 8px; }

    .pm-btn-full {

      font-family: 'Questrial', sans-serif; transition: background .15s;

    .pm-btn-green { background: #f97316; color: #000; }
    .pm-btn-green:hover { background: #ffe597; }
    .pm-btn-ghost { background: #2a2a2a; color: #fff; margin-top: 10px; }
    .pm-btn-ghost:hover { background: #3a3a3a; }

    /* Form fields inside panels */
    .pm-cart-panel label, .pm-checkout-panel label, .pm-addon-panel label { color: #ccc; }
    .pm-cart-panel input, .pm-checkout-panel input, .pm-checkout-panel select,
    .pm-addon-panel input[type=text] {
      background: #111; border: 1.5px solid #333; color: #fff; border-radius: 8px;
      padding: 10px 12px; font-size: 15px; font-family: 'Questrial', sans-serif;

    .pm-cart-panel input:focus, .pm-checkout-panel input:focus, .pm-checkout-panel select:focus {
      border-color: #f97316; outline: none;

    .pm-addon-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
    .pm-addon-item label { cursor: pointer; flex: 1; font-size: 14px; font-weight: 700; color: #fff; }
    .pm-addon-price { font-size: 13px; color: #f97316; font-weight: 700; }
    .pm-addon-item input[type=checkbox] { width: 18px; height: 18px; flex-shrink: 0; accent-color: #f97316; }

    .pm-qty-controls { display: flex; align-items: center; gap: 16px; background: #2a2a2a; border-radius: 30px; padding: 6px 18px; }

    .pm-order-recap { background: #141416; border: 1px solid #2a2a2e; border-radius: 10px; padding: 14px; margin: 16px 0; color: #eee; }
    .pm-recap-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; color: #ccc; }
    .pm-recap-total { border-top: 1px solid #33333a; margin-top: 8px; padding-top: 10px; font-weight: 900; font-size: 16px; color: #fff; }
    .pm-wa-btn {
      width: 100%; padding: 16px; border-radius: 12px; background: #25D366; color: white;
      font-size: 17px; font-weight: 850; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;

    /* WhatsApp badge in comandas */
    .badge-wa {
      display: inline-flex; align-items: center; gap: 4px;
      background: #e6f9ee; color: #0f6b3c; border-radius: 6px;
      padding: 3px 8px; font-size: 11px; font-weight: 850; margin-left: 8px; vertical-align: middle;
    }

    .menu-thumb {
      width: 40px; height: 40px; border-radius: 6px; object-fit: cover;

      width: 40px; height: 40px; border-radius: 6px; display: inline-flex;

    .icon {
      width: 18px;
      height: 18px;

    /* Hamburger button — only on mobile */

      display: none;

      border: none;

      padding: 8px;
      color: #111;
      flex-shrink: 0;
      border-radius: 8px;

      flex-shrink: 0;
      align-items: center;
    }
    .topbar-logo-right svg { display: block; }

    /* Sidebar overlay backdrop */
    .sidebar-backdrop {

  <script>
    // Domínio do cardápio (ex.: cardapiobistro.perspecta.app.br/<restaurante>):
    // transforma o caminho no link do cardápio público ANTES de qualquer render,
    // pra NÃO piscar a tela de login. O nome no caminho vira o "slug" do
    // restaurante — o mesmo definido em Configurações → Nome do cardápio.
    //   cardapiobistro.perspecta.app.br/alianca  →  #cardapio-publico-alianca
    (function () {
      try {
        if (location.hash.indexOf("#cardapio-publico") === 0) return;
        if (!/cardapio/i.test(location.hostname)) return; // só no domínio do cardápio
        var seg = (location.pathname || "").split("/").filter(Boolean)[0] || "";
        var slug = seg.toLowerCase().replace(/[^a-z0-9_-]/g, "");
        history.replaceState(null, "", (location.pathname || "/") + "#cardapio-publico" + (slug ? "-" + slug : ""));
      } catch (e) {}
    })();

    // ─────────────────────────────────────────────────────────────
    //  SENHAS — nunca guardadas/exibidas em texto. Guardamos só o
    //  hash SHA-256 com salt aleatório, no formato "salt$hash".
    //  Verificação retrocompatível: registros antigos ainda têm o
    //  campo `senha` em texto e são convertidos para hash no 1º login.
    // ─────────────────────────────────────────────────────────────
    async function _sha256Hex(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function _randSalt() {
      const a = new Uint8Array(16); crypto.getRandomValues(a);
      return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    // Gera o registro de senha (salt$hash). A senha em texto nunca é guardada.
    async function hashSenha(senha) {
      const salt = _randSalt();
      const hash = await _sha256Hex(salt + ':' + String(senha == null ? '' : senha));
      return salt + '$' + hash;
    }
    // Verifica a senha digitada contra o registro (passHash) ou, em registros
    // antigos, contra a senha em texto (`legacyPlain`). Retorna boolean.
    async function verifyPassHash(senha, passHash) {
      if (typeof passHash !== 'string' || passHash.indexOf('$') < 0) return false;
      const i = passHash.indexOf('$');
      const salt = passHash.slice(0, i), hash = passHash.slice(i + 1);
      const calc = await _sha256Hex(salt + ':' + String(senha == null ? '' : senha));
      return calc === hash;
    }
    // Confere uma credencial (gestor ou empresa): usa hash se existir,
    // senão cai no texto legado (que será convertido em seguida).
    async function credMatches(senha, cred) {
      if (!cred) return false;
      if (cred.passHash) return await verifyPassHash(senha, cred.passHash);
      if (cred.senha != null) return String(senha) === String(cred.senha);
      return false;
    }
    // Converte, no objeto master, toda senha em texto (gestor + empresas)
    // para hash. Persiste no nó master da nuvem (só companies + gestorCredentials,
    // via PATCH, sem tocar no resto do nó). Idempotente.
    async function migrateMasterPasswords(master) {
      let changed = false;
      const gc = master.gestorCredentials || (master.gestorCredentials = { login: "Perspecta" });
      if (!gc.passHash && gc.senha != null) { gc.passHash = await hashSenha(gc.senha); delete gc.senha; changed = true; }
      for (const c of (master.companies || [])) {
        if (c && !c.passHash && c.senha != null) { c.passHash = await hashSenha(c.senha); delete c.senha; c.updatedAt = Date.now(); changed = true; }
      }
      if (changed) {
        saveMasterState(master);
        try {
          const path = fbPath(MASTER_KEY);
          await authedFetch(`${FIREBASE_URL}/data/${path}.json`, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ companies: master.companies || [], gestorCredentials: master.gestorCredentials })
          });
        } catch (e) {}
      }
      return master;
    }
    // Grava só companies + gestorCredentials no nó master da nuvem (PATCH),
    // sem sobrescrever o restante do nó. Usado após mudar/redefinir senha.
    async function patchMasterCreds(master) {
      try {
        const path = fbPath(MASTER_KEY);
        await authedFetch(`${FIREBASE_URL}/data/${path}.json`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },

        });

    }

    // Grava a empresa na NUVEM pelo servidor (firebase-admin), sem depender do

    let _gestorSenhaCache = null;
    async function pushCompanyCloud(company) {

          if (s == null || !String(s).trim()) return { skipped: true };
          _gestorSenhaCache = String(s).trim();
        }
        const master = loadMasterState();
        const gestorLogin = (master.gestorCredentials && master.gestorCredentials.login) || "Perspecta";
        const r = await fetch("https://perspecta-bistro.vercel.app/api/save-company", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gestorLogin, gestorSenha: _gestorSenhaCache, company, gestorCredentials: master.gestorCredentials || null })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { if (r.status === 401) _gestorSenhaCache = null; return { error: d.error || ("erro " + r.status) }; }
        return { ok: true, company: d.company };
      } catch (e) { return { error: String((e && e.message) || e) }; }
    }
