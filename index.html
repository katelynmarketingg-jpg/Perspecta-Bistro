    function compressImage(file, maxW, maxH, quality) {
      return new Promise(resolve => {
        const reader = new FileReader();
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxW / img.width, maxH / img.height);
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          } catch {
            resolve(reader.result);
          }
        };
        img.onerror = () => resolve(reader.result);
        reader.onload = () => {
          if (typeof reader.result === "string" && reader.result.startsWith("data:image/")) img.src = reader.result;
          else resolve(null);
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

        }
        return;
      }

      const resizeHandle = event.target.closest("[data-resize-tables]");
      if (resizeHandle) {
        event.preventDefault();
        event.stopPropagation();
        const tile = resizeHandle.closest(".floor-plan [data-table-id]");
        if (!tile) return;
        tableResize = {
          id: tile.dataset.tableId,
          tile,
          startX: event.clientX,
          startY: event.clientY,
          startSize: tile.offsetWidth || Math.max(108, Math.min(180, num(state.settings.tableTileSize || 118))),
          moved: false,
          freeMode: false
        };
        tile.classList.add("dragging");
        resizeHandle.setPointerCapture?.(event.pointerId);
        return;
      }

      const tile = event.target.closest(".floor-plan [data-table-id]");
      if (!tile) return;
      const plan = tile.closest(".floor-plan");
      const rect = plan.getBoundingClientRect();
      tableDrag = {
        id: tile.dataset.tableId,
        tile,
        plan,
        rect,
        startX: event.clientX,
        startY: event.clientY,
        moved: false
      };
      tile.classList.add("dragging");
      tile.setPointerCapture?.(event.pointerId);
    });

    document.addEventListener("pointermove", event => {
      if (tableResize) {
        const dx = event.clientX - tableResize.startX;
        const dy = event.clientY - tableResize.startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) tableResize.moved = true;
        const nextSize = Math.max(108, Math.min(180, Math.round(tableResize.startSize + Math.max(dx, dy))));
        const table = (state.tables || []).find(t => t.id === tableResize.id);
        if (table) table.tamanho = nextSize;
        document.querySelectorAll(`.floor-plan .table-tile[data-table-id="${tableResize.id}"]`).forEach(tile => {
          tile.style.setProperty("--table-size", `${nextSize}px`);
        });
        document.querySelectorAll(`[data-table-row="${tableResize.id}"] [data-table-size-row]`).forEach(input => {
          input.value = nextSize;
        });
        return;
      }
      if (!tableDrag) return;
      const dx = event.clientX - tableDrag.startX;
      const dy = event.clientY - tableDrag.startY;
      if (Math.abs(dx) + Math.abs(dy) > 4) tableDrag.moved = true;
      const widthPct = (tableDrag.tile.offsetWidth / tableDrag.rect.width) * 100;
      const heightPct = (tableDrag.tile.offsetHeight / tableDrag.rect.height) * 100;
      const left = Math.max(0, Math.min(100 - widthPct, ((event.clientX - tableDrag.rect.left - tableDrag.tile.offsetWidth / 2) / tableDrag.rect.width) * 100));
      const top = Math.max(0, Math.min(100 - heightPct, ((event.clientY - tableDrag.rect.top - tableDrag.tile.offsetHeight / 2) / tableDrag.rect.height) * 100));
      tableDrag.tile.style.left = `${left}%`;
      tableDrag.tile.style.top = `${top}%`;
      const table = (state.tables || []).find(t => t.id === tableDrag.id);
      if (table) { table.x = Number(left.toFixed(1)); table.y = Number(top.toFixed(1)); }
    });

    document.addEventListener("pointerup", () => {
      if (tableResize) {
        if (tableResize.freeMode) return; // modo livre: só sai com clique (pointerdown)
        tableResize.tile.classList.remove("dragging");
        if (tableResize.moved) {
          // Drag completo: salva e sai imediatamente
          suppressTableClick = true;
          localStorage.setItem(storeKey, JSON.stringify(state));
          setTimeout(() => { suppressTableClick = false; }, 150);
          tableResize = null;
        } else {
          // Clique rápido sem arrastar: entra no modo livre
          tableResize.freeMode = true;
          tableResize.tile.classList.add("resizing");
          suppressTableClick = true;
          setTimeout(() => { suppressTableClick = false; }, 150);
        }
        return;
      }
      if (!tableDrag) return;
      tableDrag.tile.classList.remove("dragging");
      if (tableDrag.moved) {
        suppressTableClick = true;
        localStorage.setItem(storeKey, JSON.stringify(state));
        setTimeout(() => { suppressTableClick = false; }, 120);
      }
      tableDrag = null;
    });

    document.addEventListener("submit", event => {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      if (form.id === "costForm") {
        state.costs.push({
          id: uid(),
          produto: data.produto,
          rendimento: data.rendimento,
          margem: data.margem,
          outrosCustos: data.outrosCustos,
          ingredientes: [ingredientFromFormData(data)]
        });
        form.reset();
        save();
      }

      if (form.classList.contains("addIngredientForm")) {
        const recipe = state.costs.find(c => c.id === form.dataset.cost);
        if (recipe) {
          recipe.ingredientes = recipe.ingredientes || [];
          recipe.ingredientes.push(ingredientFromFormData(data));
        }
        form.reset();
        save();
      }

      if (form.classList.contains("costMarginForm")) {
        const recipe = state.costs.find(c => c.id === form.dataset.cost);
        if (recipe) {
          recipe.margem = data.margem;
          recipe.outrosCustos = data.outrosCustos;
          recipe.rendimento = data.rendimento;
        }
        save();
      }

      if (form.id === "expenseForm") {
        state.expenses.push({ id: uid(), ...data });
        form.reset();
        save();
      }

      if (form.id === "cashForm") {
        state.cash = state.cash || [];
        state.cash.push({ id: uid(), ...data, createdAt: new Date().toISOString() });
        form.reset();
        save();
      }

      if (form.id === "openCashForm") {
        state.cashSessions = state.cashSessions || [];
        const existing = currentCashSession();
        if (!existing) {
          const openedAt = new Date().toISOString();
          state.cashSessions.push({ id: uid(), date: todayISO(), status: "aberto", openedAt, openingAmount: num(data.openingAmount), openedBy: data.openedBy || "Caixa", closedAt: "", countedCash: "", difference: "" });
          state.cash = state.cash || [];
          state.cash.push({ id: uid(), tipo: "entrada", descricao: "Abertura de caixa", valor: num(data.openingAmount), forma: "dinheiro", createdAt: openedAt });
        }
        form.reset();
        save();
      }

      if (form.id === "closeCashForm") {
        const session = currentCashSession();
        if (session) {
          const expectedCash = cashToday().filter(r => r.forma === "dinheiro").reduce((s, r) => s + (r.tipo === "saida" ? -num(r.valor) : num(r.valor)), 0);
          session.status = "fechado";
          session.closedAt = new Date().toISOString();
          session.countedCash = num(data.countedCash);
          session.difference = num(data.countedCash) - expectedCash;
        }
        form.reset();
        save();
      }

      if (form.id === "inventoryForm") {
        state.inventory = state.inventory || [];
        const existing = inventoryMatchByName(data.item);
        if (existing) {
          existing.previousCost = existing.custo;
          existing.quantidade = num(existing.quantidade) + num(data.quantidade);
          existing.minimo = data.minimo || existing.minimo;
          existing.unidade = data.unidade || existing.unidade;
          existing.custo = data.custo || existing.custo;
          existing.categoria = data.categoria || existing.categoria;
          existing.fornecedor = data.fornecedor || existing.fornecedor;
          existing.validade = data.validade || existing.validade;
        } else {
          state.inventory.push({ id: uid(), previousCost: data.custo, ...data });
        }
        const movementItem = existing || state.inventory[state.inventory.length - 1];
        state.inventoryMovements = state.inventoryMovements || [];
        state.inventoryMovements.push({ id: uid(), inventoryId: movementItem.id, item: movementItem.item, tipo: "entrada", quantidade: num(data.quantidade), unidade: movementItem.unidade, custo: num(movementItem.custo), motivo: "Entrada de estoque", createdAt: new Date().toISOString() });
        form.reset();
        save();
      }

      if (form.id === "inventoryOutForm") {
        const item = inventoryById(data.inventoryId);
        if (item) {
          const quantity = Math.max(0, num(data.quantidade));
          item.quantidade = Math.max(0, num(item.quantidade) - quantity);
          state.inventoryMovements = state.inventoryMovements || [];
          state.inventoryMovements.push({ id: uid(), inventoryId: item.id, item: item.item, tipo: "saida", quantidade: quantity, unidade: item.unidade, motivo: data.motivo || "Baixa manual", createdAt: new Date().toISOString() });
        }
        form.reset();
        save();
      }

      if (form.id === "companyForm") {
        const master = loadMasterState();
        master.companies = master.companies || [];
        const newCompany = { id: uid(), ...data };
        master.companies.push(newCompany);
        saveMasterState(master);
        // initialize isolated state for this company
        const compKey = "gestaoCompany." + newCompany.id + ".v1";
        const compState = normalizeState({ ...structuredClone(defaultState), settings: { ...defaultState.settings, restaurant: newCompany.nome, whatsapp: newCompany.whatsapp || "" } });
        localStorage.setItem(compKey, JSON.stringify(compState));
        state.companies = master.companies;
        form.reset();
        save();
        showToast("Empresa \"" + newCompany.nome + "\" criada. Login: " + newCompany.login + " / Senha: " + newCompany.senha, 5000);
      }

      if (form.id === "staffForm") {
        state.staff = state.staff || [];
        state.staff.push({ id: uid(), ...data, permissions: ["dashboard", ...formData.getAll("permissions")].filter((value, index, arr) => arr.indexOf(value) === index) });
        form.reset();
        save();
      }

      if (form.id === "clientForm") {
        state.clients.push({ id: uid(), ...data });
        form.reset();
        save();
      }

      if (form.id === "settingsForm") {
        state.settings = { ...state.settings, ...data, defaultMargin: num(data.defaultMargin) };
        save();
      }

      if (form.id === "adminSettingsForm") {
        state.settings = { ...state.settings, ...data };
        save();
      }

      if (form.id === "reportFilterForm" || form.id === "comparisonForm") {
        state.settings = { ...state.settings, ...data };
        save();
      }

      if (form.id === "tableForm") {
        state.tables = state.tables || [];
        state.tables.push({ id: uid(), ...data, tamanho: Math.max(108, Math.min(180, num(data.tamanho || state.settings.tableTileSize || 118))), x: 10 + (state.tables.length % 4) * 22, y: 12 + Math.floor(state.tables.length / 4) * 28 });
        form.reset();
        save();
      }

      if (form.id === "goalForm") {
        state.goals = state.goals || [];
        state.goals.push({ id: uid(), ...data });
        form.reset();
        save();
      }

      if (form.id === "menuForm") {
        const newItem = { id: uid(), foto: null, ...data, preco: num(data.preco), ativo: data.ativo === "true" };
        delete newItem.fotoFile;
        state.menu.push(newItem);
        form.reset();
        const fileInput = form.querySelector('[name="fotoFile"]');
        const file = fileInput?.files?.[0];
        if (file) {
          compressImage(file, 480, 360, 0.78).then(b64 => { newItem.foto = b64; save(); });
        } else {
          save();
        }
      }

      if (form.id === "pmCheckoutForm") {
        const nome = escapeHTML(data.nome || "").trim();
        const tipo = data.tipo || "retirada";
        const referencia = escapeHTML(data.referencia || "").trim();
        if (!nome) return;
        const baseUrl = location.href.split("#")[0].split("?")[0];
        const local = tipo === "tele" ? "Delivery" : "Pedido por link";
        const itemsForComanda = publicCart.map(item => ({
          id: item.id, nome: item.nome, preco: item.preco,
          quantidade: item.quantidade,
          adicionais: item.adicionais || [],
          observacao: item.observacao || ""
        }));
        const payload = { nome, tipo, referencia, itens: itemsForComanda, total: pmCartTotal(), ts: Date.now() };
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        const deepLink = `${baseUrl}?pedido=${encoded}`;
        const lines = publicCart.map(item => {
          const addT = (item.adicionais || []).reduce((s, a) => s + num(a.preco), 0);
          const addNames = (item.adicionais || []).filter(a => a.nome).map(a => `  + ${a.nome}`).join("\n");
          const obs = item.observacao ? `  📝 ${item.observacao}` : "";
          return `• ${item.quantidade}× ${item.nome} — ${money((num(item.preco) + addT) * item.quantidade)}${addNames ? "\n" + addNames : ""}${obs ? "\n" + obs : ""}`;
        }).join("\n");
        const tipoLabel = tipo === "tele" ? `Tele-entrega${referencia ? ` — ${referencia}` : ""}` : "Retirada no local";
        state.commands = state.commands || [];
        state.commands.push({
          id: uid(),
          local,
          cliente: nome,
          pessoas: 1,
          status: "aberta",
          itens: itemsForComanda,
          pagamentos: [],
          createdAt: new Date().toISOString(),
          source: "cardapio-publico",
          referencia
        });
        ensureClientFromCommand(nome);
        localStorage.setItem(storeKey, JSON.stringify(state));
        const msg = `*🍽️ Novo Pedido — ${escapeHTML(state.settings.restaurant)}*\nCliente: ${nome}\nTipo: ${tipoLabel}\n\n📦 *Itens:*\n${lines}\n\n💰 *Total: ${money(pmCartTotal())}*\n\n👉 Criar comanda: ${deepLink}`;
        window.open(whatsappLink(state.settings.whatsapp, msg), "_blank");
        document.getElementById("pmCheckoutOverlay")?.classList.add("hidden");
        publicCart = [];
        updatePmFab();
        showToast("Pedido enviado e criado em Comandas! ✅", 3500);
      }

      if (form.id === "addonForm") {
        state.addons = state.addons || [];
        state.addons.push({ id: uid(), nome: data.nome, preco: num(data.preco), ativo: data.ativo === "true" });
        form.reset();
        save();
      }

      if (form.id === "commandForm") {
        const localTaken = state.commands.find(c => c.status === "aberta" && c.local.toLowerCase() === data.local.toLowerCase());
        if (!localTaken) {
          const clientName = data.cliente || "Avulso";
          state.commands.push({ id: uid(), local: data.local, cliente: clientName, pessoas: Math.max(1, num(data.pessoas || 1)), status: "aberta", itens: [], pagamentos: [], createdAt: new Date().toISOString() });
          ensureClientFromCommand(clientName);
        }
        form.reset();
        save();
        if (localTaken) alert("Já existe uma comanda aberta nesse local.");
      }

      if (form.classList.contains("editCommandForm")) {
        const command = state.commands.find(c => c.id === form.dataset.command);
        const localTaken = state.commands.find(c => c.id !== form.dataset.command && c.status === "aberta" && c.local.toLowerCase() === data.local.toLowerCase());
        if (command && !localTaken) {
          command.local = data.local;
          command.cliente = data.cliente || "Avulso";
          command.pessoas = Math.max(1, num(data.pessoas || 1));
          ensureClientFromCommand(command.cliente);
          save();
        }
        if (localTaken) alert("Já existe uma comanda aberta nesse local.");
      }

      if (form.classList.contains("addItemForm")) {
        const command = state.commands.find(c => c.id === form.dataset.command);
        const item = state.menu.find(m => m.id === data.itemId);
        if (command && item) {
          const selectedAddons = formData.getAll("adicionais")
            .map(id => (state.addons || []).find(addon => addon.id === id))
            .filter(Boolean)
            .map(addon => ({ id: addon.id, nome: addon.nome, preco: num(addon.preco) }));
          command.itens.push({
            id: item.id,
            nome: item.nome,
            preco: item.preco,
            quantidade: Math.max(1, num(data.quantidade)),
            adicionais: selectedAddons,
            observacao: data.observacao || ""
          });
          form.reset();
          save();
        }
      }

      if (form.classList.contains("paymentForm")) {
        const command = state.commands.find(c => c.id === form.dataset.command);
        if (command) {
          if (command.paidAt) {
            alert("Esta comanda já tem pagamento registrado.");
          } else {
            const paidAt = new Date().toISOString();
            const total = commandTotal(command);
            command.paidAt = paidAt;
            command.paymentMethod = data.forma;
            command.paymentAmount = num(data.valor || total);
            state.cash = state.cash || [];
            state.cash.push({ id: uid(), tipo: "entrada", descricao: `Pagamento ${command.local}`, valor: command.paymentAmount, forma: data.forma, createdAt: paidAt });
            save();
          }
        }
      }
    });

    document.addEventListener("input", event => {
      if (event.target.matches("[data-table-size]")) {
        state.settings.tableTileSize = Math.max(108, Math.min(180, num(event.target.value)));
        (state.tables || []).forEach(table => { table.tamanho = state.settings.tableTileSize; });
        localStorage.setItem(storeKey, JSON.stringify(state));
        document.querySelectorAll(".floor-plan .table-tile").forEach(tile => {
          tile.style.setProperty("--table-size", `${state.settings.tableTileSize}px`);
        });
        document.querySelectorAll("[data-table-size-row]").forEach(input => {
          input.value = state.settings.tableTileSize;
        });
      }
    });

    document.addEventListener("blur", event => {
      const renameId = event.target.dataset.renameTable;
      if (!renameId) return;
      const table = (state.tables || []).find(t => t.id === renameId);
      const newName = event.target.value.trim();
      if (table && newName && newName !== table.nome) {
        table.nome = newName;
        save();
      } else if (!newName) {
        event.target.value = table?.nome || "";
      }
    }, true);

    document.addEventListener("keydown", event => {
      if (event.key === "Enter" && event.target.dataset.renameTable) {
        event.target.blur();
      }
    });

    document.addEventListener("change", event => {
      if (event.target.matches("[data-active-tables-only]")) {
        state.settings.tableOnlyActive = event.target.checked;
        save();
      }

      // ── Tipo de pedido no checkout público ──
      if (event.target.id === "pmTipoSelect") {
        const wrap = document.getElementById("pmReferenceWrap");
        const label = document.getElementById("pmReferenceLabel");
        const input = document.getElementById("pmReferenceInput");
        if (!wrap || !label || !input) return;
        const tipo = event.target.value;
        if (tipo === "retirada") {
          wrap.classList.add("hidden");
          input.required = false;
        } else {
          wrap.classList.remove("hidden");
          label.childNodes[0].textContent = "Endereço de entrega";
          input.placeholder = "Rua, número, bairro";
          input.required = true;
        }
      }

      // ── Upload logo do cardápio ──
      // ── Upload logo Perspecta (sidebar) ──
      if (event.target.id === "perspectaLogoInput" && event.target.files?.[0]) {
        compressImage(event.target.files[0], 400, 400, 0.92).then(b64 => {
          state.settings.perspectaLogo = b64;
          save();
          renderBrand();
          renderDataTools();
          showToast("Logo da plataforma atualizado! ✅", 2500);
        });
      }

      if (event.target.id === "logoUploadInput" && event.target.files?.[0]) {
        compressImage(event.target.files[0], 600, 300, 0.9).then(b64 => {
          state.settings.logoUrl = b64;
          save();
          renderMenuAdmin();
          showToast("Logo salvo!", 2000);
        });
      }

      // ── Troca foto de item existente ──
      const photoMenu = event.target.dataset.photoMenu;
      if (photoMenu && event.target.type === "file") {
        const file = event.target.files?.[0];
        if (!file) return;
        const row = event.target.closest("[data-menu-row]");
        const preview = row?.querySelector("[data-menu-photo-preview]");
        const pending = row?.querySelector("[data-photo-pending]");
        if (!row || !preview) return;
        compressImage(file, 480, 360, 0.78).then(b64 => {
          if (!b64) {
            showToast("Não consegui ler essa foto. Tente outra imagem.", 3000);
            return;
          }
          const item = state.menu.find(x => x.id === photoMenu);
          if (!item) return;
          preview.dataset.pendingPhoto = b64;
          preview.innerHTML = `<img class="menu-thumb" src="${b64}" alt="Prévia da foto">`;
          pending?.classList.remove("hidden");
          saveMenuRow(row, item);
          save();
          showToast("Foto salva e atualizada no cardápio público.", 2600);
        });
      }
    });

    window.addEventListener("hashchange", () => {
      if (location.hash.startsWith("#cardapio-publico")) {
        document.getElementById("internalApp").classList.add("hidden");
        document.getElementById("publicMenu").classList.remove("hidden");
        renderPublicMenu();
      } else {
        document.getElementById("internalApp").classList.remove("hidden");
        document.getElementById("publicMenu").classList.add("hidden");
        const target = location.hash.replace("#", "") || "dashboard";
        if (document.getElementById(target)?.classList.contains("section")) setSection(target);
      }
    });

    window.addEventListener("storage", event => {
      if (event.key !== storeKey) return;
      state = loadState();
      if (location.hash.startsWith("#cardapio-publico")) renderPublicMenu();
      else renderAll();
    });

    // ── App boot: check session, show login or start ──
    (function boot() {
      const pub = location.hash.startsWith("#cardapio-publico");
      if (pub) { startApp(); return; }

      // deep link pedido?
      const pedidoParam = new URLSearchParams(location.search).get("pedido");

      try {
        const saved = sessionStorage.getItem("perspectaSession");
        if (saved) {
          const sess = JSON.parse(saved);
          currentSession = sess;
          if (sess.type === "gestor") {
            storeKey = MASTER_KEY;
            const master = loadMasterState();
            state = normalizeState({ ...structuredClone(defaultState), ...master });
          } else if (sess.type === "company") {
            storeKey = "gestaoCompany." + sess.company.id + ".v1";
            state = loadState();
          }
          hideLogin();
          document.getElementById("internalApp").classList.remove("hidden");
          renderAll();
          if (pedidoParam) {
            try {
              const deepLinkOrder = JSON.parse(decodeURIComponent(escape(atob(pedidoParam))));
              history.replaceState(null, "", location.pathname + location.hash);
              state.commands.push({ id: uid(), local: deepLinkOrder.tipo === "tele" ? "Delivery" : "Pedido por link", cliente: deepLinkOrder.nome || "WhatsApp", pessoas: 1, status: "aberta", itens: deepLinkOrder.itens || [], pagamentos: [], createdAt: new Date().toISOString(), source: "whatsapp", referencia: deepLinkOrder.referencia || "" });
              save();
              setSection("comandas");
              showToast("✅ Pedido de \"" + deepLinkOrder.nome + "\" criado em Comandas!");
            } catch {}
          } else {
            const start = location.hash.replace("#", "");
            if (start && document.getElementById(start)?.classList.contains("section")) setSection(start);
          }
          return;
        }
      } catch {}
      showLogin();
    })();
  </script>
</body>
</html>
