    function applyKanbanDrop(commandId, targetCol) {
      const command = state.commands.find(c => c.id === commandId);
      if (!command) return;
      const now = new Date().toISOString();
      if (targetCol === "montando" || targetCol === "feito") {
        command.kitchenSentAt = null; command.readyAt = null; command.dispatchedAt = null; command.deliveredAt = null; command.paidAt = null;
      } else if (targetCol === "cozinha") {
        command.kitchenSentAt = command.kitchenSentAt || now;
        command.readyAt = null; command.dispatchedAt = null; command.deliveredAt = null; command.paidAt = null;
      } else if (targetCol === "pronto") {
        command.kitchenSentAt = command.kitchenSentAt || now;
        command.readyAt = command.readyAt || now;
        command.dispatchedAt = null; command.deliveredAt = null; command.paidAt = null;
      } else if (targetCol === "saiu") {
        command.kitchenSentAt = command.kitchenSentAt || now;
        command.readyAt = command.readyAt || now;
        command.dispatchedAt = command.dispatchedAt || now;
        command.deliveredAt = null; command.paidAt = null;
      } else if (targetCol === "entregue") {
        command.kitchenSentAt = command.kitchenSentAt || now;
        command.readyAt = command.readyAt || now;
        command.deliveredAt = command.deliveredAt || now;
        command.paidAt = null;
      } else if (targetCol === "pago") {
        command.kitchenSentAt = command.kitchenSentAt || now;
        command.deliveredAt = command.deliveredAt || now;
        command.paidAt = command.paidAt || now;
        command.paymentMethod = command.paymentMethod || "dinheiro";
        command.paymentAmount = command.paymentAmount || commandTotal(command);
      }
      save(); renderCommands();
    }

    // Arrastar comanda entre colunas — baseado em PONTEIRO (funciona no mouse E no toque).
    // Pega o card em qualquer lugar (menos nos controles), mostra um "fantasma" seguindo
    // o cursor/dedo e solta na coluna sob ele.
    function _colUnder(x, y) {
      const el = document.elementFromPoint(x, y);
      return el && el.closest("[data-drop-col]");
    }
    document.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      const card = e.target.closest(".kanban-card[data-drag-id]");
      if (!card) return;
      // não inicia arraste se a pessoa tocou num controle (botão, seletor, barra de status…)
      if (e.target.closest("button, select, input, a, .csel, .csel-trigger, .csel-opt, .csel-drop, [data-step-advance]")) return;
      _pdrag = { id: card.dataset.dragId, card, x0: e.clientX, y0: e.clientY, started: false, ghost: null, offX: 0, offY: 0, pid: e.pointerId };
    });
    document.addEventListener("pointermove", e => {
      if (!_pdrag) return;
      const dx = e.clientX - _pdrag.x0, dy = e.clientY - _pdrag.y0;
      if (!_pdrag.started) {
        if (Math.hypot(dx, dy) < 6) return; // movimento mínimo para diferenciar de um clique
        _pdrag.started = true;
        const r = _pdrag.card.getBoundingClientRect();
        _pdrag.offX = _pdrag.x0 - r.left;
        _pdrag.offY = _pdrag.y0 - r.top;
        const g = _pdrag.card.cloneNode(true);
        g.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;margin:0;pointer-events:none;opacity:.92;z-index:99999;transform:rotate(2deg);box-shadow:0 14px 34px rgba(0,0,0,.28)`;
        document.body.appendChild(g);
        _pdrag.ghost = g;
        _pdrag.card.style.opacity = "0.3";
        document.body.style.userSelect = "none";
        try { _pdrag.card.setPointerCapture(e.pointerId); } catch (_) {}
      }
      _pdrag.ghost.style.left = (e.clientX - _pdrag.offX) + "px";
      _pdrag.ghost.style.top = (e.clientY - _pdrag.offY) + "px";
      _pdrag.ghost.style.display = "none";
      const col = _colUnder(e.clientX, e.clientY);
      _pdrag.ghost.style.display = "";
      document.querySelectorAll(".kanban-col.drag-over").forEach(c => c.classList.remove("drag-over"));
      if (col) col.classList.add("drag-over");
      e.preventDefault();
    }, { passive: false });
    function _endPdrag(e, doDrop) {
      const d = _pdrag; _pdrag = null;
      document.body.style.userSelect = "";
      document.querySelectorAll(".kanban-col.drag-over").forEach(c => c.classList.remove("drag-over"));
      if (!d) return;
      if (d.card) d.card.style.opacity = "";
      if (!d.started) { if (d.ghost) d.ghost.remove(); return; }
      let col = null;
      if (doDrop && e) { if (d.ghost) d.ghost.style.display = "none"; col = _colUnder(e.clientX, e.clientY); }
      if (d.ghost) d.ghost.remove();
      _justDragged = true; setTimeout(() => { _justDragged = false; }, 300); // evita abrir o modal após arrastar
      if (col) applyKanbanDrop(d.id, col.dataset.dropCol);
    }
    document.addEventListener("pointerup", e => _endPdrag(e, true));
    document.addEventListener("pointercancel", e => _endPdrag(e, false));

    document.addEventListener("click", async event => {
      if (suppressTableClick && event.target.closest("[data-open-table]")) {
        event.preventDefault();
        return;
      }
      if (event.target.closest("[data-resize-tables]")) {
        event.preventDefault();
        return;
      }

      const section = event.target.closest("[data-section]")?.dataset.section;
      if (section) { setSection(section); closeSidebar(); }

      const delCost = event.target.closest("[data-delete-cost]")?.dataset.deleteCost;
      if (delCost) { state.costs = state.costs.filter(x => x.id !== delCost); save(); }

      const delIngredient = event.target.closest("[data-delete-ingredient]")?.dataset.deleteIngredient;
      if (delIngredient) {
        const [costId, index] = delIngredient.split(":");
        const recipe = state.costs.find(x => x.id === costId);
        if (recipe) recipe.ingredientes.splice(Number(index), 1);
        _editIngred = null;
        save();
      }

      // ── Editar ingrediente da ficha (quantidade, unidade, perda %) ──
      const editIng = event.target.closest("[data-edit-ingredient]")?.dataset.editIngredient;
      if (editIng) { _editIngred = editIng; renderCosts("produto"); renderCosts("insumo"); }
      if (event.target.closest("[data-cancel-ingredient]")) { _editIngred = null; renderCosts("produto"); renderCosts("insumo"); }
      const saveIng = event.target.closest("[data-save-ingredient]")?.dataset.saveIngredient;
      if (saveIng) {
        const [costId, idx] = saveIng.split(":");
        const recipe = state.costs.find(x => x.id === costId);
        const row = event.target.closest("[data-ingred-row]");
        const ing = recipe && recipe.ingredientes[Number(idx)];
        if (ing && row) {
          const g = f => row.querySelector(`[data-ingred-edit="${f}"]`);
          ing.quantidadeUsada = num(g("quantidadeUsada")?.value);
          ing.unidadeUsada = g("unidadeUsada")?.value || ing.unidadeUsada;
          ing.perda = Math.max(0, Math.min(99, num(g("perda")?.value)));
          ing.aumento = Math.max(0, num(g("aumento")?.value));
          _editIngred = null;
          save();
          showToast("Ingrediente atualizado.", 2000);
        }
      }

      const cmdView = event.target.closest("[data-cmd-view]")?.dataset.cmdView;
      if (cmdView) {
        state.commandViewMode = cmdView;
        save();
        renderCommands();
      }

      const payKanban = event.target.closest("[data-pay-kanban]")?.dataset.payKanban;
      if (payKanban) {
        const command = state.commands.find(c => c.id === payKanban);
        if (command && !command.paidAt) {
          const sel = document.querySelector(`[data-kb-pay-method="${payKanban}"]`) || document.querySelector(`input[name="_kbpay_${payKanban}"]`);
          const method = sel ? sel.value : "dinheiro";
          command.paidAt = new Date().toISOString();
          command.paymentMethod = method;
          command.paymentAmount = commandTotal(command);
          registerCashSale(command);
          save();
          renderCommands();
        }
      }

      // Pagamento rápido no card da comanda: Pix / Cartão → já vira "pago".
      const quickPay = event.target.closest("[data-quick-pay]")?.dataset.quickPay;
      if (quickPay) {
        const [cid, method] = quickPay.split(":");
        const command = state.commands.find(c => c.id === cid);
        if (command && !command.paidAt) {
          command.paidAt = new Date().toISOString();
          command.paymentMethod = method === "cartao" ? "Cartão" : "Pix";
          command.paymentAmount = commandTotal(command);
          registerCashSale(command);
          save();
          renderCommands();
          showToast(`Pagamento em ${command.paymentMethod} registrado ✅`, 2500);
        }
      }

      // "Pagar": revela as formas de pagamento (Pix/Cartão/Dinheiro) no mesmo card.
      const payToggle = event.target.closest("[data-pay-toggle]")?.dataset.payToggle;
      if (payToggle) {
        const card = event.target.closest(".command-card") || document;
        const box = card.querySelector(`[data-pay-box="${payToggle}"]`);
        if (box) box.classList.toggle("hidden");
        return;
      }

      // Seletor visual de itens: tocar no item adiciona 1 à comanda (soma se repetir).
      const addMenuItem = event.target.closest("[data-add-menu-item]")?.dataset.addMenuItem;
      if (addMenuItem) {
        const [cid, iid] = addMenuItem.split(":");
        const command = state.commands.find(c => c.id === cid);
        const item = state.menu.find(m => m.id === iid);
        if (command && item) {
          const same = command.itens.find(x => x.id === item.id && !x.observacao && !(x.adicionais && x.adicionais.length));
          if (same) same.quantidade = num(same.quantidade) + 1;
          else command.itens.push({ id: item.id, nome: item.nome, preco: item.preco, quantidade: 1, adicionais: [], observacao: "" });
          save();
          renderCommands();
          // Mantém o seletor de itens ABERTO pra adicionar vários rapidinho
          // (o renderCommands recria o card e o <details> fecharia sozinho).
          document.querySelectorAll(`.command-card [data-add-menu-item^="${cid}:"]`).forEach(btn => {
            const fold = btn.closest(".add-item-fold");
            if (fold) fold.open = true;
          });
          showToast(`+1 ${item.nome}`, 1200);
        }
        return;
      }

      // Dinheiro: abre o painel de valor recebido / troco (no mesmo card clicado).
      const cashPayBtn = event.target.closest("[data-cash-pay]");
      if (cashPayBtn) {
        const card = cashPayBtn.closest(".command-card") || document;
        const panel = card.querySelector(`[data-cash-panel="${cashPayBtn.dataset.cashPay}"]`);
        if (panel) {
          panel.classList.toggle("hidden");
          if (!panel.classList.contains("hidden")) panel.querySelector("[data-cash-received]")?.focus();
        }
      }

      // Confirma pagamento em dinheiro (com troco).
      const confirmBtn = event.target.closest("[data-confirm-cash]");
      const confirmCash = confirmBtn?.dataset.confirmCash;
      if (confirmCash) {
        const command = state.commands.find(c => c.id === confirmCash);
        if (command && !command.paidAt) {
          const total = commandTotal(command);
          const card = confirmBtn.closest(".command-card") || document;
          const inp = card.querySelector(`[data-cash-received="${confirmCash}"]`);
          const recebido = num(inp && inp.value);
          if (recebido && recebido < total) { showToast(`Valor recebido menor que o total (${money(total)}).`, 3500); return; }
          command.paidAt = new Date().toISOString();
          command.paymentMethod = "Dinheiro";
          command.paymentAmount = total;
          if (recebido > total) command.troco = recebido - total;
          if (recebido) command.recebido = recebido;
          registerCashSale(command);
          save();
          renderCommands();
          showToast(command.troco ? `Pago em dinheiro ✅ Troco: ${money(command.troco)}` : "Pago em dinheiro ✅", 3500);
        }
      }

      const openTable = event.target.closest("[data-open-table]")?.dataset.openTable;
      if (openTable) {
        const existing = state.commands.find(c => c.status === "aberta" && c.local.toLowerCase() === openTable.toLowerCase());
        const explicitOpen = Boolean(event.target.closest("[data-open-table]")?.hasAttribute("data-open-btn"));
        // No Salão: seleciona a mesa e mostra a comanda ao lado (só cria comanda ao clicar "Abrir comanda").
        if (activeSection() === "mesas" || activeSection() === "comandas") {
          salaoSel = openTable;
          if (existing && existing.qrNewAt) existing.qrNewAt = null; // abriu a mesa → apaga o círculo azul
          if (!existing && explicitOpen) state.commands.push({ id: uid(), local: openTable, cliente: "", pessoas: 1, status: "aberta", itens: [], pagamentos: [], createdAt: new Date().toISOString() });
          save();
        } else {
          if (!existing) state.commands.push({ id: uid(), local: openTable, cliente: "", pessoas: 1, status: "aberta", itens: [], pagamentos: [], createdAt: new Date().toISOString() });
          setSection("comandas");
          save();

      const quickCommand = event.target.closest("[data-quick-command]")?.dataset.quickCommand;

          state.commands.push({ id: uid(), local: quickCommand, cliente: "Avulso", pessoas: 1, status: "aberta", itens: [], pagamentos: [], createdAt: new Date().toISOString() });

      const delExpense = event.target.closest("[data-delete-expense]")?.dataset.deleteExpense;

      const closeMonth = event.target.closest("[data-close-month]")?.dataset.closeMonth;

          state.settings.monthlyClose = state.settings.monthlyClose || {};
          state.settings.monthlyClose[mc.ym] = { saldoFinal: mc.sobra, vendas: mc.vendas, despesas: mc.despesas, receitas: mc.receitas, saldoAnterior: mc.saldoAnterior, closedAt: new Date().toISOString() };
          save();
          showToast(`✅ ${mc.ym} fechado · sobrou ${money(mc.sobra)}`);
        }
      }

      const delCash = event.target.closest("[data-delete-cash]")?.dataset.deleteCash;
      if (delCash) { state.cash = (state.cash || []).filter(x => x.id !== delCash); save(); }

      const delClient = event.target.closest("[data-delete-client]")?.dataset.deleteClient;
      if (delClient) { state.clients = state.clients.filter(x => x.id !== delClient); save(); }

      const delMenu = event.target.closest("[data-delete-menu]")?.dataset.deleteMenu;
      if (delMenu) { deletePhotoEverywhere(delMenu); state.menu = state.menu.filter(x => x.id !== delMenu); save(); }

      const delAddon = event.target.closest("[data-delete-addon]")?.dataset.deleteAddon;
      if (delAddon) { state.addons = (state.addons || []).filter(x => x.id !== delAddon); save(); }

      const delZone = event.target.closest("[data-delete-zone]")?.dataset.deleteZone;
      if (delZone) { state.settings.deliveryZones = (state.settings.deliveryZones || []).filter(z => z.id !== delZone); save(); renderDataTools(); }

      const clearMenuPhoto = event.target.closest("[data-clear-menu-photo]")?.dataset.clearMenuPhoto;
      if (clearMenuPhoto) {
        const item = state.menu.find(x => x.id === clearMenuPhoto);
        if (item) {
          deletePhotoEverywhere(item.id);
          item.foto = null; item.photoUpload = false; item.photoTag = null;
          save();
          showToast("Foto removida.", 2500);
        }
      }

      const delInventory = event.target.closest("[data-delete-inventory]")?.dataset.deleteInventory;
      if (delInventory) { state.inventory = (state.inventory || []).filter(x => x.id !== delInventory); save(); }

      // ── Editar insumo do estoque (inline) ──
      const editInv = event.target.closest("[data-edit-inventory]")?.dataset.editInventory;
      if (editInv) { _editInvId = editInv; _addStockId = null; renderInventory(); }
      if (event.target.closest("[data-cancel-inv-edit]")) { _editInvId = null; renderInventory(); }
      const saveInv = event.target.closest("[data-save-inventory]")?.dataset.saveInventory;
      if (saveInv) {
        const it = (state.inventory || []).find(x => x.id === saveInv);
        const row = event.target.closest("[data-inv-row]");
        if (it && row) {
          const g = f => row.querySelector(`[data-inv-edit="${f}"]`);
          const nome = (g("item")?.value || "").trim();
          if (nome) it.item = nome;
          const novoCusto = num(g("custo")?.value);
          if (novoCusto !== num(it.custo)) it.previousCost = it.custo;
          it.quantidade = num(g("quantidade")?.value);
          it.minimo = num(g("minimo")?.value);
          it.unidade = g("unidade")?.value || it.unidade;
          it.custo = novoCusto;
          it.fornecedor = (g("fornecedor")?.value || "").trim();
          _editInvId = null;
          save();
          showToast("Insumo atualizado.", 2000);
        }
      }

      // ── Adicionar ao estoque com custo médio ponderado ──
      const addStockOpen = event.target.closest("[data-add-stock]")?.dataset.addStock;
      if (addStockOpen) { _addStockId = addStockOpen; _editInvId = null; renderInventory(); }
      if (event.target.closest("[data-cancel-addstock]")) { _addStockId = null; renderInventory(); }
      const saveAddStock = event.target.closest("[data-save-addstock]")?.dataset.saveAddstock;
      if (saveAddStock) {
        const it = (state.inventory || []).find(x => x.id === saveAddStock);
        const row = event.target.closest("[data-addstock-row]");
        if (it && row) {
          const q1 = num(row.querySelector('[data-addstock="qtd"]')?.value);
          const v1 = num(row.querySelector('[data-addstock="valor"]')?.value);
          if (q1 <= 0) {
            showToast("Informe a quantidade comprada.", 3000);
          } else {
            const q0 = num(it.quantidade), c0 = num(it.custo);
            const newQty = q0 + q1;
            it.previousCost = c0;
            it.quantidade = newQty;
            it.custo = newQty > 0 ? (q0 * c0 + v1) / newQty : it.custo; // custo médio ponderado
            const unitNew = q1 > 0 ? v1 / q1 : 0;
            const at = new Date().toISOString();
            state.inventoryMovements = state.inventoryMovements || [];
            state.inventoryMovements.push({ id: uid(), inventoryId: it.id, item: it.item, tipo: "entrada", quantidade: q1, unidade: it.unidade, custo: unitNew, motivo: "Compra (custo médio)", createdAt: at });
            state.inventoryBatches = state.inventoryBatches || [];
            state.inventoryBatches.push({ id: uid(), inventoryId: it.id, item: it.item, quantidadeInicial: q1, quantidadeRestante: q1, custo: unitNew, unidade: it.unidade, createdAt: at });
            _addStockId = null;
            save();
            showToast(`Estoque atualizado: ${newQty.toLocaleString("pt-BR",{maximumFractionDigits:3})} ${it.unidade} · custo médio ${money(it.custo)}`, 3800);
          }
        }
      }

      const delTable = event.target.closest("[data-delete-table]")?.dataset.deleteTable;
      if (delTable) { state.tables = (state.tables || []).filter(x => x.id !== delTable); save(); }

      const saveMenuOrder = event.target.closest("[data-save-menu-order]")?.dataset.saveMenuOrder;
      if (saveMenuOrder) {
        const rows = normalizeMenuOrder(state.settings.menuOrder);
        state.settings.menuOrder = rows.map(item => {
          const orderInput = document.querySelector(`[data-menu-order="${item.id}"]`);
          const visibleInput = document.querySelector(`[data-menu-visible="${item.id}"]`);
          const locked = item.id === "dashboard" || item.id === "dados";
          return {
            ...item,
            order: orderInput ? Math.max(1, num(orderInput.value)) : item.order,
            visible: locked ? true : visibleInput ? visibleInput.checked : item.visible
          };
        });
        save();
      }

      const reportPeriod = event.target.closest("[data-report-period]")?.dataset.reportPeriod;
      if (reportPeriod) {
        const range = periodRange(reportPeriod);
        state.settings.reportStart = range.start;
        state.settings.reportEnd = range.end;
        state.settings.reportWeekday = range.weekday;
        save();
      }

      const saveMenuItem = event.target.closest("[data-save-menu]")?.dataset.saveMenu;
      if (saveMenuItem) {
        const row = event.target.closest("[data-menu-row]");
        const item = state.menu.find(x => x.id === saveMenuItem);
        if (row && item) {
          saveMenuRow(row, item);
          save();
        }
      }

      if (event.target.id === "saveMenuBatch") {
        document.querySelectorAll("[data-menu-row]").forEach(row => {
          const item = state.menu.find(x => x.id === row.dataset.menuRow);
          saveMenuRow(row, item);
        });
        save();
        showToast("Cardápio salvo em lote!", 2200);
      }

      const saveAddon = event.target.closest("[data-save-addon]")?.dataset.saveAddon;
      if (saveAddon) {
        const row = event.target.closest("[data-addon-row]");
        const addon = (state.addons || []).find(x => x.id === saveAddon);
        if (row && addon) {
          addon.nome = row.querySelector("[data-edit-addon-name]").value;
          addon.preco = num(row.querySelector("[data-edit-addon-price]").value);
          addon.ativo = row.querySelector("[data-edit-addon-active]").value === "true";
          save();
        }
      }


      const delCompany = event.target.closest("[data-delete-company]")?.dataset.deleteCompany;
      if (delCompany) { const master = loadMasterState(); master.companies = (master.companies || []).filter(x => x.id !== delCompany); saveMasterState(master); state.companies = master.companies; localStorage.removeItem("gestaoCompany." + delCompany + ".v1"); save(); }

      const resetCompany = event.target.closest("[data-reset-company]")?.dataset.resetCompany;
      if (resetCompany) {
        const nova = prompt("Nova senha para esta empresa (o cliente vai usar esta senha para entrar):");
        if (nova && nova.trim()) {
          (async () => {
            const master = loadMasterState();
            const co = (master.companies || []).find(x => x.id === resetCompany);
            if (co) {
              co.passHash = await hashSenha(nova.trim());
              delete co.senha;
              co.updatedAt = Date.now();
              saveMasterState(master);
              state.companies = master.companies;
              await patchMasterCreds(master);
              const _cloud = await pushCompanyCloud(co);
              const _msg = _cloud && _cloud.ok ? " ✅ (funciona em qualquer aparelho)" : (_cloud && _cloud.error ? " ⚠️ não sincronizou na nuvem (" + _cloud.error + ")" : "");
              showToast("✅ Senha redefinida. Repasse ao cliente: \"" + nova.trim() + "\"" + _msg, 6000);
              renderCompanies();
            }
          })();
        }
      }

      const resetGestor = event.target.closest("[data-reset-gestor]");
      if (resetGestor) {
        const nova = prompt("Nova senha do gestor:");
        if (nova && nova.trim()) {
          (async () => {
            const master = loadMasterState();
            master.gestorCredentials = master.gestorCredentials || { login: "Perspecta" };
            master.gestorCredentials.passHash = await hashSenha(nova.trim());
            delete master.gestorCredentials.senha;
            saveMasterState(master);
            if (state.gestorCredentials) { state.gestorCredentials.passHash = master.gestorCredentials.passHash; delete state.gestorCredentials.senha; }
            await patchMasterCreds(master);
            showToast("✅ Senha do gestor redefinida.", 3000);
          })();
        }
      }

      const delStaff = event.target.closest("[data-delete-staff]")?.dataset.deleteStaff;
      if (delStaff) { state.staff = (state.staff || []).filter(x => x.id !== delStaff); save(); }

      const saveStaffPermissions = event.target.closest("[data-save-staff-permissions]")?.dataset.saveStaffPermissions;
      if (saveStaffPermissions) {
        const row = event.target.closest("tr");
        const person = (state.staff || []).find(x => x.id === saveStaffPermissions);
        if (row && person) {
          person.permissions = ["dashboard", ...Array.from(row.querySelectorAll('input[name="permissions"]:checked')).map(input => input.value)]
            .filter((value, index, arr) => arr.indexOf(value) === index);
          save();
        }
      }

      // ── Staff card edit toggle ──
      const toggleStaffEdit = event.target.closest("[data-toggle-staff-edit]")?.dataset.toggleStaffEdit;
      if (toggleStaffEdit) {
        const card = document.querySelector(`[data-staff-card="${toggleStaffEdit}"]`);
        if (card) {
          card.querySelector(".staffInfoForm").classList.toggle("hidden");
          card.querySelector(`[data-staff-view]`).classList.toggle("hidden");
        }
      }
      // ── Imprimir cupom do cliente ──
      const printReceipt = event.target.closest("[data-print-receipt]")?.dataset.printReceipt;
      if (printReceipt) {
        const cmd = state.commands.find(c => c.id === printReceipt) || state.sales.find(s => s.id === printReceipt);
        if (cmd) printCustomerReceipt(cmd);
      }

      // ── Emitir NFC-e ──
      const emitirNfce = event.target.closest("[data-emitir-nfce]")?.dataset.emitirNfce;
      if (emitirNfce) emitirNFCe(emitirNfce);

      const cancelStaffEdit = event.target.closest("[data-cancel-staff-edit]")?.dataset.cancelStaffEdit;
      if (cancelStaffEdit) {
        const card = document.querySelector(`[data-staff-card="${cancelStaffEdit}"]`);
        if (card) {
          card.querySelector(".staffInfoForm").classList.add("hidden");
          card.querySelector(`[data-staff-view]`).classList.remove("hidden");
        }
      }

      const delGoal = event.target.closest("[data-delete-goal]")?.dataset.deleteGoal;
      if (delGoal) { state.goals = (state.goals || []).filter(x => x.id !== delGoal); save(); }

      const openCompany = event.target.closest("[data-open-company]")?.dataset.openCompany;
      if (openCompany) {
        const company = (state.companies || []).find(x => x.id === openCompany);
        if (company) {
          // Switch gestor into a read/write proxy session for this company
          currentSession = { type: "gestor-proxy", company };
          sessionStorage.setItem("perspectaSession", JSON.stringify(currentSession));
          storeKey = "gestaoCompany." + company.id + ".v1";
          state = loadState();
          renderAll();
          setSection("dashboard");
          showToast("📂 Acessando: " + company.nome, 2200);
        }
      }

      const toggleMenu = event.target.closest("[data-toggle-menu]")?.dataset.toggleMenu;
      if (toggleMenu) { const item = state.menu.find(x => x.id === toggleMenu); if (item) item.ativo = !item.ativo; save(); }

      const toggleAddon = event.target.closest("[data-toggle-addon]")?.dataset.toggleAddon;
      if (toggleAddon) { const addon = (state.addons || []).find(x => x.id === toggleAddon); if (addon) addon.ativo = !addon.ativo; save(); }

      // ── Kanban card → open full command modal ──
      // ── QR das mesas ──
      if (event.target.closest("[data-open-qr]")) { showTableQRCodes(); return; }
      if (event.target.id === "qrModalClose" || event.target.id === "qrModal") { document.getElementById("qrModal")?.classList.add("hidden"); return; }
      if (event.target.id === "qrPrintBtn") {
        const grid = document.getElementById("qrPrintArea");
        if (grid) {
          const w = window.open("", "_blank");
          if (w) {
            w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>QR das mesas</title><style>@page{size:A4;margin:12mm}body{font-family:system-ui,sans-serif;margin:0}.qr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10mm}.qr-card{border:1px dashed #bbb;border-radius:10px;padding:10px;text-align:center;page-break-inside:avoid}.qr-card img{width:100%;max-width:150px;height:auto}.qr-name{font-weight:800;font-size:18px}.qr-hint{font-size:12px;color:#555;margin-top:6px}.qr-brand{font-size:11px;color:#999;margin-top:2px}</style></head><body><div class="qr-grid">${grid.innerHTML}</div></body></html>`);
            w.document.close(); w.focus();
            setTimeout(() => { try { w.print(); } catch (e) {} }, 400);
          }
        }
        return;
      }

      if (event.target.id === "kbModalClose" || event.target.id === "kbModal") {
        closeKbModal();
      } else {
        const openKb = event.target.closest("[data-open-kb]")?.dataset.openKb;
        if (!_justDragged && openKb && !event.target.closest("button, .csel-trigger, .csel-opt, .csel-drop, .csel, [data-step-advance]")) {
          showKbModal(openKb);
        }
      }

      const removeItem = event.target.closest("[data-remove-item]")?.dataset.removeItem;
      if (removeItem) {
        const [commandId, index] = removeItem.split(":");
        const command = state.commands.find(c => c.id === commandId);
        if (command) command.itens.splice(Number(index), 1);
        save();
      }

      // Salvar edição do item (quantidade + observação)
      const saveItem = event.target.closest("[data-save-item]")?.dataset.saveItem;
      if (saveItem) {
        const [commandId, index] = saveItem.split(":");
        const command = state.commands.find(c => c.id === commandId);
        const fold = event.target.closest(".line-item-fold");
        if (command && command.itens[Number(index)] && fold) {
          const q = Math.max(1, num(fold.querySelector("[data-edit-item-qty]")?.value) || 1);
          const o = (fold.querySelector("[data-edit-item-obs]")?.value || "").trim();
          command.itens[Number(index)].quantidade = q;
          command.itens[Number(index)].observacao = o;
          save();
          showToast("Item atualizado ✓", 1500);
        }
        return;
      }

      // ── Status bar step click (montando→feito→cozinha→pronto→saiu→entregue→pago) ──
      const stepAdvance = event.target.closest("[data-step-advance]")?.dataset.stepAdvance;
      if (stepAdvance) {
        const [cmdId, step] = stepAdvance.split(":");
        const command = state.commands.find(c => c.id === cmdId);
        if (command) {
          const ord = ["montando","feito","cozinha","pronto","saiu","entregue","pago"];
          const curI = ord.indexOf(commandStage(command)), stepI = ord.indexOf(step);
          if (stepI !== curI && stepI >= 0) {
            const _now = new Date().toISOString();
            if (stepI > curI) {
              // avançar: preenche o que falta até o passo escolhido
              if (stepI >= 2) {
                if (!(command.itens||[]).length) { showToast("Adicione itens antes de mandar para a cozinha.", 2500); return; }
                if (!command.kitchenSentAt) { command.kitchenSentAt = _now; printKitchenCommand(command); }
              }
              if (stepI >= 3 && !command.readyAt) command.readyAt = _now;
              if (stepI >= 4 && isDeliveryCmd(command) && !command.dispatchedAt) command.dispatchedAt = _now;
              if (stepI >= 5 && !command.deliveredAt) command.deliveredAt = _now;
              if (stepI >= 6) { command.paidAt = _now; command.paymentMethod = command.paymentMethod || "dinheiro"; command.paymentAmount = commandTotal(command); }
            } else {
              // voltar: limpa as etapas à frente do passo escolhido
              if (stepI < 2) command.kitchenSentAt = null;
              if (stepI < 3) command.readyAt = null;
              if (stepI < 4) command.dispatchedAt = null;
              if (stepI < 5) command.deliveredAt = null;
              if (stepI < 6) command.paidAt = null;
            }
            save(); renderCommands();
          }
        }
      }

      const sendKitchen = event.target.closest("[data-send-kitchen]")?.dataset.sendKitchen;
      if (sendKitchen) {
        const command = state.commands.find(c => c.id === sendKitchen);
        if (command) {
          if (!(command.itens || []).length) {
            alert("Adicione pelo menos um item antes de mandar para a cozinha.");
          } else {
            command.kitchenSentAt = new Date().toISOString();
            save();
            printKitchenCommand(command);
            // Sem mensagem de WhatsApp — o cliente acompanha em "Meus pedidos".
          }
        }
      }

      // Entregar bebida (marca as bebidas da comanda como entregues, sem mexer no resto)
      const deliverDrinks = event.target.closest("[data-deliver-drinks]")?.dataset.deliverDrinks;
      if (deliverDrinks) {
        const command = state.commands.find(c => c.id === deliverDrinks);
        if (command) {
          const now = Date.now();
          (command.itens || []).forEach(it => { if (isDrinkItem(it) && !it.bebidaEntregue) it.bebidaEntregue = now; });
          save(); renderCommands();
          showToast("🥤 Bebida entregue!", 1800);
        }
        return;
      }

      // Marcar PRONTO (comida pronta, antes de sair/entregar)
      const markReady = event.target.closest("[data-mark-ready]")?.dataset.markReady;
      if (markReady) {
        const command = state.commands.find(c => c.id === markReady);
        if (command) {
          if (!command.kitchenSentAt) command.kitchenSentAt = new Date().toISOString();
          command.readyAt = new Date().toISOString();
          command.dispatchedAt = null; command.deliveredAt = null; command.paidAt = null;
          save(); renderCommands();
        }
      }

      // SAIU PARA ENTREGA (delivery)
      const dispatchCmd = event.target.closest("[data-dispatch]")?.dataset.dispatch;
      if (dispatchCmd) {
        const command = state.commands.find(c => c.id === dispatchCmd);
        if (command) {
          if (!command.kitchenSentAt) command.kitchenSentAt = new Date().toISOString();
          if (!command.readyAt) command.readyAt = new Date().toISOString();
          command.dispatchedAt = new Date().toISOString();
          command.deliveredAt = null; command.paidAt = null;
          save(); renderCommands();
        }
      }

      const deliverCommand = event.target.closest("[data-deliver-command]")?.dataset.deliverCommand;
      if (deliverCommand) {
        const command = state.commands.find(c => c.id === deliverCommand);
        if (command) {
          command.deliveredAt = new Date().toISOString();
          save();
          renderCommands();
          // Sem mensagem de WhatsApp — o cliente vê "saiu para entrega" em "Meus pedidos".
        }
      }

      const closeCommand = event.target.closest("[data-close-command]")?.dataset.closeCommand;
      if (closeCommand) {
        const command = state.commands.find(c => c.id === closeCommand);
        if (command) {
          if (!command.paidAt) {
            alert("Registre o pagamento antes de fechar a comanda.");
          } else {
            command.status = "fechada";
            command.closedAt = new Date().toISOString();
            command.total = commandTotal(command);
            state.sales.push({ id: uid(), createdAt: command.closedAt, local: command.local, cliente: command.cliente || "Avulso", pessoas: Math.max(1, num(command.pessoas || 1)), total: command.total, itens: command.itens, kitchenSentAt: command.kitchenSentAt || "", deliveredAt: command.deliveredAt || "", paidAt: command.paidAt || "", paymentMethod: command.paymentMethod });
            // remove comanda fechada de state.commands — dados já estão em state.sales
            state.commands = state.commands.filter(c => c.id !== closeCommand);
          }
        }
        save();
      }

      // Apagar/cancelar comanda (cliente desistiu) — não vira venda, some das comandas.
      const cancelCommand = event.target.closest("[data-cancel-command]")?.dataset.cancelCommand;
      if (cancelCommand) {
        const command = state.commands.find(c => c.id === cancelCommand);
        if (command && confirm(`Apagar a comanda de ${command.cliente || command.local || "Avulso"}? Isso não pode ser desfeito.`)) {
          state.commands = state.commands.filter(c => c.id !== cancelCommand);
          closeKbModal();
          save();
          showToast("Comanda apagada.", 2000);
        }
        return;
      }

      // ── Public menu: open addon modal ──

    document.addEventListener("pointerdown", event => {
      // Se já está em modo livre de resize, qualquer clique confirma e sai
      if (tableResize?.freeMode) {
        tableResize.tile.classList.remove("resizing");
        localStorage.setItem(storeKey, JSON.stringify(state));
        suppressTableClick = true;
        setTimeout(() => { suppressTableClick = false; }, 150);
        tableResize = null;
        if (event.target.closest("[data-resize-tables]")) {
          event.preventDefault();
          event.stopPropagation();
        }
        return;
      }

      const resizeHandle = event.target.closest("[data-resize-tables]");
      if (resizeHandle) {
        event.preventDefault();
        event.stopPropagation();
        const tile = resizeHandle.closest(".floor-plan [data-table-id]");
        if (!tile) return;
        tableResize = {
          id: tile.dataset.tableId,
          tile,
          startX: event.clientX,
          startY: event.clientY,
          startSize: tile.offsetWidth || Math.max(108, Math.min(180, num(state.settings.tableTileSize || 118))),
          moved: false,
          freeMode: false
        };
        tile.classList.add("dragging");
        resizeHandle.setPointerCapture?.(event.pointerId);
        return;
      }

      const tile = event.target.closest(".floor-plan [data-table-id]");
      if (!tile) return;
      const plan = tile.closest(".floor-plan");
      const rect = plan.getBoundingClientRect();
      tableDrag = {
        id: tile.dataset.tableId,
        tile,
        plan,
        rect,
        startX: event.clientX,
        startY: event.clientY,
        moved: false
      };
      tile.classList.add("dragging");
      tile.setPointerCapture?.(event.pointerId);
    });

    document.addEventListener("pointermove", event => {
      if (tableResize) {
        const dx = event.clientX - tableResize.startX;
        const dy = event.clientY - tableResize.startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) tableResize.moved = true;
        const nextSize = Math.max(108, Math.min(180, Math.round(tableResize.startSize + Math.max(dx, dy))));
        const table = (state.tables || []).find(t => t.id === tableResize.id);
        if (table) table.tamanho = nextSize;
        document.querySelectorAll(`.floor-plan .table-tile[data-table-id="${tableResize.id}"]`).forEach(tile => {
          tile.style.setProperty("--table-size", `${nextSize}px`);
        });
        document.querySelectorAll(`[data-table-row="${tableResize.id}"] [data-table-size-row]`).forEach(input => {
          input.value = nextSize;
        });
        return;
      }
      if (!tableDrag) return;
      const dx = event.clientX - tableDrag.startX;
      const dy = event.clientY - tableDrag.startY;
      if (Math.abs(dx) + Math.abs(dy) > 4) tableDrag.moved = true;
      const widthPct = (tableDrag.tile.offsetWidth / tableDrag.rect.width) * 100;
      const heightPct = (tableDrag.tile.offsetHeight / tableDrag.rect.height) * 100;
      const left = Math.max(0, Math.min(100 - widthPct, ((event.clientX - tableDrag.rect.left - tableDrag.tile.offsetWidth / 2) / tableDrag.rect.width) * 100));
      const top = Math.max(0, Math.min(100 - heightPct, ((event.clientY - tableDrag.rect.top - tableDrag.tile.offsetHeight / 2) / tableDrag.rect.height) * 100));
      tableDrag.tile.style.left = `${left}%`;
      tableDrag.tile.style.top = `${top}%`;
      const table = (state.tables || []).find(t => t.id === tableDrag.id);
      if (table) { table.x = Number(left.toFixed(1)); table.y = Number(top.toFixed(1)); }
    });

    document.addEventListener("pointerup", () => {

        if (tableResize.freeMode) return; // modo livre: só sai com clique (pointerdown)
        tableResize.tile.classList.remove("dragging");

          if (_newMargem !== _prevMargem) {
            recipe.margem = _newMargem;   // mexeu no lucro → lucro manda, preço volta a ser automático
            recipe.precoVenda = 0;
          } else if (_pv > 0) {
            recipe.precoVenda = _pv;       // fixou o preço → preço manda, lucro é derivado sozinho

        if (_staff.senha != null && String(_staff.senha).trim()) { _staff.passHash = await hashSenha(String(_staff.senha).trim()); }

          state.settings.customDomain = state.settings.customDomain.trim().replace(/^https?:\/\//i, "").replace(/\/+$/, "");

        state.settings = { ...state.settings, ...data };
        save();
      }

      // ── Acesso principal da empresa ──
      if (form.id === "mainAccessForm") {
        const newLogin = (data.mainLogin || "").trim();
        const newPass  = (data.mainPassword || "").trim();
        if (!newLogin) return;
        // Update company entry in master state
        const companyId = currentSession?.company?.id;
        if (companyId) {
          const master = loadMasterState();
          const co = (master.companies || []).find(x => x.id === companyId);
          if (co) {
            co.login = newLogin;
            if (newPass) { co.passHash = await hashSenha(newPass); delete co.senha; }
            co.updatedAt = Date.now();
            saveMasterState(master);
            // Reflect in current session so badge updates
            currentSession.company.login = co.login;
            if (newPass) { currentSession.company.passHash = co.passHash; delete currentSession.company.senha; }
            sessionStorage.setItem("perspectaSession", JSON.stringify(currentSession));
            await patchMasterCreds(master);   // grava a nova senha (hash) na nuvem (navegador)
            var _cloudAcc = await pushCompanyCloud(co);   // e pelo servidor (multi-aparelho)
          }
        }
        // Espelha só o login no estado da empresa — nunca a senha em texto.
        state.settings.mainLogin = newLogin;
        if (state.settings.mainPassword) delete state.settings.mainPassword;
        save();
        showToast("✅ Acesso principal atualizado." + (typeof _cloudAcc !== "undefined" && _cloudAcc && _cloudAcc.ok ? " Já funciona no celular 📱" : (_cloudAcc && _cloudAcc.error ? " ⚠️ não sincronizou: " + _cloudAcc.error : "")), 4000);
      }

      // ── Edição de funcionário existente ──
      if (form.classList.contains("staffInfoForm")) {
        const staffId = form.dataset.staffId;
        const person = (state.staff || []).find(x => x.id === staffId);
        if (person) {
          if ((data.nome || "").trim()) person.nome = data.nome.trim();
          if ((data.login || "").trim()) person.login = data.login.trim();
          if ((data.senha || "").trim()) { person.passHash = await hashSenha(data.senha.trim()); delete person.senha; }
          if (data.perfil) person.perfil = data.perfil;
          person.permissions = ["dashboard", ...formData.getAll("permissions")]

      if (form.id === "nfceSettingsForm") {

          nfceAmbiente: data.nfceAmbiente || "2",
          nfceSerie: data.nfceSerie || "1",
          nfceNcm: data.nfceNcm || "21069090",
          nfceCsosn: data.nfceCsosn || "400"
        };

        showToast("✅ Configurações NFC-e salvas.", 2000);

      if (form.id === "payInfinitePayForm") {

        state.settings.pay = state.settings.pay || {};
        state.settings.pay.infinitepay = { handle, ativo: data.ipAtivo === "true" && !!handle };
        save();                 // publishPublicMenu roda no save → nó público atualiza

      if (form.id === "deliveryZoneForm") {

        state.settings.deliveryZones.push({ id: uid(), bairro, taxa });

        save();                 // republica o nó público (deliveryZones vai junto)

        showToast(`✅ ${bairro} · ${money(taxa)}`, 1800);

      if (form.id === "reportFilterForm" || form.id === "comparisonForm") {

      if (form.id === "tableForm") {

        form.reset();
        save();
      }

      if (form.id === "goalForm") {
        state.goals = state.goals || [];
        state.goals.push({ id: uid(), ...data });
        form.reset();
        save();
      }

      if (form.id === "menuForm") {
        const newItem = { id: uid(), foto: null, ...data, preco: num(data.preco), ativo: data.ativo === "true" };
        delete newItem.fotoFile;
        state.menu.push(newItem);
        form.reset();
        const fileInput = form.querySelector('[name="fotoFile"]');
        const file = fileInput?.files?.[0];
        if (file) {
          fileToCompressed(file, 800, 600, 0.82).then(async b64 => { if (b64) await setItemPhoto(newItem, b64); else showToast("Não consegui ler a foto. Se for HEIC do iPhone, conecte na internet e tente de novo, ou envie em JPG/PNG.", 5000); save(); });
        } else {
          save();
        }
      }

      // FINALIZAR PEDIDO no site (botão grande). Grava o pedido e, se o pagamento
      // for Pix/Cartão com InfinitePay ativa, gera o link de pagamento na hora.
      if (form.id === "pmCheckoutForm") {
        if (!(data.nome || "").trim()) return;
        const status = document.getElementById("pmCheckoutStatus");
        const finalizeBtn = document.getElementById("pmFinalizeBtn");
        if (finalizeBtn) { finalizeBtn.disabled = true; finalizeBtn.textContent = "Enviando…"; }
        const res = await pmPersistOrder(data);
        if (finalizeBtn) { finalizeBtn.disabled = false; finalizeBtn.textContent = "Finalizar pedido"; }
        const waUrl = whatsappLink(state.settings.whatsapp, pmOrderWhatsMsg(res, res.saved));
        const waLink = state.settings.whatsapp
          ? `<a href="${waUrl}" target="_blank" rel="noopener" class="pm-wa-mini" style="margin-top:10px;text-decoration:none">Avisar pelo WhatsApp</a>` : "";
        const myOrdersBtn = `<button type="button" class="pm-btn-full pm-btn-ghost" id="pmGoMyOrders" style="margin-top:10px">📦 Meus pedidos</button>`;
        const ondePaga = res.tipo === "tele" ? "na entrega" : res.tipo === "mesa" ? "no local" : "na retirada";

        if (!res.saved) {
          if (status) {
            status.className = "pm-checkout-status err";
            status.innerHTML = `<span class="st-title">Não consegui registrar</span><span class="st-sub">${escapeHTML(res.failReason || "tente de novo")}. Toque para enviar seu pedido pelo WhatsApp — o restaurante confirma por lá.</span>${waLink}`;
            status.scrollIntoView({ behavior: "smooth", block: "center" });
          }
          showToast("Não consegui registrar. Use o WhatsApp abaixo.", 5000);
          return;
        }

        publicCart = []; updatePmFab();

        if (res.payOnline) {
          if (status) {
            status.className = "pm-checkout-status ok";
            status.innerHTML = `<span class="st-title">Pedido registrado ✅</span><span class="st-sub">Gerando seu pagamento seguro…</span>`;
            status.scrollIntoView({ behavior: "smooth", block: "center" });
          }
          let payUrl = "", payErr = "";
          try {
            const pr = await fetch("https://perspecta-bistro.vercel.app/api/payment-link", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ companyId: res.companyId, order: res.payload, redirectUrl: location.href })
            });
            const pj = await pr.json().catch(() => ({}));
            if (pr.ok && pj.url) payUrl = pj.url; else { payErr = pj.error || `erro ${pr.status}`; console.error("[pagamento] payment-link:", pr.status, pj); }
          } catch (e) { payErr = "sem rede"; console.error("[pagamento] erro:", e); }
          if (finalizeBtn) finalizeBtn.style.display = "none";
          if (payUrl && status) {
            status.className = "pm-checkout-status ok";
            status.innerHTML = `<span class="st-title">Falta pagar 💳</span><span class="st-sub">Seu pedido está registrado. Toque para pagar ${res.payMap[res.pagamento]} com segurança pela InfinitePay.</span><a href="${payUrl}" target="_blank" rel="noopener" class="pm-btn-full pm-btn-green" style="margin-top:10px;text-decoration:none;display:flex;justify-content:center">Pagar agora →</a>${myOrdersBtn}`;
          } else if (status) {
            status.className = "pm-checkout-status ok";
            status.innerHTML = `<span class="st-title">✅ Pedido enviado!</span><span class="st-sub">Não consegui gerar o pagamento online agora (${escapeHTML(payErr)}). Sem problema — combine o pagamento ${ondePaga} com o restaurante.</span>${myOrdersBtn}${waLink}`;
          }
          showToast("Pedido registrado ✅", 3000);
        } else {
          if (finalizeBtn) finalizeBtn.style.display = "none";
          if (status) {
            const trocoTxt = res.payload.troco ? ` Leve ${money(res.payload.trocoPara)} — troco de ${money(res.payload.troco)}.` : "";
            status.className = "pm-checkout-status ok";
            const sub = pmMesa
              ? `Seu pedido já foi pra <strong>${escapeHTML(pmMesa)}</strong>. O atendimento vai preparar — você acerta a conta no fim. 😊`
              : `O restaurante já recebeu. Você paga ${ondePaga} (${res.payMap[res.pagamento]}).${trocoTxt} Acompanhe em "Meus pedidos".`;
            status.innerHTML = `<span class="st-title">✅ Pedido enviado!</span><span class="st-sub">${sub}</span>${pmMesa ? "" : myOrdersBtn}`;
            status.scrollIntoView({ behavior: "smooth", block: "center" });
          }
          showToast("Pedido enviado! ✅", 3000);
        }
      }

      if (form.id === "addonForm") {
        state.addons = state.addons || [];
        state.addons.push({ id: uid(), nome: data.nome, preco: num(data.preco), ativo: data.ativo === "true" });
        form.reset();
        save();
      }

      if (form.id === "commandForm") {
        const multiLocal = ["balcão", "delivery"];
        const allowMulti = multiLocal.includes(data.local.toLowerCase());
        const localTaken = !allowMulti && state.commands.find(c => c.status === "aberta" && c.local.toLowerCase() === data.local.toLowerCase());
        if (!localTaken) {
          const clientName = data.cliente || "Avulso";
          const newId = uid();
          state.commands.push({ id: newId, local: data.local, cliente: clientName, pessoas: Math.max(1, num(data.pessoas || 1)), status: "aberta", itens: [], pagamentos: [], createdAt: new Date().toISOString() });
          ensureClientFromCommand(clientName);
          form.reset();
          save();
          showKbModal(newId);   // já abre a comanda pra começar o pedido (sem passo extra)
        } else {
          form.reset();
          alert("Já existe uma comanda aberta nesse local.");
        }
      }

      if (form.classList.contains("editCommandForm")) {
        const command = state.commands.find(c => c.id === form.dataset.command);
        const multiLocal = ["balcão", "delivery"];
        const allowMulti = multiLocal.includes(data.local.toLowerCase());
        const localTaken = !allowMulti && state.commands.find(c => c.id !== form.dataset.command && c.status === "aberta" && c.local.toLowerCase() === data.local.toLowerCase());
        if (command && !localTaken) {
          command.local = data.local;
          command.cliente = data.cliente || "Avulso";
          command.pessoas = Math.max(1, num(data.pessoas || 1));
          ensureClientFromCommand(command.cliente);
          save();
        }
        if (localTaken) alert("Já existe uma comanda aberta nesse local.");
      }

      if (form.classList.contains("addItemForm")) {
        const command = state.commands.find(c => c.id === form.dataset.command);
        const item = state.menu.find(m => m.id === data.itemId);
        if (command && item) {
          const selectedAddons = formData.getAll("adicionais")
            .map(id => (state.addons || []).find(addon => addon.id === id))
            .filter(Boolean)
            .map(addon => ({ id: addon.id, nome: addon.nome, preco: num(addon.preco) }));
          command.itens.push({
            id: item.id,
            nome: item.nome,
            preco: item.preco,
            quantidade: Math.max(1, num(data.quantidade)),
            adicionais: selectedAddons,
            observacao: data.observacao || ""
          });
          form.reset();
          save();
        }
      }

      if (form.classList.contains("paymentForm")) {
        const command = state.commands.find(c => c.id === form.dataset.command);
        if (command) {
          if (command.paidAt) {
            alert("Esta comanda já tem pagamento registrado.");
          } else {
            const paidAt = new Date().toISOString();
            const total = commandTotal(command);
            command.paidAt = paidAt;
            command.paymentMethod = data.forma;
            command.paymentAmount = num(data.valor || total);
            registerCashSale(command);
            save();
          }
        }
      }
    });

    document.addEventListener("input", event => {
      // Busca dentro do seletor (cselBuild): digita e filtra as opções.
      if (event.target.matches("[data-csel-search]")) {
        const drop = event.target.closest(".csel-drop");
        const q = _cselNorm(event.target.value);
        let visible = 0;
        drop.querySelectorAll(".csel-opt").forEach(o => {
          const hit = !q || _cselNorm(o.dataset.l || o.textContent).includes(q);
          o.style.display = hit ? "" : "none";
          if (hit) visible++;
        });
        const hint = drop.querySelector(".csel-empty-hint");
        if (hint) hint.style.display = visible ? "none" : "block";
        return;
      }
      // Busca no seletor visual de itens da comanda (filtra os cards ao digitar).
      if (event.target.matches("[data-item-filter]")) {
        const grid = event.target.closest(".item-picker")?.querySelector(".item-picker-grid");
        if (grid) {
          const q = _cselNorm(event.target.value);
          grid.querySelectorAll(".item-chip").forEach(b => {
            b.style.display = (!q || (b.dataset.name || "").includes(q)) ? "" : "none";
          });
        }
        return;
      }
      // Troco ao vivo no checkout público (dinheiro + delivery).
      if (event.target.id === "pmTrocoInput") { pmUpdateTrocoHint(); return; }
      // Troco ao vivo no card da comanda (dinheiro). Escopo no MESMO card
      // (a comanda pode existir 2x no DOM: no grid e no modal aberto).
      if (event.target.matches("[data-cash-received]")) {
        const cid = event.target.dataset.cashReceived;
        const command = state.commands.find(c => c.id === cid);
        const card = event.target.closest(".command-card");
        const view = card && card.querySelector(`[data-troco="${cid}"] strong`);
        if (command && view) {
          const troco = num(event.target.value) - commandTotal(command);
          view.textContent = money(troco > 0 ? troco : 0);
        }
        return;
      }
      if (event.target.matches("[data-table-size]")) {
        state.settings.tableTileSize = Math.max(108, Math.min(180, num(event.target.value)));
        (state.tables || []).forEach(table => { table.tamanho = state.settings.tableTileSize; });
        localStorage.setItem(storeKey, JSON.stringify(state));
        document.querySelectorAll(".floor-plan .table-tile").forEach(tile => {
          tile.style.setProperty("--table-size", `${state.settings.tableTileSize}px`);
        });
        document.querySelectorAll("[data-table-size-row]").forEach(input => {
          input.value = state.settings.tableTileSize;
        });
      }
    });

    document.addEventListener("blur", event => {
      const renameId = event.target.dataset.renameTable;
      if (!renameId) return;
      const table = (state.tables || []).find(t => t.id === renameId);
      const newName = event.target.value.trim();
      if (table && newName && newName !== table.nome) {
        table.nome = newName;
        save();
      } else if (!newName) {
        event.target.value = table?.nome || "";
      }
    }, true);

    document.addEventListener("keydown", event => {
      if (event.key === "Enter" && event.target.dataset.renameTable) {
        event.target.blur();
      }
    });

    document.addEventListener("change", event => {
      // ── Edição DIRETA no cabeçalho da comanda (sem abrir nada) ──
      // Nome do cliente: digita e salva ao sair do campo (não re-renderiza, pra
      // não tirar o foco — o valor já está visível no próprio campo).
      const headName = event.target.closest("[data-head-name]");
      if (headName) {
        const command = state.commands.find(c => c.id === headName.dataset.headName);
        if (command) {
          const v = (headName.value || "").trim() || "Avulso";
          command.cliente = v;
          ensureClientFromCommand(v);
          save();
        }
        return;
      }
      // Qtd. de clientes: idem, salva ao sair do campo.
      const headPessoas = event.target.closest("[data-head-pessoas]");
      if (headPessoas) {
        const command = state.commands.find(c => c.id === headPessoas.dataset.headPessoas);
        if (command) { command.pessoas = Math.max(1, num(headPessoas.value || 1)); save(); }
        return;
      }
      // Mesa / tipo: o seletor (cselBuild) dispara "change" ao escolher. Precisa
      // re-renderizar (muda o rótulo e a associação da mesa no salão).
      const headLocal = event.target.closest("[data-head-local]");
      if (headLocal && event.target.closest(".csel")) {
        const command = state.commands.find(c => c.id === headLocal.dataset.headLocal);
        if (command) {
          const localVal = (headLocal.querySelector('input[type="hidden"]')?.value || command.local || "").trim();
          const allowMulti = ["balcão", "delivery"].includes(localVal.toLowerCase());
          const localTaken = !allowMulti && state.commands.find(c => c.id !== command.id && c.status === "aberta" && c.local.toLowerCase() === localVal.toLowerCase());
          if (localTaken) { alert("Já existe uma comanda aberta nesse local."); }
          else { command.local = localVal; save(); }
          renderCommands();
        }
        return;
      }

      if (event.target.matches("[data-active-tables-only]")) {
        state.settings.tableOnlyActive = event.target.checked;
        save();
      }

      // ── Tipo de pedido no checkout público ──
      if (event.target.id === "pmTipoSelect") {
        const deliv = document.getElementById("pmDeliveryWrap");
        const mesa = document.getElementById("pmMesaWrap");
        const rua = document.getElementById("pmRua");
        const numero = document.getElementById("pmNumero");
        const bairro = document.getElementById("pmBairroSelect");
        const tipo = event.target.value;
        const isTele = tipo === "tele";
        if (deliv) deliv.classList.toggle("hidden", !isTele);
        if (mesa) mesa.classList.toggle("hidden", tipo !== "mesa");
        if (rua) rua.required = isTele;
        if (numero) numero.required = isTele;
        if (bairro) bairro.required = isTele && (state.settings.deliveryZones || []).length > 0;
        pmUpdatePayHint();
        renderPmOrderRecap();   // atualiza o total com/sem taxa de entrega
      }

      // ── Bairro selecionado → recalcula a taxa de entrega no resumo ──
      if (event.target.id === "pmBairroSelect") { renderPmOrderRecap(); }

      // ── Forma de pagamento no checkout público ──
      if (event.target.name === "pagamento") { pmUpdatePayHint(); }

      // ── Upload logo do cardápio ──
      // ── Upload logo Perspecta (sidebar) ──
      if (event.target.id === "perspectaLogoInput" && event.target.files?.[0]) {
        fileToCompressed(event.target.files[0], 512, 512, 1, "image/png").then(b64 => {
          if (!b64) { showToast("Não consegui ler essa imagem. Use JPG ou PNG.", 4000); return; }
          state.settings.perspectaLogo = b64;
          save();
          renderBrand();
          renderDataTools();
          showToast("Logo da sidebar atualizado! ✅", 2500);
        });
      }

      if (event.target.id === "faviconInput" && event.target.files?.[0]) {
        fileToCompressed(event.target.files[0], 128, 128, 1, "image/png").then(b64 => {
          if (!b64) { showToast("Não consegui ler essa imagem. Use JPG ou PNG.", 4000); return; }
          state.settings.favicon = b64;
          const faviconEl = document.getElementById("faviconLink");
          if (faviconEl) faviconEl.href = b64;
          save();
          renderDataTools();
          showToast("Favicon atualizado! ✅", 2500);
        });
      }

      if (event.target.id === "removeFavicon") {
        state.settings.favicon = null;
        const faviconEl = document.getElementById("faviconLink");
        if (faviconEl) faviconEl.href = "icone-192.png";
        save();
        renderDataTools();
        showToast("Favicon removido.", 2000);
      }

      if (event.target.id === "logoUploadInput" && event.target.files?.[0]) {
        // Logo em PNG sem perda (texto nítido + transparência), em alta resolução.
        fileToCompressed(event.target.files[0], 1400, 800, 1, "image/png").then(b64 => {
          if (!b64) return;
          const tmpImg = new Image();
          tmpImg.onload = () => {
            state.settings.logoUrl = b64;
            state.settings.logoDims = `${tmpImg.naturalWidth} × ${tmpImg.naturalHeight} px`;
            save();
            renderMenuAdmin();
            showToast("Logo salvo!", 2000);
          };
          tmpImg.src = b64;
        });
      }

      // ── Troca foto de item existente ──
      const photoMenu = event.target.dataset.photoMenu;
      if (photoMenu && event.target.type === "file") {
        const file = event.target.files?.[0];
        if (!file) return;
        const row = event.target.closest("[data-menu-row]");
        const preview = row?.querySelector("[data-menu-photo-preview]");
        if (!row || !preview) return;
        fileToCompressed(file, 800, 600, 0.82).then(async b64 => {
          if (!b64) {
            showToast("Não consegui ler essa foto. Se for HEIC do iPhone, conecte na internet e tente de novo, ou envie em JPG/PNG.", 5000);
            return;
          }
          const item = state.menu.find(x => x.id === photoMenu);
          if (!item) return;
          if (row.querySelector("[data-edit-menu-name]")) saveMenuRow(row, item); // preserva edições de texto da linha
          await setItemPhoto(item, b64);
          preview.innerHTML = `<img class="menu-thumb" src="${b64}" data-photo-item="${item.id}" alt="Prévia da foto">`;
          save({ silent: true }); // não recria a tela: não perde edições de outras linhas
          showToast("Foto salva e atualizada no cardápio público.", 2600);
        });
      }
    });

    window.addEventListener("hashchange", () => {
      if (location.hash.startsWith("#cardapio-publico")) {
        hideLogin();
        document.getElementById("internalApp").classList.add("hidden");
        document.getElementById("publicMenu").classList.remove("hidden");
        renderPublicMenu();
      } else {
        document.getElementById("internalApp").classList.remove("hidden");
        document.getElementById("publicMenu").classList.add("hidden");
        const target = location.hash.replace("#", "") || "dashboard";
        if (document.getElementById(target)?.classList.contains("section")) setSection(target);
      }
    });

    window.addEventListener("storage", event => {
      if (event.key !== storeKey) return;
      state = loadState();
      if (location.hash.startsWith("#cardapio-publico")) renderPublicMenu();
      else renderAll();
      hydratePhotos();
    });

    // ── App boot: check session, show login or start ──
    (function boot() {
      const pub = location.hash.startsWith("#cardapio-publico");
      if (pub) {
        // Link público: esconde o login NA HORA (antes de qualquer await), senão
        // a tela de acesso pisca enquanto resolve a loja. É público, não tem login.
        hideLogin();
        document.getElementById("internalApp").classList.add("hidden");
        document.getElementById("publicMenu").classList.remove("hidden");
        // Token do link: #cardapio-publico-TOKEN. TOKEN pode ser um slug
        // amigável (novo) ou o id da empresa (links antigos).
        const compMatch = location.hash.match(/^#cardapio-publico-([a-z0-9_-]+)/i);
        if (compMatch) {
          resolvePublicCompany(compMatch[1]).then(async companyId => {
            storeKey = "gestaoCompany." + companyId + ".v1";
            await loadPublicMenuState();   // lê /public/{empresa} (com fallback retrocompatível)
            startApp();
          }).catch(() => { startApp(); });
        } else {
          startApp();
        }
        return;
      }

      // deep link pedido?
      const pedidoParam = new URLSearchParams(location.search).get("pedido");

      try {
        const saved = sessionStorage.getItem("perspectaSession");
        if (saved) {
          const sess = JSON.parse(saved);
          currentSession = sess;
          if (sess.type === "gestor") {
            storeKey = MASTER_KEY;
            const master = loadMasterState();
            state = normalizeState({ ...structuredClone(defaultState), ...master });
          } else if (sess.type === "company") {
            storeKey = "gestaoCompany." + sess.company.id + ".v1";
            state = loadState();
          } else if (sess.type === "gestor-proxy") {
            // Gestor browsing a company's data — load that company's store
            storeKey = "gestaoCompany." + sess.company.id + ".v1";
            state = loadState();
          }
          hideLogin();
          document.getElementById("internalApp").classList.remove("hidden");
          renderAll();
          initPhotos();
          if (pedidoParam) {
            try {
              const deepLinkOrder = JSON.parse(decodeURIComponent(escape(atob(pedidoParam))));
              history.replaceState(null, "", location.pathname + location.hash);
              state.commands.push({ id: uid(), local: deepLinkOrder.tipo === "tele" ? "Delivery" : "Pedido por link", cliente: deepLinkOrder.nome || "WhatsApp", pessoas: 1, status: "aberta", itens: deepLinkOrder.itens || [], pagamentos: [], createdAt: new Date().toISOString(), source: "whatsapp", referencia: deepLinkOrder.referencia || "" });
              save();
              setSection("comandas");
              showToast("✅ Pedido de \"" + deepLinkOrder.nome + "\" criado em Comandas!");
            } catch {}
          } else {
            const start = location.hash.replace("#", "");
            if (start && document.getElementById(start)?.classList.contains("section")) setSection(start);
          }
          return;
        }
      } catch {}
      showLogin();
    })();

    // ── Service worker: registra, procura versão nova a cada 1 min e aplica sozinho ──
    // (resolve o "minhas mudanças não aparecem": antes a página nem registrava o SW,
    //  então um SW antigo ficava preso servindo cache.)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const hadController = !!navigator.serviceWorker.controller;
        let pendingReload = false, reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          // só recarrega quando é ATUALIZAÇÃO (não na primeira instalação)
          if (hadController) pendingReload = true;
        });
        // aplica a versão nova quando a pessoa não estiver no meio de um cadastro/modal
        setInterval(() => {
          if (pendingReload && !reloaded && !isUserBusy()) { reloaded = true; location.reload(); }
        }, 3000);
        navigator.serviceWorker.register("sw.js").then(reg => {
          reg.update();
          setInterval(() => reg.update(), 60000);
        }).catch(() => {});
      });
    }
  </script>
</body>
