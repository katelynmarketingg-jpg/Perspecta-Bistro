      if (btn) { btn.textContent = "Verificando…"; btn.disabled = true; }
      if (errEl) errEl.classList.add("hidden");
      document.getElementById("loginNetworkError")?.classList.add("hidden");

      // Load master state from localStorage first
      let master = loadMasterState();

      // If localStorage has no companies, pull from Firebase (new device / fresh browser)
      if (!master.companies || master.companies.length === 0) {
        try {
          const r = await authedFetch(`${FIREBASE_URL}/data/${fbPath(MASTER_KEY)}.json`);
          if (r.ok) {
            const fb = await r.json();
            if (fb && fb.companies) {
              master = { ...master, ...fb };
              saveMasterState(master); // cache locally for next time
            }
          }
        } catch(e) {
          // Network error — show friendly message, do not show "wrong password"
          if (btn) { btn.textContent = "Entrar"; btn.disabled = false; }
          document.getElementById("loginNetworkError")?.classList.remove("hidden");
          return;
        }
      }

      if (btn) { btn.textContent = "Entrar"; btn.disabled = false; }

      // Guarda empresa+nome deste acesso (nunca a senha) para o próximo login.
      const lembrar = () => {
        try { localStorage.setItem(BISTRO_REMEMBER, JSON.stringify({ empresa, pessoa })); } catch {}
      };

      const gc = master.gestorCredentials || { login: "Perspecta", senha: "001" };
      // Gestor: pode digitar o login do gestor no campo Empresa OU no campo Nome.
      if (senha === gc.senha && (emp === norm(gc.login) || pes === norm(gc.login))) {
        currentSession = { type: "gestor" };
        sessionStorage.setItem("perspectaSession", JSON.stringify(currentSession));
        storeKey = MASTER_KEY;
        state = normalizeState({ ...structuredClone(defaultState), ...master });
        lembrar();
        hideLogin();
        startApp();
        return;
      }
      const companies = master.companies || [];
      // Casa por Empresa (nome) + Nome (responsável) + Senha. Retrocompatível:
      // quem tinha só "login" ainda entra digitando o login no campo Empresa ou Nome.
      const company = companies.find(c => {
        if (c.senha !== senha || c.status === "inativo") return false;
        const nomeOk = norm(c.nome) === emp;
        const pessoaOk = !c.responsavel || norm(c.responsavel) === pes;
        const loginAntigo = c.login && (norm(c.login) === emp || norm(c.login) === pes);
        return (nomeOk && pessoaOk) || loginAntigo;
      });
      if (company) {
        lembrar();
        currentSession = { type: "company", company };
        sessionStorage.setItem("perspectaSession", JSON.stringify(currentSession));
        storeKey = "gestaoCompany." + company.id + ".v1";
        state = loadState();
        // Also pull company state from Firebase if localStorage empty
        try {
          const r2 = await authedFetch(`${FIREBASE_URL}/data/${fbPath(storeKey)}.json`);
          if (r2.ok) {
            const fb2 = await r2.json();
            if (fb2 && (fb2.savedAt || 0) > (state.savedAt || 0)) {
              state = normalizeState({ ...structuredClone(defaultState), ...fb2 });
              localStorage.setItem(storeKey, JSON.stringify(state));
            }
          }
        } catch(e) {}
        hideLogin();
        startApp();
        return;
      }
      if (errEl) errEl.classList.remove("hidden");
    }

    function startApp() {
      if (location.hash.startsWith("#cardapio-publico")) {
        hideLogin();
        document.getElementById("internalApp").classList.add("hidden");
        document.getElementById("publicMenu").classList.remove("hidden");
        renderPublicMenu();
        initPhotos();
        pollSync();
        // Atualiza instantaneamente quando admin salva no mesmo navegador (cross-tab via localStorage)
        window.addEventListener('storage', (ev) => {
          if (ev.key === storeKey && ev.newValue) {
            try {
              state = normalizeState(mergeStates(JSON.parse(ev.newValue), state));
              renderPublicMenu();
              hydratePhotos();
            } catch(e) {}
          }
        });
        // Polling Firebase a cada 8s para sincronização entre dispositivos diferentes
        setInterval(pollSync, 8000);
        return;
      }
      document.getElementById("internalApp").classList.remove("hidden");
      renderAll();
      initPhotos();
      const start = location.hash.replace("#", "");
      if (start && document.getElementById(start)?.classList.contains("section")) setSection(start);

      // Reenvio de dados que ficaram pendentes (sem conexão no último save)
      flushPending();
      // Verifica pedidos do cardápio público que chegaram enquanto o sistema estava fechado
      checkPendingOrders();

      // Sync no boot: puxa e junta dados da nuvem (merge por item)
      pollSync();

      // Polling a cada 8s: junta o que outro aparelho salvou + verifica pedidos do cardápio público
      setInterval(() => { pollSync(); checkPendingOrders(); }, 8000);
    }

    function getSessionLabel() {
      if (!currentSession) return "";
      if (currentSession.type === "gestor") return "Gestor";
      if (currentSession.type === "gestor-proxy") return "👁 " + (currentSession.company?.nome || "Empresa");
      return currentSession.company?.nome || "Empresa";
    }

    function getNavItems() {
      if (!currentSession || currentSession.type === "gestor") return navItems;
      // Both company sessions and gestor-proxy sessions see the company's own nav (no "Empresas" panel)
      return navItems.filter(([id]) => id !== "empresas");
    }

    function normalizeState(data) {
      data.settings = { ...structuredClone(defaultState.settings), ...(data.settings || {}) };
      data.settings.menuOrder = normalizeMenuOrder(data.settings.menuOrder);
      data.cash = data.cash || [];
      data.cashSessions = data.cashSessions || structuredClone(defaultState.cashSessions);
      data.tables = ensureDefaultServicePoints(data.tables || structuredClone(defaultState.tables));
      data.goals = data.goals || structuredClone(defaultState.goals);
      data.inventory = data.inventory || structuredClone(defaultState.inventory);
      data.inventory = data.inventory.map(item => ({ previousCost: item.previousCost ?? item.custo, ...item }));
      data.inventoryMovements = data.inventoryMovements || [];
      data.inventoryBatches = data.inventoryBatches || [];
      const savedMenu = Array.isArray(data.menu) && data.menu.length ? data.menu : structuredClone(defaultState.menu);
      const savedAddons = Array.isArray(data.addons) && data.addons.length ? data.addons : structuredClone(defaultState.addons);
      data.menu = savedMenu.map(item => ({ foto: null, ...item, id: item.id || uid(), preco: num(item.preco) }));
      data.addons = savedAddons.map(addon => ({ ativo: true, ...addon, preco: num(addon.preco) }));
      data.companies = data.companies || structuredClone(defaultState.companies);
      data.staff = data.staff || structuredClone(defaultState.staff);
      data.staff = data.staff.map(person => ({ ...person, permissions: Array.isArray(person.permissions) ? person.permissions : defaultPermissionsForRole(person.perfil) }));
      data.tables = data.tables.map((table, index) => ({
        ...table,
        x: table.x ?? (8 + (index % 4) * 24),
        y: table.y ?? (12 + Math.floor(index / 4) * 34)
      }));
      data.goals = data.goals.map(goal => ({
        tipo: "valor",
        periodo: "hoje",
        produto: "",
        ...goal
      }));
      data.commands  = Array.isArray(data.commands)
        ? data.commands
            .filter(c => c.status !== "fechada") // fechadas já estão em sales, não precisam ficar aqui
            .map(c => ({ ...c, itens: Array.isArray(c.itens) ? c.itens : [], pagamentos: Array.isArray(c.pagamentos) ? c.pagamentos : [] }))
        : [];
      data.sales     = Array.isArray(data.sales)     ? data.sales     : [];
      data.expenses  = Array.isArray(data.expenses)  ? data.expenses  : [];
      data.clients   = Array.isArray(data.clients)   ? data.clients   : [];
      data.commandViewMode = data.commandViewMode || "geral";
      data.costs = (data.costs || []).map(row => {
        if (Array.isArray(row.ingredientes)) {
          return {
            tipo: "produto",
            ...row,
            ingredientes: row.ingredientes.map(item => ({
              ...item,
              inventoryId: item.inventoryId || inventoryMatchByName(item.nome, data.inventory)?.id || "",
              baseUnitCost: item.baseUnitCost || purchaseUnitCost(item)
            }))
          };
        }
        return {
          id: row.id || uid(),
          tipo: row.tipo || "produto",
          produto: row.produto || "Produto",
          rendimento: row.rendimento || 1,
          margem: row.margem || data.settings.defaultMargin,
          outrosCustos: row.outrosCustos || 0,
          ingredientes: [{
            nome: row.ingrediente || "Ingrediente",
            precoCompra: row.precoCompra || 0,
            quantidadeCompra: row.quantidadeCompra || 1,
            unidadeCompra: row.unidadeCompra || "kg",
            quantidadeUsada: row.quantidadeUsada || 0,
            unidadeUsada: row.unidadeUsada || "g",
            inventoryId: inventoryMatchByName(row.ingrediente, data.inventory)?.id || "",
            baseUnitCost: purchaseUnitCost(row)
          }]
        };
      });
      // Sync por merge: garante id em todo registro e poda tombstones antigos (>30 dias).
      MERGE_COLLECTIONS.forEach(coll => {
        if (Array.isArray(data[coll])) data[coll].forEach(r => { if (r && typeof r === "object" && r.id == null) r.id = uid(); });
      });
      if (data._tomb && typeof data._tomb === "object") {
        const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
        for (const coll of Object.keys(data._tomb)) {
          const m = data._tomb[coll] || {};
          for (const id of Object.keys(m)) if ((m[id] || 0) < cutoff) delete m[id];
        }
      }
      return data;
    }

    function ensureDefaultServicePoints(tables) {
      const required = [
        ...Array.from({ length: 11 }, (_, index) => ({ nome: `Mesa ${index + 1}`, area: index < 4 ? "Salão" : index < 8 ? "Meio" : "Fundo" })),
        { nome: "Balcão", area: "Caixa" },
        { nome: "Bebidas", area: "Balcão" },
        { nome: "Delivery", area: "Online" }
      ];
      const existing = new Set((tables || []).map(table => String(table.nome || "").toLowerCase()));
      required.forEach((item, index) => {
        if (!existing.has(item.nome.toLowerCase())) {
          tables.push({
            id: uid(),
            nome: item.nome,
            area: item.area,
            ordem: (tables.length || 0) + 1,
            x: 8 + (index % 4) * 26,
            y: 12 + Math.floor(index / 4) * 25
          });
        }
      });
      return tables;
    }

    function normalizeMenuOrder(order) {
      const saved = Array.isArray(order) ? order : [];
      const byId = new Map(saved.map((item, index) => [item.id, { ...item, order: num(item.order || index + 1) }]));
      return getNavItems().map(([id, label], index) => {
        const current = byId.get(id) || {};
        // Migração: ao separar "Insumos" em aba própria, renomeamos o rótulo antigo.
        const savedLabel = (id === "estoque" && current.label === "Estoque e insumos") ? "Estoque" : current.label;
        return {
          id,
          label: savedLabel || label,
          order: current.order || index + 1,
          visible: id === "dashboard" || id === "dados" ? true : current.visible !== false
        };
      });
    }

    function orderedMenuItems() {
      const order = normalizeMenuOrder(state.settings.menuOrder);
      state.settings.menuOrder = order;
      return order
        .filter(item => item.visible || item.id === "dashboard" || item.id === "dados")
        .sort((a, b) => num(a.order) - num(b.order));
    }

    function defaultPermissionsForRole(role) {
      if (role === "Gestão") return navItems.map(item => item[0]).filter(id => id !== "empresas");
      if (role === "Caixa") return ["dashboard", "caixa", "mesas", "estoque", "clientes", "cardapio", "comandas", "relatorios"];
      if (role === "Cozinha") return ["dashboard", "comandas", "estoque"];
      return ["dashboard", "mesas", "clientes", "cardapio", "comandas"];
    }

    function permissionOptions(selected = []) {
      const locked = new Set(["dashboard"]);
      return navItems
        .filter(([id]) => id !== "empresas")
        .map(([id, label]) => `<label class="permission-chip"><input type="checkbox" name="permissions" value="${id}" ${selected.includes(id) || locked.has(id) ? "checked" : ""} ${locked.has(id) ? "disabled" : ""}> ${escapeHTML(label)}</label>`)
        .join("");
    }

    const FIREBASE_URL = 'https://perspecta-bistro-default-rtdb.firebaseio.com';

    // Em desenvolvimento (localhost) usamos um namespace de teste para NUNCA
    // tocar os dados de produção. Em produção (github.io) isso é sempre false.
    const TEST_MODE = /^(localhost|127\.0\.0\.1|\[?::1\]?)$/.test(location.hostname);
    // Firebase keys cannot contain . $ # [ ] /
    function fbPath(key) { return key.replace(/\./g, '_') + (TEST_MODE ? '__TESTE' : ''); }

    // ─────────────────────────────────────────────────────────────
    //  SEGURANÇA — autenticação anônima do Firebase
    //  Sem uma chave aqui, o app funciona como antes (fetch normal, sem token).
    //  Ao preencher a "Chave de API da Web" do Firebase e ativar o login
    //  anônimo no console, todas as chamadas passam a levar um token e as
    //  regras do banco podem exigir login — barrando robôs/curl sem token.
    //  Obs.: a chave da Web é PÚBLICA por natureza (fica em todo app web
    //  Firebase); pode ficar no código sem risco.
    // ─────────────────────────────────────────────────────────────
    const FIREBASE_API_KEY = "AIzaSyBy_FMQjmTMnR9OZC6wIQGVx1i2R_5DvAw"; // Chave de API da Web (pública por natureza)

    let _fbAuth = null; // { idToken, refreshToken, exp }
    try { _fbAuth = JSON.parse(localStorage.getItem('perspectaFbAuth') || 'null'); } catch (e) {}
    let _fbAuthPromise = null;

    async function ensureFbToken() {
      if (!FIREBASE_API_KEY) return null;                                  // segurança desligada
      const now = Date.now();
      if (_fbAuth && _fbAuth.idToken && now < _fbAuth.exp - 60000) return _fbAuth.idToken;
      if (_fbAuthPromise) return _fbAuthPromise;                           // evita corrida entre chamadas
      _fbAuthPromise = (async () => {
        try {
          // 1) tenta renovar com o refresh token (evita criar usuário anônimo novo toda hora)
          if (_fbAuth && _fbAuth.refreshToken) {
            const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}`, {
              method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(_fbAuth.refreshToken)}`
            });
            if (r.ok) {
              const d = await r.json();
              _fbAuth = { idToken: d.id_token, refreshToken: d.refresh_token, exp: Date.now() + (+d.expires_in) * 1000 };
              localStorage.setItem('perspectaFbAuth', JSON.stringify(_fbAuth));
              return _fbAuth.idToken;
            }
          }
          // 2) cria um usuário anônimo
          const r2 = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ returnSecureToken: true })
          });
          if (r2.ok) {
            const d = await r2.json();
            _fbAuth = { idToken: d.idToken, refreshToken: d.refreshToken, exp: Date.now() + (+d.expiresIn) * 1000 };
            localStorage.setItem('perspectaFbAuth', JSON.stringify(_fbAuth));
            return _fbAuth.idToken;
          }
        } catch (e) {}
        return _fbAuth && _fbAuth.idToken ? _fbAuth.idToken : null;
      })();
      const t = await _fbAuthPromise;
      _fbAuthPromise = null;
      return t;
    }

    // Igual ao fetch(), mas anexa ?auth=token nas chamadas do Firebase.
    // Segurança desligada (sem API key) → fetch normal, comportamento idêntico ao de antes.
    async function authedFetch(url, opts) {
      const token = await ensureFbToken();
      const build = (u, t) => t ? u + (u.includes('?') ? '&' : '?') + 'auth=' + t : u;
      let res = await fetch(build(url, token), opts);
      if (res.status === 401 && FIREBASE_API_KEY) { // token venceu → renova e tenta 1x
        _fbAuth = null;
        const t2 = await ensureFbToken();
        if (t2) res = await fetch(build(url, t2), opts);
      }
      return res;
    }

    // ─────────────────────────────────────────────────────────────
    //  FOTOS — armazenadas SEPARADAS do estado (não incham o sync)
    //  • Fotos enviadas pelo usuário ficam no IndexedDB (local, sem o limite
    //    de 5 MB do localStorage) e na nuvem em /photos/{loja}/{itemId}={b64,tag}.
    //  • No estado só guardamos referências minúsculas: item.photoUpload (bool)
    //    e item.photoTag (muda quando a foto muda → detecta troca entre aparelhos).
    //  • item.foto continua aceitando um arquivo fixo (ex.: "fotos/x.jpg").
    // ─────────────────────────────────────────────────────────────
    let photoMem = {};       // { [itemId]: dataURL }  espelho em memória p/ render síncrono
    let _photoTagMem = {};   // { [itemId]: tag }      versão da foto que está em cache

    const PHOTO_STORE = 'img';
    let _photoDbPromise = null;
    function photoDb() {
      if (_photoDbPromise) return _photoDbPromise;
      _photoDbPromise = new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open('perspectaPhotos', 1);
          req.onupgradeneeded = () => req.result.createObjectStore(PHOTO_STORE);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (e) { reject(e); }
      });
      return _photoDbPromise;
    }
    function _idbReq(mode, fn) {
      return photoDb().then(db => new Promise(resolve => {
        try {
          const r = fn(db.transaction(PHOTO_STORE, mode).objectStore(PHOTO_STORE));
          r.onsuccess = () => resolve(r.result);
          r.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      })).catch(() => null);
    }
    const idbGet = key => _idbReq('readonly', s => s.get(key));
    const idbSet = (key, val) => _idbReq('readwrite', s => s.put(val, key));
    const idbDel = key => _idbReq('readwrite', s => s.delete(key));
    function idbAll() {
      return photoDb().then(db => new Promise(resolve => {
        try {
          const out = {};
          const cur = db.transaction(PHOTO_STORE, 'readonly').objectStore(PHOTO_STORE).openCursor();
          cur.onsuccess = e => { const c = e.target.result; if (c) { out[c.key] = c.value; c.continue(); } else resolve(out); };
          cur.onerror = () => resolve(out);
        } catch (e) { resolve({}); }
      })).catch(() => ({}));
    }
    function photoStoreKey(itemId) { return fbPath(storeKey) + ':' + itemId; }
    function newPhotoTag() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    // Carrega no boot todas as fotos desta loja do IndexedDB para a memória,
    // migra fotos antigas (base64 dentro do estado) e busca novidades na nuvem.
    async function initPhotos() {
      photoMem = {}; _photoTagMem = {};
      const prefix = fbPath(storeKey) + ':';
      const all = await idbAll();
      Object.keys(all || {}).forEach(k => {
        if (k.indexOf(prefix) === 0) {
          const id = k.slice(prefix.length), v = all[k] || {};
          if (v.b64) { photoMem[id] = v.b64; _photoTagMem[id] = v.tag || ''; }
        }
      });
      softRerender();           // mostra de imediato as fotos já em cache
      await migrateInlinePhotos();
      hydratePhotos();          // busca da nuvem o que falta / mudou em outro aparelho
    }

    // Move fotos antigas (base64 dentro do estado) para o armazenamento separado.
    // Roda uma única vez, na primeira abertura com o novo código.
    async function migrateInlinePhotos() {
      let changed = false;
      for (const item of (state.menu || [])) {
        if (typeof item.foto === 'string' && item.foto.startsWith('data:image/')) {
          const tag = newPhotoTag(), b64 = item.foto;
          photoMem[item.id] = b64; _photoTagMem[item.id] = tag;
          await idbSet(photoStoreKey(item.id), { b64, tag });
          syncPhotoToServer(item.id, b64, tag);
          item.foto = null; item.photoUpload = true; item.photoTag = tag;
          changed = true;
        }
      }
      if (changed) save({ silent: true });
    }

    // Busca na nuvem fotos que faltam localmente ou que mudaram em outro aparelho.
    async function hydratePhotos() {
      for (const item of (state.menu || []).filter(m => m.photoUpload)) {
        if (photoMem[item.id] && _photoTagMem[item.id] === (item.photoTag || '')) continue;
        try {
          const r = await authedFetch(`${FIREBASE_URL}/photos/${fbPath(storeKey)}/${item.id}.json`);
          if (!r.ok) continue;
          const data = await r.json();
          const b64 = data && (data.b64 || (typeof data === 'string' ? data : null));
          if (!b64) continue;
          const t = (data && data.tag) || item.photoTag || '';
          photoMem[item.id] = b64; _photoTagMem[item.id] = t;
          idbSet(photoStoreKey(item.id), { b64, tag: t });
          document.querySelectorAll(`img[data-photo-item="${item.id}"]`).forEach(img => { img.src = b64; });
        } catch (e) {}
      }
    }

    function syncPhotoToServer(itemId, b64, tag) {
      try {
        authedFetch(`${FIREBASE_URL}/photos/${fbPath(storeKey)}/${itemId}.json`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ b64, tag })
        }).catch(() => {});
      } catch (e) {}
    }
    function deletePhotoEverywhere(itemId) {
      delete photoMem[itemId]; delete _photoTagMem[itemId];
      idbDel(photoStoreKey(itemId));
      try { authedFetch(`${FIREBASE_URL}/photos/${fbPath(storeKey)}/${itemId}.json`, { method: 'DELETE' }).catch(() => {}); } catch (e) {}
    }

    // Aplica uma foto recém-escolhida: salva local (IndexedDB) + nuvem + marca o item.
    async function setItemPhoto(item, b64) {
      const tag = newPhotoTag();
      photoMem[item.id] = b64; _photoTagMem[item.id] = tag;
      await idbSet(photoStoreKey(item.id), { b64, tag });
      syncPhotoToServer(item.id, b64, tag);
      item.photoUpload = true; item.photoTag = tag; item.foto = null;
    }

    // Resolve qual imagem mostrar: foto enviada (vence) → arquivo fixo → nenhuma.
    function resolvePhoto(item) {
      if (!item) return null;
      if (item.photoUpload && photoMem[item.id]) return photoMem[item.id];
      if (validBundledSrc(item.foto)) return item.foto;
      return null;
    }
    function validBundledSrc(src) {
      return typeof src === 'string' && src.length > 0 &&
        (/^https?:\/\//.test(src) || /^file:\/\//.test(src) || /^data:image\//.test(src) ||
         /^[\w./-]+\.(jpe?g|png|webp|gif|avif)$/i.test(src)); // caminho relativo: fotos/x.jpg
    }
    function hasPhoto(item) { return !!(item && (item.photoUpload || validBundledSrc(item.foto))); }

    // Re-render seguro: não recria a tela se o usuário está digitando ou com modal aberto.
    // Atividade recente — evita re-desenhar/recarregar a tela no meio de um cadastro
    // (era isso que "fechava a tela e sumia o que estava sendo digitado").
    let _lastActivity = 0;
    ['keydown', 'input', 'change', 'pointerdown', 'touchstart', 'click'].forEach(ev =>
      document.addEventListener(ev, () => { _lastActivity = Date.now(); }, true)
    );
    function isUserBusy() {
      const a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
      if (document.querySelector('.pm-overlay:not(.hidden), #kbModal:not(.hidden)')) return true;
      // Mexeu há menos de 30s → ocupada: não apaga o que está fazendo
      if (Date.now() - _lastActivity < 30000) return true;
      return false;
    }
    function softRerender() {
      if (isUserBusy()) return;
      if (location.hash.startsWith('#cardapio-publico')) {
        const pm = document.getElementById('publicMenu');
        if (pm && !pm.classList.contains('hidden')) renderPublicMenu();
      } else {
        const app = document.getElementById('internalApp');
        if (app && !app.classList.contains('hidden')) renderAll();
      }
    }

    function showSyncStatus(status) {
      const el = document.getElementById("syncBadge");
      if (!el) return;
      if (status === 'ok')      { el.textContent = "☁️ sincronizado"; el.style.color = "#1a7a45"; }
      else if (status === 'err'){ el.textContent = "⚠️ sem conexão"; el.style.color = "#c0392b"; }
      else if (status === 'ing'){ el.textContent = "☁️ sincronizando…"; el.style.color = "var(--muted)"; }
      else                      { el.textContent = ""; }
    }

    const PENDING_KEY = () => 'perspectaPending_' + fbPath(storeKey);

    function markPending() { try { localStorage.setItem(PENDING_KEY(), '1'); } catch(e) {} }
    function clearPending() { try { localStorage.removeItem(PENDING_KEY()); } catch(e) {} }
    function hasPending() { return localStorage.getItem(PENDING_KEY()) === '1'; }

    // ── Motor de merge: junta dados por item em vez de sobrescrever o blob ──
    function _recNoTs(r) { const c = { ...r }; delete c.updatedAt; return JSON.stringify(c); }

    // Carimba updatedAt só no que mudou desde o último salvamento (baseline = snap)
    // e registra exclusões como tombstones. Não precisa tocar nas telas de CRUD.
    function stampChanges(cur, snap) {
      const now = Date.now();
      cur._tomb = cur._tomb || {};
      for (const coll of MERGE_COLLECTIONS) {
        const arr = Array.isArray(cur[coll]) ? cur[coll] : [];
        const snapArr = (snap && Array.isArray(snap[coll])) ? snap[coll] : [];
        const snapById = new Map(snapArr.filter(r => r && r.id != null).map(r => [r.id, r]));
        const curIds = new Set();
        for (const r of arr) {
          if (!r || typeof r !== 'object') continue;
          if (r.id == null) r.id = uid();
          curIds.add(r.id);
          const prev = snapById.get(r.id);
          if (!prev) { if (r.updatedAt == null) r.updatedAt = now; }
          else if (_recNoTs(r) !== _recNoTs(prev)) r.updatedAt = now;
          else if (r.updatedAt == null) r.updatedAt = prev.updatedAt || now;
        }
        cur._tomb[coll] = cur._tomb[coll] || {};
        for (const r of snapArr) if (r && r.id != null && !curIds.has(r.id)) cur._tomb[coll][r.id] = now;
      }
      if (!snap || JSON.stringify(cur.settings) !== JSON.stringify(snap.settings)) cur._settingsUpdatedAt = now;
    }

    function _mergeTomb(a, b) {
      const out = {};
      for (const src of [a || {}, b || {}]) for (const coll of Object.keys(src)) {
        out[coll] = out[coll] || {};
        for (const id of Object.keys(src[coll] || {})) out[coll][id] = Math.max(out[coll][id] || 0, src[coll][id] || 0);
      }
      return out;
    }

    // Junta duas listas por id: vence quem tem updatedAt maior; tombstone novo remove.
    function _mergeArr(localArr, serverArr, tombMap) {
      localArr = Array.isArray(localArr) ? localArr : [];
      serverArr = Array.isArray(serverArr) ? serverArr : [];
      const lById = new Map(localArr.filter(r => r && r.id != null).map(r => [r.id, r]));
      const sById = new Map(serverArr.filter(r => r && r.id != null).map(r => [r.id, r]));
      const order = [], seen = new Set();
      for (const r of localArr)  if (r && r.id != null && !seen.has(r.id)) { order.push(r.id); seen.add(r.id); }
      for (const r of serverArr) if (r && r.id != null && !seen.has(r.id)) { order.push(r.id); seen.add(r.id); }
      const out = [];
      for (const id of order) {
        const l = lById.get(id), s = sById.get(id);
        const pick = (l && s) ? (((s.updatedAt || 0) > (l.updatedAt || 0)) ? s : l) : (l || s);
        const td = tombMap && tombMap[id];
        if (td && td >= (pick.updatedAt || 0)) continue; // exclusão mais nova vence
        out.push(pick);
      }
      return out;
    }

    function mergeStates(server, local) {
      const out = { ...structuredClone(defaultState), ...structuredClone(local) };
      const tomb = _mergeTomb(server && server._tomb, local && local._tomb);
      out._tomb = tomb;
      for (const coll of MERGE_COLLECTIONS) out[coll] = _mergeArr(local && local[coll], server && server[coll], tomb[coll]);
      const sT = (server && server._settingsUpdatedAt) || 0, lT = (local && local._settingsUpdatedAt) || 0;
      if (sT > lT && server.settings) { out.settings = server.settings; out._settingsUpdatedAt = sT; }
      else out._settingsUpdatedAt = lT;
      out.savedAt = Math.max((server && server.savedAt) || 0, (local && local.savedAt) || 0);
      return out;
    }

    // Envia para a nuvem com merge: lê o servidor, junta com o local e regrava.
    // Assim dois aparelhos salvando ao mesmo tempo não apagam o trabalho um do outro.
    let _syncing = false, _syncQueued = false;
    async function syncToServer() {
      if (_syncing) { _syncQueued = true; return; }
      _syncing = true;
      showSyncStatus('ing');
      const path = fbPath(storeKey);
      try {
        let server = null;
        try {
          const ctrl = new AbortController();
          const tmo = setTimeout(() => ctrl.abort(), 15000);
          const r = await authedFetch(`${FIREBASE_URL}/data/${path}.json`, { signal: ctrl.signal });
          clearTimeout(tmo);
          if (r.ok) server = await r.json();
        } catch (e) {}
        const merged = server ? mergeStates(server, state) : state;
        merged.savedAt = Date.now();
        const ctrl2 = new AbortController();
        const tmo2 = setTimeout(() => ctrl2.abort(), 20000);
        const w = await authedFetch(`${FIREBASE_URL}/data/${path}.json`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(merged), signal: ctrl2.signal
        });
        clearTimeout(tmo2);
        if (w.ok) {
          state = normalizeState(merged);
          localStorage.setItem(storeKey, JSON.stringify(state));
          clearPending(); showSyncStatus('ok');
          if (!isUserBusy()) { softRerender(); hydratePhotos(); }
        } else { markPending(); showSyncStatus('err'); }
      } catch (e) { markPending(); showSyncStatus('err'); }
      finally {
        _syncing = false;
        if (_syncQueued) { _syncQueued = false; setTimeout(syncToServer, 200); }
      }
    }

    // Puxa da nuvem e junta (sem apagar o que é local). Não recria a tela se o
    // usuário está digitando/com modal aberto. Reenvia pendências, se houver.
    async function pollSync() {
      if (isUserBusy()) return;
      try {
        const server = await loadFromServer();
        if (server) {
          const merged = mergeStates(server, state);
          if (JSON.stringify(merged) !== JSON.stringify(state)) {
            state = normalizeState(merged);
            localStorage.setItem(storeKey, JSON.stringify(state));
            softRerender();
            hydratePhotos();
          }
          showSyncStatus('ok');
        }
        if (hasPending()) syncToServer();
      } catch (e) { showSyncStatus('err'); }
    }

    // Reenvio automático se ficou pendente da última vez
    async function flushPending() {
      if (!hasPending()) return;
      syncToServer(); // reenvia com merge (não sobrescreve o que outro aparelho salvou)
    }

    // Verifica pedidos pendentes feitos pelo cardápio público e cria comandas automaticamente
    async function checkPendingOrders() {
      if (!storeKey) return;
      try {
        const path = fbPath(storeKey);
        const r = await authedFetch(`${FIREBASE_URL}/orders/${path}.json`);
        if (!r.ok) return;
        const orders = await r.json();
        if (!orders || typeof orders !== 'object') return;
        let newCmds = 0;
        for (const [orderId, order] of Object.entries(orders)) {
          // Ignora se já foi processado (comanda aberta ou fechada com esse sourceOrderId)
          if ((state.commands || []).find(c => c.sourceOrderId === orderId)) continue;
          if ((state.sales || []).find(s => s.sourceOrderId === orderId)) continue;
          state.commands = state.commands || [];
          state.commands.push({
            id: uid(),
            sourceOrderId: orderId,
            local: order.local || "Cardápio online",
            cliente: order.nome || "WhatsApp",
            pessoas: 1,
            status: "aberta",
            itens: Array.isArray(order.itens) ? order.itens : [],
            pagamentos: [],
            createdAt: order.createdAt || new Date().toISOString(),
            source: "whatsapp",
            referencia: order.referencia || "",
            tipoEntrega: order.tipo || "retirada",
            tipoLabel: order.tipoLabel || "",
            telefone: order.telefone || ""
          });
          ensureClientFromCommand(order.nome || "WhatsApp");
          newCmds++;
          // Remove o pedido do Firebase após processar
          authedFetch(`${FIREBASE_URL}/orders/${path}/${orderId}.json`, { method: 'DELETE' }).catch(() => {});
        }
        if (newCmds > 0) {
          save();
          showToast(`📲 ${newCmds} novo${newCmds > 1 ? 's' : ''} pedido${newCmds > 1 ? 's' : ''} chegou!`, 4000);
        }
      } catch(e) {}
    }

    async function loadFromServer() {
      try {
        const path = fbPath(storeKey);
        const r = await authedFetch(`${FIREBASE_URL}/data/${path}.json`);
        if (!r.ok) return null;
        const data = await r.json();
        return data; // Firebase returns null if path is empty
      } catch(e) { return null; }
    }

    function save(opts = {}) {
      try {
        // baseline = último estado salvo no localStorage; carimba só o que mudou
        let snap = null;
        try { snap = JSON.parse(localStorage.getItem(storeKey) || 'null'); } catch (e) {}
        stampChanges(state, snap);
        state.savedAt = Date.now();
        localStorage.setItem(storeKey, JSON.stringify(state));
        if (!opts.silent) renderAll();
        syncToServer();
      } catch (error) {
        alert("Não foi possível salvar. Tente novamente; se persistir, recarregue a página.");
      }
    }

    function saveMenuRow(row, item) {
      if (!row || !item) return;
      item.nome = row.querySelector("[data-edit-menu-name]").value;
      item.descricao = row.querySelector("[data-edit-menu-desc]").value;
      item.emoji = row.querySelector("[data-edit-menu-emoji]").value || "🍽️";
      item.categoria = row.querySelector("[data-edit-menu-category]").value;
      item.preco = num(row.querySelector("[data-edit-menu-price]").value);
      item.ativo = row.querySelector("[data-edit-menu-active]").value === "true";
    }

    // mantido por compatibilidade; agora delega para a resolução de fotos nova
    function validPhotoSrc(src) { return validBundledSrc(src); }

    function menuPhotoPreview(item) {
      const src = resolvePhoto(item);
      if (!src) return `<span class="menu-thumb-empty">${escapeHTML(item.emoji || "🍽️")}</span>`;
      return `<img class="menu-thumb" src="${src}" data-photo-item="${item.id}" alt="${escapeHTML(item.nome)}" data-emoji="${escapeHTML(item.emoji || "🍽️")}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'menu-thumb-empty',textContent:this.dataset.emoji||'🍽️'}))">`;
    }

    function money(value) {
      return BRL.format(Number(value || 0));
    }

    function num(value) {
      return Number(String(value ?? "").replace(",", ".")) || 0;
    }

    function convertToBase(value, unit) {
      const amount = num(value);
      if (unit === "kg" || unit === "l") return amount * 1000;
      if (unit === "g" || unit === "ml" || unit === "un") return amount;
      return amount;
    }

    function inventoryMatchByName(name, inventory = state.inventory || []) {
      const normalized = String(name || "").trim().toLowerCase();
      return inventory.find(item => String(item.item || "").trim().toLowerCase() === normalized);
    }

    function inventoryById(id) {
      return (state.inventory || []).find(item => item.id === id);
    }

    function purchaseUnitCost(row) {
      const base = convertToBase(row.quantidadeCompra || 1, row.unidadeCompra || "un");
      return base ? num(row.precoCompra) / base : 0;
    }

    function inventoryUnitCost(item) {
      if (!item) return 0;
      const base = convertToBase(1, item.unidade || "un");
      return base ? num(item.custo) / base : 0;
    }

    function currentIngredientUnitCost(row) {
      const inventory = inventoryById(row.inventoryId) || inventoryMatchByName(row.nome);
      return inventory ? inventoryUnitCost(inventory) : purchaseUnitCost(row);
    }

    // Perda/merma: ingrediente que perde X% no preparo (ex.: carne -18% ao cozinhar).
    // A perda NÃO altera o custo — o valor pago pelo que foi usado segue o mesmo.
    // Ela só indica que RENDE MENOS: yieldFactor = (1 − perda%). Perda 0 = sem efeito.
    function yieldFactor(row) {
      const p = num(row && row.perda) || 0;      // perda: rende MENOS (ex.: carne -18%)
      const a = num(row && row.aumento) || 0;    // aumento: rende MAIS (ex.: arroz +150%)
      const fPerda = (p > 0 && p < 100) ? (1 - p / 100) : 1;
      const fAumento = a > 0 ? (1 + a / 100) : 1;
      return fPerda * fAumento;                   // nenhum dos dois mexe no custo, só na quantidade
    }

    // Quantidade que sobra depois da perda, já em unidade legível
    // (ex.: 1 kg com 18% de perda → "820 g").
    function usableQtyLabel(row) {
      const base = convertToBase(num(row.quantidadeUsada), row.unidadeUsada) * yieldFactor(row);
      const u = (row.unidadeUsada || "").toLowerCase();
      const fmt = n => (Math.round(n * 100) / 100).toString().replace(".", ",");
      if (u === "kg" || u === "g") return base >= 1000 ? fmt(base / 1000) + " kg" : Math.round(base) + " g";
      if (u === "l" || u === "ml") return base >= 1000 ? fmt(base / 1000) + " l" : Math.round(base) + " ml";
      return fmt(base) + " un";
    }

    function ingredientCost(row) {
      if (row.costId) {
        const sub = state.costs.find(c => c.id === row.costId);
        if (sub) return costCalc(sub).costPerUnit * num(row.quantidadeUsada);
      }
      const usedBase = convertToBase(row.quantidadeUsada, row.unidadeUsada);
      const unitCost = currentIngredientUnitCost(row);
      return unitCost * usedBase;
    }

    function ingredientOriginalCost(row) {
      const usedBase = convertToBase(row.quantidadeUsada, row.unidadeUsada);
      return num(row.baseUnitCost || purchaseUnitCost(row)) * usedBase;
    }

    // ── FIFO ────────────────────────────────────────────────
    function fifoBatchesForItem(inventoryId) {
      return (state.inventoryBatches || [])
        .filter(b => b.inventoryId === inventoryId && num(b.quantidadeRestante) > 0)
        .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    }

    // Custo FIFO por unidade do insumo (R$ / unidade do estoque)
    function fifoCostForItem(inventoryId) {
      const batches = fifoBatchesForItem(inventoryId);
      return batches.length ? num(batches[0].custo) : null;
    }

    // Consome lotes FIFO na baixa
    function consumeFIFO(inventoryId, quantidade) {
      let remaining = num(quantidade);
      for (const batch of fifoBatchesForItem(inventoryId)) {
        if (remaining <= 0) break;
        const consume = Math.min(remaining, num(batch.quantidadeRestante));
        batch.quantidadeRestante = Math.max(0, num(batch.quantidadeRestante) - consume);
        remaining -= consume;
      }
    }

    // Detecta fichas de custo com mudança de preço FIFO
    function fifoAlerts() {
      const alerts = [];
      (state.costs || []).forEach(recipe => {
        (recipe.ingredientes || []).forEach(ing => {
          const inv = inventoryById(ing.inventoryId);
          if (!inv) return;
          const fifo = fifoCostForItem(inv.id);
          if (fifo === null) return;
          const base = num(ing.baseUnitCost) * convertToBase(1, inv.unidade || "un");
          const delta = fifo - base;
          if (Math.abs(delta) >= 0.01) {
            alerts.push({ recipe: recipe.produto, ingredient: ing.nome, base, fifo, delta, pct: base ? ((delta / base) * 100) : 0 });
          }
        });
      });
      return alerts;
    }

    // Dimensão da unidade — evita comparar coisas incompatíveis (un × kg dá conta errada)
    function unitDim(u) {
      u = (u || "").toLowerCase();
      if (u === "kg" || u === "g") return "peso";
      if (u === "l" || u === "ml") return "volume";
      return "un";
    }

    function ingredientChange(row) {
      // Sub-receita (preparo): o custo vem da ficha do preparo, NUNCA do estoque/FIFO.
      // (Sem isso, uma massa-preparo ligada a um item de estoque em kg dava R$0,01 no lugar de R$0,53.)
      if (row.costId && state.costs.find(c => c.id === row.costId)) {
        const c = ingredientCost(row);
        return { current: c, original: c, delta: 0, changed: false, isFifo: false };
      }
      const inv = inventoryById(row.inventoryId);
      const fifoRaw = inv ? fifoCostForItem(inv.id) : null;
      // Só compara FIFO quando a unidade usada é compatível com a do estoque
      // (peso com peso, volume com volume). Senão, cai no custo normal — sem conta sem sentido.
      const sameDim = !!inv && unitDim(row.unidadeUsada) === unitDim(inv.unidade);
      // fifoCostForItem retorna custo por unidade de estoque (ex: R$/kg)
      // precisa normalizar para por unidade base (R$/g) antes de multiplicar por convertToBase
      const stockBase = inv ? (convertToBase(1, inv.unidade || "un") || 1) : 1;
      const fifoPerBase = (fifoRaw !== null && sameDim) ? fifoRaw / stockBase : null;
      const current = fifoPerBase !== null
        ? fifoPerBase * convertToBase(num(row.quantidadeUsada), row.unidadeUsada || inv?.unidade || "un")
        : ingredientCost(row);
      const original = ingredientOriginalCost(row);
      const delta = current - original;
      return { current, original, delta, changed: Math.abs(delta) >= 0.01, isFifo: fifoRaw !== null && sameDim };
    }

    function costCalc(row) {
      const ingredientTotal = (row.ingredientes || []).reduce((sum, item) => sum + ingredientCost(item), 0);
      const totalRecipe = ingredientTotal + num(row.outrosCustos);
      const costPerUnit = totalRecipe / Math.max(1, num(row.rendimento));
      // Preço de venda: se a pessoa fixar um valor (precoVenda), ele manda e o lucro é derivado.
      // Se não, o lucro (margem) manda e o preço é sugerido — bidirecional.
      const precoManual = num(row.precoVenda) > 0;
      const suggested = precoManual ? num(row.precoVenda) : costPerUnit * (1 + num(row.margem) / 100);
      const profitValue = suggested - costPerUnit;
      const margemEfetiva = costPerUnit > 0 ? (suggested / costPerUnit - 1) * 100 : num(row.margem);
      return { ingredientCost: ingredientTotal, totalRecipe, costPerUnit, profitValue, suggested: isFinite(suggested) ? suggested : 0, margemEfetiva, precoManual };
    }

    function commandTotal(command) {
      return (command.itens || []).reduce((sum, item) => sum + commandItemTotal(item), 0);
    }

    function commandItemAddons(item) {
      return (item.adicionais || []).map(addon => typeof addon === "string" ? { id: "", nome: addon, preco: 0 } : { preco: 0, ...addon });
    }

    function commandItemTotal(item) {
      const addonsTotal = commandItemAddons(item).reduce((sum, addon) => sum + num(addon.preco), 0);
      return (num(item.preco) + addonsTotal) * Math.max(1, num(item.quantidade));
    }

    function commandStatus(command) {
      if (command.closedAt) return "fechada";
      if (command.paidAt) return "paga";
      if (command.deliveredAt) return "entregue";
      if (command.kitchenSentAt) return "cozinha";
      return "aberta";
    }

    function commandStatusText(command) {
      const status = commandStatus(command);
      const labels = {
        aberta: "Montando pedido",
        cozinha: "Enviado para cozinha",
        entregue: "Pedido entregue",
        paga: `Pago${command.paymentMethod ? ` em ${command.paymentMethod}` : ""}`,
        fechada: "Fechada"
      };
      return labels[status] || "Aberta";
    }

    function todaySales() {
      const today = todayISO();
      return state.sales.filter(s => (s.createdAt || "").slice(0, 10) === today);
    }

    function monthEntries() {
      const ym = todayISO().slice(0, 7);
      return state.expenses.filter(e => (e.vencimento || "").slice(0, 7) === ym || e.recorrencia === "mensal");
    }

    function escapeHTML(text) {
      return String(text ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
    }

    // ── Custom select helpers ──
    function cselBuild(name, opts, selected, style = "") {
      const match = opts.find(o => String(o.v) === String(selected));
      const selLabel = (match || opts[0])?.l || "";
      const selVal   = String((match || opts[0])?.v ?? selected ?? "");
      const items = opts.length
        ? opts.map(o => `<div class="csel-opt${String(o.v)===String(selected)?" sel":""}" data-v="${escapeHTML(String(o.v))}">${escapeHTML(o.l)}</div>`).join("")
        : `<div style="padding:10px 14px;font-size:12px;color:var(--muted)">Nenhuma opção cadastrada</div>`;
      return `<div class="csel" style="${style}"><div class="csel-trigger"><span class="csel-val">${escapeHTML(selLabel)}</span></div><div class="csel-drop">${items}</div><input type="hidden" name="${escapeHTML(name)}" value="${escapeHTML(selVal)}"></div>`;
    }
    document.addEventListener("click", e => {
      const opt = e.target.closest(".csel-opt");
      if (opt) {
        const csel = opt.closest(".csel");
        csel.querySelector("input[type=hidden]").value = opt.dataset.v;
        csel.querySelector(".csel-val").textContent = opt.textContent;
        csel.querySelectorAll(".csel-opt").forEach(o => o.classList.toggle("sel", o === opt));
        csel.querySelector(".csel-drop").classList.remove("open");
        csel.dispatchEvent(new Event("change", { bubbles: true }));
        return;
      }
      const trigger = e.target.closest(".csel-trigger");
      if (trigger) {
        const csel = trigger.closest(".csel");
        const drop = csel.querySelector(".csel-drop");
        const isOpen = drop.classList.contains("open");
        document.querySelectorAll(".csel-drop.open").forEach(d => d.classList.remove("open"));
        if (!isOpen) { drop.classList.add("open"); drop.scrollTop = 0; }
        return;
      }
      if (!e.target.closest(".csel")) {
        document.querySelectorAll(".csel-drop.open").forEach(d => d.classList.remove("open"));
      }
    });

    // Custo/un digitado → calcula total
    function calcCustoDir() {
      const q = parseFloat(document.getElementById('invQtd')?.value) || 0;
      const c = parseFloat(document.getElementById('invCusto')?.value) || 0;
      const el = document.getElementById('invCustoTotal');
      if (el && q && c) el.value = (q * c).toFixed(2);
      else if (el) el.value = '';
    }
    // Custo total digitado → calcula custo/un
    function calcCustoRev() {
      const q = parseFloat(document.getElementById('invQtd')?.value) || 0;
      const t = parseFloat(document.getElementById('invCustoTotal')?.value) || 0;
      const el = document.getElementById('invCusto');
      if (el && q && t) el.value = (t / q).toFixed(4);
      else if (el) el.value = '';
    }

    function whatsappLink(phone, message = "") {
      const clean = String(phone || "").replace(/\D/g, "");
      return `https://wa.me/${clean}?text=${encodeURIComponent(message)}`;

    function icon(name) {

      document.getElementById("nav").innerHTML = orderedMenuItems().map(({ id, label }) =>
        `<button class="${id === activeSection() ? "active" : ""}" data-section="${id}">${icon(id)}<span>${escapeHTML(label)}</span></button>`
      ).join("");
    }

    function activeSection() {
      return document.querySelector(".section.active")?.id || "dashboard";
    }

    function setSection(id) {
      document.querySelectorAll(".section").forEach(s => s.classList.toggle("active", s.id === id));
      updatePageHeader(id);
      renderNav();
      window.location.hash = id;
    }

      const [title, subtitle] = pageCopy[id] || pageCopy.dashboard;

      document.getElementById("pageSubtitle").textContent = subtitle;

    function renderDashboard() {
      const sales = todaySales();

      const ticket = clients ? total / clients : 0;
      const ranking = productRanking().slice(0, 5);

      // ── Datas ──
      const _iso2 = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      const _sum2 = orders => orders.reduce((s,o) => s + num(o.total || commandTotal(o)), 0);
      const todayD = new Date(); todayD.setHours(0,0,0,0);
      const todayStr = _iso2(todayD);
      const yesterdayD = new Date(todayD); yesterdayD.setDate(todayD.getDate()-1);
      const sdlmD = new Date(todayD); sdlmD.setMonth(todayD.getMonth()-1);
      const sdlyD = new Date(todayD); sdlyD.setFullYear(todayD.getFullYear()-1);

      // ── Pedidos por período ──
      const ordersHoje  = ordersForRange(todayStr, todayStr);
      const totalHoje   = _sum2(ordersHoje);
      const countHoje   = ordersHoje.length;
      const mondayD = new Date(todayD); mondayD.setDate(todayD.getDate() - (todayD.getDay()===0?6:todayD.getDay()-1));
      const countSemana = ordersForRange(_iso2(mondayD), todayStr).length;
      const firstMesD   = new Date(todayD.getFullYear(), todayD.getMonth(), 1);
      const ordersMonth = ordersForRange(_iso2(firstMesD), todayStr);
      const countMes    = ordersMonth.length;
      const totalMes    = _sum2(ordersMonth);

      // ── Comparativos ──
      const totalOntem = _sum2(ordersForRange(_iso2(yesterdayD), _iso2(yesterdayD)));
      const totalSdlm  = _sum2(ordersForRange(_iso2(sdlmD),     _iso2(sdlmD)));
      const totalSdly  = _sum2(ordersForRange(_iso2(sdlyD),     _iso2(sdlyD)));
      const firstLYD   = new Date(todayD.getFullYear()-1, todayD.getMonth(), 1);
      const lastLYD    = new Date(todayD.getFullYear()-1, todayD.getMonth()+1, 0);
      const totalMesLY = _sum2(ordersForRange(_iso2(firstLYD), _iso2(lastLYD)));

      const _delta2 = (cur, prev) => {
        if (!prev) return { txt: cur > 0 ? "+100%" : "—", ok: cur > 0 ? true : null };
        const p = (cur - prev) / prev * 100;
        return { txt: (p>=0?"+":"") + p.toFixed(1)+"%", ok: p >= 0 };

      const _dc2 = ok => ok === null ? "#999" : ok ? "#1a7a45" : "#c0392b";
      const dOntem = _delta2(totalHoje, totalOntem);

      // ── Lucro estimado hoje ──
      let _custoHoje = 0, _semFH = 0, _comFH = 0;
      ordersHoje.forEach(order => {

          if (!recipe) { _semFH++; return; }
          _comFH++;
          const ci = costCalc(recipe);
          _custoHoje += ci.costPerUnit * qty;
        });
      });

      const margemH    = (_comFH > 0 && totalHoje > 0) ? (lucroHoje / totalHoje * 100) : null;
      const margemCorH = margemH === null ? "#999" : margemH >= 60 ? "#1a7a45" : margemH >= 35 ? "#a07000" : "#c0392b";

      // ── Meta do dia ──

      const metaCor    = metaPct >= 100 ? "#1a7a45" : metaPct >= 70 ? "#a07000" : "var(--brand)";

      document.getElementById("dashboard").innerHTML = `
        <div class="grid metrics">
          ${metric("Faturamento hoje", money(totalHoje), dOntem.ok !== null ? dOntem.txt+" vs ontem" : "hoje", false)}
          ${metric("Ticket médio", money(ticket), clients ? ""+clients+" cliente(s)" : "—", false)}
          ${metric("Clientes atendidos", clients, "mesas + balcão", false)}
          <div class="metric metric-vendidos">
            <div class="label">Mais vendidos</div>
            <div class="metric-vendidos-list">
              ${ranking.length
                ? ranking.slice(0,3).map(p => `<div class="metric-vendidos-row"><span>${escapeHTML(p.nome)}</span><span>${p.quantidade}x</span></div>`).join("")

            </div>

        </div>

            <h2 style="margin:0">🎯 Meta do dia</h2>
            <form id="metaDiaForm" style="display:flex;gap:6px;align-items:center">
              <span style="font-size:11px;color:var(--muted)">Meta:</span>
              <input name="metaDia" type="number" min="0" step="50" value="${metaDia || ""}" placeholder="R$ 0"
                style="width:80px;padding:4px 8px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--text)">
              <button class="btn secondary" type="submit" style="padding:4px 10px;font-size:11px">Salvar</button>
            </form>
          </div>
          ${metaDia > 0 ? `
            <div style="height:14px;border-radius:7px;background:#e8e0d8;overflow:hidden;margin-bottom:8px">
              <div style="height:100%;width:${metaPct.toFixed(1)}%;background:${metaCor};border-radius:7px"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:12px">
              <strong style="color:${metaCor}">${metaPct.toFixed(0)}% atingido</strong>
              <span style="color:var(--muted)">${money(totalHoje)} de ${money(metaDia)}${metaFaltam > 0 ? " · faltam "+money(metaFaltam) : " ✓"}</span>
            </div>
          ` : `<p class="mini" style="color:var(--muted)">Defina uma meta acima para acompanhar o progresso.</p>`}
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">
          <article style="background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)">
            <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Hoje</div>
            <div style="font-size:9px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.5px">pedidos</div>
            <div style="font-size:22px;font-weight:800;margin:1px 0 1px">${countHoje}</div>
            <div style="font-size:11px;color:var(--muted)">${totalHoje > 0 ? money(totalHoje) : "Nenhum"}</div>
          </article>
          <article style="background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)">
            <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Esta semana</div>
            <div style="font-size:9px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.5px">pedidos</div>
            <div style="font-size:22px;font-weight:800;margin:1px 0 1px">${countSemana}</div>
            <div style="font-size:11px;color:var(--muted)">desde segunda</div>
          </article>
          <article style="background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)">
            <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Este mês</div>
            <div style="font-size:9px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.5px">pedidos</div>
            <div style="font-size:22px;font-weight:800;margin:1px 0 1px">${countMes}</div>
            <div style="font-size:11px;color:var(--muted)">${money(totalMes)}</div>
          </article>
        </div>

        <div class="panel" style="margin-top:14px">
          <h2>📊 Comparativos de faturamento</h2>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
            <div style="padding:10px 12px;border-radius:10px;background:var(--panel-2)">
              <div style="font-size:11px;color:var(--muted);margin-bottom:2px">vs Ontem (${_iso2(yesterdayD).slice(5).replace("-","/")})</div>
              <div style="font-size:20px;font-weight:800;color:${_dc2(dOntem.ok)}">${dOntem.txt}</div>
              <div style="font-size:11px;color:var(--muted)">${totalOntem > 0 ? "Ontem: "+money(totalOntem) : "Sem dados ontem"}</div>
            </div>
            <div style="padding:10px 12px;border-radius:10px;background:var(--panel-2)">
              <div style="font-size:11px;color:var(--muted);margin-bottom:2px">vs Mesmo dia mês passado</div>
              <div style="font-size:20px;font-weight:800;color:${_dc2(dSdlm.ok)}">${dSdlm.txt}</div>
              <div style="font-size:11px;color:var(--muted)">${totalSdlm > 0 ? _iso2(sdlmD).slice(5).replace("-","/")+": "+money(totalSdlm) : "Sem dados"}</div>
            </div>
            <div style="padding:10px 12px;border-radius:10px;background:var(--panel-2)">
              <div style="font-size:11px;color:var(--muted);margin-bottom:2px">vs Mesmo dia ano passado</div>
              <div style="font-size:20px;font-weight:800;color:${_dc2(dSdly.ok)}">${dSdly.txt}</div>
              <div style="font-size:11px;color:var(--muted)">${totalSdly > 0 ? _iso2(sdlyD).slice(5).replace("-","/")+": "+money(totalSdly) : "Sem dados"}</div>
            </div>
            <div style="padding:10px 12px;border-radius:10px;background:var(--panel-2)">

              ${simpleCard("Vendas hoje", money(totalHoje), "Total faturado no dia.")}

              <article class="simple-card"><span class="mini">Margem hoje</span><strong style="font-size:22px;color:${margemCorH}">${margemH.toFixed(1).replace(".",",")}%</strong><p class="mini">Lucro: ${money(lucroHoje)}</p></article>
            </div>
          ` : `<p class="mini" style="color:var(--muted);padding:4px 0">Cadastre fichas de custo nos produtos para ver o lucro estimado.</p>`}

        <div class="panel" style="margin-top:14px">

    function tableMap(draggable = false, allowOpen = true) {
      const open = state.commands.filter(c => c.status === "aberta");
      const onlyActive = Boolean(state.settings.tableOnlyActive);
      const content = (state.tables || []).sort((a, b) => num(a.ordem) - num(b.ordem)).map(table => {
        const command = open.find(c => c.local.toLowerCase() === table.nome.toLowerCase());
        if (onlyActive && !command) return "";
        const tileSize = Math.max(108, Math.min(180, num(table.tamanho || state.settings.tableTileSize || 118)));
        const minutes = command ? Math.max(1, Math.round((Date.now() - new Date(command.createdAt).getTime()) / 60000)) : 0;
        const status = tableStatus(command);
        const style = draggable ? `style="--table-size:${tileSize}px;left:${Math.max(0, Math.min(88, num(table.x)))}%;top:${Math.max(0, Math.min(80, num(table.y)))}%"` : `style="--table-size:${tileSize}px"`;
        const openAttr = allowOpen ? `data-open-table="${escapeHTML(table.nome)}"` : "";
        const showMinutes = command && !command.deliveredAt && !command.paidAt;
        const statusText = command ? `${status.label}${showMinutes ? ` · ${minutes} min` : ""}` : "Livre";
        const paidBadge = command?.paidAt ? `<span class="table-paid-badge" title="Pago">✓</span>` : "";
        const mainText = command ? escapeHTML(command.cliente || "Avulso") : escapeHTML(table.nome);
        const subText = command ? `<span class="table-name">${escapeHTML(table.nome)}</span>` : "";
        return `<button class="table-tile ${status.className}" ${style} data-table-id="${table.id}" ${openAttr}>
          ${paidBadge}
          <div><strong class="table-client">${mainText}</strong>${subText}<span class="table-status">${statusText}</span></div>
          <span class="table-resize-handle" data-resize-tables title="Ajustar tamanho das mesas"></span>
        </button>`;
      }).join("");
      const emptyMessage = onlyActive && !content.trim() ? `<div class="empty">Nenhuma mesa ativa agora.</div>` : "";
      return draggable ? `<div class="floor-plan" id="floorPlan">${content}${emptyMessage}</div>` : `<div class="floor-grid">${content}${emptyMessage}</div>`;
    }

    function tableStatus(command) {
      if (!command) return { className: "free", label: "Livre" };
      if (command.paidAt) return { className: "paid", label: "Pago" };
      if (command.deliveredAt) return { className: "delivered", label: "Comendo" };
      if (command.kitchenSentAt) return { className: "kitchen", label: "Cozinha" };
      return { className: "busy", label: "Ocupada" };
    }

    function tableMapControls() {
      const size = Math.max(108, Math.min(180, num(state.settings.tableTileSize || 132)));
      const checked = state.settings.tableOnlyActive ? "checked" : "";
      return `<div class="map-toolbar">
        <label>Tamanho das mesas <input data-table-size type="range" min="108" max="180" value="${size}"></label>
        <label class="map-toggle"><input data-active-tables-only type="checkbox" ${checked}> Só mesas ativas</label>
      </div>`;
    }

    function tableLegend() {
      return `<div class="map-legend">
        <span><i class="legend-dot"></i>Livre</span>
        <span><i class="legend-dot busy"></i>Ocupada</span>
        <span><i class="legend-dot kitchen"></i>Cozinha</span>
        <span><i class="legend-dot delivered"></i>Comendo</span>
        <span><i class="legend-dot paid"></i>Pago</span>
      </div>`;
    }

    function tableVisitorsToday(tableName) {
      const normalized = String(tableName || "").toLowerCase();
      const closedVisitors = todaySales()
        .filter(sale => String(sale.local || "").toLowerCase() === normalized)
        .reduce((sum, sale) => sum + Math.max(1, num(sale.pessoas || 1)), 0);
      const openVisitors = state.commands
        .filter(command => command.status === "aberta" && String(command.local || "").toLowerCase() === normalized)
        .reduce((sum, command) => sum + Math.max(1, num(command.pessoas || 1)), 0);
      return closedVisitors + openVisitors;
    }

    function stockAlerts() {
      const now = Date.now();
      const week = 7 * 24 * 60 * 60 * 1000;
      const low = (state.inventory || []).filter(item => num(item.quantidade) <= num(item.minimo));
      const expiring = (state.inventory || []).filter(item => {
        if (!item.validade) return false;
        const diff = new Date(item.validade).getTime() - now;
        return diff >= 0 && diff <= week;
      });
      const expired = (state.inventory || []).filter(item => {
        if (!item.validade) return false;
        return new Date(item.validade).getTime() < now;
      });
      if (!low.length && !expiring.length && !expired.length) return empty("Nada faltando agora.");
      return [
        ...expired.map(item => `<div class="product-row"><div><strong>${escapeHTML(item.item)}</strong><span>Vencido em ${new Date(item.validade).toLocaleDateString("pt-BR")}</span></div><span class="status paused">vencido</span></div>`),
        ...expiring.map(item => {
          const dias = Math.ceil((new Date(item.validade).getTime() - now) / (24*60*60*1000));
          return `<div class="product-row"><div><strong>${escapeHTML(item.item)}</strong><span>Vence em ${dias} dia${dias !== 1 ? "s" : ""} (${new Date(item.validade).toLocaleDateString("pt-BR")})</span></div><span class="status" style="background:#fff3cd;color:#856404">validade</span></div>`;
        }),
        ...low.map(item => `<div class="product-row"><div><strong>${escapeHTML(item.item)}</strong><span>Tem ${item.quantidade}${item.unidade}; mínimo ${item.minimo}${item.unidade}</span></div><span class="status paused">repor</span></div>`)
      ].join("");
    }

    function metric(label, value, delta, bad) {
      return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div><div class="delta ${bad ? "bad" : ""}">${delta}</div></div>`;
    }

    function moduleCard(title, text, tags) {
      return `<article class="module-card"><h3>${title}</h3><p>${text}</p><div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join("")}</div></article>`;
    }

    function bar(label, pct) {
      return `<div class="bar-line"><span>${label}</span><div class="bar"><i style="width:${pct}%"></i></div><strong>${pct}%</strong></div>`;
    }

    function flow(title, sub, iconName) {
      return `<button class="flow-step" data-section="${iconName}">${icon(iconName)}<strong>${title}</strong><span>${sub}</span></button>`;
    }

    function cashToday() {
      const today = todayISO();
      return (state.cash || []).filter(row => (row.createdAt || "").slice(0, 10) === today);
    }

    function cashBalance(rows = cashToday()) {
      return rows.reduce((sum, row) => sum + (row.tipo === "saida" ? -num(row.valor) : num(row.valor)), 0);
    }

    function cashByMethod(rows = cashToday(), method) {
      return rows
        .filter(row => row.forma === method && row.tipo === "entrada" && row.descricao !== "Abertura de caixa")
        .reduce((sum, row) => sum + num(row.valor), 0);
    }

    function currentCashSession() {
      const today = todayISO();
      return (state.cashSessions || []).find(session => session.date === today && session.status === "aberto") || null;
    }

    function lastCashSession() {
      const today = todayISO();
      return (state.cashSessions || []).filter(session => session.date === today).slice(-1)[0] || null;
    }

    function renderCash() {
      const rows = cashToday();
      const entradas = rows.filter(r => r.tipo === "entrada").reduce((s, r) => s + num(r.valor), 0);
      const saidas = rows.filter(r => r.tipo === "saida").reduce((s, r) => s + num(r.valor), 0);
      const entradasDinheiro = rows.filter(r => r.forma === "dinheiro" && r.tipo === "entrada").reduce((s, r) => s + num(r.valor), 0);
      const saidasDinheiro = rows.filter(r => r.forma === "dinheiro" && r.tipo === "saida").reduce((s, r) => s + num(r.valor), 0);
      const dinheiro = entradasDinheiro - saidasDinheiro;
      const methodTotals = [
        ["dinheiro", "Dinheiro"],
        ["pix", "Pix"],
        ["debito", "Débito"],
        ["credito", "Crédito"]
      ];
      const session = currentCashSession();
      const lastSession = lastCashSession();

      document.getElementById("caixa").innerHTML = `
        <div class="panel">
          <h2>Status do caixa</h2>
          <div class="summary-strip" style="grid-template-columns:repeat(4,minmax(0,1fr))">
            <div><span>Abertura</span><strong>${session ? money(session.openingAmount) : lastSession?.openingAmount ? money(lastSession.openingAmount) : money(0)}</strong></div>
            <div><span>Entradas</span><strong>${money(entradas)}</strong></div>
            <div><span>Saídas</span><strong>${money(saidas)}</strong></div>

            <span style="display:inline-block;padding:5px 16px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:.5px;color:#fff;background:${session ? '#176b5d' : '#c0392b'}">
              ● ${status}
            </span>
          </div>
          ${session ? closeCashForm(dinheiro) : openCashForm(lastSession)}
          ${lastSession && lastSession.status === "fechado" ? `<p class="mini">Último fechamento: ${money(lastSession.countedCash)}${num(lastSession.difference) ? ` · diferença ${money(lastSession.difference)}` : " · conferido"}.</p>` : ""}
        </div>

        <div class="panel">
          <h2>Caixa do Dia</h2>
          <form id="cashForm">
            <div class="form-grid form-grid-2col">
              <label>Movimento
                <select name="tipo" id="cashTipo" onchange="
                  var s=document.getElementById('cashSangriaRow');
                  var show=this.value==='sangria';
                  s.style.display=show?'contents':'none';
                  var r=s.querySelector('[name=responsavelSangria]');
                  if(r) r.required=show;
                ">
                  <option value="entrada">Entrada</option>
                  <option value="saida">Saída</option>
                  <option value="sangria">Sangria</option>
                </select>
              </label>

    // Custo médio ponderado ao adicionar uma compra ao estoque (preview ao vivo).
    function calcStockAvg(id) {
      const item = (state.inventory || []).find(x => x.id === id);
      const row = document.querySelector(`[data-addstock-row="${id}"]`);
      if (!item || !row) return;
      const q1 = num(row.querySelector('[data-addstock="qtd"]')?.value);
      const v1 = num(row.querySelector('[data-addstock="valor"]')?.value);
      const q0 = num(item.quantidade), c0 = num(item.custo);
      const newQty = q0 + q1;
      const newAvg = newQty > 0 ? (q0 * c0 + v1) / newQty : 0;
      const prev = row.querySelector(`[data-addstock-preview="${id}"]`);
      if (!prev) return;
      const un = escapeHTML(item.unidade || "");
      if (q1 > 0 || v1 > 0) {
        prev.style.color = "var(--ink)";
        prev.innerHTML = `Novo saldo: <strong>${newQty.toLocaleString("pt-BR",{maximumFractionDigits:3})} ${un}</strong> · Novo custo médio: <strong style="color:var(--brand)">${money(newAvg)}/${un}</strong>${q1 > 0 ? ` <span style="color:var(--muted)">(esta compra: ${money(v1 / q1)}/${un})</span>` : ""}`;
      } else {
        prev.style.color = "var(--muted)";
        prev.innerHTML = "Preencha a quantidade e o valor pago para ver o novo custo médio.";
      }
    }
